version: chrona/example-materializer/v0.1
id: atlas-deck
role: regression-corpus
contextDefaults:
  project:
    id: atlas
    kind: project
    store: {provider: local, identity: atlas-deck}
    address: project.yaml
    revision: {token: w3}
  inputs:
    snapshot:
      id: atlas-baseline-w0
      kind: snapshot-ref
      store: {provider: local, identity: atlas-deck}
      address: baseline-ref.yaml
      revision: {token: w0}
    actual:
      id: atlas-observed
      kind: actual-set
      store: {provider: local, identity: atlas-deck}
      address: actual.yaml
      revision: {token: w3}
    detailProfile:
      id: halcyon-target-b-legend
      kind: review-detail-profile
      store: {provider: package, identity: chrona.resources}
      address: designs/target-b/detail.yaml
      revision: {token: bundled}
  theme:
    id: target-b
    kind: theme
    store: {provider: package, identity: chrona.resources}
    address: designs/target-b/theme.yaml
    revision: {token: bundled}
  colorScheme:
    id: target-b
    kind: color-scheme
    store: {provider: package, identity: chrona.resources}
    address: designs/target-b/scheme.yaml
    revision: {token: bundled}
  layout:
    id: target-b
    kind: layout-profile
    store: {provider: package, identity: chrona.resources}
    address: designs/target-b/layout.yaml
    revision: {token: bundled}
  environment:
    viewport: {inlineSize: 1600, blockSize: 900}
    locale: en-US
    fontMetrics:
      algorithm: declared-metrics-v3
      missingFont: diagnose
      assets:
      - family: Noto Sans Mono
        weight: 400
        metrics:
          locator: {provider: package, identity: chrona.resources, address: font_metrics/noto-sans-mono-regular-v2.json}
        font:
          locator: {provider: package, identity: chrona.resources, address: fonts/noto-sans-mono-regular-v1.ttf}
      - family: Noto Sans
        weight: 400
        metrics:
          locator: {provider: package, identity: chrona.resources, address: font_metrics/noto-sans-regular-v2.json}
        font:
          locator: {provider: package, identity: chrona.resources, address: fonts/noto-sans-regular-v1.ttf}
      - family: Noto Sans
        weight: 700
        metrics:
          locator: {provider: package, identity: chrona.resources, address: font_metrics/noto-sans-bold-v2.json}
        font:
          locator: {provider: package, identity: chrona.resources, address: fonts/noto-sans-bold-v1.ttf}
    scenePrecision: 3
  target:
    kind: svg
    visualProfile: chrona-output/visual/v0.6-svg
    capabilities: [accessibleText, hierarchicalAxis, marker, semanticRoles, sourceMetadata, tableSemantics]
slides:
- id: exec
  expectedSvg: generated/exec.svg
  expectedScene: generated/exec.scene.json
  evidence: executive summary
  contextOverrides:
    id: atlas-exec
    body:
      view: {id: atlas-exec-summary, kind: view, store: {provider: local, identity: atlas-deck}, address: views/exec-summary.yaml, revision: {token: v1}}
- id: focus
  expectedSvg: generated/focus.svg
  expectedScene: generated/focus.scene.json
  evidence: working view with a focus window
  contextOverrides:
    id: atlas-focus
    body:
      view: {id: atlas-focus, kind: view, store: {provider: local, identity: atlas-deck}, address: views/focus.yaml, revision: {token: v1}}
- id: network
  expectedSvg: generated/network.svg
  expectedScene: generated/network.scene.json
  evidence: dependency network
  contextOverrides:
    id: atlas-network
    body:
      view: {id: atlas-network, kind: view, store: {provider: local, identity: atlas-deck}, address: views/network.yaml, revision: {token: v1}}
      layout: {id: csv-network-layout, kind: layout-profile, store: {provider: local, identity: atlas-deck}, address: views/network-layout.yaml, revision: {token: v1}}
      inputs: {actual: null, snapshot: null}
- id: compare
  expectedSvg: generated/compare.svg
  expectedScene: generated/compare.scene.json
  evidence: baseline comparison
  contextOverrides:
    id: atlas-compare
    body:
      view: {id: atlas-compare, kind: view, store: {provider: local, identity: atlas-deck}, address: views/compare.yaml, revision: {token: v1}}
      forecast: true
