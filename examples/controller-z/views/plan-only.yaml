version: chrona/view/v0.16
kind: view
id: controller-z-plan-only
body:
  surface: table-timeline
  selection:
    include:
      ids:
      - architecture
      - firmware
      - evb-arrival
      types:
      - span
      - point
  grouping:
    by: none
    missing: ungrouped
  ordering:
    by: plannedStart
    direction: ascending
    tieBreak: id
  window:
    mode: selected-planned
    marginDays: 7
  comparison:
    baseline: primary
    actual: optional
    observationSelection: latest
    deltaUnit: calendar-days
    facets:
    - planned
  visibility:
    labels: true
    relations:
      mode: semantic
      overflow: suppress
    annotations: none
  rowDecoration:
    mode: none
  tableColumns:
  - id: Work item
    source: title
    missing: em-dash
    align: start
    width: {minmax: {min: content, max: {fr: 1}}}
  rows:
    mode: automatic
