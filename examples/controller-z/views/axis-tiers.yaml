version: chrona/view/v0.24
kind: view
id: controller-z-axis-tiers
body:
  surface: table-timeline
  selection:
    include:
      types:
      - span
      - point
  grouping:
    by: field
    field: owner
    missing: ungrouped
    order:
    - fw-team
    - validation-team
    - factory-team
    presentation: header
  ordering:
    by: plannedStart
    direction: ascending
    tieBreak: id
  window:
    mode: explicit
    start: '2026-02-01'
    end: '2026-07-01'
  comparison:
    baseline: primary
    actual: required
    observationSelection: latest
    deltaUnit: calendar-days
    facets:
    - planned
    - actual
    - finishDelta
    - atDelta
    - progress
    - missingActual
    - unmatchedActual
  progressFill:
    source: actual
  visibility:
    labels:
      placement: plot
      content:
      - title
      side: inside
      overflow: suppress
    fallback:
      labels:
      - inside
      - above
      - suppress
    relations:
      mode: semantic
      overflow: suppress
      content:
      - lag
      - endpointPair
    annotations: none
  axis:
    # Two band tiers (#426): each takes its own lane and its own fill, and
    # each pairs with the labels tier that shares its typographyRole so the
    # band is the visible ground directly under its own labels.
    tiers:
    - unit: quarter
      every: 1
      role: band
      typographyRole: axisQuarter
    - unit: quarter
      every: 1
      role: grid-major
    - unit: quarter
      every: 1
      role: labels
      typographyRole: axisQuarter
      label:
        form: year-quarter
        align: center
        overflow: thin-with-record
        orientation: horizontal
    - unit: month
      every: 1
      role: band
      typographyRole: axisMonth
    - unit: month
      every: 1
      role: labels
      typographyRole: axisMonth
      label:
        form: short-month
        nameTable: en-US
        align: start
        overflow: thin-with-record
        orientation: horizontal
    - unit: month
      every: 1
      role: grid-minor
  backgroundDecoration:
    rows: alternate
    groups: all
  tableColumns:
  - id: Workstream
    source: title
    missing: em-dash
    align: start
    width: {minmax: {min: content, max: {fr: 1}}}
    headerOrientation: horizontal
  rows:
    mode: automatic
