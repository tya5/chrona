version: chrona/view/v0.28
kind: view
id: controller-z-annotation-artwork
body:
  surface: table-timeline
  selection:
    include:
      types:
      - span
      - point
  grouping:
    by: field
    field: owner
    missing: ungrouped
    order:
    - fw-team
    - validation-team
    - factory-team
    presentation: header
  ordering:
    by: plannedStart
    direction: ascending
    tieBreak: id
  window:
    mode: explicit
    start: '2026-02-01'
    end: '2026-07-01'
  comparison:
    baseline: primary
    actual: required
    observationSelection: latest
    deltaUnit: calendar-days
    facets:
    - planned
    - actual
    - finishDelta
    - atDelta
    - progress
    - missingActual
    - unmatchedActual
  progressFill:
    source: actual
  visibility:
    labels:
      placement: plot
      content:
      - title
      side: inside
      overflow: suppress
    fallback:
      labels:
      - inside
      - above
      - suppress
    relations:
      mode: semantic
      overflow: suppress
    annotations:
      mode: presentation
      marker: numbered
  axis:
    tiers:
    - unit: quarter
      every: 1
      role: band
    - unit: quarter
      every: 1
      role: grid-major
    - unit: quarter
      every: 1
      role: labels
      label:
        form: year-quarter
        align: center
        overflow: thin-with-record
        orientation: horizontal
    - unit: month
      every: 1
      role: labels
      label:
        form: short-month
        nameTable: en-US
        align: start
        overflow: thin-with-record
        orientation: horizontal
    - unit: month
      every: 1
      role: grid-minor
  backgroundDecoration:
    rows: alternate
    groups: all
  tableColumns:
  - id: Workstream
    source: title
    missing: em-dash
    align: start
    width:
      minmax:
        min: content
        max:
          fr: 1
    headerOrientation: horizontal
  rows:
    mode: automatic
  annotations:
  - id: evb-note
    purpose: callout
    projectAnnotation: evb-risk
    anchor:
      kind: object
      id: evb-arrival
      facet: planned
      endpoint: at
    candidates:
    - id: plot-near
      region:
        kind: plot
      search:
        kind: nearest-free
        maxPositions: 512
        maxInlineEm: 12
      obstacles:
        classes: &id001
        - mark
        - text
        - label-visual
        - dependency-route
        - leader-route
        - annotation-box
        - port
        - rule
      connector:
        kind: none
  - id: pvt-note
    purpose: callout
    projectAnnotation: pvt-exit
    anchor:
      kind: object
      id: ga
      facet: planned
      endpoint: at
    candidates:
    - id: plot-near
      region:
        kind: plot
      search:
        kind: nearest-free
        maxPositions: 512
        maxInlineEm: 12
      obstacles:
        classes: *id001
      connector:
        kind: none
  - id: bulletin
    purpose: highlight
    anchor:
      kind: object
      id: evb-arrival
      facet: planned
      endpoint: at
    candidates:
    - id: plot-near
      region:
        kind: plot
      search:
        kind: nearest-free
        maxPositions: 512
        maxInlineEm: 12
      obstacles:
        classes:
        - mark
        - text
        - label-visual
        - dependency-route
        - leader-route
        - annotation-box
        - port
        - rule
      connector:
        kind: none
    text: 'Bring-up bulletin: boot ROM image signed off, board support package frozen for the gate review.'
