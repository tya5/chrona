version: chrona/view/v0.28
kind: view
id: controller-z-as-of-below-plot
body:
  surface: table-timeline
  heading:
    title: "{project}"
    subtitle: "Every work package by owning team · as of {asOf} · calendar: {calendar}"
    dateForm: day-month-year
  # The as-of chip below the plot, in a block Layout reserves under the last row (#1063).
  markers:
  - kind: asOf
    source: actual
    label: as of
    placement: below-plot
    date:
      form: day-month
  selection:
    include:
      types:
      - span
      - point
  grouping:
    by: field
    field: owner
    missing: ungrouped
    order:
    - fw-team
    - validation-team
    - factory-team
    presentation: header
  ordering:
    by: plannedStart
    direction: ascending
    tieBreak: id
  window:
    mode: explicit
    start: '2026-02-01'
    end: '2026-07-01'
  comparison:
    baseline: primary
    actual: required
    observationSelection: latest
    deltaUnit: calendar-days
    facets:
    - planned
    - actual
    - finishDelta
    - atDelta
    - progress
    - missingActual
    - unmatchedActual
  progressFill:
    source: actual
  visibility:
    labels:
      placement: plot
      content:
      - title
      side: inside
      overflow: suppress
    fallback:
      labels:
      - inside
      - above
      - start
      - end
      - suppress
    relations:
      mode: semantic
      overflow: suppress
      content:
      - lag
      - endpointPair
    annotations: none
  axis:
    tiers:
    - unit: quarter
      every: 1
      role: band
    - unit: quarter
      every: 1
      role: grid-major
    - unit: quarter
      every: 1
      role: labels
      label:
        form: year-quarter
        align: center
        overflow: thin-with-record
        orientation: horizontal
    - unit: month
      every: 1
      role: labels
      label:
        form: short-month
        nameTable: en-US
        align: start
        overflow: thin-with-record
        orientation: horizontal
    - unit: month
      every: 1
      role: grid-minor
  backgroundDecoration:
    rows: alternate
    groups: all
  tableColumns:
  - id: Workstream
    source: title
    missing: em-dash
    align: start
    width: {minmax: {min: content, max: {fr: 1}}}
    headerOrientation: horizontal
  rows:
    mode: automatic
