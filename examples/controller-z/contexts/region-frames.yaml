version: chrona/render-context/v0.17
kind: render-context
id: controller-z-value-affixes
body:
  project:
    id: controller-z-silicon-bringup
    kind: project
    store:
      provider: local
      identity: controller-z-example
    address: project.yaml
    revision:
      token: example-v1
  view:
    id: controller-z-value-affixes
    kind: view
    store:
      provider: local
      identity: controller-z-example
    address: views/value-affixes.yaml
    revision:
      token: example-v1
  theme:
    id: region-frames
    kind: theme
    store:
      provider: local
      identity: controller-z-example
    address: themes/region-frames.yaml
    revision:
      token: example-v1
  colorScheme:
    id: newsprint
    kind: color-scheme
    store:
      provider: local
      identity: controller-z-example
    address: schemes/newsprint.yaml
    revision:
      token: example-v1
  layout:
    id: controller-z-region-frames
    kind: layout-profile
    store:
      provider: local
      identity: controller-z-example
    address: layouts/region-frames.yaml
    revision:
      token: example-v1
  inputs:
    actual:
      id: controller-z-observed
      kind: actual-set
      store:
        provider: local
        identity: controller-z-example
      address: actual.yaml
      revision:
        token: example-v1
    detailProfile:
      id: controller-z-legend-key
      kind: review-detail-profile
      store:
        provider: local
        identity: controller-z-example
      address: profiles/legend-key.yaml
      revision:
        token: example-v1
  environment:
    viewport:
      inlineSize: 1600
      blockSize: 900
    locale: en-US
    fontMetrics:
      algorithm: declared-metrics-v3
      missingFont: diagnose
      assets:
      - family: Noto Sans Mono
        weight: 400
        metrics:
          locator:
            provider: package
            identity: chrona.resources
            address: font_metrics/noto-sans-mono-regular-v2.json
        font:
          locator:
            provider: package
            identity: chrona.resources
            address: fonts/noto-sans-mono-regular-v1.ttf
      - family: Noto Sans
        weight: 400
        metrics:
          locator:
            provider: package
            identity: chrona.resources
            address: font_metrics/noto-sans-regular-v2.json
        font:
          locator:
            provider: package
            identity: chrona.resources
            address: fonts/noto-sans-regular-v1.ttf
      - family: Noto Sans
        weight: 700
        metrics:
          locator:
            provider: package
            identity: chrona.resources
            address: font_metrics/noto-sans-bold-v2.json
        font:
          locator:
            provider: package
            identity: chrona.resources
            address: fonts/noto-sans-bold-v1.ttf
    scenePrecision: 3
  target:
    kind: svg
    visualProfile: chrona-output/visual/v0.6-svg
    capabilities:
    - accessibleText
    - hierarchicalAxis
    - marker
    - semanticRoles
    - sourceMetadata
    - tableSemantics
