version: chrona/render-context/v0.13
kind: render-context
id: controller-z-composition-compact
body:
  project:
    id: controller-z-silicon-bringup
    kind: project
    store:
      provider: local
      identity: controller-z-example
    address: project.yaml
    revision:
      token: example-v1
  view:
    id: controller-z-executive
    kind: view
    store:
      provider: local
      identity: controller-z-example
    address: views/executive.yaml
    revision:
      token: example-v1
  theme:
    id: executive-light
    kind: theme
    store:
      provider: local
      identity: controller-z-example
    address: themes/executive-light.yaml
    revision:
      token: example-v1
  colorScheme:
    id: executive-light
    kind: color-scheme
    store:
      provider: local
      identity: controller-z-example
    address: schemes/executive-light.yaml
    revision:
      token: example-v1
  layout:
    id: executive-review-compact
    kind: layout-profile
    store:
      provider: local
      identity: controller-z-example
    address: layouts/executive-review-compact.yaml
    revision:
      token: example-v1
  inputs:
    actual:
      id: controller-z-observed
      kind: actual-set
      store:
        provider: local
        identity: controller-z-example
      address: actual.yaml
      revision:
        token: example-v1
    detailProfile:
      id: controller-z-review-detail
      kind: review-detail-profile
      store:
        provider: local
        identity: controller-z-example
      address: profiles/review-detail.yaml
      revision:
        token: example-v1
  environment:
    viewport:
      inlineSize: 1600
      blockSize: 900
    locale: en-US
    fontMetrics:
      algorithm: declared-metrics-v2
      assets:
      - family: Noto Sans CJK JP
        weight: 400
        metrics:
          path: font_metrics/noto-sans-cjk-jp-regular-v1.json
          contentIdentity: sha256:c8bd29f9ce742fde7e54de380dd2484b3dcdd4641ef8dccb1e866d40d7e9f8c3
        font:
          path: fonts/noto-sans-cjk-jp-regular-v1.ttf
          contentIdentity: sha256:70f0ae1666b5152ee51966648eb769895f8b5b6b30f9667f4fdc67646c0b91d1
      - family: Noto Sans CJK JP
        weight: 700
        metrics:
          path: font_metrics/noto-sans-cjk-jp-bold-v1.json
          contentIdentity: sha256:a66b18b64e2f228147493b885017788a8e4f86f238fa09c5f5c9d0de6ad91146
        font:
          path: fonts/noto-sans-cjk-jp-bold-v1.ttf
          contentIdentity: sha256:1da9e588ac21d8910fc82e9964ce515db06ceef204a944066476648a08d79c77
      missingFont: diagnose
    scenePrecision: 3
  target:
    kind: svg
    visualProfile: chrona-output/visual/v0.5-baseline
    capabilities:
    - accessibleText
    - hierarchicalAxis
    - marker
    - semanticRoles
    - sourceMetadata
    - tableSemantics
