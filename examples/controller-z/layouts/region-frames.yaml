version: chrona/layout-profile/v0.10
id: controller-z-region-frames
flowDirection: horizontal
dependencyNetworkFlowDirection: horizontal
requiredThemeTokens: [panel.minimum, spacing.l, spacing.m, spacing.none]
reviewSurface: {rowDistribution: fill, backgroundExtents: {rowBand: both, groupBand: timeline, groupHeaderBand: both, calendarClosed: timeline}, annotationRouting: {maxBends: 4, maxDetourRatio: 2}}
root:
  id: page
  kind: column
  inlineSize: fill
  blockSize: fill
  gap: {token: spacing.l}
  padding: {token: spacing.l}
  alignItems: stretch
  justifyContent: start
  children:
    # The masthead: a title panel and, beside it, the key (the legend) in its own panel. The gap between
    # the two is the gutter; each panel's padding is its inner margin (#889).
    - id: masthead
      kind: row
      inlineSize: fill
      blockSize: content
      gap: {token: spacing.l}
      padding: {token: spacing.none}
      alignItems: stretch
      justifyContent: start
      children:
        - id: title-panel
          kind: row
          inlineSize: {fr: 2}
          blockSize: content
          gap: {token: spacing.none}
          padding: {token: spacing.m}
          alignItems: center
          justifyContent: start
          frame: {}
          children:
            - id: title
              kind: slot
              source: title
              inlineSize: content
              blockSize: content
              place: {inline: start, block: center, safety: safe}
              priority: required
              overflow: visible-overflow
        - id: key-panel
          kind: row
          inlineSize: {fr: 3}
          blockSize: content
          gap: {token: spacing.none}
          padding: {token: spacing.m}
          alignItems: center
          justifyContent: start
          frame: {}
          children:
            - id: legend
              kind: slot
              source: legend
              inlineSize: fill
              blockSize: content
              place: {inline: start, block: center, safety: safe}
              priority: optional
              overflow: ellipsize-with-source
              direction: inline
              gap: {token: spacing.m}
              itemMinInlineSize: {token: panel.minimum}
    # The chart panel: the table and the timeline together, drawn as one framed region.
    - id: chart-panel
      kind: row
      inlineSize: fill
      blockSize: fill
      gap: {token: spacing.l}
      padding: {token: spacing.m}
      alignItems: stretch
      justifyContent: start
      frame: {}
      children:
        - id: table
          kind: slot
          source: table
          inlineSize: {fr: 3}
          blockSize: fill
          place: {inline: stretch, block: stretch, safety: strict}
          priority: required
          overflow: ellipsize-with-source
        - id: timeline-stack
          kind: column
          inlineSize: {fr: 7}
          blockSize: fill
          gap: {token: spacing.none}
          padding: {token: spacing.none}
          alignItems: stretch
          justifyContent: start
          children:
            - id: timeline-axis
              kind: slot
              source: timeline-axis
              inlineSize: fill
              blockSize: content
              place: {inline: stretch, block: start, safety: strict}
              priority: required
              overflow: visible-overflow
            - id: timeline
              kind: slot
              source: timeline
              inlineSize: fill
              blockSize: fill
              place: {inline: stretch, block: stretch, safety: strict}
              priority: required
              overflow: visible-overflow
