version: chrona/example-materializer/v0.1
id: controller-z
role: regression-corpus
context: contexts/executive.yaml
slides:
  - id: executive
    evidence: "Executive review with actuals, inside labels, and fallback labels."
    expectedSvg: generated/executive.svg
    expectedScene: generated/executive.scene.json
  - id: annotations
    evidence: "Purpose-specific callout, highlight, note, and explanatory-arrow placements, including a declared arrow terminal and obstacle-avoiding leaders."
    context: contexts/annotations.yaml
    expectedSvg: generated/annotations.svg
    expectedScene: generated/annotations.scene.json
  - id: plan-only
    evidence: "Plan-only control view over the same Controller Z schedule and observations."
    context: contexts/plan-only.yaml
    expectedSvg: generated/plan-only.svg
    expectedScene: generated/plan-only.scene.json
  - id: elevated
    evidence: "Portable gradient, shadow, and stroke-finish treatment over the same Controller Z evidence."
    context: contexts/elevated.yaml
    expectedSvg: generated/elevated.svg
    expectedScene: generated/elevated.scene.json
  - id: icons
    evidence: "Immutable vector and raster catalog icons as a measured label prefix and semantic mark."
    context: contexts/icons.yaml
    expectedSvg: generated/icons.svg
    expectedScene: generated/icons.scene.json
  - id: material-icons
    evidence: "Bundled Material Symbols aliases and short names at table, header, and title text sizes."
    context: contexts/material-icons.yaml
    expectedSvg: generated/material-icons.svg
    expectedScene: generated/material-icons.scene.json
  - id: progress-track
    evidence: "Progress drawn as an inset capsule inside its bar (track inset and fill radius from a derived Theme), at several bar lengths."
    context: contexts/progress-track.yaml
    expectedSvg: generated/progress-track.svg
    expectedScene: generated/progress-track.scene.json
  - id: capabilities
    evidence: "Row stripes across table and timeline, fill row distribution, band grouping, a fixed-position date column after an fr title column, an uppercase letter-spaced legend and a Noto Sans Mono delta column (#434)."
    context: contexts/capabilities.yaml
    expectedSvg: generated/capabilities.svg
    expectedScene: generated/capabilities.scene.json
  - id: axis-alternating
    evidence: "Quarter and month band fills alternate by each tier's natural interval ordinal from exact Theme Scheme-slot mappings (#490)."
    context: contexts/axis-alternating.yaml
    expectedSvg: generated/axis-alternating.svg
    expectedScene: generated/axis-alternating.scene.json
  - id: axis-interval-scales
    evidence: "Quarter interval fills and month fills keyed by their containing quarter use the same exact Theme scale over the February–July window (#490)."
    context: contexts/axis-interval-scales.yaml
    expectedSvg: generated/axis-interval-scales.svg
    expectedScene: generated/axis-interval-scales.scene.json
  - id: axis-cell-corners
    evidence: "Quarter cells with cut (chamfered) corners and month cells with rounded corners, each separated by a cell gap, from the Theme properties cellCornerChamfer and cellCornerRadius on the two band roles (#491), and month ticks standing on the axis rule instead of full grid lines, from the Theme tickLength on the axis-minor role (#492)."
    context: contexts/axis-cell-corners.yaml
    expectedSvg: generated/axis-cell-corners.svg
    expectedScene: generated/axis-cell-corners.scene.json
  - id: surface-glow
    evidence: "A glow around every planned mark and gate on a dark stage, drawn as a per-element halo clipped to the canvas under the rich SVG profile, from the Theme properties glowColor, glowBlur and glowOpacity (#587)."
    context: contexts/surface-glow.yaml
    expectedSvg: generated/surface-glow.svg
    expectedScene: generated/surface-glow.scene.json
  - id: region-frames
    evidence: "A masthead of a title panel and, beside it, the legend in its own key panel, over one framed chart panel holding the table and the timeline, each panel an ink outline with rounded corners and a hand wobble on newsprint, a gap as the gutter between panels, from the Layout Profile frame declaration and the Theme role region-frame, with the delta affixes of #588 (#889)."
    context: contexts/region-frames.yaml
    expectedSvg: generated/region-frames.svg
    expectedScene: generated/region-frames.scene.json
  - id: annotation-kinds
    evidence: "A Title Card style note per Project annotation kind (#584): a kind-coloured title bar with a label, a secondary line, an accent edge and a hazard-tab stamp from the packaged target-parts catalogue, on the dark texture Theme, with no corpus datum edited."
    context: contexts/annotation-kinds.yaml
    expectedSvg: generated/annotation-kinds.svg
    expectedScene: generated/annotation-kinds.scene.json
  - id: viewer-fit
    evidence: "A viewer that lacks the layout font (#1050): the same notes as the artwork slide with the Theme box roles declaring how text and box absorb the missing face, a scroll-framed callout and a clipping-edge highlight pinned line by line to the width Layout measured (text-follows-box, with spacing and with spacingAndGlyphs), and a plain note whose background follows its text (box-follows-text); the SVG still names the family and embeds nothing, and PNG output draws the packaged font from the raw SVG, with no corpus datum edited."
    context: contexts/viewer-fit.yaml
    expectedSvg: generated/viewer-fit.svg
    expectedScene: generated/viewer-fit.scene.json
  - id: annotation-rounded
    evidence: "Rounded note boxes on a right-hand notes rail (#1087): the Theme annotationContainer cornerRadius drawn as the paper's corner radius, a 4 px kind-coloured start border and a 1 px bottom border on the note that follow the rounded outline, a 3 px ink border on all four sides of the callout with mitred corners, the boxes filling the rail (#1051), with no corpus datum edited."
    context: contexts/annotation-rounded.yaml
    expectedSvg: generated/annotation-rounded.svg
    expectedScene: generated/annotation-rounded.scene.json
  - id: group-header-runs
    evidence: "Role-marked spans in a group-header template (#1192): the View header template marks {ordinal} and a {figure:id} with the Theme text roles group-ordinal (bold, orange) and group-gloss (small, muted capitals), and the unmarked title keeps groupHeader; Layout measures each run with its own role and places the three runs on one baseline, from the executive sources."
    context: contexts/group-header-runs.yaml
    expectedSvg: generated/group-header-runs.svg
    expectedScene: generated/group-header-runs.scene.json
  - id: group-child-indent
    evidence: "Child rows indented under field-grouping headers (#1065): the View declares hierarchyColumn Workstream over a field grouping with header presentation, and Layout starts each row's label exactly the Theme's table.indent.inlineSize after its header's label, over the executive sources."
    context: contexts/group-child-indent.yaml
    expectedSvg: generated/group-child-indent.svg
    expectedScene: generated/group-child-indent.scene.json
  - id: slot-heading
    evidence: "A slot heading (#1064): the Layout Profile declares heading Notes on the annotations rail with block header-row, the Theme text role slot-heading (small, bold, letter-spaced capitals in a muted ink) styles it, and Layout centres it in the axis header band and starts the notes below it, over the annotation-border sources."
    context: contexts/slot-heading.yaml
    expectedSvg: generated/slot-heading.svg
    expectedScene: generated/slot-heading.scene.json
  - id: baseline-ghosts
    evidence: "Baseline ghosts together with field-grouped automatic rows (#991): comparison.baseline snapshot with baselineMarks ghost draws one dashed baseline ghost bar and hollow baseline gate per selected item under the group header bands, over the executive sources and a captured snapshot."
    context: contexts/baseline-ghosts.yaml
    expectedSvg: generated/baseline-ghosts.svg
    expectedScene: generated/baseline-ghosts.scene.json
  - id: as-of-foot
    evidence: "The as-of chip at the plot foot with a day-month date (#991): the marker's placement foot centres the chip on the rule above the last row, its date form day-month reads `as of 20 May`, and the heading's dateForm day-month-year puts `20 May 2026` in the subtitle, over the executive sources."
    context: contexts/as-of-foot.yaml
    expectedSvg: generated/as-of-foot.svg
    expectedScene: generated/as-of-foot.scene.json
  - id: in-progress
    evidence: "Work in progress and not yet observed (#991): comparison.missingActualScope in-progress hatches a span that has an actual start and no finish from that start to the as-of date (the Theme's missing-actual hatch), and puts no mark on a due span or a gate, over the executive sources."
    context: contexts/in-progress.yaml
    expectedSvg: generated/in-progress.svg
    expectedScene: generated/in-progress.scene.json
  - id: text-roles
    evidence: "Text set apart per column and for the legend (#1062): a View column that names the Theme text role table-cell-secondary (here the Team column, 12 px in textMuted against 14 px cells) and a Theme that binds legend.fill (textMuted legend labels, swatches unchanged), over the executive sources."
    context: contexts/text-roles.yaml
    expectedSvg: generated/text-roles.svg
    expectedScene: generated/text-roles.scene.json
