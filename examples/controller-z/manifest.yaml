  - id: table-header
    evidence: "Table column headers set apart from the cells (#991): a Theme that declares the text role tableColumnLabel gives the headers their own size, letter spacing and muted colour (here 11 px, 0.08 em, textMuted against 14 px cells), over the executive sources."
