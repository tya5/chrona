    expectedSvg: generated/table-header.svg
    expectedScene: generated/table-header.scene.json
  - id: gate-paint
    evidence: "Gates painted apart from the bars (#991): a Theme that declares the role gate colours the primary gates with it (here the text ink, as the target's black diamonds) while the bars keep the planned paint, over the executive sources."
