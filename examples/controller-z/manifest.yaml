    expectedSvg: generated/gate-paint.svg
    expectedScene: generated/gate-paint.scene.json
  - id: as-of-cone
    evidence: "The as-of marker as a cone of light (Marquee spotlight): a gradient polygon from the top of the plot to its last row, fading from ink to transparent under the bars and gates, drawn under the rich SVG profile from the Theme role as-of-cone with a label chip (#890)."
    context: contexts/as-of-cone.yaml
    expectedSvg: generated/as-of-cone.svg
    expectedScene: generated/as-of-cone.scene.json
