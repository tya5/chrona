version: chrona/view/v0.23
kind: view
id: orion-asic-gates
body:
  surface: table-timeline
  selection:
    include:
      types:
      - span
      - point
  grouping:
    by: field
    field: owner
    missing: other
    order:
    - design
    - product
    - validation
    presentation: header
  ordering:
    by: plannedStart
    direction: ascending
    tieBreak: id
  window:
    mode: explicit
    start: '2026-08-24'
    end: '2027-09-13'
  comparison:
    baseline: primary
    actual: required
    observationSelection: latest
    deltaUnit: calendar-days
    facets:
    - planned
    - actual
    - finishDelta
    - atDelta
    - progress
    - missingActual
    - unmatchedActual
  progressFill:
    source: actual
  colorEncoding:
    scale: revision
    target: planned
    source:
      field: revision
    domain:
    - A0
    - A1
    - B0
  visibility:
    labels:
      placement: table
      content:
      - title
      side: auto
      overflow: suppress
    relations:
      mode: semantic
      overflow: suppress
    annotations:
      mode: presentation
      marker: numbered
  axis:
    tiers:
    - unit: quarter
      every: 1
      role: band
    - unit: quarter
      every: 1
      role: grid-major
    - unit: quarter
      every: 1
      role: labels
      label:
        form: year-quarter
        align: center
        overflow: visible-overflow
        orientation: horizontal
    - unit: month
      every: 1
      role: labels
      label:
        form: short-month
        align: start
        overflow: thin-with-record
        orientation: horizontal
    - unit: month
      every: 1
      role: grid-minor
    - unit: week
      every: 2
      role: grid-minor
  markers:
  - kind: asOf
    source: actual
    label: as of
    date: {form: localized-date}
  shading:
    nonWorking: false
    exceptions: true
  backgroundDecoration:
    rows: none
    groups: all
  tableColumns:
  - id: Work package
    source: title
    missing: em-dash
    align: start
    width: {minmax: {min: content, max: {fr: 1}}}
    headerOrientation: horizontal
  - id: Revision
    source:
      field: revision
    missing: em-dash
    align: start
    width: content
    headerOrientation: horizontal
  - id: Approval
    source:
      field: approval
    missing: blank
    align: start
    width: content
    headerOrientation: horizontal
  - id: Δ
    source:
      facet: finishDelta
    format: signedDays
    missing: em-dash
    align: end
    width: content
    headerOrientation: horizontal
  rows:
    mode: automatic
