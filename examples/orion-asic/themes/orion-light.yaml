    background.fill: surface
    text.fill: text
    member-label-inside-planned.fill: insideLabelPlanned
    member-label-inside-actual.fill: insideLabelActual
    member-label-inside-snapshot.fill: insideLabelSnapshot
    member-label-inside-scenario.fill: insideLabelScenario
    axis-major.stroke: neutral
    axis-minor.stroke: surfaceRaised
    axis-band-decoration.fill: surfaceRaised
    table-header.fill: surfaceRaised
    group-band.fill: category:default
    row-band.fill: category:default
    group-header-band.fill: surfaceRaised
    group:factory-team.fill: category:factory-team
    group:fw-team.fill: category:fw-team
    group:validation-team.fill: category:validation-team
    planned.fill: accent
    planned.stroke: text
    network-node.fill: surfaceRaised
    network-node.stroke: text
    network-edge.stroke: textMuted
    critical-edge.stroke: negative
    summary-bar.fill: accent
    snapshot.fill: neutral
    snapshot.stroke: text
    actual.fill: positive
    actual.stroke: text
    as-of.stroke: warning
    calendar-closed.fill: surfaceRaised
    calendar-closed.stroke: neutral
    missing-actual.fill: textMuted
    missing-actual.stroke: text
    variance-ahead.fill: positive
    variance-on-track.fill: textMuted
    variance-behind.fill: warning
    missing-actual-cell.fill: textMuted
    variance-behind.stroke: warning
    dependency.stroke: textMuted
    annotation.fill: surfaceRaised
    annotation.stroke: neutral
    progress-fill.fill: warning
    progress-fill.stroke: text
    icon-mark.fill: surface
