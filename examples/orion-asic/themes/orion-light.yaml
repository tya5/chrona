    text.body.size: text-size
    text.body.lineHeight: text-line-height
    timeline.dayWidth: timeline-day-width
    timeline.row.minBlockSize: timeline-row-height
    timeline.row.paddingBlock: timeline-row-padding
    timeline.mark.blockSize: timeline-mark-size
    timeline.groupHeader.blockSize: timeline-group-header-size
    timeline.axis.blockSize: timeline-axis-height
    network.node.minInlineSize: network-node-min-inline
    network.node.minBlockSize: network-node-min-block
    network.rank.gap: network-rank-gap
    table.column.minInlineSize: table-column-width
    table.column.gutter.inlineSize: table-column-gutter
    table.indent.inlineSize: table-indent
    table.header.blockSize: table-header-height
  colorScales:
    revision:
      slots:
        A0: revision-a0
        A1: revision-a1
        B0: revision-b0
