      fontFamily: editorial
      fontWeight: text-weight
      fontSize: heading-size
      lineHeight: heading-line-height
      letterSpacing: letter-spacing
      textTransform: text-transform
      numericSpacing: numeric-spacing
    axis:
      fontFamily: editorial
      fontWeight: text-weight
      fontSize: axis-size
      lineHeight: axis-line-height
      letterSpacing: letter-spacing
      textTransform: text-transform
      numericSpacing: numeric-spacing
    legend:
      fontFamily: editorial
      fontWeight: text-weight
      fontSize: legend-size
      lineHeight: legend-line-height
      letterSpacing: letter-spacing
      textTransform: text-transform
      numericSpacing: numeric-spacing
    summary:
      fontFamily: editorial
      fontWeight: text-weight
      fontSize: summary-size
      lineHeight: summary-line-height
      letterSpacing: letter-spacing
      textTransform: text-transform
      numericSpacing: numeric-spacing
    annotation:
      fontFamily: editorial
      fontWeight: text-weight
      fontSize: annotation-size
      lineHeight: annotation-line-height
      letterSpacing: letter-spacing
      textTransform: text-transform
      numericSpacing: numeric-spacing
