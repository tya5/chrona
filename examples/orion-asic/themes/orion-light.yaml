    axis-major:
      strokeWidth: stroke-width
    axis-minor:
      strokeWidth: stroke-width
    network-edge:
      strokeWidth: stroke-width
    critical-edge:
      strokeWidth: stroke-width
    as-of:
      strokeWidth: stroke-width
    variance-behind:
      strokeWidth: stroke-width
      contrastTreatment: required
    variance-ahead:
      contrastTreatment: deemphasized
    variance-on-track:
      contrastTreatment: required
    missing-actual-cell:
      contrastTreatment: required
    milestoneSymbol:
      symbol: milestone-symbol
    relationSourceTerminal:
      marker: dependency-marker
    relationTargetTerminal:
      marker: dependency-marker
    dependency:
      marker: dependency-marker
      strokeWidth: stroke-width
    snapshot:
