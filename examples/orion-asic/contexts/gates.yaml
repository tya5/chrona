version: chrona/render-context/v0.15
kind: render-context
id: orion-asic-gates
body:
  project:
    id: orion-asic
    kind: project
    store:
      provider: local
      identity: orion-asic-example
    address: project.yaml
    revision:
      token: example-v1
  view:
    id: orion-asic-gates
    kind: view
    store:
      provider: local
      identity: orion-asic-example
    address: views/gates.yaml
    revision:
      token: example-v1
  theme:
    id: orion-light
    kind: theme
    store:
      provider: local
      identity: orion-asic-example
    address: themes/orion-light.yaml
