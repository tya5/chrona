version: chrona/render-context/v0.11
kind: render-context
id: orion-asic-gates
body:
  project: {id: orion-asic, kind: project, store: {provider: local, identity: orion-asic-example}, address: project.yaml, revision: {token: example-v1}}
  view: {id: orion-asic-gates, kind: view, store: {provider: local, identity: orion-asic-example}, address: views/gates.yaml, revision: {token: example-v1}}
  theme: {id: orion-light, kind: theme, store: {provider: local, identity: orion-asic-example}, address: themes/orion-light.yaml, revision: {token: example-v1}}
  colorScheme: {id: orion-light, kind: color-scheme, store: {provider: local, identity: orion-asic-example}, address: schemes/orion-light.yaml, revision: {token: example-v1}}
  layout: {id: orion-review, kind: layout-profile, store: {provider: local, identity: orion-asic-example}, address: layouts/orion-review.yaml, revision: {token: example-v1}}
  inputs:
    actual: {id: orion-asic-observed, kind: actual-set, store: {provider: local, identity: orion-asic-example}, address: actual.yaml, revision: {token: example-v1}}
    detailProfile: {id: orion-asic-review-detail, kind: review-detail-profile, store: {provider: local, identity: orion-asic-example}, address: profiles/review-detail.yaml, revision: {token: example-v1}}
  environment:
    viewport: {inlineSize: 1600, blockSize: 900}
    locale: en-US
    fontMetrics:
      algorithm: declared-metrics-v1
      assets: [{family: Nimbus Sans, weight: 400, revision: nimbus-sans-regular-v1, path: font_metrics/nimbus-sans-regular-v1.json}]
      missingFont: declared-fallback
    scenePrecision: 3
  target:
    kind: svg
    visualProfile: chrona-output/visual/v0.5-baseline
    capabilities: [accessibleText, hierarchicalAxis, marker, semanticRoles, sourceMetadata, tableSemantics]
