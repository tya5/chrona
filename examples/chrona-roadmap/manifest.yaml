      view:
        id: chrona-roadmap-yuya
        kind: view
        store: {provider: local, identity: chrona-roadmap-example}
        address: views/yuya.yaml
        revision: {token: example-v1}
      theme:
        id: yuya
        kind: theme
        store: {provider: package, identity: chrona.resources}
        address: designs/yuya/theme.yaml
        revision: {token: bundled}
      colorScheme:
        id: yuya
        kind: color-scheme
        store: {provider: package, identity: chrona.resources}
        address: designs/yuya/scheme.yaml
        revision: {token: bundled}
      layout:
        id: yuya
        kind: layout-profile
        store: {provider: package, identity: chrona.resources}
        address: designs/yuya/layout.yaml
        revision: {token: bundled}
      inputs:
        detailProfile:
          id: halcyon-yuya-legend
          kind: review-detail-profile
          store: {provider: package, identity: chrona.resources}
          address: designs/yuya/detail.yaml
          revision: {token: bundled}
        iconCatalogs:
        - id: chrona-target-parts-v2026-10-09
          kind: icon-catalog
          store: {provider: package, identity: chrona.resources}
          address: icons/chrona-target-parts-v2026-10-09.yaml
          revision: {token: v2026-10-09}
        - id: chrona-annotation-parts-v2026-10-09
          kind: icon-catalog
          store: {provider: package, identity: chrona.resources}
          address: icons/chrona-annotation-parts-v2026-10-09.yaml
          revision: {token: v2026-10-09}
        - id: chrona-theme-starter-v2026-10-09
          kind: icon-catalog
          store: {provider: package, identity: chrona.resources}
          address: icons/chrona-theme-starter-v2026-10-09.yaml
          revision: {token: v2026-10-09}
      environment: {locale: ja-JP}
  expectedSvg: generated/roadmap-yuya.svg
  expectedScene: generated/roadmap-yuya.scene.json
