version: chrona/example-materializer/v0.1
id: chrona-roadmap
role: regression-corpus
contextDefaults:
  project:
    id: chrona-roadmap
    kind: project
    store: {provider: local, identity: chrona-roadmap-example}
    address: project.yaml
    revision: {token: example-v7}
  inputs:
    snapshot:
      id: chrona-roadmap-plan-2026-10-10
      kind: snapshot-ref
      store: {provider: local, identity: chrona-roadmap-example}
      address: snapshots/plan-2026-10-10.yaml
      revision: {token: example-v1}
    actual:
      id: chrona-roadmap-observed
      kind: actual-set
      store: {provider: local, identity: chrona-roadmap-example}
      address: actual.yaml
      revision: {token: example-v2}
    iconCatalogs:
    - id: chrona-target-parts-v2026-10-09
      kind: icon-catalog
      store: {provider: package, identity: chrona.resources}
      address: icons/chrona-target-parts-v2026-10-09.yaml
      revision: {token: v2026-10-09}
  environment:
    viewport: {inlineSize: 1600, blockSize: 900}
    locale: en-US
    fontMetrics:
      algorithm: declared-metrics-v3
      missingFont: diagnose
      assets:
      - family: Noto Sans Mono
        weight: 400
        metrics:
          locator: {provider: package, identity: chrona.resources, address: font_metrics/noto-sans-mono-regular-v2.json}
        font:
          locator: {provider: package, identity: chrona.resources, address: fonts/noto-sans-mono-regular-v1.ttf}
      - family: Noto Sans
        weight: 400
        metrics:
          locator: {provider: package, identity: chrona.resources, address: font_metrics/noto-sans-regular-v2.json}
        font:
          locator: {provider: package, identity: chrona.resources, address: fonts/noto-sans-regular-v1.ttf}
      - family: Noto Sans
        weight: 700
        metrics:
          locator: {provider: package, identity: chrona.resources, address: font_metrics/noto-sans-bold-v2.json}
        font:
          locator: {provider: package, identity: chrona.resources, address: fonts/noto-sans-bold-v1.ttf}
      - family: Noto Sans JP
        weight: 400
        metrics:
          locator: {provider: package, identity: chrona-fonts-noto-cjk, address: font_metrics/noto-sans-jp-regular-v2.json}
        font:
          locator: {provider: package, identity: chrona-fonts-noto-cjk, address: fonts/noto-sans-jp-regular-v1.ttf}
      - family: Noto Sans JP
        weight: 700
        metrics:
          locator: {provider: package, identity: chrona-fonts-noto-cjk, address: font_metrics/noto-sans-jp-bold-v2.json}
        font:
          locator: {provider: package, identity: chrona-fonts-noto-cjk, address: fonts/noto-sans-jp-bold-v1.ttf}
    scenePrecision: 3
  target:
    kind: svg
    visualProfile: chrona-output/visual/v0.6-svg
    capabilities: [accessibleText, hierarchicalAxis, marker, semanticRoles, sourceMetadata, tableSemantics]
slides:
- id: roadmap
  evidence: chrona's own road to a release candidate in the target B design
  contextOverrides:
    id: chrona-roadmap-board
    body:
      view:
        id: chrona-roadmap-board
        kind: view
        store: {provider: local, identity: chrona-roadmap-example}
        address: views/roadmap.yaml
        revision: {token: example-v2}
      theme:
        id: chrona-roadmap
        kind: theme
        store: {provider: local, identity: chrona-roadmap-example}
        address: themes/roadmap.yaml
        revision: {token: example-v1}
      colorScheme:
        id: chrona-roadmap
        kind: color-scheme
        store: {provider: local, identity: chrona-roadmap-example}
        address: schemes/roadmap.yaml
        revision: {token: example-v1}
      layout:
        id: chrona-roadmap
        kind: layout-profile
        store: {provider: local, identity: chrona-roadmap-example}
        address: layouts/roadmap.yaml
        revision: {token: example-v1}
      inputs:
        detailProfile:
          id: chrona-roadmap
          kind: review-detail-profile
          store: {provider: local, identity: chrona-roadmap-example}
          address: profiles/roadmap-detail.yaml
          revision: {token: example-v1}
        iconCatalogs: null
      environment:
        fontMetrics:
          algorithm: declared-metrics-v3
          missingFont: diagnose
          assets:
          - family: Noto Sans Mono
            weight: 400
            metrics:
              locator: {provider: package, identity: chrona.resources, address: font_metrics/noto-sans-mono-regular-v2.json}
            font:
              locator: {provider: package, identity: chrona.resources, address: fonts/noto-sans-mono-regular-v1.ttf}
          - family: Noto Sans
            weight: 400
            metrics:
              locator: {provider: package, identity: chrona.resources, address: font_metrics/noto-sans-regular-v2.json}
            font:
              locator: {provider: package, identity: chrona.resources, address: fonts/noto-sans-regular-v1.ttf}
          - family: Noto Sans
            weight: 700
            metrics:
              locator: {provider: package, identity: chrona.resources, address: font_metrics/noto-sans-bold-v2.json}
            font:
              locator: {provider: package, identity: chrona.resources, address: fonts/noto-sans-bold-v1.ttf}
  expectedSvg: generated/roadmap.svg
  expectedScene: generated/roadmap.scene.json
- id: roadmap-yuya
  evidence: the same roadmap data in the packaged Yuya design, bound by a thin View with no design copied
  contextOverrides:
