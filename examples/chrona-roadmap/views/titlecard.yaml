version: chrona/view/v0.28
kind: view
id: chrona-roadmap-titlecard
# Thin connector: the roadmap's ids, bindings and wording only. The design is the packaged titlecard
# Layout profile's `viewDefaults`; the heading is restated here only to say what this project counts
# (work items in milestones), and the countdown slot is bound to the release-candidate gate.
body:
  surface: table-timeline
  heading:
    kicker: 製品化への道
    title: 計画表、{project}
    subtitle: 'ROADMAP · {figure:selected-count} WORK ITEMS · {figure:group-count} MILESTONES · BASELINE / PLAN / ACTUAL'
    dateForm: day-month-year
  window:
    mode: explicit
    start: '2026-10-01'
    end: '2026-12-16'
  periods:
  - id: rc-window
    label:
      text: RC window
  figures:
  - {id: selected-count, kind: count, source: selected}
  - {id: group-count, kind: count, source: groups}
  - {id: note-count, kind: count, source: placedNotes}
  bindings:
    countdown: {figure: {kind: daysUntil, to: {object: rc-gate, endpoint: at}}}
  comparison:
    baseline: snapshot
    actual: required
    observationSelection: latest
  annotationBindings:
  - {kind: note, temporalKind: span, purpose: note, facet: planned, endpoint: end}
  - {kind: risk, temporalKind: span, purpose: note, facet: planned, endpoint: end}
  markers:
  - source: actual
  hierarchyColumn: Work item
  tableColumns:
  - id: Work item
    source: title
  - id: Lane
    source:
      field: lane
  - id: Δ finish
    source:
      facet: finishDelta
  selection:
    include:
      types:
      - span
      - point
    exclude:
      objectTypes:
      - group
  grouping:
    by: field
    field: owner
    missing: ungrouped
    order:
    - m0
    - m1
    - m2
    - m3
    - m4
    - rc
  ordering:
    by: source
    direction: ascending
    tieBreak: id
