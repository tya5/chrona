version: chrona/view/v0.28
kind: view
id: chrona-roadmap-sunday
# Thin connector: the roadmap's ids, bindings and wording only. The design is the packaged sunday
# Layout profile's `viewDefaults`; the heading is restated here only to name this project and its
# author, and the period label and legend wording name the release-candidate window.
body:
  surface: table-timeline
  heading:
    kicker: The road to a release candidate,
    title: '{project}'
    subtitle: 'in {figure:group-count} panels · by the reviewer'
    dateForm: day-month-year
  window:
    mode: explicit
    start: '2026-10-01'
    end: '2026-12-16'
  periods:
  - id: rc-window
    label:
      text: RC WINDOW
  figures:
  - {id: group-count, kind: count, source: groups}
  wording:
    legend:
      period-band: release-candidate window
  comparison:
    baseline: snapshot
    actual: required
    observationSelection: latest
  annotationBindings:
  - {kind: risk, temporalKind: span, purpose: note, facet: planned, endpoint: body}
  - {kind: note, temporalKind: span, purpose: note, facet: planned, endpoint: end}
  markers:
  - source: actual
  hierarchyColumn: What
  tableColumns:
  - id: What
    source: title
  - id: Who
    source:
      field: lane
  - id: Late?
    source:
      facet: finishDelta
  selection:
    include:
      types:
      - span
      - point
    exclude:
      objectTypes:
      - group
  grouping:
    by: field
    field: owner
    missing: ungrouped
    order:
    - m0
    - m1
    - m2
    - m3
    - m4
    - rc
  ordering:
    by: source
    direction: ascending
    tieBreak: id
