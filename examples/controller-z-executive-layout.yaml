version: chrona/layout-profile/v0.1
id: executive-light-16x9
canvas: {aspectRatio: '16:9', margin: compact, density: presentation}
surface:
  groupMode: merged
  groupLabel: Owner
  groupFraction: 0.4
  groupGap: 6
  axisLevels: [month]
  fontSize: 19
  titleSize: 40
  groupFontSize: 24
  barHeight: 17
  barGap: 4
  showVariance: true
regions:
  - {id: header, layout: stack}
  - {id: main, layout: split, tracks: ['3fr', '7fr']}
  - {id: footer, layout: grid, tracks: ['1fr']}
slots:
  title: {region: header, source: title, priority: required, overflow: diagnose, role: text}
  table: {region: main, source: table, priority: required, overflow: diagnose, role: table-header}
  timeline: {region: main, source: timeline, priority: required, overflow: diagnose, role: planned}
  legend: {region: footer, source: legend, priority: required, overflow: diagnose, role: text}
constraints: {connectors: obstacle-aware, overlap: diagnose}
