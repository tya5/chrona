version: chrona/theme/v0.2
kind: theme
id: executive-light
body:
  values:
    editorial: {type: fontFamily, value: 'Nimbus Sans, Arial, sans-serif'}
    text-weight: {type: fontWeight, value: 400}
    spacing.none: {type: number, value: 0}
    spacing.s: {type: number, value: 8}
    spacing.m: {type: number, value: 16}
    spacing.l: {type: number, value: 24}
    panel.minimum: {type: number, value: 180}
    text-size: {type: number, value: 14}
    text-line-height: {type: number, value: 1.4}
    heading-size: {type: number, value: 24}
    heading-line-height: {type: number, value: 1.2}
    axis-size: {type: number, value: 12}
    axis-line-height: {type: number, value: 1.2}
    legend-size: {type: number, value: 12}
    legend-line-height: {type: number, value: 1.4}
    summary-size: {type: number, value: 14}
    summary-line-height: {type: number, value: 1.4}
    annotation-size: {type: number, value: 14}
    annotation-line-height: {type: number, value: 1.4}
    dependency-marker: {type: marker, value: triangle}
    timeline-day-width: {type: number, value: 12}
    timeline-row-height: {type: number, value: 40}
    timeline-axis-height: {type: number, value: 48}
    table-column-width: {type: number, value: 120}
    table-header-height: {type: number, value: 44}
  roles:
    text: {fontFamily: editorial, fontWeight: text-weight, fontSize: text-size, lineHeight: text-line-height}
    heading: {fontFamily: editorial, fontWeight: text-weight, fontSize: heading-size, lineHeight: heading-line-height}
    axis: {fontFamily: editorial, fontWeight: text-weight, fontSize: axis-size, lineHeight: axis-line-height}
    legend: {fontFamily: editorial, fontWeight: text-weight, fontSize: legend-size, lineHeight: legend-line-height}
    summary: {fontFamily: editorial, fontWeight: text-weight, fontSize: summary-size, lineHeight: summary-line-height}
    annotation: {fontFamily: editorial, fontWeight: text-weight, fontSize: annotation-size, lineHeight: annotation-line-height}
    dependency: {marker: dependency-marker}
  colorBindings:
    background.fill: surface
    text.fill: text
    axis-major.stroke: neutral
    axis-minor.stroke: surfaceRaised
    table-header.fill: surfaceRaised
    group-band.fill: category
    'group:factory-team.fill': category
    'group:fw-team.fill': category
    'group:validation-team.fill': category
    planned.fill: accent
    actual.fill: positive
    missing-actual.fill: textMuted
    variance-ahead.fill: positive
    variance-on-track.fill: neutral
    variance-behind.fill: warning
    variance-behind.stroke: warning
    dependency.stroke: neutral
    annotation.fill: surfaceRaised
    annotation.stroke: neutral
  metrics:
    text.body.size: text-size
    text.body.lineHeight: text-line-height
    timeline.dayWidth: timeline-day-width
    timeline.row.minBlockSize: timeline-row-height
    timeline.axis.blockSize: timeline-axis-height
    table.column.minInlineSize: table-column-width
    table.header.blockSize: table-header-height
