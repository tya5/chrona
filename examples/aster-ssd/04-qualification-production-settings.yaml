layout:
  margins:
    top: 32
    right: 40
    bottom: 28
    left: 40
  regionGap: 0
  regions:
  - id: header
    layout: stack
    block:
      kind: fixed
      value: 116
      min: 116
      max: 116
    tracks:
    - kind: fraction
      value: 1
      min: 0
      max: 10000
    gap: 0
  - id: main
    layout: split
    block:
      kind: fraction
      value: 1
      min: 100
      max: 10000
    tracks:
    - kind: fraction
      value: 3.2
      min: 0
      max: 10000
    - kind: fraction
      value: 6.8
      min: 0
      max: 10000
    gap: 0
  - id: footer
    layout: stack
    block:
      kind: fixed
      value: 100
      min: 100
      max: 100
    tracks:
    - kind: fraction
      value: 1
      min: 0
      max: 10000
    gap: 0
  slots:
    title:
      region: header
      track: 0
      source: title
      priority: required
      overflow: diagnose
      align: start
    table:
      region: main
      track: 0
      source: table
      priority: required
      overflow: diagnose
      align: stretch
    timeline:
      region: main
      track: 1
      source: timeline
      scaleId: primary
      priority: required
      overflow: diagnose
      align: stretch
    timelineAxis:
      region: main
      track: 1
      source: timeline-axis
      scaleId: primary
      priority: required
      overflow: diagnose
      align: stretch
    legend:
      region: footer
      track: 0
      source: legend
      priority: required
      overflow: diagnose
      align: start
  group:
    mode: header
    fraction: 0.4
    gap: 12
    headerHeight: 32
    labelAlign: center
  labelPlacement:
    candidateSides: [inside, end, start, above, below]
    maxCandidates: 5
    overflow: clip-optional
  row:
    sizing: fit
    height: 72
    minHeight: 54
    verticalPadding: 8
    stripeEvery: 2
    stripeOffset: 1
    ruleScope: after-group-column
  cellPadding:
    top: 6
    right: 12
    bottom: 6
    left: 12
  columnTracks: []
  text:
    maxLines: 3
    horizontalAlign: start
    verticalAlign: center
    wrap: word
  title:
    padding:
      top: 0
      right: 0
      bottom: 0
      left: 0
    subtitleGap: 12
    showSubtitle: true
  axis:
    levels:
    - month
    bandHeights:
    - 48
    labelAlign: center
    padding:
      top: 8
      right: 0
      bottom: 8
      left: 0
    minorVisible: false
    tickStep: 1
    tickUnit: month
  scale:
    mode: fit-window
    dayWidth: 14
    paddingStart: 20
    paddingEnd: 20
    singlePointSpanDays: 1
  bars:
    gap: 4
    align: center
    comparisonMode: stacked
  variance:
    visible: true
    showZero: false
    offset: 12
    labelGap: 7
    labelAlign: center
  missingActual:
    mode: label
    gap: 4
  routing:
    enabled: true
    algorithm: orthogonal-obstacle
    clearance: 4
    gridOffset: 2
    portOffset: 8
    bendPenalty: 12
    strokeLayer: behind-marks
    limit: 4096
  lanes:
    grouping: view-groups
    stacking: stable-lowest-nonoverlap
    occupancy: mark-bounds-plus-required-label-bounds
    surface: row-aligned
    pitchPolicy: scene-mark-extent-plus-clearance
    trackPadding: 8
    trackGap: 6
    maxStack: 12
  legend:
    padding:
      top: 24
      right: 0
      bottom: 0
      left: 0
    itemGap: 28
    swatchWidth: 38
    swatchHeight: 12
    labelGap: 10
    rowGap: 12
    wrap: true
    coverageGap: 18
  notes:
    padding:
      top: 0
      right: 0
      bottom: 0
      left: 0
    itemGap: 8
  summary:
    padding:
      top: 0
      right: 0
      bottom: 0
      left: 0
    panelGap: 6
    metricGap: 3
detail:
  labelRules:
  - {id: actual-finish, source: actual-date, facet: actual, endpoint: finish, required: false}
  - {id: finish-variance, source: comparison-delta, facet: variance, endpoint: finish, required: false}
  groupLabel: Owner
  subtitle: Fictional SSD program / {windowStart} to {windowLastVisible} / Observations through 30 Jun
    2027
  accessibleDescription: Plan and Actual comparison. {selectedCount} rows; {unmatchedCount} unmatched
    observations. Actual is not a forecast.
  missingActualLabel: Actual not reported
  coverage: 'No actual: {missingCount}/{selectedCount} items / Unmapped observations: {unmatchedCount}
    / Delta: calendar days'
  legend:
  - role: planned
    label: Baseline plan
  - role: actual
    label: Observed actual
  - role: variance
    label: Finish variance
  - role: milestone
    label: Planned gate
  - role: dependency
    label: Dependency
  formatting:
    month: short-month-year
    quarter: quarter-year
    date: iso-date
    signedDaysSuffix: d
    positiveSign: +
    rangeSeparator: ' – '
    blank: ''
    unknown: unknown
    emDash: —
  summaryLabels:
    selectedCount: Selected work
    actualCoverage: Actual coverage
    knownFinishVarianceCount: Known finish variance
    missingActualCount: Missing Actual
    nextPlannedPoint: Next planned point
  title: ASTER / Qualification and production
  unmatchedActual: 'Unmatched Actual: {unmatchedIds}'
  summaryEntry: '{label}: {value}'
  coverageRatio: '{actualCount}/{selectedCount}'
  listSeparator: ', '
