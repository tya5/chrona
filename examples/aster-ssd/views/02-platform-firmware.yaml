version: chrona/view/v0.21
kind: view
id: aster-02-platform-firmware
body:
  surface: table-timeline
  selection:
    include:
      ids:
      - requirements
      - board
      - nand
      - power
      - boot
      - ftl
      - recovery
      - fw-freeze
      types:
      - span
      - point
  grouping:
    by: field
    field: owner
    missing: ungrouped
    order:
    - platform
    - firmware
    - performance
    - security
    - qualification
    - production
  ordering:
    by: plannedStart
    direction: ascending
    tieBreak: id
  window:
    mode: explicit
    start: '2027-01-01'
    end: '2027-06-01'
  comparison:
    baseline: primary
    actual: required
    observationSelection: latest
    deltaUnit: calendar-days
    facets:
    - planned
    - actual
    - finishDelta
    - missingActual
    - unmatchedActual
  visibility:
    labels: true
    relations:
      mode: semantic
      overflow: suppress
    annotations: none
  axis:
    tiers:
    - unit: quarter
      every: 1
      role: band
    - unit: quarter
      every: 1
      role: grid-major
    - unit: quarter
      every: 1
      role: labels
      label:
        form: year-quarter
        align: center
        overflow: thin-with-record
        orientation: horizontal
    - unit: month
      every: 1
      role: labels
      label:
        form: short-month
        align: start
        overflow: thin-with-record
        orientation: horizontal
    - unit: month
      every: 1
      role: grid-minor
  backgroundDecoration:
    rows: none
    groups: all
  tableColumns:
  - id: Work package / gate
    source: title
    missing: em-dash
    align: start
    width: {minmax: {min: content, max: {fr: 1}}}
    headerOrientation: horizontal
  rows:
    mode: automatic
