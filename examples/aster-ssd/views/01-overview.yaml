version: chrona/view/v0.6
kind: view
id: aster-01-overview
body:
  selection:
    include:
      ids:
      - board
      - ftl
      - fw-freeze
      - perf-exit
      - security-exit
      - qual-exit
      - pilot
      - release
      types:
      - span
      - point
  grouping:
    by: none
    missing: ungrouped
  ordering:
    by: plannedStart
    direction: ascending
    tieBreak: id
  window:
    mode: explicit
    start: '2027-01-01'
    end: '2027-09-01'
  comparison:
    baseline: primary
    actual: required
    observationSelection: latest
    deltaUnit: calendar-days
    facets:
    - planned
    - actual
    - finishDelta
    - missingActual
    - unmatchedActual
  visibility:
    labels: true
    relations: {mode: semantic, overflow: suppress}
    annotations: none
  layoutIntent:
    compactness: balanced
    itemStacking: stable
  tableColumns:
  - id: Work package / gate
    source: title
    missing: em-dash
  rows: {mode: automatic}
