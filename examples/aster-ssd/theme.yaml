version: chrona/presentation/v0.1
kind: theme
id: executive-light
body:
  values:
    canvas: {type: color, value: '#FFFFFF'}
    ink: {type: color, value: '#172033'}
    grid: {type: color, value: '#C9CED8'}
    grid-light: {type: color, value: '#E6E9EE'}
    header: {type: color, value: '#EAF0F8'}
    group: {type: color, value: '#EEF3F8'}
    group-firmware: {type: color, value: '#E7F0FA'}
    group-validation: {type: color, value: '#E8F6F0'}
    group-product: {type: color, value: '#FFF4E4'}
    plan: {type: color, value: '#3986E6'}
    actual: {type: color, value: '#269D79'}
    delay: {type: color, value: '#C8762B'}
    editorial: {type: fontFamily, value: 'Nimbus Sans, Arial, sans-serif'}
  roles:
    background: {fill: canvas}
    text: {fill: ink, fontFamily: editorial}
    axis-major: {stroke: grid}
    axis-minor: {stroke: grid-light}
    table-header: {fill: header}
    group-band: {fill: group}
    'group:factory-team': {fill: group-product}
    'group:fw-team': {fill: group-firmware}
    'group:validation-team': {fill: group-validation}
    planned: {fill: plan}
    actual: {fill: actual}
    variance-behind: {stroke: delay}
