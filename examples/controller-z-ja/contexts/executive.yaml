version: chrona/render-context/v0.16
kind: render-context
id: controller-z-ja-executive
body:
  project:
    id: controller-z-ja-silicon-bringup
    kind: project
    store:
      provider: local
      identity: controller-z-ja-example
    address: project.yaml
    revision:
      token: example-v1
  view:
    id: controller-z-ja-executive
    kind: view
    store:
      provider: local
      identity: controller-z-ja-example
    address: views/executive.yaml
    revision:
      token: example-v1
  theme:
    id: executive-light-ja
    kind: theme
    store:
      provider: local
      identity: controller-z-ja-example
    address: themes/executive-light.yaml
    revision:
      token: example-v1
  colorScheme:
    id: executive-light
    kind: color-scheme
    store:
      provider: local
      identity: controller-z-ja-example
    address: schemes/executive-light.yaml
    revision:
      token: example-v1
  layout:
    id: executive-review
    kind: layout-profile
    store:
      provider: local
      identity: controller-z-ja-example
    address: layouts/executive-review.yaml
    revision:
      token: example-v1
  inputs:
    actual:
      id: controller-z-ja-observed
      kind: actual-set
      store:
        provider: local
        identity: controller-z-ja-example
      address: actual.yaml
      revision:
        token: example-v1
    detailProfile:
      id: controller-z-ja-review-detail
      kind: review-detail-profile
      store:
        provider: local
        identity: controller-z-ja-example
      address: profiles/review-detail.yaml
      revision:
        token: example-v1
  environment:
    viewport:
      inlineSize: 1600
      blockSize: 900
    locale: ja-JP
    fontMetrics:
      algorithm: declared-metrics-v3
      missingFont: diagnose
      assets:
      - family: Noto Sans JP
        weight: 400
        metrics:
          locator:
            provider: package
            identity: chrona-fonts-noto-cjk
            address: font_metrics/noto-sans-jp-regular-v2.json
          contentIdentity: sha256:06ced32a2737bdfcb83596eca7e79eebf379f7b43f69d09b4974a459818e76c9
        font:
          locator:
            provider: package
            identity: chrona-fonts-noto-cjk
            address: fonts/noto-sans-jp-regular-v1.ttf
          contentIdentity: sha256:84d0bd9a7231cd598c221dfe23bdf4ecb4f996e505ce9bdcd3b1336866802af0
      - family: Noto Sans JP
        weight: 700
        metrics:
          locator:
            provider: package
            identity: chrona-fonts-noto-cjk
            address: font_metrics/noto-sans-jp-bold-v2.json
          contentIdentity: sha256:4672250bb08d13c822bc55a2f4e557996164ce291210843f4b3dc4a99ff3a789
        font:
          locator:
            provider: package
            identity: chrona-fonts-noto-cjk
            address: fonts/noto-sans-jp-bold-v1.ttf
          contentIdentity: sha256:84ad23bbb20113059ed4500bbfe2c83631269a26195c16ee2eef25c42c363d55
    scenePrecision: 3
  target:
    kind: svg
    visualProfile: chrona-output/visual/v0.5-baseline
    capabilities:
    - accessibleText
    - hierarchicalAxis
    - marker
    - semanticRoles
    - sourceMetadata
    - tableSemantics
