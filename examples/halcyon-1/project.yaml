    fields: {owner: payload, team: Imaging payload, phase: Qualify}
    schedule: {mode: scheduled, amount: 8d}
  payload-delivery:
    type: gate
    title: Payload delivered
    fields: {owner: payload, team: Imaging payload, phase: Qualify, review: PDD}
    schedule: {mode: fixed-point, at: '2027-07-02'}
  integration:
    type: task
    title: Spacecraft integration
    fields: {owner: ait, team: AIT, phase: Integrate}
    schedule: {mode: scheduled, amount: 15wd}
  vibration:
    type: task
    title: Vibration and shock
    fields: {owner: ait, team: AIT, phase: Verify}
    schedule: {mode: scheduled, amount: 5wd}
  tvac:
    type: task
    title: System thermal-vacuum
    fields: {owner: ait, team: AIT, phase: Verify}
    schedule: {mode: scheduled, amount: 14d}
  emc:
    type: task
    title: EMC and RF compatibility
    fields: {owner: ait, team: AIT, phase: Verify}
    schedule: {mode: scheduled, amount: 5wd, constraints: {end: {max: '2027-09-08'}}}
  psr:
    type: gate
    title: Pre-ship review
    fields: {owner: ait, team: Programme, phase: Verify, review: PSR}
    schedule: {mode: fixed-point, at: '2027-09-10'}
  mcs:
    type: task
    title: Mission control software
    fields: {owner: ground, team: Ground segment, phase: Build}
    schedule: {mode: scheduled, amount: 45wd, anchor: {start: '2027-03-08'}}
  station:
    type: task
    title: Ground station upgrade
    fields: {owner: ground, team: Ground segment, phase: Build}
    schedule: {mode: scheduled, amount: 30wd, anchor: {start: '2027-04-19'}}
  comms-test:
