version: timeline/v0.6
project:
  id: halcyon-1
  title: HALCYON-1
  calendar: engineering
calendars:
  engineering:
    working_days: [mon, tue, wed, thu, fri]
    exceptions:
      - {date: '2027-04-02', working: false}
      - {date: '2027-05-31', working: false}
      - {date: '2027-07-05', working: false}
      - {date: '2027-09-06', working: false}
  range:
    working_days: [mon, tue, wed, thu, fri, sat]
    exceptions:
      - {date: '2027-10-09', working: false}
      - {date: '2027-10-16', working: false}
entities:
  bus: {type: team, title: Spacecraft bus}
  payload: {type: team, title: Imaging payload}
  ait: {type: team, title: 'Assembly, integration and test'}
  ground: {type: team, title: Ground segment}
  launch: {type: team, title: Launch and range}
  ops: {type: team, title: Mission operations}
objects:
  pdr:
    type: gate
    title: Preliminary design review
    fields: {owner: bus, team: Programme, phase: Design, review: PDR}
    schedule: {mode: fixed-point, at: '2027-03-05'}
  structure:
    type: task
    title: Primary structure fabrication
    fields: {owner: bus, team: Spacecraft bus, phase: Build}
    schedule: {mode: scheduled, amount: 20wd}
  avionics:
    type: task
    title: Avionics integration
    fields: {owner: bus, team: Spacecraft bus, phase: Build}
    schedule: {mode: scheduled, amount: 15wd}
  eps:
    type: task
    title: Power system qualification
    fields: {owner: bus, team: Spacecraft bus, phase: Qualify}
    schedule: {mode: scheduled, amount: 12wd, anchor: {start: '2027-03-22'}}
  bus-test:
    type: task
    title: Bus functional test
    fields: {owner: bus, team: Spacecraft bus, phase: Qualify}
    schedule: {mode: scheduled, amount: 10wd}
  cdr:
    type: gate
    title: Critical design review
    fields: {owner: bus, team: Programme, phase: Design, review: CDR}
