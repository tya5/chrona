  optics:
    type: task
    title: Imager optics alignment
    fields: {owner: payload, team: Imaging payload, phase: Build}
    schedule: {mode: scheduled, amount: 18wd, anchor: {start: '2027-03-08'}}
  detector:
    type: task
    title: Detector calibration
    fields: {owner: payload, team: Imaging payload, phase: Qualify}
    schedule: {mode: scheduled, amount: 10wd}
  payload-tvac:
