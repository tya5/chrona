version: chrona/view/v0.16
kind: view
id: halcyon-04-tvac-slip
body:
  surface: table-timeline
  rows:
    mode: automatic
    points: group-header
  selection:
    include:
      ids:
      - tvac
      - emc
      - psr
      - shipment
      - campaign
      types:
      - span
      - point
  grouping:
    by: field
    field: owner
    missing: ungrouped
    order:
    - ait
    - launch
    presentation: header
  ordering:
    by: plannedStart
    direction: ascending
    tieBreak: id
  window:
    mode: explicit
    start: '2027-07-01'
    end: '2027-12-01'
  comparison:
    baseline: scenario
    scenario: tvac-slip
    actual: required
    observationSelection: latest
    deltaUnit: calendar-days
    facets:
    - planned
    - actual
    - finishDelta
    - missingActual
    - unmatchedActual
  visibility:
    labels:
      placement: plot
      content:
      - title
      side: auto
      overflow: suppress
    relations:
      mode: semantic
      overflow: suppress
      content:
      - lag
      - endpointPair
    annotations:
      mode: presentation
      marker: numbered
  axis:
    levels:
    - unit: quarter
      format: year-quarter
    - unit: month
      format: short-month
    ticks: week
  markers:
  - kind: asOf
    source: actual
    label: as of
  shading:
    nonWorking: true
    exceptions: true
  rowDecoration:
    mode: none
  tableColumns:
  - id: Work package
    source: title
    missing: em-dash
    align: start
    width: {minmax: {min: content, max: {fr: 1}}}
  - id: Scenario
    source:
      scenario: title
    missing: em-dash
    align: start
    width: content
  - id: Δ
    source:
      facet: finishDelta
    format: signedDays
    missing: em-dash
    align: end
    width: content
