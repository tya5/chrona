version: chrona/view/v0.18
kind: view
id: chrona-default-draft
body:
  surface: table-timeline
  selection:
    include:
      types:
      - span
      - point
  grouping:
    by: none
    missing: ungrouped
  ordering:
    by: plannedStart
    direction: ascending
    tieBreak: id
  window:
    mode: selected-planned
  comparison:
    baseline: primary
    actual: optional
    observationSelection: latest
    deltaUnit: calendar-days
    facets:
    - planned
    - actual
    - finishDelta
  visibility:
    labels:
      placement: plot
      content:
      - title
      side: auto
      overflow: suppress
    fallback:
      labels:
      - inside
      - above
      - suppress
    relations:
      mode: semantic
      overflow: suppress
    annotations: none
  rowDecoration:
    mode: none
  tableColumns:
  - id: Work item
    source: title
    missing: em-dash
    align: start
    width: {minmax: {min: content, max: {fr: 1}}}
    headerOrientation: horizontal
  - id: Plan
    source:
      facet: planned
    format: dateRange
    missing: em-dash
    align: start
    width: content
    headerOrientation: horizontal
  rows:
    mode: automatic
