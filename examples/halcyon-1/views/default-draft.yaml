version: chrona/view/v0.24
kind: view
id: chrona-default-draft
body:
  surface: table-timeline
  selection:
    include:
      types:
      - span
      - point
  grouping:
    by: none
    missing: ungrouped
  ordering:
    by: plannedStart
    direction: ascending
    tieBreak: id
  window:
    mode: selected-planned
  comparison:
    baseline: primary
    actual: optional
    observationSelection: latest
    deltaUnit: calendar-days
    facets:
    - planned
    - actual
    - finishDelta
  visibility:
    labels:
      placement: plot
      content:
      - title
      side: end
      overflow: suppress
    fallback:
      labels:
      - end
      - start
      - suppress
    relations:
      mode: semantic
      overflow: suppress
    annotations: none
  axis:
    tiers:
    - unit: quarter
      every: 1
      role: band
    - unit: quarter
      every: 1
      role: labels
      label: {form: year-quarter, align: center, overflow: thin-with-record, orientation: horizontal}
    - unit: month
      every: 1
      role: labels
      label: {form: short-month, align: center, overflow: thin-with-record, orientation: horizontal}
  backgroundDecoration:
    rows: alternate
    groups: all
  tableColumns:
  - id: Work item
    source: title
    missing: em-dash
    align: start
    width: {minmax: {min: content, max: {fr: 1}}}
    headerOrientation: horizontal
  - id: Plan
    source:
      facet: planned
    format: dateRange
    missing: em-dash
    align: start
    width: content
    headerOrientation: horizontal
  rows:
    mode: automatic
