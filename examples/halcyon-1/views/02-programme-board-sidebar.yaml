version: chrona/view/v0.28
kind: view
id: halcyon-02-programme-board-sidebar
# Slide 02 only (slides 11 and 12 keep views/02-programme-board.yaml): one row per work package
# under owner group-header bands, names and finish deltas beside their marks, and the Project
# notes listed in the sidebar's notes slot.
body:
  surface: table-timeline
  heading:
    kicker: "{project}"
    title: Programme board
    subtitle: "Every work package by owning team · baseline, current plan and observed"
    text: {wrap: allow}
  rows:
    mode: automatic
  selection:
    include:
      types:
      - span
      - point
    exclude:
      objectTypes:
      - group
  grouping:
    by: field
    field: owner
    missing: ungrouped
    order: [bus, payload, ait, ground, launch, ops]
    presentation: header
  ordering:
    by: source
    direction: ascending
    tieBreak: id
  window:
    mode: explicit
    start: '2027-03-01'
    end: '2027-12-01'
  periods:
  - id: launch-window
    label: {placement: top}
  figures:
  - {id: launch-countdown, kind: daysUntil, to: {period: launch-window, side: start}}
  comparison:
    baseline: primary
    missingActualScope: in-progress
    actual: required
    observationSelection: latest
    deltaUnit: calendar-days
    facets: [planned, actual, finishDelta, missingActual, unmatchedActual]
  visibility:
    labels:
      placement: plot
      content: [title, finishDelta]
      side: auto
      overflow: suppress
    relations:
      mode: semantic
      overflow: suppress
    annotations:
      mode: semantic
      marker: none
  axis:
    tiers:
    - unit: month
      every: 1
      role: grid-major
    - unit: month
      every: 1
      role: labels
      label: {form: short-month, align: start, overflow: visible-overflow, orientation: horizontal}
    - unit: week
      every: 1
      role: grid-minor
  markers:
  - kind: asOf
    source: actual
    label: {wording: marker.asOf}
    placement: below-plot
    date: {form: day-month}
  shading:
    nonWorking: true
    exceptions: true
  backgroundDecoration:
    rows: none
    groups: none
