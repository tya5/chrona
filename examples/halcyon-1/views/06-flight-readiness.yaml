version: chrona/view/v0.20
kind: view
id: halcyon-06-flight-readiness
body:
  surface: table-timeline
  rows:
    mode: automatic
  selection:
    include:
      ids:
      - mission-closeout
      - frr
      - launch
      - leop
      - first-light
      types:
      - span
      - point
  grouping:
    by: hierarchy
    depth: 1
    rollup: bar
    missing: ungrouped
  ordering:
    by: plannedStart
    direction: ascending
    tieBreak: id
  window:
    mode: explicit
    start: '2027-10-01'
    end: '2027-12-01'
  comparison:
    baseline: scenario
    scenario: tvac-slip
    actual: required
    observationSelection: latest
    deltaUnit: calendar-days
    facets:
    - planned
    - actual
    - finishDelta
    - missingActual
    - unmatchedActual
  visibility:
    labels:
      placement: table
      content:
      - title
      side: auto
      overflow: suppress
    relations:
      mode: critical
      overflow: suppress
    annotations:
      mode: none
      marker: none
    links: title
  axis:
    tiers:
    - unit: quarter
      every: 1
      role: band
    - unit: quarter
      every: 1
      role: grid-major
    - unit: quarter
      every: 1
      role: labels
      label:
        form: year-quarter
        align: center
        overflow: visible-overflow
        orientation: horizontal
    - unit: month
      every: 1
      role: labels
      label:
        form: short-month
        align: start
        overflow: visible-overflow
        orientation: rotate-cw
    - unit: month
      every: 1
      role: grid-minor
    - unit: week
      every: 1
      role: grid-minor
  markers:
  - kind: asOf
    source: actual
    label: as of
  shading:
    nonWorking: true
    exceptions: true
  rowDecoration:
    mode: none
  tableColumns:
  - id: WBS
    source: wbsCode
    missing: em-dash
    align: start
    width: content
    headerOrientation: horizontal
  - id: Work package
    source: title
    missing: em-dash
    align: start
    width: {minmax: {min: content, max: {fr: 1}}}
    headerOrientation: horizontal
  - id: Float
    source: totalFloat
    format: signedDays
    missing: em-dash
    align: end
    width: content
    headerOrientation: horizontal
  - id: Scenario
    source:
      scenario: title
    missing: em-dash
    align: start
    width: content
    headerOrientation: horizontal
  hierarchyColumn: Work package
