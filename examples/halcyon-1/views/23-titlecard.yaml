version: chrona/view/v0.28
kind: view
id: halcyon-23-titlecard
# Thin connector: HALCYON's ids, bindings and wording only. The design, including the heading
# templates, is the titlecard Layout profile's `viewDefaults`. The heading and the notes heading
# count with the figures declared here; the countdown slot is bound to this project's period.
body:
  surface: table-timeline
  window:
    mode: explicit
    start: '2027-03-01'
    end: '2027-12-01'
  periods:
  - id: launch-window
    label: {}
  figures:
  - {id: selected-count, kind: count, source: selected}
  - {id: group-count, kind: count, source: groups}
  - {id: note-count, kind: count, source: placedNotes}
  bindings:
    countdown: {figure: {kind: daysUntil, to: {period: launch-window, side: start}}}
  comparison:
    baseline: snapshot
    actual: required
    observationSelection: latest
  annotationBindings:
  - {kind: note, temporalKind: point, purpose: note, facet: planned, endpoint: at}
  - {kind: risk, temporalKind: span, purpose: note, facet: actual, endpoint: body}
  - {kind: note, temporalKind: span, purpose: note, facet: planned, endpoint: end}
  markers:
  - source: actual
  hierarchyColumn: Work package
  tableColumns:
  - id: Work package
    source: title
  - id: Phase
    source:
      field: phase
  - id: Δ finish
    source:
      facet: finishDelta
  selection:
    include:
      types:
      - span
      - point
    exclude:
      objectTypes:
      - group
  grouping:
    by: field
    field: owner
    missing: ungrouped
    order:
    - bus
    - payload
    - ait
    - ground
    - launch
    - ops
  ordering:
    by: source
    direction: ascending
    tieBreak: id
