version: chrona/view/v0.28
kind: view
id: halcyon-24-marquee
# Thin connector: HALCYON's ids, bindings and wording only. The design, including the heading
# template, is the marquee Layout profile's `viewDefaults`; the heading counts with the figures
# declared here.
body:
  surface: table-timeline
  window:
    mode: explicit
    start: '2027-03-01'
    end: '2027-12-01'
  periods:
  - id: launch-window
    label:
      text: OPENING NIGHT
  figures:
  - {id: selected-count, kind: count, source: selected}
  - {id: group-count, kind: count, source: groups}
  comparison:
    baseline: snapshot
    actual: required
    observationSelection: latest
  annotationBindings:
  - {kind: risk, temporalKind: span, purpose: note, facet: actual, endpoint: body}
  - {kind: note, temporalKind: span, purpose: note, facet: planned, endpoint: end}
  - {kind: note, temporalKind: point, purpose: note, facet: planned, endpoint: at}
  markers:
  - source: actual
  hierarchyColumn: The company
  tableColumns:
  - id: The company
    source: title
  - id: Role
    source:
      field: phase
  - id: Δ finish
    source:
      facet: finishDelta
  selection:
    include:
      types:
      - span
      - point
    exclude:
      objectTypes:
      - group
  grouping:
    by: field
    field: owner
    missing: ungrouped
    order:
    - bus
    - payload
    - ait
    - ground
    - launch
    - ops
  ordering:
    by: source
    direction: ascending
    tieBreak: id
