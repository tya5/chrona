version: chrona/presentation/v0.1
kind: view
id: halcyon-02-programme-board
body:
  selection:
    include:
      types: [span, point]
  grouping:
    by: field
    field: owner
    missing: ungrouped
    order: [bus, payload, ait, ground, launch, ops]
  ordering:
    by: plannedStart
    direction: ascending
    tieBreak: id
  window:
    mode: explicit
    start: '2027-03-01'
    end: '2027-12-01'
  comparison:
    baseline: primary
    actual: required
    observationSelection: latest
    deltaUnit: calendar-days
    facets: [planned, actual, finishDelta, missingActual, unmatchedActual]
  visibility:
    labels: true
    relations: semantic
    annotations: none
  layoutIntent:
    compactness: compact
    itemStacking: stable
  tableColumns:
    - {id: Work package, source: title, missing: em-dash}
    - {id: Phase, source: {field: phase}, missing: em-dash}
