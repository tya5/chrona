version: chrona/view/v0.4
kind: view
id: halcyon-02-programme-board
body:
  rows: {mode: automatic}
  selection:
    include:
      types: [span, point]
  grouping:
    by: field
    field: owner
    missing: ungrouped
    order: [bus, payload, ait, ground, launch, ops]
    presentation: header
  ordering:
    by: plannedStart
    direction: ascending
    tieBreak: id
  window:
    mode: explicit
    start: '2027-03-01'
    end: '2027-12-01'
  comparison:
    baseline: primary
    actual: required
    observationSelection: latest
    deltaUnit: calendar-days
    facets: [planned, actual, finishDelta, missingActual, unmatchedActual]
  visibility:
    labels: {placement: table, content: [title], side: auto, overflow: suppress}
    relations: {mode: semantic, overflow: suppress}
    annotations: {mode: presentation, marker: numbered}
  axis:
    levels: [{unit: quarter, format: year-quarter}, {unit: month, format: short-month}]
    ticks: week
  markers: [{kind: asOf, source: actual, label: as of}]
  shading: {nonWorking: true, exceptions: true}
  layoutIntent:
    compactness: compact
    itemStacking: stable
  tableColumns:
    - {id: Work package, source: title, missing: em-dash}
    - {id: Phase, source: {field: phase}, missing: em-dash}
    - {id: Δ, source: {facet: finishDelta}, format: signedDays, missing: em-dash}
