version: chrona/view/v0.28
kind: view
id: halcyon-02-programme-board
body:
  surface: table-timeline
  rows:
    mode: lanes
    packing: [explicit, attached, chain, dates]
    laneTable: {label: group, count: true}
  selection:
    include:
      ids:
      - pdr
      - structure
      - avionics
      - eps
      - bus-test
      - cdr
      - optics
      - detector
      - payload-tvac
      - payload-delivery
      - integration
      - vibration
      - tvac
      - emc
      - psr
      - mcs
      - station
      - comms-test
      - launch-contract
      - shipment
      - campaign
      - frr
      - launch
      - rehearsals
      - leop
      - first-light
      types:
      - span
      - point
  colorEncoding:
    scale: owner
    target: planned
    source:
      field: owner
    domain:
    - bus
    - payload
    - ait
    - ground
    - launch
    - ops
  progressFill:
    source: planned
  grouping:
    by: field
    field: owner
    missing: ungrouped
    order:
    - bus
    - payload
    - ait
    - ground
    - launch
    - ops
    presentation: header
  ordering:
    by: plannedStart
    direction: ascending
    tieBreak: id
  window:
    mode: explicit
    start: '2027-03-01'
    end: '2027-12-01'
  comparison:
    baseline: primary
    actual: required
    observationSelection: latest
    deltaUnit: calendar-days
    facets:
    - planned
    - actual
    - finishDelta
    - missingActual
    - unmatchedActual
  visibility:
    labels:
      placement: plot
      content:
      - title
      - finishDelta
      side: auto
      overflow: suppress
    relations:
      mode: semantic
      overflow: suppress
    annotations:
      mode: presentation
      marker: numbered
  annotations:
  - id: window-note
    purpose: note
    anchor:
      kind: object
      id: launch
      facet: planned
      endpoint: at
    projectAnnotation: window
    candidates:
    - id: plot-near
      region: {kind: plot}
      search: {kind: nearest-free, maxPositions: 1024, maxInlineEm: 12}
      obstacles: {classes: [mark, text, label-visual, dependency-route, leader-route, annotation-box, port, rule]}
      connector: {kind: tail}
  - id: tvac-note
    purpose: note
    anchor:
      kind: object
      id: payload-tvac
      facet: actual
      endpoint: body
    projectAnnotation: tvac
    candidates:
    - id: plot-near
      region: {kind: plot}
      search: {kind: nearest-free, maxPositions: 1024, maxInlineEm: 12}
      obstacles: {classes: [mark, text, label-visual, dependency-route, leader-route, annotation-box, port, rule]}
      connector: {kind: tail}
  - id: station-note
    purpose: note
    anchor:
      kind: object
      id: station
      facet: planned
      endpoint: finish
    projectAnnotation: station
    candidates:
    - id: plot-near
      region: {kind: plot}
      search: {kind: nearest-free, maxPositions: 1024, maxInlineEm: 12}
      obstacles: {classes: [mark, text, label-visual, dependency-route, leader-route, annotation-box, port, rule]}
      connector: {kind: tail}
  axis:
    tiers:
    - unit: quarter
      every: 1
      role: band
    - unit: quarter
      every: 1
      role: grid-major
    - unit: quarter
      every: 1
      role: labels
      label:
        form: year-quarter
        align: center
        overflow: visible-overflow
        orientation: horizontal
    - unit: month
      every: 1
      role: labels
      label:
        form: short-month
        align: start
        overflow: visible-overflow
        orientation: horizontal
    - unit: month
      every: 1
      role: grid-minor
    - unit: week
      every: 1
      role: grid-minor
  markers:
  - kind: asOf
    source: actual
    label: Today
  shading:
    nonWorking: true
    exceptions: true
  backgroundDecoration:
    rows: none
    groups: all
