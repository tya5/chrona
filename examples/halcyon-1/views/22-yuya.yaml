version: chrona/view/v0.28
kind: view
id: halcyon-22-yuya
# Thin connector: HALCYON's ids, bindings and wording only. The design is the yuya Layout profile's
# `viewDefaults`. The heading names this project's year and calendar, and the group header reads the
# project's `titleJa` field, so both stay here.
body:
  surface: table-timeline
  heading:
    title: 計画表　{project}
    subtitle: PROGRAMME BOARD · 二〇二七年 · 工学暦
    dateForm: day-month-year
  window:
    mode: explicit
    start: '2027-03-01'
    end: '2027-12-01'
  periods:
  - id: launch-window
    label: {}
  comparison:
    baseline: snapshot
    actual: required
    observationSelection: latest
  annotationBindings:
  - {kind: note, temporalKind: point, purpose: note, facet: planned, endpoint: at}
  - {kind: risk, temporalKind: span, purpose: note, facet: actual, endpoint: body}
  - {kind: note, temporalKind: span, purpose: note, facet: planned, endpoint: end}
  markers:
  - source: actual
  hierarchyColumn: Work package
  tableColumns:
  - id: Work package
    source: title
  - id: Phase
    source:
      field: phase
  - id: Δ finish
    source:
      facet: finishDelta
  selection:
    include:
      types:
      - span
      - point
    exclude:
      objectTypes:
      - group
  grouping:
    by: field
    field: owner
    missing: ungrouped
    order:
    - bus
    - payload
    - ait
    - ground
    - launch
    - ops
    header:
      text: '{ordinal}・{secondary}'
      ordinal: kanji-formal
      secondary:
        entityField: titleJa
  ordering:
    by: source
    direction: ascending
    tieBreak: id
