version: chrona/view/v0.6
kind: view
id: halcyon-03-launch-campaign
body:
  rows: {mode: automatic}
  selection:
    include:
      ids: [integration, vibration, tvac, emc, psr, rehearsals, shipment, campaign, frr, launch, leop, first-light]
      types: [span, point]
  grouping:
    by: none
    missing: ungrouped
  ordering:
    by: plannedStart
    direction: ascending
    tieBreak: id
  window:
    mode: explicit
    start: '2027-07-01'
    end: '2027-12-01'
  comparison:
    baseline: primary
    actual: optional
    observationSelection: latest
    deltaUnit: calendar-days
    facets: [planned, actual, finishDelta]
  visibility:
    labels: {placement: plot, content: [title], side: auto, overflow: suppress}
    relations: {mode: semantic, overflow: suppress}
    annotations: {mode: presentation, marker: numbered}
  axis:
    levels: [{unit: quarter, format: year-quarter}, {unit: month, format: short-month}]
    ticks: week
  markers: [{kind: asOf, source: actual, label: as of}]
  shading: {nonWorking: true, exceptions: true}
  layoutIntent:
    compactness: expanded
    itemStacking: stable
  tableColumns:
    - {id: Activity, source: title, missing: em-dash}
    - {id: Plan, source: {facet: planned}, format: dateRange, missing: em-dash}
    - {id: Actual, source: {facet: actual}, format: dateRange, missing: in-progress}
    - {id: Δ, source: {facet: finishDelta}, format: signedDays, missing: em-dash}
