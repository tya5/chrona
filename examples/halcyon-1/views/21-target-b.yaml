version: chrona/view/v0.28
kind: view
id: halcyon-21-target-b
# Thin connector: HALCYON's ids, bindings and wording only. The design (axis, comparison policy,
# column styles, annotation placement and the rest) is the target-b Layout profile's `viewDefaults`.
body:
  surface: table-timeline
  heading:
    title: "{project} · Programme board"
    subtitle: "Every work package by owning team · baseline, current plan and observed · as of {asOf} · calendar: {calendar} (range for launch campaign)"
    dateForm: day-month-year
  window:
    mode: explicit
    start: '2027-03-01'
    end: '2027-12-01'
  periods:
  - id: launch-window
    label: {}
  comparison:
    baseline: snapshot
    actual: required
    observationSelection: latest
  annotationBindings:
  - {kind: note, temporalKind: point, purpose: note, facet: planned, endpoint: at}
  - {kind: risk, temporalKind: span, purpose: note, facet: actual, endpoint: body}
  - {kind: note, temporalKind: span, purpose: note, facet: planned, endpoint: end}
  markers:
  - source: actual
  hierarchyColumn: Work package
  tableColumns:
  - id: Work package
    source: title
  - id: Phase
    source:
      field: phase
  - id: Δ finish
    source:
      facet: finishDelta
  selection:
    include:
      types:
      - span
      - point
    exclude:
      objectTypes:
      - group
  grouping:
    by: field
    field: owner
    missing: ungrouped
    order:
    - bus
    - payload
    - ait
    - ground
    - launch
    - ops
  ordering:
    by: source
    direction: ascending
    tieBreak: id
