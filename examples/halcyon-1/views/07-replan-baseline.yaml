version: chrona/view/v0.17
kind: view
id: halcyon-07-replan-baseline
body:
  surface: table-timeline
  rows:
    mode: automatic
  selection:
    include:
      ids:
      - spacecraft-ait
      - integration
      - vibration
      - tvac
      - emc
      - psr
      - shipment
      - campaign
      types:
      - span
      - point
  grouping:
    by: hierarchy
    depth: 1
    rollup: bar
    missing: ungrouped
  ordering:
    by: plannedStart
    direction: ascending
    tieBreak: id
  window:
    mode: explicit
    start: '2027-06-28'
    end: '2027-11-15'
  comparison:
    baseline: snapshot
    actual: optional
    observationSelection: latest
    deltaUnit: calendar-days
    facets:
    - planned
    - actual
    - finishDelta
    - missingActual
    - unmatchedActual
  visibility:
    labels:
      placement: plot
      content:
      - title
      side: auto
      overflow: suppress
    relations:
      mode: semantic
      overflow: suppress
    annotations:
      mode: presentation
      marker: numbered
  axis:
    tiers:
    - unit: quarter
      every: 1
      role: band
    - unit: quarter
      every: 1
      role: grid-major
    - unit: month
      every: 1
      role: labels
      label:
        form: short-month
        align: start
        overflow: diagnose
    - unit: month
      every: 1
      role: grid-minor
    - unit: week
      every: 1
      role: grid-minor
  markers:
  - kind: asOf
    source: actual
    label: as of
  shading:
    nonWorking: true
    exceptions: true
  rowDecoration:
    mode: none
  tableColumns:
  - id: Work package
    source: title
    missing: em-dash
    align: start
    width: {minmax: {min: content, max: {fr: 1}}}
  - id: Baseline finish
    source:
      comparisonFacet: finishDelta
    format: signedDays
    missing: em-dash
    align: end
    width: content
  - id: Δ
    source:
      facet: finishDelta
    format: signedDays
    missing: em-dash
    align: end
    width: content
  hierarchyColumn: Work package
