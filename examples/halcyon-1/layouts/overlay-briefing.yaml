version: chrona/layout-profile/v0.10
# Used by slide 11 only. The review block is 1000 px, not the Theme's 960, so the launch-window lane
# added by views/11-overlay-briefing.yaml keeps a connected route and its name pose (#1848).
id: overlay-briefing
flowDirection: horizontal
dependencyNetworkFlowDirection: horizontal
requiredThemeTokens: [panel.side, spacing.l, spacing.m, spacing.none]
reviewSurface: {rowDistribution: fill, backgroundExtents: {rowBand: table, groupBand: timeline, groupHeaderBand: both, calendarClosed: timeline}, annotationRouting: {maxBends: 4, maxDetourRatio: 2}}
relationRouting: {maxBends: 4, maxDetourRatio: 2}
root:
  id: overlay-page
  kind: overlay
  inlineSize: fill
  blockSize: fill
  padding: {token: spacing.l}
  guides:
    review-top: {axis: block, at: "1/8"}
  barriers:
    sidebar-end: {axis: inline, edge: end, members: [sidebar]}
    table-end: {axis: inline, edge: end, members: [table]}
  children:
    - id: sidebar
      kind: column
      inlineSize: {fixed: {token: panel.side}}
      blockSize: max-content
      gap: {token: spacing.m}
      padding: {token: spacing.none}
      alignItems: start
      justifyContent: start
      anchor:
        self: {inline: start, block: start}
        target:
          inline: {ref: parent, point: start}
          block: {ref: guide:review-top, point: start}
      children:
        - id: title
          kind: slot
          source: title
          inlineSize: content
          blockSize: content
          place: {inline: start, block: start, safety: safe}
          priority: required
          overflow: visible-overflow
    - id: table
      kind: slot
      source: table
      inlineSize: content
      blockSize: {fixed: 1000}
      place: {inline: start, block: start, safety: strict}
      anchor:
        self: {inline: start, block: start}
        target:
          inline: {ref: barrier:sidebar-end, point: end}
          block: {ref: guide:review-top, point: start}
        gap: {inline: {token: spacing.m}}
      priority: required
      overflow: visible-overflow
    - id: timeline-stack
      kind: column
      inlineSize: content
      blockSize: {fixed: 1000}
      gap: {token: spacing.none}
      padding: {token: spacing.none}
      alignItems: stretch
      justifyContent: start
      anchor:
        self: {inline: start, block: start}
        target:
          inline: {ref: barrier:table-end, point: end}
          block: {ref: guide:review-top, point: start}
        gap: {inline: {token: spacing.m}}
      children:
        - id: timeline-axis
          kind: slot
          source: timeline-axis
          inlineSize: content
          blockSize: content
          place: {inline: stretch, block: start, safety: strict}
          priority: required
          overflow: visible-overflow
        - id: timeline
          kind: slot
          source: timeline
          inlineSize: content
          blockSize: fill
          place: {inline: stretch, block: stretch, safety: strict}
          priority: required
          overflow: visible-overflow
