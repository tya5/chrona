version: chrona/layout-profile/v0.10
id: marquee
flowDirection: horizontal
dependencyNetworkFlowDirection: horizontal
requiredThemeTokens: [legend-block, legend-gap, legend-item-min, note-rail-width, spacing.frame, spacing.l, spacing.m, spacing.none]
reviewSurface: {rowDistribution: fill, backgroundExtents: {rowBand: table, groupBand: both, groupHeaderBand: both, calendarClosed: timeline}, annotationRouting: {maxBends: 4, maxDetourRatio: 2}}
relationRouting: {maxBends: 4, maxDetourRatio: 4, entry: side}
root:
  id: page
  kind: column
  inlineSize: fill
  blockSize: fill
  gap: {token: spacing.none}
  padding: {token: spacing.frame}
  alignItems: stretch
  justifyContent: start
  frame: {inset: 4, paint: outer}
  children:
    - id: stage
      kind: column
      inlineSize: fill
      blockSize: fill
      gap: {token: spacing.m}
      padding: {inlineStart: {token: spacing.l}, inlineEnd: {token: spacing.l}, blockStart: {token: spacing.l}, blockEnd: {token: spacing.m}}
      alignItems: stretch
      justifyContent: start
      frame: {inset: 0, paint: inner}
      children:
        - id: head
          kind: row
          inlineSize: fill
          blockSize: content
          gap: {token: spacing.l}
          padding: {token: spacing.none}
          alignItems: start
          justifyContent: start
          children:
            - id: sign
              kind: row
              inlineSize: content
              blockSize: content
              gap: {token: spacing.none}
              padding: {token: spacing.l}
              alignItems: center
              justifyContent: center
              frame: {inset: 2, paint: marquee}
              children:
                - id: title
                  kind: slot
                  source: heading.title
                  inlineSize: content
                  blockSize: content
                  place: {inline: center, block: center, safety: safe}
                  priority: required
                  overflow: visible-overflow
            - id: head-text
              kind: column
              inlineSize: fill
              blockSize: content
              gap: {token: spacing.none}
              padding: {token: spacing.none}
              alignItems: start
              justifyContent: start
              children:
                - id: kicker
                  kind: slot
                  source: heading.kicker
                  inlineSize: fill
                  blockSize: content
                  place: {inline: start, block: start, safety: safe}
                  priority: required
                  overflow: visible-overflow
                - id: subtitle
                  kind: slot
                  source: heading.subtitle
                  inlineSize: fill
                  blockSize: content
                  place: {inline: start, block: start, safety: safe}
                  priority: required
                  overflow: visible-overflow
        - id: review
          kind: row
          inlineSize: fill
          blockSize: fill
          gap: {token: spacing.m}
          padding: {token: spacing.none}
          alignItems: stretch
          justifyContent: start
          children:
            - id: table
              kind: slot
              source: table
              inlineSize: {minmax: {min: content, max: {fr: 1}}}
              blockSize: fill
              place: {inline: stretch, block: stretch, safety: strict}
              priority: required
              overflow: visible-overflow
            - id: timeline-stack
              kind: column
              inlineSize: {fr: 2}
              blockSize: fill
              gap: {token: spacing.none}
              padding: {token: spacing.none}
              alignItems: stretch
              justifyContent: start
              children:
                - id: timeline-axis
                  kind: slot
                  source: timeline-axis
                  inlineSize: fill
                  blockSize: content
                  place: {inline: stretch, block: start, safety: strict}
                  priority: required
                  overflow: visible-overflow
                - id: timeline
                  kind: slot
                  source: timeline
                  inlineSize: fill
                  blockSize: fill
                  place: {inline: stretch, block: stretch, safety: strict}
                  priority: required
                  overflow: visible-overflow
            - id: annotations
              kind: slot
              source: annotations
              heading: {text: LATE EDITION, align: start, block: header-row}
              inlineSize: {fixed: {token: note-rail-width}}
              blockSize: fill
              place: {inline: stretch, block: stretch, safety: strict}
              priority: optional
              overflow: visible-overflow
        - id: legend
          kind: slot
          source: legend
          inlineSize: fill
          blockSize: {fixed: {token: legend-block}}
          place: {inline: start, block: start, safety: safe}
          priority: preferred
          overflow: ellipsize-with-source
          direction: inline
          itemMinInlineSize: {token: legend-item-min}
          gap: {token: legend-gap}
