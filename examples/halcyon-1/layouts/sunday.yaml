version: chrona/layout-profile/v0.10
id: sunday
flowDirection: horizontal
dependencyNetworkFlowDirection: horizontal
requiredThemeTokens: [key-panel-block, legend-gap, spacing.frame, spacing.gutter, spacing.l, spacing.m, spacing.none, spacing.s, title-panel-width]
reviewSurface: {rowDistribution: fill, backgroundExtents: {rowBand: table, groupBand: timeline, groupHeaderBand: text, groupHeaderStrip: both, calendarClosed: timeline}, annotationRouting: {maxBends: 4, maxDetourRatio: 2}}
relationRouting: {maxBends: 4, maxDetourRatio: 4, entry: side}
root:
  id: page
  kind: column
  inlineSize: fill
  blockSize: fill
  gap: {token: spacing.gutter}
  padding: {token: spacing.frame}
  alignItems: stretch
  justifyContent: start
  children:
    - id: head
      kind: row
      inlineSize: fill
      blockSize: {fixed: {token: key-panel-block}}
      gap: {token: spacing.gutter}
      padding: {token: spacing.none}
      alignItems: stretch
      justifyContent: start
      children:
        - id: title-panel
          kind: row
          inlineSize: {fixed: {token: title-panel-width}}
          blockSize: fill
          gap: {token: spacing.l}
          padding: {token: spacing.m}
          alignItems: center
          justifyContent: start
          frame: {inset: 0, paint: title}
          children:
            - id: title
              kind: slot
              source: heading.title
              inlineSize: content
              blockSize: content
              place: {inline: start, block: center, safety: safe}
              priority: required
              overflow: visible-overflow
            - id: head-text
              kind: column
              inlineSize: fill
              blockSize: content
              gap: {token: spacing.s}
              padding: {token: spacing.none}
              alignItems: start
              justifyContent: center
              children:
                - id: kicker
                  kind: slot
                  source: heading.kicker
                  inlineSize: fill
                  blockSize: content
                  place: {inline: start, block: start, safety: safe}
                  priority: required
                  overflow: visible-overflow
                - id: subtitle
                  kind: slot
                  source: heading.subtitle
                  inlineSize: fill
                  blockSize: content
                  place: {inline: start, block: start, safety: safe}
                  priority: required
                  overflow: visible-overflow
        - id: key-panel
          kind: column
          inlineSize: fill
          blockSize: fill
          gap: {token: spacing.none}
          padding: {token: spacing.s}
          alignItems: stretch
          justifyContent: center
          frame: {inset: 0, paint: key}
          children:
            - id: legend
              kind: slot
              source: legend
              heading: {text: THE KEY, align: start, block: start-column}
              inlineSize: fill
              blockSize: fill
              place: {inline: start, block: center, safety: safe}
              priority: preferred
              overflow: ellipsize-with-source
              columns: 3
              gap: {token: legend-gap}
    - id: chart-panel
      kind: row
      inlineSize: fill
      blockSize: fill
      gap: {token: spacing.m}
      padding: {token: spacing.m}
      alignItems: stretch
      justifyContent: start
      frame: {inset: 0, paint: chart}
      children:
        - id: table
          kind: slot
          source: table
          inlineSize: {minmax: {min: content, max: {fr: 1}}}
          blockSize: fill
          place: {inline: stretch, block: stretch, safety: strict}
          priority: required
          overflow: visible-overflow
        - id: timeline-stack
          kind: column
          inlineSize: {fr: 3}
          blockSize: fill
          gap: {token: spacing.none}
          padding: {token: spacing.none}
          alignItems: stretch
          justifyContent: start
          children:
            - id: timeline-axis
              kind: slot
              source: timeline-axis
              inlineSize: fill
              blockSize: content
              place: {inline: stretch, block: start, safety: strict}
              priority: required
              overflow: visible-overflow
            - id: timeline
              kind: slot
              source: timeline
              inlineSize: fill
              blockSize: fill
              place: {inline: stretch, block: stretch, safety: strict}
              priority: required
              overflow: visible-overflow
