version: chrona/theme/v0.2
kind: theme
id: print
body:
  values:
    editorial: {type: fontFamily, value: 'Nimbus Sans, Helvetica Neue, Arial, sans-serif'}
    spacing.none: {type: number, value: 0}
    spacing.xs: {type: number, value: 6}
    spacing.s: {type: number, value: 12}
    spacing.m: {type: number, value: 20}
    spacing.l: {type: number, value: 40}
    spacing.xl: {type: number, value: 64}
    panel.side: {type: number, value: 360}
    panel.notes: {type: number, value: 340}
    panel.timeline: {type: number, value: 840}
    text-size: {type: number, value: 14}
    text-line-height: {type: number, value: 1.5}
    timeline-day-width: {type: number, value: 5}
    timeline-row-height: {type: number, value: 44}
    timeline-axis-height: {type: number, value: 40}
    table-column-width: {type: number, value: 130}
    table-header-height: {type: number, value: 40}
  roles:
    text: {fontFamily: editorial}
  colorBindings:
    background.fill: surface
    text.fill: text
    table-header.fill: surfaceRaised
    planned.fill: accent
    actual.fill: positive
    axis-major.stroke: neutral
    dependency.stroke: neutral
    group-band.fill: category
  metrics:
    text.body.size: text-size
    text.body.lineHeight: text-line-height
    timeline.dayWidth: timeline-day-width
    timeline.row.minBlockSize: timeline-row-height
    timeline.axis.blockSize: timeline-axis-height
    table.column.minInlineSize: table-column-width
    table.header.blockSize: table-header-height
