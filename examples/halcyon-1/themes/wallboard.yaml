version: chrona/theme/v0.3
kind: theme
id: wallboard
body:
  values:
    editorial: {type: fontFamily, value: 'Nimbus Sans, Helvetica Neue, Arial, sans-serif'}
    weight.regular: {type: fontWeight, value: '400'}
    weight.bold: {type: fontWeight, value: '700'}
    size.heading: {type: number, value: 40}
    size.subtitle: {type: number, value: 18}
    size.body: {type: number, value: 15}
    size.axis: {type: number, value: 13}
    size.legend: {type: number, value: 14}
    size.note: {type: number, value: 15}
    leading.tight: {type: number, value: 1.15}
    leading.body: {type: number, value: 1.45}
    arrow: {type: marker, value: triangle}
    stroke-width: {type: number, value: 1}
    hatch: {type: pattern, value: diagonal-hatch}
    spacing.none: {type: number, value: 0}
    spacing.m: {type: number, value: 24}
    spacing.l: {type: number, value: 40}
    panel.side: {type: number, value: 420}
    timeline-day-width: {type: number, value: 4}
    timeline-calendar-closed-min-day-width: {type: number, value: 6}
    timeline-row-height: {type: number, value: 30}
    timeline-mark-size: {type: number, value: 10}
    timeline-axis-height: {type: number, value: 46}
    network-node-min-inline: {type: number, value: 120}
    network-node-min-block: {type: number, value: 36}
    network-rank-gap: {type: number, value: 24}
    table-column-width: {type: number, value: 210}
    table-column-gutter: {type: number, value: 14}
    table-indent: {type: number, value: 16}
    table-header-height: {type: number, value: 46}
    timeline-group-header-size: {type: number, value: 20}
    opacity.group-band: {type: number, value: 0.12}
    opacity.group-header-band: {type: number, value: 0.2}
    opacity.calendar-closed: {type: number, value: 0.12}
  roles:
    group-band: {opacity: opacity.group-band}
    group-header-band: {opacity: opacity.group-header-band}
    calendar-closed: {opacity: opacity.calendar-closed}
    text: {fontFamily: editorial, fontWeight: weight.regular, fontSize: size.body, lineHeight: leading.body}
    heading: {fontFamily: editorial, fontWeight: weight.bold, fontSize: size.heading, lineHeight: leading.tight}
    subtitle: {fontFamily: editorial, fontWeight: weight.regular, fontSize: size.subtitle, lineHeight: leading.body}
    axis: {fontFamily: editorial, fontWeight: weight.bold, fontSize: size.axis, lineHeight: leading.body}
    legend: {fontFamily: editorial, fontWeight: weight.regular, fontSize: size.legend, lineHeight: leading.body}
    annotation: {fontFamily: editorial, fontWeight: weight.regular, fontSize: size.note, lineHeight: leading.body, strokeWidth: stroke-width}
    summary: {fontFamily: editorial, fontWeight: weight.regular, fontSize: size.legend, lineHeight: leading.body}
    metric: {fontFamily: editorial, fontWeight: weight.bold, fontSize: size.heading, lineHeight: leading.tight}
    groupHeader: {fontFamily: editorial, fontWeight: weight.bold, fontSize: size.axis, lineHeight: leading.body}
    dependency: {marker: arrow, strokeWidth: stroke-width}
    missing-actual: {pattern: hatch, strokeWidth: stroke-width}
    axis-major: {strokeWidth: stroke-width}
    axis-minor: {strokeWidth: stroke-width}
    network-edge: {strokeWidth: stroke-width}
    critical-edge: {strokeWidth: stroke-width}
    variance-behind: {strokeWidth: stroke-width}
    baseline: {strokeWidth: stroke-width}
    asOf: {strokeWidth: stroke-width}
    as-of: {strokeWidth: stroke-width}
  colorBindings:
    background.fill: surface
    text.fill: text
    member-label-inside-planned.fill: insideLabelPlanned
    member-label-inside-actual.fill: insideLabelActual
    member-label-inside-snapshot.fill: insideLabelSnapshot
    member-label-inside-scenario.fill: insideLabelScenario
    heading.fill: text
    subtitle.fill: textMuted
    axis.fill: textMuted
    legend.fill: textMuted
    annotation.fill: surfaceRaised
    annotation.stroke: neutral
    summary.fill: text
    metric.fill: text
    table-header.fill: surfaceRaised
    axis-major.stroke: neutral
    axis-minor.stroke: surfaceRaised
    axis-band-decoration.fill: surface
    group-band.fill: category
    group-header-band.fill: surfaceRaised
    'group:bus.fill': category
    'group:payload.fill': category
    'group:ait.fill': category
    'group:ground.fill': category
    'group:launch.fill': category
    'group:ops.fill': category
    planned.fill: accent
    network-node.fill: surfaceRaised
    network-edge.stroke: textMuted
    critical-edge.stroke: negative
    snapshot.fill: neutral
    summary-bar.fill: accent
    actual.fill: positive
    milestone.fill: accent
    missing-actual.fill: neutral
    missing-actual.stroke: neutral
    variance-ahead.fill: positive
    variance-on-track.fill: textMuted
    variance-behind.fill: negative
    variance-behind.stroke: negative
    dependency.stroke: textMuted
    groupHeader.fill: surfaceRaised
    baseline.stroke: neutral
    calendar-closed.fill: surfaceRaised
    calendar-exception.fill: warning
    range.fill: warning
    asOf.stroke: warning
    as-of.stroke: warning
  metrics:
    text.body.size: size.body
    text.body.lineHeight: leading.body
    timeline.dayWidth: timeline-day-width
    timeline.calendarClosed.minimumDayWidth: timeline-calendar-closed-min-day-width
    timeline.row.minBlockSize: timeline-row-height
    timeline.mark.blockSize: timeline-mark-size
    timeline.axis.blockSize: timeline-axis-height
    network.node.minInlineSize: network-node-min-inline
    network.node.minBlockSize: network-node-min-block
    network.rank.gap: network-rank-gap
    table.column.minInlineSize: table-column-width
    table.column.gutter.inlineSize: table-column-gutter
    table.indent.inlineSize: table-indent
    table.header.blockSize: table-header-height
    timeline.groupHeader.blockSize: timeline-group-header-size
