  colorBindings:
    axis-band-decoration.fill: text
    axis-band-decoration2.fill: surfaceRaised
    axis-label2.fill: surface
    axis-label3.fill: text
    axis-cell-separator.stroke: surfaceRaised
    axis-rule.stroke: text
    background.fill: surface
    text.fill: text
    subtitle.fill: textMuted
    annotation.fill: surfaceRaised
    axis-major.stroke: neutral
    axis-minor.stroke: surfaceRaised
    group-band.fill: surfaceRaised
    row-band.fill: category:default
    group-header-band.fill: surfaceRaised
    metric.fill: text
    calendar-closed.fill: text
    calendar-exception.fill: warning
    as-of.stroke: accent
    note-index.fill: accent
    planned.fill: surface
    planned.stroke: text
    network-node.fill: surfaceRaised
    network-node.stroke: text
    network-edge.stroke: textMuted
    critical-edge.stroke: negative
    milestone.fill: text
    snapshot.fill: neutral
    snapshot.stroke: text
    # Editorial's visible inset fill is the progress-fill role (progressInset,
    # #430), not the ordinary "actual" comparison mark, which still renders
    # unconditionally whenever Actual data exists (no View policy suppresses
    # it, see the I383-1 slice commit). Giving it the outline pattern (like
    # "planned") rather than a second solid coral fill avoids doubling the
    # progress-fill's own coral on top of itself, and keeps a real,
    # contrast-checked stroke rather than an invisible blended fill (the
    # corpus contrast gate classifies "actual" as a required-contrast mark
    # unconditionally; a theme cannot opt it out via contrastTreatment).
    actual.fill: surface
    actual.stroke: text
    variance-ahead.fill: positive
    variance-on-track.fill: textMuted
    variance-behind.fill: negative
    missing-actual.fill: neutral
    missing-actual.stroke: text
    missing-actual-cell.fill: textMuted
    dependency.stroke: textMuted
    progress-fill.fill: accent
    progress-fill.stroke: accent
    period-band.fill: accent
    period-label.fill: text
    period-label-chip.fill: surface
  metrics:
    text.body.size: size.body
    text.body.lineHeight: leading.body
    timeline.dayWidth: timeline-day-width
