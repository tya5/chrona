        source: synthetic-example-record-HG-001
        emphasis: attention
        cells:
          area: PSR
          observation: FM approval pending system TVAC close-out.
          disposition: Review
      - id: payload-fast-track
        source: synthetic-example-record-HG-002
        emphasis: normal
        cells:
          area: Payload
          observation: Fast-track starts TVAC 3 wd before calibration ends.
          disposition: Recorded
