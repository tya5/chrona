      store:
        provider: local
        identity: halcyon-1-example
      address: profiles/launch-legend.yaml
      revision:
        token: example-v1
  environment:
    viewport:
      inlineSize: 1200
      blockSize: 1120
    locale: en-US
    fontMetrics:
      algorithm: declared-metrics-v3
      missingFont: diagnose
      assets:
      - family: Noto Sans Mono
        weight: 400
        metrics:
          locator:
            provider: package
            identity: chrona.resources
            address: font_metrics/noto-sans-mono-regular-v2.json
        font:
          locator:
            provider: package
            identity: chrona.resources
            address: fonts/noto-sans-mono-regular-v1.ttf
      - family: Noto Sans
        weight: 400
        metrics:
          locator:
            provider: package
            identity: chrona.resources
            address: font_metrics/noto-sans-regular-v2.json
        font:
          locator:
            provider: package
            identity: chrona.resources
            address: fonts/noto-sans-regular-v1.ttf
      - family: Noto Sans
        weight: 700
        metrics:
          locator:
            provider: package
            identity: chrona.resources
            address: font_metrics/noto-sans-bold-v2.json
        font:
          locator:
            provider: package
            identity: chrona.resources
            address: fonts/noto-sans-bold-v1.ttf
    scenePrecision: 3
  target:
    kind: svg
    visualProfile: chrona-output/visual/v0.5-baseline
    capabilities:
    - accessibleText
    - hierarchicalAxis
    - marker
    - semanticRoles
    - sourceMetadata
    - tableSemantics
