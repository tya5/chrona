version: chrona/render-context/v0.17
kind: render-context
id: halcyon-1-03-launch-campaign
body:
  project:
    id: halcyon-1
    kind: project
    store:
      provider: local
      identity: halcyon-1-example
    address: project.yaml
    revision:
      token: example-v6
  view:
    id: halcyon-03-launch-campaign
    kind: view
    store:
      provider: local
      identity: halcyon-1-example
    address: views/03-launch-campaign.yaml
    revision:
      token: example-v1
  theme:
    id: print
    kind: theme
    store:
      provider: local
      identity: halcyon-1-example
    address: themes/print.yaml
    revision:
      token: example-v1
  colorScheme:
    id: print-mono
    kind: color-scheme
    store:
      provider: local
      identity: halcyon-1-example
    address: schemes/print-mono.yaml
    revision:
      token: example-v1
  layout:
    id: print-portrait
    kind: layout-profile
    store:
      provider: local
      identity: halcyon-1-example
    address: layouts/print-portrait.yaml
    revision:
      token: example-v1
  inputs:
    actual:
      id: halcyon-1-observed-2027-08-20
      kind: actual-set
      store:
        provider: local
        identity: halcyon-1-example
      address: actual.yaml
      revision:
        token: example-v1
    summaryProfile:
      id: halcyon-key-figures
      kind: summary-profile
      store:
        provider: local
        identity: halcyon-1-example
      address: profiles/summary.yaml
      revision:
        token: example-v1
    detailProfile:
