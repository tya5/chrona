version: chrona/render-context/v0.17
kind: render-context
id: halcyon-1-16-gallery-editorial-lanes
body:
  project:
    id: halcyon-1
    kind: project
    store: {provider: local, identity: halcyon-1-example}
    address: project.yaml
    revision: {token: example-v6}
  view:
    id: chrona-preset-editorial-lanes
    kind: view
    store: {provider: local, identity: halcyon-1-example}
    address: views/editorial-lanes.yaml
    revision: {token: example-v1}
  theme:
    id: chrona-builtin-editorial
    kind: theme
    store: {provider: local, identity: halcyon-1-example}
    address: themes/editorial.yaml
    revision: {token: example-v1}
  colorScheme:
    id: chrona-builtin-editorial
    kind: color-scheme
    store: {provider: local, identity: halcyon-1-example}
    address: schemes/editorial.yaml
    revision: {token: example-v1}
  layout:
    id: chrona-builtin-editorial
    kind: layout-profile
    store: {provider: local, identity: halcyon-1-example}
    address: layouts/editorial.yaml
    revision: {token: example-v1}
  inputs:
    actual:
      id: halcyon-1-observed-2027-08-20
      kind: actual-set
      store: {provider: local, identity: halcyon-1-example}
      address: actual.yaml
      revision: {token: example-v1}
    detailProfile:
      id: chrona-builtin-editorial-detail
      kind: review-detail-profile
      store: {provider: local, identity: halcyon-1-example}
      address: profiles/editorial-detail.yaml
      revision: {token: example-v1}
  environment:
    viewport: {inlineSize: 2400, blockSize: 900}
    locale: en-US
    fontMetrics:
      algorithm: declared-metrics-v3
      missingFont: diagnose
      assets:
      - family: Noto Sans Mono
        weight: 400
        metrics:
          locator: {provider: package, identity: chrona.resources, address: font_metrics/noto-sans-mono-regular-v2.json}
        font:
          locator: {provider: package, identity: chrona.resources, address: fonts/noto-sans-mono-regular-v1.ttf}
      - family: Noto Sans
        weight: 400
        metrics:
          locator: {provider: package, identity: chrona.resources, address: font_metrics/noto-sans-regular-v2.json}
        font:
          locator: {provider: package, identity: chrona.resources, address: fonts/noto-sans-regular-v1.ttf}
      - family: Noto Sans
        weight: 700
        metrics:
          locator: {provider: package, identity: chrona.resources, address: font_metrics/noto-sans-bold-v2.json}
        font:
          locator: {provider: package, identity: chrona.resources, address: fonts/noto-sans-bold-v1.ttf}
    scenePrecision: 3
  target:
    kind: svg
    visualProfile: chrona-output/visual/v0.5-baseline
    capabilities: [accessibleText, hierarchicalAxis, marker, semanticRoles, sourceMetadata, tableSemantics]
