version: chrona/layout-profile/v0.2
id: relative-review-detail
writingMode: horizontal-tb
root:
  id: detail-overlay
  kind: overlay
  inlineSize: fill
  blockSize: fill
  padding: {token: spacing.l}
  guides:
    center-line: {axis: inline, at: center}
  barriers:
    label-end:
      axis: inline
      edge: end
      members: [group-details, observations]
  children:
    - id: group-details
      kind: slot
      source: group-details
      inlineSize: content
      blockSize: content
      place: {inline: start, block: start, safety: safe}
      priority: required
      overflow: diagnose
    - id: observations
      kind: slot
      source: observations
      inlineSize: content
      blockSize: content
      place: {inline: start, block: center, safety: safe}
      priority: required
      overflow: diagnose
    - id: milestones
      kind: slot
      source: milestones
      inlineSize: content
      blockSize: content
      place: {inline: start, block: center, safety: strict}
      anchor:
        self: {inline: start, block: center}
        target:
          inline: {ref: barrier:label-end, point: end}
          block: {ref: parent, point: center}
        gap:
          inline: {token: spacing.m}
      priority: required
      overflow: diagnose
