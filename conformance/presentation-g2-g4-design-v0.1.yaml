version: chrona/presentation-g2-g4-design/v0.1
positive:
  projects:
    - id: cross-functional-rollout
      labels:
        - objectId: build-api
          source: title
          text: "Review API contract compatibility and the migration plan"
          required: true
          candidates: [above, below, end]
      annotations:
        - id: launch-risk
          purpose: callout
          text: "Do not substitute the planned value when Actual is unreported"
          anchor: {kind: object, id: launch, facet: planned, endpoint: finish}
          leader: orthogonal-or-none
      marks:
        - objectId: build-api
          groupId: platform
          start: 2027-01-01
          requiredLabelBounds: true
        - objectId: test-api
          groupId: platform
          start: 2027-01-01
          requiredLabelBounds: true
      maxStack: 2
      laneSurface: independent-lane-track
      trackPadding: 8
      trackGap: 6
      pitchPolicy: scene-mark-extent-plus-clearance
      routing: {limit: 64}
    - id: regulatory-readiness
      labels:
        - objectId: approval
          source: comparison-delta
          text: "+3d"
          required: false
          candidates: [end, above]
      annotations:
        - id: evidence-note
          purpose: note
          text: "Evidence references the target object and does not persist screen coordinates"
          anchor: {kind: object, id: approval, facet: actual, endpoint: finish}
          leader: orthogonal-or-none
      marks:
        - objectId: approval
          groupId: assurance
          start: 2027-02-10
          requiredLabelBounds: false
      maxStack: 1
      laneSurface: row-aligned
      trackPadding: 8
      trackGap: 6
      pitchPolicy: scene-mark-extent-plus-clearance
      routing: {limit: 64}
negative:
  - id: too-many-candidates
    input: {candidateSides: [above, below, end, start, inside, above, below, end, start, inside, above, below, end, start, inside, above, below], maxCandidates: 17}
    diagnostic: E_PRESENTATION_LABEL_UNPLACEABLE
  - id: missing-actual-anchor
    input: {anchor: {kind: object, id: approval, facet: actual, endpoint: finish}, actualPresent: false}
    diagnostic: E_PRESENTATION_ANCHOR_MISSING
  - id: unsupported-group-anchor
    input: {anchor: {kind: group, id: assurance, endpoint: body}}
    diagnostic: E_PRESENTATION_ANCHOR_UNSUPPORTED
  - id: stack-overflow
    input: {groupId: platform, occupancy: mark-bounds-plus-required-label-bounds, items: 3, maxStack: 2}
    diagnostic: E_PRESENTATION_STACK_OVERFLOW
  - id: route-limit
    input: {routing: {limit: 0}}
    diagnostic: E_PRESENTATION_ROUTE_LIMIT
