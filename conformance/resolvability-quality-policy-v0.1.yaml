version: chrona/resolvability-quality-policy/v0.1
diagnosticActionability:
  defaultBacklog: {disposition: backlog, nextAction: "Add owner-local actionable detail or explicitly classify the identifier as sufficient."}
  # Every existing bare ingress diagnostic is a visible improvement backlog;
  # code-specific owner work is selected by its generated site count.
  backlog: &backlog {disposition: backlog, nextAction: "Add owner-local actionable detail or explicitly justify identifier-only output."}
  bareDiagnostics:
    - {<<: *backlog, code: E_AUTHORING_ACTUAL_TASK}
