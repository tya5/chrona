version: chrona/resolvability-quality-policy/v0.1
diagnosticActionability:
  # Ratchet (#829): every user-facing code raised without detail has one entry here with the number of such
  # sites. A new code, an extra site, or a count that is higher or lower than recorded fails
  # tools/diagnostic_inventory.py (validate) and tests/unit/tools/test_diagnostic_inventory.py. Adding detail at a raise
  # site means lowering `sites` (or deleting the entry) in the same change; `sufficient` needs a `reason`.
  backlog: &backlog {disposition: backlog, nextAction: "Add owner-local actionable detail (the offending value, and the valid values where the set is small) or classify the identifier as sufficient with a reason."}
