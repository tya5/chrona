    classification: pinned-deliberately
    producer: chrona identity bytes
  - path: src/chrona/presentation/model/theme_inheritance.py
    function: _resolve
    field: contentIdentity
    classification: pinned-deliberately
    producer: chrona identity document
  - path: src/chrona/presentation/model/font_metrics.py
