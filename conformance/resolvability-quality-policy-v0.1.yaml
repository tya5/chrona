declaredComputedValues:
  - path: src/chrona/operational/references.py
    function: lookup
    field: requestIdentity
    classification: pinned-deliberately
    producer: chrona identity document
  - path: src/chrona/operational/references.py
    function: lookup
    field: targetIdentity
    classification: pinned-deliberately
    producer: chrona identity document
  - path: src/chrona/operational/references.py
    function: verify_reference
    field: contentIdentity
    classification: pinned-deliberately
    producer: chrona identity bytes
  - path: src/chrona/presentation/model/closure.py
