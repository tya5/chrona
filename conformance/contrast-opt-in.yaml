# The Theme ids this repository holds to the contrast floors (#1126).
#
# Contrast constraints are an opt-in design option: a Theme that declares no `contrastPolicy` only gets typed
# warnings. The repository keeps its own quality guarantee for the Themes it ships by listing them here. The
# corpus gate (`tools/presentation_contrast.py --check`) reads each committed Scene's Theme id from its
# provenance and evaluates a listed Theme at `error` for marks, state text, ground text and ground that cannot be
# computed (a decoration warns, #995); a Theme that is not listed is evaluated with every class at `warning`, and the
# report names it with its warning count. Listing a Theme is an explicit choice; a Theme that declares
# `contrastPolicy: error` itself needs no entry (its render fails). `target-b` is deliberately not listed (owner
# decision, #987 and #1126). Ids are Theme resource ids, not file names.
version: chrona/contrast-opt-in/v0.1
themes:
  - annotation-kinds
  - annotation-rounded
  - axis-cell-corners
  - axis-secondary-ja
  - briefing
  - capabilities
  - chrona-builtin-control-room-dark
  - chrona-builtin-editorial
  - chrona-builtin-editorial-readable-default
  - chrona-builtin-elevated-light
  - chrona-builtin-executive-light
  - chrona-builtin-mission-light
  - chrona-builtin-print-mono
  - chrona-builtin-technical-print
  - elevated-light
  - executive-light
  - executive-light-ja
  - glyph-gates
  - heading
  - in-progress
  - material-icons-light
  - orion-light
  - print
  - progress-track
  - region-frames
  - slot-heading
  - surface-glow
  - text-roles
  - viewer-fit
  - wallboard
  - wallboard-image-notes
  - wallboard-text-compression
