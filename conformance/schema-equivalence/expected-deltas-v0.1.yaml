# Deliberate, reviewed changes to accepted values or diagnostics that the equivalence gate must not fail on.
# Each entry names its layer, a reason and the test that covers it. Empty at S0; the I662-S5 slices add one `after: removed` line per archived schema file; S1d lists the authoring-command path guard (T1): three L1 pointers and the L3 probes that moved from apply to parse.
#   L1: {schema, pointer, before, after, reason, test}      pointer is into the dereferenced schema;
#       a whole file is `pointer: ""` with `after: added` or `after: removed`. A missing `before`/`after` means absent.
#   L2: {layer: L2, document, before, after, reason, test}   before/after are baseline-format verdict records.
#   L3: {layer: L3, probe, before, after, reason, test}      before/after are baseline-format diagnostic records.
# An L1 entry is meaningful only against the base that predates its PR (#970). Add one line per delta (an optional
# `pr: <number>` names the PR for readers). Once the PR merges the entry is stale: a `--base-rev` run reports it and
# fails when it outlives its landing by more than one later merge that touches `schemas/`; the next schema PR retires
# it with `python -m tools.schema_equivalence --base-rev origin/main --prune-stale`, which proves each entry stale
# against the base it was recorded for. L2 and L3 entries compare with the recorded baseline and stay until it is re-recorded.
