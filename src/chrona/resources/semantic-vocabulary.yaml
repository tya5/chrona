version: chrona/semantic-vocabulary/v0.1
kind: semantic-vocabulary
id: chrona-core
body:
  bindings:
    # Comparison marks.
    - semanticId: "planned"
      primitiveFamily: "mark"
      purpose: "planned"
      sceneRole: "planned"
      themeRole: "planned"
      contrastClass: "mark"
    # A forecast is distinct temporal truth, painted with the existing planned role.
    - semanticId: "forecast"
      primitiveFamily: "mark"
      purpose: "forecast"
      sceneRole: "planned"
      themeRole: "planned"
      contrastClass: null
    - semanticId: "actual"
      primitiveFamily: "mark"
      purpose: "actual"
      sceneRole: "actual"
      themeRole: "actual"
      contrastClass: "mark"
    - semanticId: "snapshot"
      primitiveFamily: "mark"
      purpose: "snapshot"
      sceneRole: "snapshot"
      themeRole: "snapshot"
      contrastClass: "mark"
    # A gate (point mark) painted by its own Theme role when the Theme declares one (#991); its purpose stays `planned`.
    - semanticId: "gate"
      primitiveFamily: "mark"
      purpose: "planned"
      sceneRole: "gate"
      themeRole: "gate"
      contrastClass: "mark"
    - semanticId: "missingActual"
      primitiveFamily: "mark"
      purpose: "missingActual"
      sceneRole: "missing-actual"
      themeRole: "missing-actual"
      contrastClass: "mark"
    - semanticId: "summaryBar"
      primitiveFamily: "mark"
      purpose: "summary-bar"
      sceneRole: "summary-bar"
      themeRole: "summaryBar"
      contrastClass: "mark"
    - semanticId: "progressFill"
      primitiveFamily: "mark"
      purpose: "progress-fill"
      sceneRole: "progress-fill"
      themeRole: "progressFill"
      contrastClass: "mark"
    - semanticId: "iconMark"
      primitiveFamily: "icon"
      purpose: "icon-mark"
      sceneRole: "icon-mark"
      themeRole: "icon-mark"
      contrastClass: null
    - semanticId: "labelVisual"
      primitiveFamily: "icon"
      purpose: "label-visual"
      sceneRole: "text"
      themeRole: "text"
      contrastClass: null
    # Time decorations.
    # Public Scene role remains hyphenated; theme authoring resolves the canonical asOf binding.
    - semanticId: "asOf"
      primitiveFamily: "line"
      purpose: "as-of"
      sceneRole: "as-of"
      themeRole: "asOf"
      contrastClass: null
    - semanticId: "asOfLabel"
      primitiveFamily: "label"
      purpose: "as-of-label"
      sceneRole: "text"
      themeRole: "text"
      contrastClass: "ground-text"
    # The as-of light cone (#890): a translucent gradient polygon from the marker, under every mark. Deliberately
    # not contrast-classified (a faint light is the point); the gates composite it as the ground of what lies on it.
    - semanticId: "asOfCone"
      primitiveFamily: "decoration"
      purpose: "as-of-cone"
      sceneRole: "as-of-cone"
      themeRole: "as-of-cone"
      contrastClass: null
    # A Project deadline (#822): a tick at the promised date and, when the planned finish is later, a run to it.
    # One role paints both, so a Theme gives them one ink; the run is what tells a missed promise from a kept one.
    - semanticId: "deadlineMark"
      primitiveFamily: "line"
      purpose: "deadline-mark"
      sceneRole: "deadline-mark"
      themeRole: "deadline-mark"
      contrastClass: "mark"
    # A deadline outline is its actual painted ground, not another message.
    - semanticId: "deadlineMarkOutline"
      primitiveFamily: "decoration"
      purpose: "deadline-outline"
      sceneRole: "deadline-mark-outline"
      themeRole: "background"
      contrastClass: null
    # Label chips (#428): a background drawn from a label's own measured box,
    # one binding per label semantic, Theme role ``<label purpose>-chip``.
    - semanticId: "asOfLabelChip"
      primitiveFamily: "decoration"
      purpose: "label-chip"
      sceneRole: "as-of-label-chip"
      themeRole: "as-of-label-chip"
      contrastClass: null
    - semanticId: "memberLabelChip"
      primitiveFamily: "decoration"
      purpose: "label-chip"
      sceneRole: "member-label-chip"
      themeRole: "member-label-chip"
      contrastClass: null
    - semanticId: "finishDeltaChip"
      primitiveFamily: "decoration"
      purpose: "label-chip"
      sceneRole: "finish-delta-chip"
      themeRole: "finish-delta-chip"
      contrastClass: null
    - semanticId: "calendarClosed"
      primitiveFamily: "decoration"
      purpose: "calendar-closed"
      sceneRole: "calendar-closed"
      themeRole: "calendarClosed"
      contrastClass: "decoration"
    # A calendar-exception day drawn in its own colour when the Theme declares a `calendar-exception` background (#991).
    - semanticId: "calendarException"
      primitiveFamily: "decoration"
      purpose: "calendar-exception"
      sceneRole: "calendar-exception"
      themeRole: "calendarException"
      contrastClass: "decoration"
    # A named Project period (#582): a band across the plot, selected by the View and painted by the Theme.
    - semanticId: "periodBand"
      primitiveFamily: "decoration"
      purpose: "period-band"
      sceneRole: "period-band"
      themeRole: "period-band"
      contrastClass: "decoration"
    - semanticId: "periodLabel"
      primitiveFamily: "label"
      purpose: "period-label"
      sceneRole: "period-label"
      themeRole: "period-label"
      contrastClass: "state-text"
    - semanticId: "periodLabelChip"
      primitiveFamily: "decoration"
      purpose: "label-chip"
      sceneRole: "period-label-chip"
      themeRole: "period-label-chip"
      contrastClass: null
    # Canvas texture (#587): ground under every primitive. Deliberately not
    # contrast-classified: a faint texture is the point, and the gates treat its
    # substrate and ink as the ground of what lies on it instead.
    - semanticId: "canvasTexture"
      primitiveFamily: "decoration"
      purpose: "canvas-texture"
      sceneRole: "canvas-texture"
      themeRole: "canvas-texture"
      contrastClass: null
    # Fixed above-content overlays are distinct from the canvas ground and have
    # their contrast effect evaluated over covered content (Spec 46, #888).
    - semanticId: "canvasOverlay"
      primitiveFamily: "decoration"
      purpose: "canvas-overlay"
      sceneRole: "canvas-overlay"
      themeRole: "canvas-overlay"
      contrastClass: null
    - semanticId: "canvasOverlayGradient"
      primitiveFamily: "decoration"
      purpose: "canvas-overlay-gradient"
      sceneRole: "canvas-overlay-gradient"
      themeRole: "canvas-overlay-gradient"
      contrastClass: null
    # Region frame (#889): the panel Layout completes behind a framed Layout Profile node. Ground like the
    # texture and for the same reason not contrast-classified: what lies on it is gated against its fill.
    - semanticId: "regionFrame"
      primitiveFamily: "decoration"
      purpose: "region-frame"
      sceneRole: "region-frame"
      themeRole: "region-frame"
      contrastClass: null
    # A sparse catalogue border is ground only where its completed ink touches content.
    - semanticId: "frameGlyph"
      primitiveFamily: "decoration"
      purpose: "frame-glyph"
      sceneRole: "frame-glyph"
      themeRole: "frame-glyph"
      contrastClass: null
    # Axis.
    - semanticId: "axisBand"
      primitiveFamily: "label"
      purpose: "axis-band"
      sceneRole: "axis-band"
      themeRole: "axis"
      contrastClass: "ground-text"
    - semanticId: "axisBandDecoration"
      primitiveFamily: "decoration"
      purpose: "axis-band"
      sceneRole: "axis-band-decoration"
      themeRole: "axis-band-decoration"
      contrastClass: "decoration"
    - semanticId: "axisLabel"
      primitiveFamily: "label"
      purpose: "axis-label"
      sceneRole: "text"
      themeRole: "axis"
      contrastClass: "ground-text"
    # Second band tier (#426): a View may declare a second band tier, each
    # in its own Layout-assigned lane; the second ordinal resolves through
    # its own semantic id so a Theme can bind it a distinct fill. Two
    # ordinals meet the literal two-band-tier acceptance; a third is a
    # small, visible follow-up if a View ever needs it. (A third band id is
    # deliberately not pre-registered: the corpus-wide decoration contrast
    # witness in tools/presentation_contrast.py requires every registered
    # DECORATION-classified role to be painted somewhere in committed public
    # evidence, and no committed slide needs a third band.)
    - semanticId: "axisBandDecoration2"
      primitiveFamily: "decoration"
      purpose: "axis-band"
      sceneRole: "axis-band-decoration2"
      themeRole: "axis-band-decoration2"
      contrastClass: "decoration"
    # Second and third labels tier (#426; ground text since #980, and the
    # decoration witness above counts DECORATION roles only, so it does not
    # constrain how many are registered):
    # distinct scene roles (not the shared "text" role axisLabel uses), so a
    # Theme can bind a labels tier its own colour, not only its own font
    # (font already varies per tier through the typographyRole passed
    # explicitly to place_text, independent of scene role). A tier that
    # leaves typographyRole at its default keeps the shared "axisLabel" id
    # every committed View already uses, so two fully-styled tiers (neither
    # left at the default) need both of these ordinals at once.
    - semanticId: "axisLabel2"
      primitiveFamily: "label"
      purpose: "axis-label"
      sceneRole: "axis-label2"
      themeRole: "axis2"
      contrastClass: "ground-text"
    - semanticId: "axisLabel3"
      primitiveFamily: "label"
      purpose: "axis-label"
      sceneRole: "axis-label3"
      themeRole: "axis3"
      contrastClass: "ground-text"
    - semanticId: "axisGrid"
      primitiveFamily: "line"
      purpose: "axis-grid"
      sceneRole: "axis-major"
      themeRole: "axis-major"
      contrastClass: null
    - semanticId: "axisGridMinor"
      primitiveFamily: "line"
      purpose: "axis-grid"
      sceneRole: "axis-minor"
      themeRole: "axis-minor"
      contrastClass: null
    # Axis cells and the axis/plot boundary (#426 rows 6-7).
    - semanticId: "axisRule"
      primitiveFamily: "line"
      purpose: "axis-rule"
      sceneRole: "axis-rule"
      themeRole: "axis-rule"
      contrastClass: null
    - semanticId: "axisCellSeparator"
      primitiveFamily: "line"
      purpose: "axis-cell-separator"
      sceneRole: "axis-cell-separator"
      themeRole: "axis-cell-separator"
      contrastClass: null
    # Grouping.
    - semanticId: "groupBand"
      primitiveFamily: "decoration"
      purpose: "group-decoration"
      sceneRole: "group-band"
      themeRole: "group-band"
      contrastClass: "decoration"
    - semanticId: "rowBand"
      primitiveFamily: "decoration"
      purpose: "row-decoration"
      sceneRole: "row-band"
      themeRole: "row-band"
      contrastClass: "decoration"
    - semanticId: "rowRule"
      primitiveFamily: "decoration"
      purpose: "row-rule"
      sceneRole: "row-rule"
      themeRole: "row-rule"
      contrastClass: "decoration"
    # The rule under the table's column headers, across the table width only (#1545).
    - semanticId: "tableColumnRule"
      primitiveFamily: "decoration"
      purpose: "table-column-rule"
      sceneRole: "tableColumnRule"
      themeRole: "tableColumnRule"
      contrastClass: "decoration"
    - semanticId: "groupHeaderBand"
      primitiveFamily: "decoration"
      purpose: "group-header-band"
      sceneRole: "group-header-band"
      themeRole: "group-header-band"
      contrastClass: "decoration"
    - semanticId: "groupHeaderStrip"
      primitiveFamily: "decoration"
      purpose: "group-header-strip"
      sceneRole: "group-header-strip"
      themeRole: "group-header-strip"
      contrastClass: "decoration"
    # A patterned tab on each group header (#882), a Theme role Layout completes beside the header text.
    - semanticId: "groupTab"
      primitiveFamily: "decoration"
      purpose: "group-tab"
      sceneRole: "group-tab"
      themeRole: "group-tab"
      contrastClass: "decoration"
    - semanticId: "groupHeader"
      primitiveFamily: "decoration"
      purpose: "group-header"
      sceneRole: "group-header"
      themeRole: "groupHeader"
      contrastClass: "ground-text"
    - semanticId: "groupDetail"
      primitiveFamily: "label"
      purpose: "group-detail"
      sceneRole: "text"
      themeRole: "text"
      contrastClass: "ground-text"
    - semanticId: "observationSource"
      primitiveFamily: "label"
      purpose: "observation-source"
      sceneRole: "text"
      themeRole: "text"
      contrastClass: "ground-text"
    - semanticId: "observationColumnLabel"
      primitiveFamily: "label"
      purpose: "observation-column-label"
      sceneRole: "text"
      themeRole: "text"
      contrastClass: "ground-text"
    - semanticId: "observationCell"
      primitiveFamily: "label"
      purpose: "observation-cell"
      sceneRole: "text"
      themeRole: "text"
      contrastClass: "ground-text"
    # Emphasis is classified by the existing state-text role, like finishDelta.
    - semanticId: "observationAttentionCell"
      primitiveFamily: "label"
      purpose: "observation-cell"
      sceneRole: "variance-ahead"
      themeRole: "variance-ahead"
      contrastClass: null
    - semanticId: "observationCriticalCell"
      primitiveFamily: "label"
      purpose: "observation-cell"
      sceneRole: "variance-behind"
      themeRole: "variance-behind"
      contrastClass: null
    # Table.
    - semanticId: "titleText"
      primitiveFamily: "label"
      purpose: "title-text"
      sceneRole: "heading"
      themeRole: "heading"
      contrastClass: "ground-text"
    - semanticId: "kickerText"
      primitiveFamily: "label"
      purpose: "kicker-text"
      sceneRole: "kicker"
      themeRole: "kicker"
      contrastClass: "ground-text"
    # The subtitle line a View's `heading.subtitle` declares (#991), in the Theme's `subtitle` typography role.
    - semanticId: "subtitleText"
      primitiveFamily: "label"
      purpose: "subtitle-text"
      sceneRole: "subtitle"
      themeRole: "subtitle"
      contrastClass: "ground-text"
    # The caption a Layout Profile slot declares (#1064), in the Theme's `slot-heading` text role (`text` when absent).
    - semanticId: "slotHeading"
      primitiveFamily: "label"
      purpose: "slot-heading"
      sceneRole: "slot-heading"
      themeRole: "slot-heading"
      contrastClass: "ground-text"
    - semanticId: "deadlineCaption"
      primitiveFamily: "label"
      purpose: "deadline-caption"
      sceneRole: "text"
      themeRole: "text"
      contrastClass: "ground-text"
    - semanticId: "tableColumnLabel"
      primitiveFamily: "label"
      purpose: "table-column-label"
      sceneRole: "text"
      themeRole: "text"
      contrastClass: "ground-text"
    - semanticId: "tableCell"
      primitiveFamily: "label"
      purpose: "table-cell"
      sceneRole: "text"
      themeRole: "text"
      contrastClass: "ground-text"
    - semanticId: "tableVarianceAhead"
      primitiveFamily: "label"
      purpose: "table-cell"
      sceneRole: "variance-ahead"
      themeRole: "variance-ahead"
      contrastClass: "state-text"
    - semanticId: "tableVarianceOnTrack"
      primitiveFamily: "label"
      purpose: "table-cell"
      sceneRole: "variance-on-track"
      themeRole: "variance-on-track"
      contrastClass: "state-text"
    - semanticId: "tableVarianceBehind"
      primitiveFamily: "label"
      purpose: "table-cell"
      sceneRole: "variance-behind"
      themeRole: "variance-behind"
      contrastClass: "state-text"
    - semanticId: "missingActualCell"
      primitiveFamily: "label"
      purpose: "table-cell"
      sceneRole: "missing-actual-cell"
      themeRole: "missing-actual-cell"
      contrastClass: "state-text"
    # Plot labels.
    - semanticId: "memberLabel"
      primitiveFamily: "label"
      purpose: "member-label"
      sceneRole: "text"
      themeRole: "text"
      contrastClass: "ground-text"
    - semanticId: "memberLabelInsidePlanned"
      primitiveFamily: "label"
      purpose: "member-label"
      sceneRole: "member-label-inside-planned"
      themeRole: "member-label-inside-planned"
      contrastClass: "ground-text"
    - semanticId: "memberLabelInsideActual"
      primitiveFamily: "label"
      purpose: "member-label"
      sceneRole: "member-label-inside-actual"
      themeRole: "member-label-inside-actual"
      contrastClass: "ground-text"
    - semanticId: "memberLabelInsideSnapshot"
      primitiveFamily: "label"
      purpose: "member-label"
      sceneRole: "member-label-inside-snapshot"
      themeRole: "member-label-inside-snapshot"
      contrastClass: "ground-text"
    - semanticId: "memberLabelInsideScenario"
      primitiveFamily: "label"
      purpose: "member-label"
      sceneRole: "member-label-inside-scenario"
      themeRole: "member-label-inside-scenario"
      contrastClass: "ground-text"
    - semanticId: "finishDelta"
      primitiveFamily: "label"
      purpose: "finish-delta"
      sceneRole: "variance-on-track"
      themeRole: "variance-on-track"
      contrastClass: null
    - semanticId: "varianceAhead"
      primitiveFamily: "label"
      purpose: "finish-delta"
      sceneRole: "variance-ahead"
      themeRole: "variance-ahead"
      contrastClass: null
    - semanticId: "varianceBehind"
      primitiveFamily: "label"
      purpose: "finish-delta"
      sceneRole: "variance-behind"
      themeRole: "variance-behind"
      contrastClass: null
    - semanticId: "forecastFinishDelta"
      primitiveFamily: "label"
      purpose: "forecast-finish-delta"
      sceneRole: "variance-on-track"
      themeRole: "variance-on-track"
      contrastClass: null
    - semanticId: "forecastVarianceAhead"
      primitiveFamily: "label"
      purpose: "forecast-finish-delta"
      sceneRole: "variance-ahead"
      themeRole: "variance-ahead"
      contrastClass: null
    - semanticId: "forecastVarianceBehind"
      primitiveFamily: "label"
      purpose: "forecast-finish-delta"
      sceneRole: "variance-behind"
      themeRole: "variance-behind"
      contrastClass: null
    - semanticId: "milestoneDigestEntry"
      primitiveFamily: "label"
      purpose: "milestone-digest-entry"
      sceneRole: "text"
      themeRole: "text"
      contrastClass: "ground-text"
    # Relations.
    - semanticId: "dependency"
      primitiveFamily: "line"
      purpose: "dependency"
      sceneRole: "dependency"
      themeRole: "dependency"
      contrastClass: null
    - semanticId: "dependencyHalo"
      primitiveFamily: "decoration"
      purpose: "dependency-halo"
      sceneRole: "dependency-halo"
      themeRole: "dependency-halo"
      contrastClass: null
    - semanticId: "dependency-critical"
      primitiveFamily: "line"
      purpose: "dependency"
      sceneRole: "dependency-critical"
      themeRole: "dependency-critical"
      contrastClass: null
    # A relation label is label text: its ink is the text role's, like every other label (#880). Its visual role
    # used to be "annotation", whose fill every Theme binds to a ground colour (it paints annotation boxes), so the
    # label read as ghost text. Its typography is still the Theme's "annotation" role (the theme-role field).
    - semanticId: "relationLabel"
      primitiveFamily: "label"
      purpose: "relation-label"
      sceneRole: "text"
      themeRole: "annotation"
      contrastClass: "ground-text"
    - semanticId: "networkNode"
      primitiveFamily: "mark"
      purpose: "network-node"
      sceneRole: "network-node"
      themeRole: "network-node"
      contrastClass: "mark"
    # Preserve the public network-label purpose while separating its shared ink from title ink.
    - semanticId: "networkLabel"
      primitiveFamily: "label"
      purpose: "title-text"
      sceneRole: "text"
      themeRole: "text"
      contrastClass: "ground-text"
    - semanticId: "networkEdge"
      primitiveFamily: "line"
      purpose: "network-edge"
      sceneRole: "network-edge"
      themeRole: "network-edge"
      contrastClass: null
    - semanticId: "criticalEdge"
      primitiveFamily: "line"
      purpose: "critical-edge"
      sceneRole: "critical-edge"
      themeRole: "critical-edge"
      contrastClass: null
    # Legend, notes and annotations.
    # The swatch's own theme role is "legend-swatch" (size/spacing), separate
    # from "legendLabel"'s "legend" (text) role; its drawn primitive is
    # dispatched per entry role by Layout, not fixed by this binding (#427).
    - semanticId: "legendEntry"
      primitiveFamily: "decoration"
      purpose: "legend-swatch"
      sceneRole: "legend-swatch"
      themeRole: "legend-swatch"
      contrastClass: null
    - semanticId: "scaleLegendEntry"
      primitiveFamily: "decoration"
      purpose: "legend-swatch"
      sceneRole: "planned"
      themeRole: "planned"
      contrastClass: null
    - semanticId: "legendLabel"
      primitiveFamily: "label"
      purpose: "legend-label"
      sceneRole: "text"
      themeRole: "legend"
      contrastClass: "ground-text"
    - semanticId: "projectNote"
      primitiveFamily: "label"
      purpose: "project-note"
      sceneRole: "text"
      themeRole: "annotation"
      contrastClass: "ground-text"
    - semanticId: "annotationListText"
      primitiveFamily: "label"
      purpose: "annotation-list-text"
      sceneRole: "text"
      themeRole: "annotation"
      contrastClass: "ground-text"
    - semanticId: "noteIndex"
      primitiveFamily: "label"
      purpose: "note-index"
      sceneRole: "note-index"
      themeRole: "note-index"
      contrastClass: "ground-text"
    - semanticId: "annotationCalloutBox"
      primitiveFamily: "decoration"
      purpose: "annotation-box"
      sceneRole: "annotation-callout-box"
      themeRole: "annotation-callout-box"
      contrastClass: null
    - semanticId: "annotationCalloutText"
      primitiveFamily: "label"
      purpose: "annotation-text"
      sceneRole: "annotation-callout-text"
      themeRole: "annotation-callout-text"
      contrastClass: "ground-text"
    - semanticId: "annotationCalloutLeader"
      primitiveFamily: "line"
      purpose: "annotation-leader"
      sceneRole: "annotation-callout-leader"
      themeRole: "annotation-callout-leader"
      contrastClass: null
    - semanticId: "annotationHighlightBox"
      primitiveFamily: "decoration"
      purpose: "annotation-box"
      sceneRole: "annotation-highlight-box"
      themeRole: "annotation-highlight-box"
      contrastClass: null
    - semanticId: "annotationHighlightText"
      primitiveFamily: "label"
      purpose: "annotation-text"
      sceneRole: "annotation-highlight-text"
      themeRole: "annotation-highlight-text"
      contrastClass: "ground-text"
    - semanticId: "annotationNoteBox"
      primitiveFamily: "decoration"
      purpose: "annotation-box"
      sceneRole: "annotation-note-box"
      themeRole: "annotation-note-box"
      contrastClass: "decoration"
    - semanticId: "annotationNoteText"
      primitiveFamily: "label"
      purpose: "annotation-text"
      sceneRole: "annotation-note-text"
      themeRole: "annotation-note-text"
      contrastClass: "state-text"
    - semanticId: "annotationNoteLeader"
      primitiveFamily: "line"
      purpose: "annotation-leader"
      sceneRole: "annotation-note-leader"
      themeRole: "annotation-note-leader"
      contrastClass: null
    - semanticId: "annotationArrowBox"
      primitiveFamily: "decoration"
      purpose: "annotation-box"
      sceneRole: "annotation-arrow-box"
      themeRole: "annotation-arrow-box"
      contrastClass: null
    - semanticId: "annotationArrowText"
      primitiveFamily: "label"
      purpose: "annotation-text"
      sceneRole: "annotation-arrow-text"
      themeRole: "annotation-arrow-text"
      contrastClass: "ground-text"
    - semanticId: "annotationArrowLeader"
      primitiveFamily: "line"
      purpose: "annotation-leader"
      sceneRole: "annotation-arrow-leader"
      themeRole: "annotation-arrow-leader"
      contrastClass: null
    # Annotation kind header (#584): a title bar, the header text and an accent edge, painted from one
    # role set shared by every kind (the kind colour replaces the fill). The text is judged against the
    # bar (or the note box) it lies on; the bar and the accent are decorations.
    - semanticId: "annotationKindBar"
      primitiveFamily: "decoration"
      purpose: "annotation-kind-bar"
      sceneRole: "annotation-kind-bar"
      themeRole: "annotation-kind-bar"
      contrastClass: "decoration"
    - semanticId: "annotationKindAccent"
      primitiveFamily: "decoration"
      purpose: "annotation-kind-accent"
      sceneRole: "annotation-kind-accent"
      themeRole: "annotation-kind-accent"
      contrastClass: "decoration"
    - semanticId: "annotationKindStamp"
      primitiveFamily: "decoration"
      purpose: "annotation-kind-stamp"
      sceneRole: "annotation-kind-stamp"
      themeRole: "annotation-kind-stamp"
      contrastClass: "decoration"
    # Vector artwork behind an annotation container (#848): catalogue glyph parts painted over the note box.
    - semanticId: "annotationArtwork"
      primitiveFamily: "decoration"
      purpose: "annotation-artwork"
      sceneRole: "annotation-artwork"
      themeRole: "annotation-artwork"
      contrastClass: "decoration"
    # The ink of a per-side box border (#1049), one role per logical side; a kind-painted side uses annotationKindAccent.
    - semanticId: "annotationBorderStart"
      primitiveFamily: "decoration"
      purpose: "annotation-border-start"
      sceneRole: "annotation-border-start"
      themeRole: "annotation-border-start"
      contrastClass: "decoration"
    - semanticId: "annotationBorderEnd"
      primitiveFamily: "decoration"
      purpose: "annotation-border-end"
