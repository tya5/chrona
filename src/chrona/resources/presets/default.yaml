  resources:
    view: {id: chrona-preset-editorial, kind: view, path: views/editorial.yaml}
    theme: {id: chrona-builtin-editorial, kind: theme, path: themes/editorial.yaml}
    colorScheme: {id: chrona-builtin-editorial, kind: color-scheme, path: schemes/editorial.yaml}
    layout: {id: chrona-builtin-editorial, kind: layout-profile, path: layouts/editorial.yaml}
