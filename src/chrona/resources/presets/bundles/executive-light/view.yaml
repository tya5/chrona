version: chrona/view/v0.28
kind: view
id: chrona-preset-executive-light
body:
  heading: {text: {wrap: allow}}
  surface: table-timeline
  selection:
    include:
      types:
      - span
      - point
    exclude:
      objectTypes:
      - group
  grouping:
    by: field
    field: owner
    missing: Other
    order:
      by: earliestPlannedStart
    presentation: header
  ordering:
    by: plannedStart
    direction: ascending
    tieBreak: id
  window:
    mode: selected-planned
  comparison:
    baseline: primary
    actual: optional
    observationSelection: latest
    deltaUnit: calendar-days
    facets:
    - planned
    - actual
    - finishDelta
  visibility:
    labels:
      placement: plot
      content:
      - title
      - finishDelta
      side: end
      overflow: suppress
    fallback:
      labels:
      - end
      - start
      - suppress
    relations:
      mode: semantic
      overflow: suppress
    annotations: none
  axis:
    tiers:
    - unit: quarter
      every: 1
      role: band
      typographyRole: axisQuarter
    - unit: quarter
      every: 1
      role: grid-major
    - unit: quarter
      every: 1
      role: labels
      typographyRole: axisQuarter
      label:
        form: year-quarter
        align: center
        overflow: visible-overflow
        orientation: horizontal
    - unit: month
      every: 1
      role: band
      typographyRole: axisMonth
    - unit: month
      every: 1
      role: labels
      typographyRole: axisMonth
      label:
        form: short-month
        align: start
        overflow: thin-with-record
        orientation: horizontal
    - unit: month
      every: 1
      role: grid-minor
  backgroundDecoration:
    rows: alternate
    groups: all
  rows:
    mode: lanes
    packing: [explicit, attached]
    laneTable: {label: lane, count: true, text: {wrap: allow}}
  markers:
  - kind: asOf
    source: actual
    label: as of
    date: {form: localized-date}
  shading:
    nonWorking: true
    exceptions: true
  progressFill:
    source: actual
