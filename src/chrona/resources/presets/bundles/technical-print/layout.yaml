version: chrona/layout-profile/v0.10
id: chrona-builtin-technical-print
flowDirection: horizontal
dependencyNetworkFlowDirection: horizontal
requiredThemeTokens: [spacing.m, spacing.none]
reviewSurface: {rowDistribution: pack, backgroundExtents: {rowBand: both, groupBand: table, groupHeaderBand: both, calendarClosed: timeline}, annotationRouting: {maxBends: 4, maxDetourRatio: 2}}
relationRouting: {maxBends: 4, maxDetourRatio: 2}
root:
  id: page
  kind: column
  inlineSize: fill
  blockSize: fill
  gap: {token: spacing.m}
  padding: {token: spacing.m}
  alignItems: stretch
  justifyContent: start
  children:
    - id: title
      kind: slot
      source: title
      inlineSize: content
      blockSize: content
      place: {inline: start, block: start, safety: safe}
      priority: required
      overflow: visible-overflow
    - id: review
      kind: row
      inlineSize: fill
      blockSize: fill
      gap: {token: spacing.m}
      padding: {token: spacing.none}
      alignItems: stretch
      justifyContent: start
      children:
        - id: table
          kind: slot
          source: table
          maxInlineShare: 0.4
          inlineSize: {minmax: {min: content, max: {fr: 1}}}
          blockSize: fill
          place: {inline: stretch, block: stretch, safety: strict}
          priority: required
          overflow: visible-overflow
        - id: timeline-stack
          kind: column
          inlineSize: {fr: 2}
          blockSize: fill
          gap: {token: spacing.none}
          padding: {token: spacing.none}
          alignItems: stretch
          justifyContent: start
          children:
            - id: timeline-axis
              kind: slot
              source: timeline-axis
              inlineSize: fill
              blockSize: content
              place: {inline: stretch, block: start, safety: strict}
              priority: required
              overflow: visible-overflow
            - id: timeline
              kind: slot
              source: timeline
              inlineSize: fill
              blockSize: fill
              place: {inline: stretch, block: stretch, safety: strict}
              priority: required
              overflow: visible-overflow
    - id: legend
      kind: slot
      source: legend
      inlineSize: fill
      blockSize: content
      place: {inline: start, block: start, safety: safe}
      priority: preferred
      overflow: ellipsize-with-source
      direction: inline
      gap: {token: spacing.m}
    - id: notes
      kind: slot
      source: notes
      inlineSize: fill
      blockSize: content
      place: {inline: start, block: end, safety: safe}
      priority: preferred
      overflow: ellipsize-with-source
