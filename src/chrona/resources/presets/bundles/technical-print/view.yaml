version: chrona/view/v0.28
kind: view
id: chrona-preset-technical-print
body:
  heading: {text: {wrap: allow}}
  surface: table-timeline
  selection:
    include:
      types:
      - span
      - point
    exclude:
      objectTypes:
      - group
  grouping:
    by: none
  ordering:
    by: plannedStart
    direction: ascending
    tieBreak: id
  window:
    mode: selected-planned
  comparison:
    baseline: primary
    actual: optional
    observationSelection: latest
    deltaUnit: calendar-days
    facets:
    - planned
  visibility:
    labels:
      placement: plot
      content:
      - title
      - finishDelta
      side: end
      overflow: suppress
    fallback:
      labels:
      - end
      - start
      - suppress
    relations:
      mode: semantic
      overflow: suppress
    annotations: none
  axis:
    tiers:
    - unit: year
      every: 1
      role: band
      typographyRole: axisQuarter
    - unit: quarter
      every: 1
      role: grid-major
    - unit: auto
      every: 1
      role: labels
      typographyRole: axisQuarter
      label:
        forms:
          month: short-month-year
          quarter: year-quarter
          half: half-year
          year: year
        align: center
        overflow: thin-with-record
        orientation: horizontal
    - unit: month
      every: 1
      role: grid-minor
  backgroundDecoration:
    rows: none
    groups: all
  rows:
    mode: lanes
    packing: [explicit, attached]
    laneTable: {label: lane, count: true, text: {wrap: allow}}
  markers:
  - kind: asOf
    source: actual
    label: Today
  shading:
    nonWorking: true
    exceptions: true
