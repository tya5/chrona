$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "timeline/project-v0.1"
title: "Timeline Project v0.1"
type: object
required: [version, project]
additionalProperties: false

properties:
  version:
    const: "timeline/v0.1"

  project:
    type: object
    required: [id]
    additionalProperties: false
    properties:
      id: {type: string, minLength: 1}
      title: {type: string}
      calendar: {type: string}

  calendars:
    type: object
    additionalProperties:
      $ref: "#/$defs/calendar"

  entities:
    type: object
    additionalProperties:
      $ref: "#/$defs/entity"

  objects:
    type: object
    additionalProperties:
      $ref: "#/$defs/object"

  relations:
    type: array
    items:
      $ref: "#/$defs/relation"

  annotations:
    type: object
    additionalProperties:
      $ref: "#/$defs/annotation"

  extensions:
    type: array
    items:
      oneOf:
        - type: string
          minLength: 1
        - type: object
          required: [packageId, path, revision, contentIdentity]
          additionalProperties: false
          properties:
            packageId: {type: string, minLength: 1}
            path: {type: string, pattern: "^(?!.*(?:^|/)\\.{1,2}(?:/|$))[A-Za-z0-9][A-Za-z0-9._/-]*$"}
            revision: {type: string, pattern: "^git:[0-9A-Fa-f]{40,64}$"}
            contentIdentity: {type: string, pattern: "^sha256:[0-9a-f]{64}$"}
        - type: object
          required: [packageId, resource]
          additionalProperties: false
          properties:
            packageId: {type: string, minLength: 1}
            resource: {type: object}

$defs:
  date:
    type: string
    pattern: "^\\d{4}-\\d{2}-\\d{2}$"

  temporalAmount:
    type: string
    pattern: "^-?(?:\\d+(?:h|min|s|d|w|mo|y|wd))(?: \\d+(?:d|w|mo|y))*$"

  scheduledAmount:
    type: string
    pattern: "^[1-9]\\d*(?:d|w|wd)$"

  calendar:
    type: object
    additionalProperties: false
    required: [working_days]
    properties:
      working_days:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          enum: [mon, tue, wed, thu, fri, sat, sun]
      exceptions:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [date, working]
          properties:
            date: {$ref: "#/$defs/date"}
            working: {type: boolean}

  entity:
    type: object
    required: [type]
    properties:
      type: {type: string}
      title: {type: string}
      fields: {type: object}
    additionalProperties: false

  object:
    type: object
    required: [type, schedule]
    properties:
      type: {type: string}
      title: {type: string}
      calendar: {type: string}
      fields: {type: object}
      children:
        type: array
        items: {type: string}
      deadline: {$ref: "#/$defs/date"}
      schedule:
        $ref: "#/$defs/schedule"
    additionalProperties: false

  schedule:
    oneOf:
      - $ref: "#/$defs/fixedPoint"
      - $ref: "#/$defs/fixedSpan"
      - $ref: "#/$defs/scheduled"
      - $ref: "#/$defs/derived"

  fixedPoint:
    type: object
    additionalProperties: false
    required: [mode, at]
    properties:
      mode: {const: fixed}
      at: {$ref: "#/$defs/date"}

  fixedSpan:
    type: object
    additionalProperties: false
    required: [mode, start, end]
    properties:
      mode: {const: fixed}
      start: {$ref: "#/$defs/date"}
      end: {$ref: "#/$defs/date"}

  scheduled:
    type: object
    additionalProperties: false
    required: [mode, amount]
    properties:
      mode: {const: scheduled}
      amount: {$ref: "#/$defs/scheduledAmount"}
      anchor:
        type: object
        minProperties: 1
        maxProperties: 1
        properties:
          start: {$ref: "#/$defs/date"}
          end: {$ref: "#/$defs/date"}
        additionalProperties: false
      constraints:
        $ref: "#/$defs/constraints"

  derived:
    type: object
    additionalProperties: false
    required: [mode, from]
    properties:
      mode: {const: derived}
      from: {enum: [children]}

  constraints:
    type: object
    additionalProperties: false
    properties:
      start: {$ref: "#/$defs/bounds"}
      end: {$ref: "#/$defs/bounds"}

  bounds:
    type: object
    additionalProperties: false
    properties:
      min: {$ref: "#/$defs/date"}
      max: {$ref: "#/$defs/date"}

  endpointRef:
    type: object
    additionalProperties: false
    required: [object, endpoint]
    properties:
      object: {type: string}
      endpoint: {enum: [at, start, end]}

  relation:
    type: object
    required: [type, from, to]
    additionalProperties: false
    properties:
      id: {type: string}
      type: {type: string}
      from: {$ref: "#/$defs/endpointRef"}
      to: {$ref: "#/$defs/endpointRef"}
      lag:
        oneOf:
          - {$ref: "#/$defs/temporalAmount"}
          - type: object
            additionalProperties: false
            required: [value]
            properties:
              value: {$ref: "#/$defs/temporalAmount"}
              calendar: {type: string}

  annotation:
    type: object
    required: [kind, text, anchor]
    additionalProperties: false
    properties:
      kind: {type: string}
      text: {type: string}
      anchor:
        type: object
        additionalProperties: false
        required: [object]
        properties:
          object: {type: string}
