$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "urn:chrona:review-detail-profile-v0.1"
type: object
additionalProperties: false
required: [version, id, body]
properties:
  version: {const: "chrona/review-detail-profile/v0.1"}
  id: {type: string, minLength: 1, maxLength: 4096}
  body:
    type: object
    additionalProperties: false
    minProperties: 1
    properties:
      groupDetails:
        type: array
        minItems: 1
        items:
          type: object
          additionalProperties: false
          required: [groupId, label, description]
          properties:
            groupId: {type: string, minLength: 1, maxLength: 4096}
            label: {type: string, minLength: 1, maxLength: 4096}
            description: {type: string, minLength: 1, maxLength: 16384}
      milestones:
        type: array
        minItems: 1
        uniqueItems: true
        items: {type: string, minLength: 1, maxLength: 4096}
      observations:
        type: object
        additionalProperties: false
        required: [columns, rows]
        properties:
          columns:
            type: array
            minItems: 1
            items:
              type: object
              additionalProperties: false
              required: [id, label]
              properties:
                id: {type: string, minLength: 1, maxLength: 4096}
                label: {type: string, minLength: 1, maxLength: 4096}
          rows:
            type: array
            minItems: 1
            items:
              type: object
              additionalProperties: false
              required: [id, source, cells]
              properties:
                id: {type: string, minLength: 1, maxLength: 4096}
                source: {type: string, minLength: 1, maxLength: 4096}
                emphasis: {enum: [normal, attention, critical]}
                cells:
                  type: object
                  minProperties: 1
                  additionalProperties: {type: string, maxLength: 16384}
