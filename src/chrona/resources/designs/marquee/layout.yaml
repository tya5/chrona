version: chrona/layout-profile/v0.10
id: marquee
flowDirection: horizontal
dependencyNetworkFlowDirection: horizontal
requiredThemeTokens: [legend-block, legend-gap, legend-item-min, note-rail-width, spacing.frame, spacing.l, spacing.m, spacing.none]
reviewSurface: {rowDistribution: fill, backgroundExtents: {rowBand: table, groupBand: both, groupHeaderBand: both, calendarClosed: timeline}, annotationRouting: {maxBends: 4, maxDetourRatio: 2}}
relationRouting: {maxBends: 4, maxDetourRatio: 4, entry: side, search: best, unroutable: relax}
# The design half of the View (#1341, Spec 06 §9.2). Project-independent: a View connects a project by
# declaring its selection, window, grouping key/order, column captions/sources, period and marker
# sources, figures and annotation bindings; any member the View declares replaces the one below.
# The heading reads the count figures `selected-count` and `group-count`, which the View declares
# (the packaged design-default View counts span objects and groups other than the unassigned
# fallback). "baseline" and "what actually happened" are printed only when the render supplies a
# Snapshot or an Actual Set.
viewDefaults:
  heading:
    text: {wrap: allow}
    kicker: The plan
    title: "{project}"
    subtitle:
      - {text: "{figure:selected-count} work packages"}
      - {text: " in {figure:group-count} acts", omitWhenZero: group-count}
      - {text: " · "}
      - {text: "baseline, ", presentWhen: snapshot}
      - {text: "plan"}
      - {text: " and what actually happened", presentWhen: actualSet}
    dateForm: day-month-year
  figureFormats:
    selected-count: {form: english-words, capitalize: true}
    group-count: {form: english-words}
  rows: {mode: automatic}
  comparison:
    baselineMarks: ghost-when-changed
    missingActualScope: in-progress
    deltaUnit: working-days
    facets: [planned, actual, finishDelta, missingActual, unmatchedActual]
  progressFill: {source: actual}
  visibility:
    labels: {placement: table, content: [title, finishDelta], side: end, overflow: suppress}
    relations: {mode: semantic, overflow: suppress}
    annotations: {mode: presentation, marker: none}
  annotationPlacement:
    note:
      candidates:
        - id: rail
          region: {kind: slot, source: annotations}
          search: {kind: row-aligned}
          obstacles: {classes: [mark, text, label-visual, dependency-route, leader-route, annotation-box, port, rule]}
          connector: {kind: leader}
        - id: list
          region: {kind: slot, source: annotations}
          search: {kind: row-aligned}
          obstacles: {classes: [mark, text, label-visual, dependency-route, leader-route, annotation-box, port, rule]}
          connector: {kind: none}
  axis:
    tiers:
      - {unit: quarter, every: 1, role: band, typographyRole: axisQuarter}
      - {unit: quarter, every: 1, role: grid-major}
      - unit: quarter
        every: 1
        role: labels
        label: {form: quarter-year, align: center, overflow: visible-overflow, orientation: horizontal}
        typographyRole: axisQuarter
      - {unit: month, every: 1, role: band, typographyRole: axisMonth}
      - unit: month
        every: 1
        role: labels
        label: {form: short-month, align: center, overflow: visible-overflow, orientation: horizontal}
        typographyRole: axisMonth
      - {unit: month, every: 1, role: grid-minor}
  markerPresentation: {kind: asOf, label: {wording: marker.asOf}, placement: below-plot, date: {form: day-month}}
  periodLabelPresentation: {placement: top}
  shading: {nonWorking: true, exceptions: true}
  backgroundDecoration: {rows: rules, groups: all}
  columnStyles:
    title: {missing: em-dash, align: start, width: {minmax: {min: content, max: {fr: 1}}}, headerOrientation: horizontal}
    field: {textRole: table-cell-secondary, missing: em-dash, align: start, width: content, headerOrientation: horizontal}
    facet:
      format: signedDays
      missing: blank
      missingBy: {inProgress: blank, dueUnobserved: blank, notYetDue: blank}
      align: end
      width: content
      headerOrientation: horizontal
  grouping:
    presentation: header
    header: {text: 'ACT {ordinal|group-ordinal} · {title}', ordinal: roman}
root:
  id: page
  kind: column
  inlineSize: fill
  blockSize: fill
  gap: {token: spacing.none}
  padding: {token: spacing.frame}
  alignItems: stretch
  justifyContent: start
  frame: {inset: 4, paint: outer}
  children:
    - id: stage
      kind: column
      inlineSize: fill
      blockSize: fill
      gap: {token: spacing.m}
      padding: {inlineStart: {token: spacing.l}, inlineEnd: {token: spacing.l}, blockStart: {token: spacing.l}, blockEnd: {token: spacing.m}}
      alignItems: stretch
      justifyContent: start
      frame: {inset: 0, paint: inner}
      children:
        - id: head
          kind: row
          inlineSize: fill
          blockSize: content
          gap: {token: spacing.l}
          padding: {token: spacing.none}
          alignItems: start
          justifyContent: start
          children:
            - id: sign
              kind: row
              inlineSize: content
              blockSize: content
              gap: {token: spacing.none}
              padding: {token: spacing.l}
              alignItems: center
              justifyContent: center
              frame: {inset: 2, paint: marquee}
              children:
                - id: title
                  kind: slot
                  source: heading.title
                  inlineSize: content
                  blockSize: content
                  place: {inline: center, block: center, safety: safe}
                  priority: required
                  overflow: visible-overflow
            - id: head-text
              kind: column
              inlineSize: fill
              blockSize: content
              gap: {token: spacing.none}
              padding: {token: spacing.none}
              alignItems: start
              justifyContent: start
              children:
                - id: kicker
                  kind: slot
                  source: heading.kicker
                  inlineSize: fill
                  blockSize: content
                  place: {inline: start, block: start, safety: safe}
                  priority: required
                  overflow: visible-overflow
                - id: subtitle
                  kind: slot
                  source: heading.subtitle
                  inlineSize: fill
                  blockSize: content
                  place: {inline: start, block: start, safety: safe}
                  priority: required
                  overflow: visible-overflow
        - id: review
          kind: row
          inlineSize: fill
          blockSize: fill
          gap: {token: spacing.m}
          padding: {token: spacing.none}
          alignItems: stretch
          justifyContent: start
          children:
            - id: table
              kind: slot
              source: table
              inlineSize: {minmax: {min: content, max: {fr: 1}}}
              blockSize: fill
              place: {inline: stretch, block: stretch, safety: strict}
              priority: required
              overflow: visible-overflow
            - id: timeline-stack
              kind: column
              inlineSize: {fr: 2}
              blockSize: fill
              gap: {token: spacing.none}
              padding: {token: spacing.none}
              alignItems: stretch
              justifyContent: start
              children:
                - id: timeline-axis
                  kind: slot
                  source: timeline-axis
                  inlineSize: fill
                  blockSize: content
                  place: {inline: stretch, block: start, safety: strict}
                  priority: required
                  overflow: visible-overflow
                - id: timeline
                  kind: slot
                  source: timeline
                  inlineSize: fill
                  blockSize: fill
                  place: {inline: stretch, block: stretch, safety: strict}
                  priority: required
                  overflow: visible-overflow
            - id: annotations
              kind: slot
              source: annotations
              heading: {text: LATE EDITION, align: start, block: header-row}
              inlineSize: {fixed: {token: note-rail-width}}
              blockSize: fill
              place: {inline: stretch, block: stretch, safety: strict}
              priority: optional
              overflow: visible-overflow
        - id: legend
          kind: slot
          source: legend
          inlineSize: fill
          blockSize: {fixed: {token: legend-block}}
          place: {inline: start, block: start, safety: safe}
          priority: preferred
          overflow: ellipsize-with-source
          direction: inline
          itemMinInlineSize: {token: legend-item-min}
          gap: {token: legend-gap}
