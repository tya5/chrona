version: chrona/layout-profile/v0.10
id: sunday
flowDirection: horizontal
dependencyNetworkFlowDirection: horizontal
requiredThemeTokens: [key-caption-gap, key-panel-block, legend-gap, spacing.frame, spacing.gutter, spacing.l, spacing.m, spacing.none, spacing.s, title-panel-width]
reviewSurface: {rowDistribution: fill, backgroundExtents: {rowBand: table, groupBand: timeline, groupHeaderBand: text, groupHeaderStrip: both, calendarClosed: timeline}, annotationRouting: {maxBends: 4, maxDetourRatio: 2}}
relationRouting: {maxBends: 4, maxDetourRatio: 4, entry: side, search: best, unroutable: relax}
# The design half of the View (#1341, Spec 06 §9.2). Project-independent: a View connects a project by
# declaring its selection, window, grouping key/order, column captions/sources, period and marker
# sources, figures, wording and annotation bindings; any member the View declares replaces the one
# below. The heading reads the count figure `group-count`, which the View declares.
viewDefaults:
  heading:
    kicker: The plan,
    title: '{project}'
    subtitle:
      - {text: "in {figure:group-count} panels", omitWhenZero: group-count}
    dateForm: day-month-year
  figureFormats:
    group-count: {form: english-words}
  rows: {mode: automatic}
  comparison:
    baselineMarks: ghost-when-changed
    missingActualScope: in-progress
    deltaUnit: working-days
    facets: [planned, actual, finishDelta, missingActual, unmatchedActual]
  progressFill: {source: actual}
  visibility:
    labels: {placement: table, content: [title, finishDelta], side: end, overflow: suppress}
    relations: {mode: semantic, overflow: suppress}
    annotations: {mode: presentation, marker: none}
  annotationPlacement:
    note:
      candidates:
        - id: plot-near
          region: {kind: plot}
          search: {kind: nearest-free, maxPositions: 1024, maxInlineEm: 12}
          obstacles: &obstacles {classes: [mark, text, label-visual, dependency-route, leader-route, annotation-box, port, rule]}
          connector: {kind: tail}
        - id: plot-narrow
          region: {kind: plot}
          search: {kind: nearest-free, maxPositions: 1024, maxInlineEm: 8}
          obstacles: *obstacles
          connector: {kind: tail}
        - id: plot-wide
          region: {kind: plot}
          search: {kind: nearest-free, maxPositions: 1024, maxInlineEm: 16}
          obstacles: *obstacles
          connector: {kind: tail}
  axis:
    tiers:
      - {unit: quarter, every: 1, role: band, typographyRole: axisQuarter}
      - {unit: quarter, every: 1, role: grid-major}
      - unit: quarter
        every: 1
        role: labels
        label: {form: quarter-year, align: center, overflow: visible-overflow, orientation: horizontal}
        typographyRole: axisQuarter
      - {unit: month, every: 1, role: band, typographyRole: axisMonth}
      - unit: month
        every: 1
        role: labels
        label: {form: long-month, align: start, overflow: visible-overflow, orientation: horizontal}
        typographyRole: axisMonth
      - {unit: month, every: 1, role: grid-minor}
  markerPresentation: {kind: asOf, label: TODAY!, placement: below-plot, date: {form: day-month}}
  periodLabelPresentation: {placement: top}
  shading: {nonWorking: true, exceptions: true}
  backgroundDecoration: {rows: none, groups: all}
  columnStyles:
    title: {missing: em-dash, align: start, width: {minmax: {min: content, max: {fr: 1}}}, headerOrientation: horizontal}
    field: {textRole: table-cell-secondary, missing: em-dash, align: start, width: content, headerOrientation: horizontal}
    facet:
      format: signedNumber
      zero: plain
      missing: blank
      missingBy: {inProgress: blank, dueUnobserved: blank, notYetDue: blank}
      align: end
      width: content
      headerOrientation: horizontal
      affixes: {slip: {suffix: '!'}}
  grouping:
    presentation: header
    header: {text: "Meanwhile, in the {title}…", first: "In the {title}…"}
root:
  id: page
  kind: column
  inlineSize: fill
  blockSize: fill
  gap: {token: spacing.gutter}
  padding: {token: spacing.frame}
  alignItems: stretch
  justifyContent: start
  children:
    - id: head
      kind: row
      inlineSize: fill
      blockSize: {fixed: {token: key-panel-block}}
      gap: {token: spacing.gutter}
      padding: {token: spacing.none}
      alignItems: stretch
      justifyContent: start
      children:
        - id: title-panel
          kind: row
          inlineSize: {fixed: {token: title-panel-width}}
          blockSize: fill
          gap: {token: spacing.l}
          padding: {token: spacing.m}
          alignItems: center
          justifyContent: start
          frame: {inset: 0, paint: title}
          children:
            - id: title
              kind: slot
              source: heading.title
              inlineSize: content
              blockSize: content
              place: {inline: start, block: center, safety: safe}
              priority: required
              overflow: visible-overflow
            - id: head-text
              kind: column
              inlineSize: fill
              blockSize: content
              gap: {token: spacing.s}
              padding: {token: spacing.none}
              alignItems: start
              justifyContent: center
              children:
                - id: kicker
                  kind: slot
                  source: heading.kicker
                  inlineSize: fill
                  blockSize: content
                  place: {inline: start, block: start, safety: safe}
                  priority: required
                  overflow: visible-overflow
                - id: subtitle
                  kind: slot
                  source: heading.subtitle
                  inlineSize: fill
                  blockSize: content
                  place: {inline: start, block: start, safety: safe}
                  priority: required
                  overflow: visible-overflow
        - id: key-panel
          kind: column
          inlineSize: fill
          blockSize: fill
          gap: {token: spacing.none}
          padding: {token: spacing.s}
          alignItems: stretch
          justifyContent: center
          frame: {inset: 0, paint: key}
          children:
            - id: legend
              kind: slot
              source: legend
              heading: {text: THE KEY, align: start, block: start-column, gap: {token: key-caption-gap}}
              inlineSize: fill
              blockSize: fill
              place: {inline: start, block: center, safety: safe}
              priority: preferred
              overflow: ellipsize-with-source
              columns: 3
              columnDistribution: spread
              gap: {token: legend-gap}
    - id: chart-panel
      kind: row
      inlineSize: fill
      blockSize: fill
      gap: {token: spacing.m}
      padding: {token: spacing.m}
      alignItems: stretch
      justifyContent: start
      frame: {inset: 0, paint: chart}
      children:
        - id: table
          kind: slot
          source: table
          inlineSize: {minmax: {min: content, max: {fr: 1}}}
          blockSize: fill
          place: {inline: stretch, block: stretch, safety: strict}
          priority: required
          overflow: visible-overflow
        - id: timeline-stack
          kind: column
          inlineSize: {fr: 3}
          blockSize: fill
          gap: {token: spacing.none}
          padding: {token: spacing.none}
          alignItems: stretch
          justifyContent: start
          children:
            - id: timeline-axis
              kind: slot
              source: timeline-axis
              inlineSize: fill
              blockSize: content
              place: {inline: stretch, block: start, safety: strict}
              priority: required
              overflow: visible-overflow
            - id: timeline
              kind: slot
              source: timeline
              inlineSize: fill
              blockSize: fill
              place: {inline: stretch, block: stretch, safety: strict}
              priority: required
              overflow: visible-overflow
