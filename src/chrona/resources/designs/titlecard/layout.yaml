version: chrona/layout-profile/v0.10
id: titlecard
flowDirection: horizontal
dependencyNetworkFlowDirection: horizontal
requiredThemeTokens: [countdown.width, frame.stripe.width, legend-block, legend-gap, legend-item-min, note-rail-width, spacing.l, spacing.m, spacing.none, spacing.s]
reviewSurface: {rowDistribution: fill, backgroundExtents: {rowBand: table, groupBand: both, groupHeaderBand: both, calendarClosed: timeline}, annotationRouting: {maxBends: 4, maxDetourRatio: 2}}
relationRouting: {maxBends: 4, maxDetourRatio: 4, entry: side, search: best, unroutable: relax}
# The design half of the View (#1341, Spec 06 §9.2). Project-independent: a View connects a project by
# declaring its selection, window, grouping key/order, column captions/sources, period and marker
# sources, figures, slot bindings and annotation bindings; any member the View declares replaces the
# one below. The heading and the notes heading read the count figures `selected-count`,
# `group-count` and `note-count`, which the View declares (the packaged design-default View counts
# span objects and groups other than the unassigned fallback). BASELINE and ACTUAL are printed only
# when the render supplies a Snapshot or an Actual Set.
viewDefaults:
  heading:
    kicker: 第弐面
    title: 計画表、{project}
    subtitle:
      - {text: "SCHEDULE · {figure:selected-count} WORK PACKAGES"}
      - {text: " · {figure:group-count} SECTIONS", omitWhenZero: group-count}
      - {text: " · "}
      - {text: "BASELINE / ", presentWhen: snapshot}
      - {text: "PLAN"}
      - {text: " / ACTUAL", presentWhen: actualSet}
    dateForm: day-month-year
  figureFormats:
    note-count: {form: digits, minimumDigits: 2}
  rows: {mode: automatic}
  comparison:
    baselineMarks: ghost-when-changed
    missingActualScope: in-progress
    deltaUnit: working-days
    facets: [planned, actual, finishDelta, missingActual, unmatchedActual]
  progressFill: {source: actual}
  visibility:
    labels: {placement: table, content: [title, finishDelta], side: end, overflow: suppress}
    relations: {mode: semantic, overflow: suppress}
    annotations: {mode: presentation, marker: none}
  annotationPlacement:
    note:
      candidates:
        - id: rail
          region: {kind: slot, source: annotations}
          search: {kind: row-aligned}
          obstacles: {classes: [mark, text, label-visual, dependency-route, leader-route, annotation-box, port, rule]}
          connector: {kind: leader}
  axis:
    tiers:
      - {unit: quarter, every: 1, role: band, typographyRole: axisQuarter}
      - {unit: quarter, every: 1, role: grid-major}
      - unit: quarter
        every: 1
        role: labels
        label: {form: year-quarter, nameTable: en-US, align: start, overflow: visible-overflow, orientation: horizontal}
        typographyRole: axisQuarter
      - {unit: month, every: 1, role: band, typographyRole: axisMonth}
      - unit: month
        every: 1
        role: labels
        label:
          form: short-month
          nameTable: ja-JP
          align: start
          overflow: visible-overflow
          orientation: horizontal
          secondary: {form: short-month, nameTable: en-US, typographyRole: axisSecondary, placement: inline}
        typographyRole: axisMonth
      - {unit: month, every: 1, role: grid-minor}
  markerPresentation: {kind: asOf, label: 現在 NOW, placement: below-plot, date: {form: localized-date, nameTable: ja-JP}}
  periodLabelPresentation: {placement: top}
  shading: {nonWorking: true, exceptions: true}
  backgroundDecoration: {rows: rules, groups: all}
  columnStyles:
    title: {missing: em-dash, align: start, width: {minmax: {min: content, max: {fr: 1}}}, headerOrientation: horizontal}
    field: {textRole: table-cell-secondary, missing: em-dash, align: start, width: content, headerOrientation: horizontal}
    facet:
      format: signedDays
      missing: blank
      missingBy: {inProgress: blank, dueUnobserved: blank, notYetDue: blank}
      align: end
      width: content
      headerOrientation: horizontal
  grouping:
    presentation: header
    header: {text: '{ordinal|group-ordinal}  {title}', ordinal: zero-padded}
root:
  id: page
  kind: column
  inlineSize: fill
  blockSize: fill
  gap: {token: spacing.m}
  padding: {token: spacing.l}
  alignItems: stretch
  justifyContent: start
  children:
    - id: head
      kind: row
      inlineSize: fill
      blockSize: content
      gap: {token: spacing.l}
      padding: {token: spacing.none}
      alignItems: start
      justifyContent: space-between
      children:
        - id: title
          kind: slot
          source: title
          inlineSize: content
          blockSize: content
          place: {inline: start, block: start, safety: safe}
          priority: required
          overflow: visible-overflow
        - id: countdown-bezel
          kind: column
          inlineSize: {fixed: {token: countdown.width}}
          blockSize: content
          gap: {token: spacing.none}
          padding: {inlineStart: {token: frame.stripe.width}, inlineEnd: {token: spacing.none}, blockStart: {token: spacing.none}, blockEnd: {token: spacing.none}}
          alignItems: stretch
          justifyContent: start
          frame: {paint: stripe}
          children:
            - id: countdown
              kind: column
              inlineSize: fill
              blockSize: content
              gap: {token: spacing.none}
              padding: {token: spacing.s}
              alignItems: stretch
              justifyContent: start
              frame: {paint: countdown}
              children:
                - id: summary
                  kind: slot
                  source: summary
                  inlineSize: fill
                  blockSize: content
                  place: {inline: stretch, block: start, safety: safe}
                  priority: required
                  overflow: visible-overflow
    - id: review
      kind: row
      inlineSize: fill
      blockSize: fill
      gap: {token: spacing.m}
      padding: {token: spacing.none}
      alignItems: stretch
      justifyContent: start
      children:
        - id: table
          kind: slot
          source: table
          inlineSize: {minmax: {min: content, max: {fr: 1}}}
          blockSize: fill
          place: {inline: stretch, block: stretch, safety: strict}
          priority: required
          overflow: visible-overflow
        - id: timeline-stack
          kind: column
          inlineSize: {fr: 2}
          blockSize: fill
          gap: {token: spacing.none}
          padding: {token: spacing.none}
          alignItems: stretch
          justifyContent: start
          children:
            - id: timeline-axis
              kind: slot
              source: timeline-axis
              inlineSize: fill
              blockSize: content
              place: {inline: stretch, block: start, safety: strict}
              priority: required
              overflow: visible-overflow
            - id: timeline
              kind: slot
              source: timeline
              inlineSize: fill
              blockSize: fill
              place: {inline: stretch, block: stretch, safety: strict}
              priority: required
              overflow: visible-overflow
        - id: annotations
          kind: slot
          source: annotations
          heading: {template: "STATUS REPORTS : {figure:note-count}", align: start, block: header-row}
          inlineSize: {fixed: {token: note-rail-width}}
          blockSize: fill
          place: {inline: stretch, block: stretch, safety: strict}
          priority: optional
          overflow: visible-overflow
    - id: legend
      kind: slot
      source: legend
      inlineSize: fill
      blockSize: {fixed: {token: legend-block}}
      place: {inline: start, block: start, safety: safe}
      priority: preferred
      overflow: ellipsize-with-source
      direction: inline
      itemMinInlineSize: {token: legend-item-min}
      gap: {token: legend-gap}
