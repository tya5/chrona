# Reusable Theme/Layout fragments for a catalogue-glyph title frame (#888).
# Merge themePatch into the Theme body; replace the Layout title node with
# layoutNode. Other presentation and Project declarations remain independent.
layoutNode:
  id: marquee-title-panel
  kind: row
  inlineSize: fill
  blockSize: content
  padding: {token: spacing.l}
  gap: {token: spacing.none}
  alignItems: center
  justifyContent: center
  frame: {inset: 4, paint: marquee}
  children:
    - {id: title, kind: slot, source: title, inlineSize: fill, blockSize: content}
themePatch:
  values:
    marquee.ground: {type: color, value: '#181818'}
    marquee.bulb: {type: color, value: '#FFDA63'}
    marquee.ring: {type: color, value: '#C99824'}
    marquee.symbol: {type: symbol, value: {shape: {catalog: 'chrona-target-parts:bulb'}}}
    marquee.size: {type: number, value: 16}
    marquee.pitch: {type: number, value: 24}
    marquee.fidelity: {type: fidelity, value: required}
  roles:
    region-frame-marquee: {fill: marquee.ground}
    frame-glyph-marquee:
      symbol: marquee.symbol
      glyphSize: marquee.size
      glyphPitch: marquee.pitch
      fill: marquee.bulb
      stroke: marquee.ring
      artworkFidelity: marquee.fidelity
