# Reviewed per-slide record of what each public evidence slide shows (#977). One line per manifest slide,
# keyed <example>/<slide-id>, sorted. A slide with no row fails (not accounted for); a changed value fails.
# This is a change detector, not a quality target or an oracle: edit a row only for an intended change and
# say why in the PR. Fields: axisLabels (axis-label primitives in the Scene, equal to the SVG's);
# dvtHosted (Controller Z only: the `dvt` member label follows its host bar; default false);
# chips (the `chip:*` primitives the Scene carries; default none).
