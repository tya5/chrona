$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "urn:chrona:common-v0.1"
title: "Chrona Common Definitions v0.1"
description: >-
  Shared value definitions referenced by live schemas as `urn:chrona:common-v0.1#/$defs/<name>`.
  The part asserts nothing at its root. Each definition is frozen once published: the inventory
  records a digest per definition and a change is a new part version, never an edit. Definitions
  that name an existing inline pattern are byte-exact to it, including the `$` anchor.
$defs:
  tableMissingText:
    description: "An author-chosen literal for an absent table value: one to eight characters with no control character, drawn exactly as written in the column's text role (#1288). `affixes.missing` still wraps whatever the absent text is, in every absent state."
    examples: [{text: "?"}]
    type: object
    required: [text]
    additionalProperties: false
    properties:
      text: {description: "The literal shown in place of the absent value; no control character.", examples: ["?"], type: string, minLength: 1, maxLength: 8, not: {pattern: "[\\u0000-\\u001f\\u007f]"}}
  tableColumnAffix:
    description: "A literal prefix and suffix of one to eight characters wrapped around a table cell's text in one state (#588); at least one is declared."
    examples: [{suffix: "!"}]
    type: object
    minProperties: 1
    additionalProperties: false
    properties:
      prefix: {description: "Literal text before the cell text.", type: string, minLength: 1, maxLength: 8}
      suffix: {description: "Literal text after the cell text.", type: string, minLength: 1, maxLength: 8}
  tableTextWrap:
    type: object
    description: "Text wrapping preference for the item."
    required: [wrap]
    additionalProperties: false
    properties: {wrap: {description: "Whether the text may wrap.", enum: [allow, forbid]}}


  tableColumnPresentation:
    description: "Project-independent optional column presentation; required effective-column fields are validated by View."
    type: object
    additionalProperties: false
    properties:
      format:
        description: "Closed scalar formatter or an explicit boolean presence presentation."
        examples: [text, {kind: presence, whenTrue: "Yes", whenFalse: "No"}]
        oneOf:
          - {$ref: "urn:chrona:vocabulary-v0.1#/$defs/tableColumnScalarFormat"}
          - {description: "A signed whole number with no unit (`+10`, `+0`, `-3`; #588). The shared vocabulary part is frozen, so this one value is declared here until the part has a new version.", const: signedNumber}
          - description: "Explicit text for a boolean presence value."
            type: object
            required: [kind, whenTrue, whenFalse]
            additionalProperties: false
            properties:
              kind: {description: "Boolean presence formatter.", const: presence}
              whenTrue: {description: "Text rendered for boolean true; an empty string is intentional.", type: string}
              whenFalse: {description: "Text rendered for boolean false; an empty string is intentional.", type: string}
      missing:
        description: "The text of an absent value: `blank`, `em-dash`, `unknown`, `in-progress`, or an author-chosen literal `{text}` shown exactly as written (#1288)."
        examples: [blank, {text: "?"}]
        oneOf:
          - {description: "Built-in absent-value text.", enum: [blank, em-dash, unknown, in-progress]}
          - {$ref: "#/$defs/tableMissingText"}
      missingBy:
        description: "The text of an absent value by the item's observation state (#991), each taking the values of `missing` that need no actual source; a state not named keeps `missing`. `inProgress` is a span with an actual start and no finish, `dueUnobserved` a due item with no observation, `notYetDue` an item still before its due date, `unavailable` one with no as-of date or due date."
        examples: [{inProgress: em-dash, dueUnobserved: blank, notYetDue: blank}]
        type: object
        minProperties: 1
        additionalProperties: false
        properties:
          inProgress:
            description: "Absent text for an in-progress observation."
            examples: [blank]
            oneOf:
              - {description: "Built-in absent-value text.", enum: [blank, em-dash, unknown]}
              - {$ref: "#/$defs/tableMissingText"}
          dueUnobserved:
            description: "Absent text for a due item without observations."
            examples: [blank]
            oneOf:
              - {description: "Built-in absent-value text.", enum: [blank, em-dash, unknown]}
              - {$ref: "#/$defs/tableMissingText"}
          notYetDue:
            description: "Absent text for an item not yet due."
            examples: [blank]
            oneOf:
              - {description: "Built-in absent-value text.", enum: [blank, em-dash, unknown]}
              - {$ref: "#/$defs/tableMissingText"}
          unavailable:
            description: "Absent text when observation state is unavailable."
            examples: [blank]
            oneOf:
              - {description: "Built-in absent-value text.", enum: [blank, em-dash, unknown]}
              - {$ref: "#/$defs/tableMissingText"}
      affixes:
        description: "Per-state text affixes (#588) wrapped around the formatted cell text: slip, onTime and ahead for a signed format (a value above, at and below zero), missing for an absent value. Absent, the cell is the formatted text."
        examples: [{slip: {suffix: "!"}, missing: {suffix: "?"}}]
        type: object
        minProperties: 1
        additionalProperties: false
        properties:
          slip: {$ref: "#/$defs/tableColumnAffix"}
          onTime: {$ref: "#/$defs/tableColumnAffix"}
          ahead: {$ref: "#/$defs/tableColumnAffix"}
          missing: {$ref: "#/$defs/tableColumnAffix"}
      zero:
        description: "How a zero value of a `signedNumber` or `signedDays` column reads: `signed` (the default) keeps the sign (`+0`, `+0d`), `plain` draws it without one (`0`, `0d`); non-zero values keep their sign either way (#1289). An `onTime` affix still wraps the text."
        enum: [signed, plain]
      textRole: {description: "Named Theme text role in which this column's cells are measured and set (#1062): its size, weight, letter spacing and transform, and, when the Theme binds `<role>.fill`, the colour of a plain cell. A state-coloured cell (variance, missing actual) keeps its own ink. Absent, the cells keep `text` (`numeric` for a signed format). A role the Theme does not declare is `E_THEME_ROLE_REQUIRED`.", examples: [table-cell-secondary], type: string, minLength: 1}
      align: {description: "Inline alignment inside the measured column allocation.", enum: [start, center, end]}
      headerOrientation: {description: "Finite orientation of this column header; table cells remain horizontal.", enum: [horizontal, rotate-cw, rotate-ccw]}
      width:
        description: "Table subset of the Layout logical size grammar for this measured column."
        examples: [content, {minmax: {min: content, max: fill}}]
        oneOf:
          - {description: "Intrinsic or remaining-space width.", enum: [content, fill]}
          - {$ref: "urn:chrona:common-v0.1#/$defs/fractionalTrack"}
          - description: "Bounded intrinsic-to-flexible column allocation."
            type: object
            required: [minmax]
            additionalProperties: false
            properties:
              minmax:
                description: "Minimum and maximum column allocation."
                type: object
                required: [min, max]
                additionalProperties: false
                properties:
                  min: {description: "Intrinsic minimum width.", enum: [content]}
                  max:
                    description: "Maximum column allocation."
                    examples: [fill]
                    oneOf:
                      - {description: "Intrinsic or remaining-space maximum.", enum: [content, fill]}
                      - {$ref: "urn:chrona:common-v0.1#/$defs/fractionalTrack"}

      endDisplay:
        description: "Display-only dateRange endpoint: inclusive shows end minus one calendar day for positive spans; absent/exclusive preserves the stored exclusive end."
        enum: [inclusive, exclusive]
      text: {$ref: "#/$defs/tableTextWrap"}
  viewHeading:
    description: "The optional kicker above the title, the title, and optional subtitle lines of a table-timeline surface (a dependency network ignores it), each a template of literal text and the placeholders {project} (the Project title), {asOf} (the Actual Set's as-of date in dateForm) , {calendar} (the Project's default calendar title, else its id), and {figure:id} (a declared global figure, bound before Layout measurement); {{ and }} are literal braces. Absent, the title is the Project title and there is no kicker or subtitle."
    examples: [{kicker: "Episode {asOf}", title: "{project}", subtitle: "Every work package by owning team, as of {asOf}, calendar {calendar}"}]
    type: object
    minProperties: 1
    additionalProperties: false
    properties:
      kicker: {description: "The optional template drawn above the title in the Theme's `kicker` typography role.", type: string, minLength: 1, examples: ["第弐面"]}
      title: {description: "The title template; a Project without a title shows `Chrona`.", type: string, minLength: 1, examples: ["{project} programme board"]}
      subtitle: {description: "The subtitle template, drawn under the title in the Theme's `subtitle` typography role.", type: string, minLength: 1, examples: ["as of {asOf}"]}
      dateForm: {description: "The form of {asOf}; absent is the localized date.", enum: [localized-date, day-month, day-month-year]}
      text: {$ref: "#/$defs/tableTextWrap"}
  groupHeaderPresentation:
    description: "Group-header text template; usable only with presentation header and grouping by field or object type."
    type: object
    required: [text]
    additionalProperties: false
    properties:
      text: {description: "Literal text with the closed placeholders {ordinal}, {title}, {secondary} and {figure:<id>} (a derived figure the View declares); {{ and }} are literal braces. A placeholder may name a Theme text role, {name|role} (role: a letter then letters, digits, underscore or hyphen): its text is one run in that role's typography and ink on the shared baseline, and unmarked text takes the groupHeader role.", examples: ["{ordinal|group-ordinal} {title}"], type: string, minLength: 1}
      ordinal: {description: "Form of {ordinal}, the group's 1-based position in display order; arabic when omitted.", enum: [arabic, zero-padded, roman, kanji, kanji-formal]}
      first: {description: "Template for the first group in display order, with the same placeholders.", type: string, minLength: 1}
      secondary:
        description: "Source of {secondary}: a non-empty string in the group entity's fields."
        type: object
        required: [entityField]
        additionalProperties: false
        properties: {entityField: {description: "Entity field name.", type: string, minLength: 1}}
  groupTintPresentation:
    description: "Per-group band tint: a Theme colour scale over the grouping field's values; usable only when grouping by field."
    type: object
    required: [scale]
    additionalProperties: false
    properties:
      scale: {description: "Named Theme colour scale applied to each group's band and header band.", type: string, minLength: 1}
      domain:
        description: "Closed set of group values admitted by the scale, or firstAppearance (the default) to derive it from the groups in display order."
        examples: [firstAppearance, [alpha, beta]]
        oneOf:
          - description: "Explicit admitted group-value order."
            type: array
            minItems: 1
            uniqueItems: true
            items: {description: "One admitted group value.", type: string, minLength: 1}
          - {description: "Distinct group values in display order.", const: firstAppearance}
  groupPresentation: {description: "Visual treatment for groups.", enum: [band, header]}
  colorEncodingPresentation:
    description: "Design half of field-to-colour encoding; source and domain remain View connection data."
    type: object
    additionalProperties: false
    properties:
      scale: {description: "Named colour scale to apply.", type: string, minLength: 1}
      target: {description: "Only planned marks are colour-encoded.", const: planned}
  figureFormats:
    description: "Closed count text formats keyed by declared View count figure identity. Explicit empty mapping replaces design defaults."
    type: object
    propertyNames: {$ref: "#/$defs/identifier"}
    additionalProperties: {$ref: "#/$defs/countTextFormat"}
  countTextFormat:
    description: "A pure count text form; only digits accept minimumDigits and only English accepts capitalize. Number-name ranges are checked when text reads the count."
    examples: [{form: digits, minimumDigits: 2}, {form: english-words, capitalize: true}, {form: kanji}]
    oneOf:
      - description: "Decimal digits with optional zero padding."
        type: object
        required: [form]
        additionalProperties: false
        properties:
          form: {description: "Use decimal digits.", const: digits}
          minimumDigits: {description: "Minimum digit count, including leading zeros.", type: integer, minimum: 1, maximum: 80}
      - description: "English number words with optional initial capitalization."
        type: object
        required: [form]
        additionalProperties: false
        properties:
          form: {description: "Use the English number-name table.", const: english-words}
          capitalize: {description: "Capitalize the first letter when true.", type: boolean}
      - description: "Ordinary or formal kanji number names."
        type: object
        required: [form]
        additionalProperties: false
        properties:
          form: {description: "Select the kanji number-name table.", enum: [kanji, kanji-formal]}
  sha256Identity:
    description: "SHA-256 identity of one immutable byte payload: the `sha256:` prefix and 64 lowercase hexadecimal digits."
    examples: ["sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"]
    type: string
    pattern: "^sha256:[0-9a-f]{64}$"
  isoDate:
    description: "A calendar date written YYYY-MM-DD. The shape is checked here; calendar validity is a later phase."
    examples: ["2026-09-30"]
    type: string
    pattern: "^\\d{4}-\\d{2}-\\d{2}$"
  safeRelativePath:
    description: "Strict relative path: starts with a letter or digit, uses only letters, digits, `.`, `_`, `-` and `/`, and has no `.` or `..` segment."
    examples: ["views/overview.yaml"]
    type: string
    pattern: "^(?!.*(?:^|/)\\.{1,2}(?:/|$))[A-Za-z0-9][A-Za-z0-9._/-]*$"
  relativeAddress:
    description: "Loose Store-relative address: not absolute and no `.` or `..` segment; any other character is accepted, and the check sees only the first line. Frozen: since #710 only transitioning schemas reference it; a live site references `storeAddress`."
    examples: ["resources/project.yaml"]
    type: string
    pattern: "^(?!/)(?!.*(?:^|/)\\.{1,2}(?:/|$)).+"
  relativeAddressDotTolerant:
    description: "Loose Context-relative address: not absolute and no `..` segment; a single `.` segment is accepted. Frozen: since #710 only transitioning schemas reference it; a live site references `storeAddress`."
    examples: ["font_metrics/acme-regular.json"]
    type: string
    pattern: "^(?!/)(?!.*(?:^|/)\\.\\.(?:/|$)).+$"
  storeAddress:
    description: "Strict Store-relative address (#710): segments of letters, digits, `.`, `_` and `-` joined by single `/`; no empty segment and no segment made only of dots (so no `.`, `..` or `...`); no leading `/`, `:`, backslash, NUL or control character, and no trailing newline."
    examples: ["resources/project.yaml", "snapshots/baseline-2027-06.yaml"]
    type: string
    pattern: "^(?!(?:.*/)?\\.+(?:/|(?![\\s\\S])))[A-Za-z0-9._-]+(?:/[A-Za-z0-9._-]+)*(?![\\s\\S])"
  fileName:
    description: "One file name inside a directory: non-empty, not `.` or `..`, and no `/`, `\\` or control character. Spaces and non-ASCII characters are accepted."
    examples: ["plan.yaml", "計画.yaml"]
    type: string
    minLength: 1
    pattern: "^[^/\\\\\\u0000-\\u001f\\u007f]+(?![\\s\\S])"
    not: {enum: [".", ".."]}
  identifier:
    description: "A stable identifier: non-empty and free of control characters. Spaces and non-ASCII characters are accepted."
    examples: ["Work package / gate", "作業ストリーム"]
    type: string
    minLength: 1
    pattern: "^[^\\u0000-\\u001f\\u007f]+(?![\\s\\S])"
  slug:
    description: "Lowercase identifier: a letter, then lowercase letters, digits and hyphens."
    examples: ["controller-z"]
    type: string
    pattern: "^[a-z][a-z0-9-]*$"
  portableName:
    description: "Portable name: a letter or digit, then letters, digits, underscores and hyphens."
    examples: ["material_symbols"]
    type: string
    pattern: "^[A-Za-z0-9][A-Za-z0-9_-]*$"
  gitRevision:
    description: "Pinned Git revision: the `git:` prefix and 40 to 64 hexadecimal digits."
    examples: ["git:0123456789abcdef0123456789abcdef01234567"]
    type: string
    pattern: "^git:[0-9A-Fa-f]{40,64}$"
  revisionToken:
    description: "Opaque revision token: one or more non-whitespace characters."
    examples: ["main"]
    type: string
    pattern: "^\\S+$"
  fractionalTrack:
    description: "Positive fractional track size."
    examples: [{fr: 1}]
    type: object
    required: [fr]
    additionalProperties: false
    properties:
      fr: {description: "Positive fractional allocation weight.", type: number, exclusiveMinimum: 0, maximum: 1000000}
  license:
    description: "Explicit licensing details that travel with an asset."
    examples: [{spdx: MIT, notice: "Copyright the authors"}]
    type: object
    required: [spdx, notice]
    additionalProperties: false
    properties:
      spdx: {description: "Declared SPDX identifier; policy remains the author's decision.", type: string, minLength: 1}
      notice: {description: "Complete notice text that must travel with the asset.", type: string, minLength: 1}
  sha256IdentityOrNull:
    description: "A SHA-256 identity that may be absent: the nullable form of `sha256Identity`, with the same pattern for a string."
    examples: ["sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef", null]
    type: [string, "null"]
    pattern: "^sha256:[0-9a-f]{64}$"
  literalCaption:
    description: "Literal caption copy: one to eighty characters with no control character; the Theme role's text transform styles it."
    examples: [Notes]
    type: string
    minLength: 1
    maxLength: 80
    pattern: "^[^\\u0000-\\u001f\\u007f]+$"
  annotationLegacyPlacement:
    description: "The old rung spelling: one flush side of the anchor. Kept valid alongside candidates (#466); an annotation uses exactly one spelling."
    examples: [{side: end, alignment: center}]
    type: object
    required: [side, alignment]
    additionalProperties: false
    properties:
      side: {$ref: "urn:chrona:vocabulary-v0.1#/$defs/annotationSide"}
      alignment: {$ref: "urn:chrona:vocabulary-v0.1#/$defs/annotationAlignment"}
  annotationCandidates:
    description: "The declared placement-candidate list: region, search, obstacles and connector (#466). An annotation uses exactly one spelling."
    type: array
    minItems: 1
    items:
      description: "One declared annotation placement candidate: region, search, obstacles and connector (#466)."
      examples: [{id: plot-near, region: {kind: plot}, search: {kind: nearest-free, maxPositions: 256, maxInlineEm: 18}, obstacles: {classes: [mark, text, label-visual, dependency-route, leader-route, annotation-box, port, rule]}, connector: {kind: tail}}]
      type: object
      required: [id, region, search, obstacles, connector]
      additionalProperties: false
      properties:
        id: {description: "Candidate identifier, unique per annotation and stable in diagnostics.", type: string, minLength: 1}
        region:
          description: "The area this candidate's box may occupy."
          examples: [{kind: plot}]
          type: object
          required: [kind]
          additionalProperties: false
          properties:
            kind: {description: "Region kind.", enum: [plot, content, slot, intersection]}
            source: {description: "The named slot source, required only for a slot region.", type: string, minLength: 1}
            of:
              description: "The exactly two named simple (non-intersection) regions an intersection region combines."
              type: array
              minItems: 2
              maxItems: 2
              items:
                description: "One simple region combined by an intersection."
                examples: [{kind: plot}]
                type: object
                required: [kind]
                additionalProperties: false
                properties:
                  kind: {description: "Region kind.", enum: [plot, content, slot]}
                  source: {description: "The named slot source, required only for a slot region.", type: string, minLength: 1}
                allOf:
                  - description: "A slot region names its source slot."
                    examples: [{kind: slot, source: annotations}]
                    if: {properties: {kind: {const: slot}}, required: [kind]}
                    then: {required: [source]}
          allOf:
            - description: "A slot region names its source slot."
              examples: [{kind: slot, source: annotations}]
              if: {properties: {kind: {const: slot}}, required: [kind]}
              then: {required: [source]}
            - description: "Only an intersection region combines two named regions."
              examples: [{kind: intersection, of: [{kind: plot}, {kind: slot, source: annotations}]}]
              if: {properties: {kind: {const: intersection}}, required: [kind]}
              then: {required: [of]}
              else: {not: {required: [of]}}
        search:
          description: "How positions inside the region are generated and ordered."
          examples: [{kind: nearest-free, maxPositions: 256, maxInlineEm: 18}]
          type: object
          required: [kind]
          additionalProperties: false
          properties:
            kind: {description: "Search strategy.", enum: [row-aligned, adjacent, nearest-free]}
            side: {description: "The one logical side an adjacent search projects from.", $ref: "urn:chrona:vocabulary-v0.1#/$defs/annotationSide"}
            maxPositions: {description: "Bounded lattice size examined by a nearest-free search.", type: integer, minimum: 1, maximum: 1024}
            maxInlineEm: {description: "Positive finite text-width bound for a plot/content search, in em.", type: number, exclusiveMinimum: 0}
          allOf:
            - description: "An adjacent search must declare its one logical side."
              examples: [{kind: adjacent, side: end}]
              if: {properties: {kind: {const: adjacent}}, required: [kind]}
              then: {required: [side]}
            - description: "maxInlineEm bounds only a nearest-free search."
              examples: [{kind: row-aligned}]
              if: {properties: {kind: {not: {const: nearest-free}}}, required: [kind]}
              then: {not: {required: [maxInlineEm]}}
        obstacles:
          description: "The nonempty closed set of obstacle-index classes this candidate must avoid."
          examples: [{classes: [mark, text, label-visual, dependency-route, leader-route, annotation-box, port, rule]}]
          type: object
          required: [classes]
          additionalProperties: false
          properties:
            classes:
              description: "One or more obstacle-index classes."
              type: array
              minItems: 1
              uniqueItems: true
              items: {description: "One shared obstacle-index class.", enum: [mark, text, label-visual, dependency-route, leader-route, annotation-box, port, rule]}
        connector:
          description: "How the box points at its subject."
          examples: [{kind: tail}]
          type: object
          required: [kind]
          additionalProperties: false
          properties:
            kind: {description: "Connector kind.", enum: [none, leader, tail]}
  annotationPlacementPolicy:
    description: "One reusable purpose policy; exactly one existing annotation placement spelling."
    examples: [{placement: {side: end, alignment: center}}]
    type: object
    additionalProperties: false
    properties:
      placement: {$ref: "#/$defs/annotationLegacyPlacement"}
      candidates: {$ref: "#/$defs/annotationCandidates"}
    oneOf:
      - description: "A legacy side/alignment policy excludes declared candidates."
        examples: [{placement: {side: end, alignment: center}}]
        required: [placement]
        not: {required: [candidates]}
      - description: "A declared candidate policy excludes a legacy rung."
        examples: [{candidates: [{id: rail, region: {kind: slot, source: annotations}, search: {kind: row-aligned}, obstacles: {classes: [mark]}, connector: {kind: leader}}]}]
        required: [candidates]
        not: {required: [placement]}
  annotationPlacementByPurpose:
    description: "Reusable placement policies keyed by closed annotation purpose; an empty map replaces all offered policies."
    examples: [{note: {placement: {side: end, alignment: center}}}]
    type: object
    propertyNames: {$ref: "urn:chrona:vocabulary-v0.1#/$defs/annotationPurpose"}
    additionalProperties: {$ref: "#/$defs/annotationPlacementPolicy"}
