$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "urn:chrona:render-context-v0.3"
title: "Chrona Render Context v0.3"
type: object
required: [version, kind, id, body]
additionalProperties: false
properties:
  version: {const: "chrona/presentation/v0.3"}
  kind: {const: "render-context"}
  id: {type: string, minLength: 1}
  body:
    type: object
    required: [project, view, presentationPreset, inputs, target]
    additionalProperties: false
    properties:
      project:
        allOf:
          - {$ref: "#/$defs/reference"}
          - {properties: {kind: {const: project}}}
      view:
        allOf:
          - {$ref: "#/$defs/reference"}
          - {properties: {kind: {const: view}}}
      presentationPreset:
        allOf:
          - {$ref: "#/$defs/reference"}
          - {properties: {kind: {const: presentation-preset}}}
      inputs:
        type: object
        additionalProperties: false
        properties:
          actual:
            allOf:
              - {$ref: "#/$defs/reference"}
              - {properties: {kind: {const: actual-set}}}
          summaryProfile:
            allOf:
              - {$ref: "#/$defs/reference"}
              - {properties: {kind: {const: summary-profile}}}
          detailProfile:
            allOf:
              - {$ref: "#/$defs/reference"}
              - {properties: {kind: {const: review-detail-profile}}}
      target:
        type: object
        required: [kind, capabilities]
        additionalProperties: false
        properties:
          kind: {const: svg}
          capabilities:
            type: array
            minItems: 1
            uniqueItems: true
            items: {type: string, minLength: 1}
$defs:
  reference:
    type: object
    required: [id, kind, store, address, revision, contentIdentity]
    additionalProperties: false
    properties:
      id: {type: string, minLength: 1}
      kind: {type: string, minLength: 1}
      store:
        type: object
        required: [provider, identity]
        additionalProperties: false
        properties:
          provider: {enum: [git, local, content]}
          identity: {type: string, minLength: 1}
          locator: {type: string, minLength: 1}
      address:
        type: string
        minLength: 1
        pattern: "^(?!/)(?!.*(?:^|/)\\.{1,2}(?:/|$)).+"
      revision:
        type: object
        required: [token]
        additionalProperties: false
        properties:
          token: {type: string, minLength: 1, pattern: "^\\S+$"}
      contentIdentity: {type: string, pattern: "^sha256:[0-9a-f]{64}$"}
