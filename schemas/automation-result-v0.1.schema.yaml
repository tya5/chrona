$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "chrona/automation-result-v0.1"
title: "Chrona automation result v0.1"
description: "Recorded outcome of a checked or applied automation operation."
type: object
required: [version, operation, status, requestContentIdentity, inputs, diagnostics, artifacts]
additionalProperties: false
properties:
  version: {description: "This automation-result contract version.", const: chrona/automation-result/v0.1}
  operation: {description: "Automation operation that produced this result.", enum: [command-check, command-apply, actual-intake, actual-resolve, baseline-capture, baseline-compare]}
  status: {description: "Whether the operation was accepted or rejected.", enum: [accepted, rejected]}
  replayed: {description: "Whether this result was reproduced from a prior request.", type: boolean}
  requestContentIdentity: {description: "SHA-256 identity of the originating request.", examples: ["sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"], type: string, pattern: "^sha256:[0-9a-f]{64}$"}
  inputs: {description: "Immutable resources consumed by the operation.", type: array, minItems: 1, items: {$ref: "urn:chrona:revision-store-resource-ref-v0.1"}}
  resultTarget: {$ref: "urn:chrona:revision-store-resource-ref-v0.1"}
  diagnostics: {description: "Diagnostics emitted while processing the request.", type: array, items: {description: "One diagnostic record with a stable code.", type: object, required: [code], additionalProperties: true, properties: {code: {description: "Stable diagnostic code.", type: string, minLength: 1}}}}
  artifacts: {description: "Immutable artifacts produced by the operation.", type: array, items: {$ref: "urn:chrona:revision-store-resource-ref-v0.1"}}
  actualIntake: {description: "Operation-specific Actual intake result data.", type: object, additionalProperties: true}
  comparison: {description: "Operation-specific baseline comparison result data.", type: object, additionalProperties: true}
allOf:
  - description: "Accepted results contain no diagnostics."
    examples: [{}]
    if: {properties: {status: {const: accepted}}}
    then: {properties: {diagnostics: {maxItems: 0}}}
  - description: "Rejected results do not name a result target."
    examples: [{}]
    if: {properties: {status: {const: rejected}}}
    then: {not: {required: [resultTarget]}}
