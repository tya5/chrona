$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "chrona/automation-result-v0.1"
title: "Chrona automation result v0.1"
type: object
required: [version, operation, status, requestContentIdentity, inputs, diagnostics, artifacts]
additionalProperties: false
properties:
  version: {const: chrona/automation-result/v0.1}
  operation: {enum: [command-check, command-apply, actual-intake, actual-resolve, baseline-capture, baseline-compare]}
  status: {enum: [accepted, rejected]}
  replayed: {type: boolean}
  requestContentIdentity: {type: string, pattern: "^sha256:[0-9a-f]{64}$"}
  inputs: {type: array, minItems: 1, items: {$ref: "urn:chrona:revision-store-resource-ref-v0.1"}}
  resultTarget: {$ref: "urn:chrona:revision-store-resource-ref-v0.1"}
  diagnostics: {type: array, items: {type: object, required: [code], additionalProperties: true, properties: {code: {type: string, minLength: 1}}}}
  artifacts: {type: array, items: {$ref: "urn:chrona:revision-store-resource-ref-v0.1"}}
  actualIntake: {type: object, additionalProperties: true}
  comparison: {type: object, additionalProperties: true}
allOf:
  - if: {properties: {status: {const: accepted}}}
    then: {properties: {diagnostics: {maxItems: 0}}}
  - if: {properties: {status: {const: rejected}}}
    then: {not: {required: [resultTarget]}}
