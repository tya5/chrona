$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "chrona/presentation-package-v0.1"
title: "Chrona declarative presentation package v0.1"
description: "Closed manifest for immutable ordinary presentation resources."
type: object
required: [format, kind, id, package, members, compatibility, provenance]
additionalProperties: false
properties:
  format: {description: "Package manifest format.", const: chrona/presentation-package/v0.1}
  kind: {description: "Package manifest kind.", const: presentation-package}
  id: {description: "Namespaced immutable package identifier.", type: string, pattern: "^[a-z0-9][a-z0-9-]*/[a-z0-9][a-z0-9-]*$"}
  package:
    type: object
    required: [release, contentIdentity, license, publisher]
    additionalProperties: false
    properties:
      release: {description: "Exact immutable package release.", type: string, minLength: 1}
      contentIdentity: {$ref: "#/$defs/digest"}
      license: {description: "Machine-readable package license.", type: string, minLength: 1}
      publisher:
        type: object
        required: [id, displayName]
        additionalProperties: false
        properties:
          id: {type: string, minLength: 1}
          displayName: {type: string, minLength: 1}
      deprecated: {type: boolean}
      replacement: {type: string, pattern: "^[a-z0-9][a-z0-9-]*/[a-z0-9][a-z0-9-]*$"}
  members:
    type: object
    required: [presets, resources]
    additionalProperties: false
    properties:
      presets: {type: array, minItems: 1, items: {$ref: "#/$defs/presetMember"}}
      resources: {type: array, minItems: 4, items: {$ref: "#/$defs/resourceMember"}}
  compatibility:
    type: object
    required: [chrona, targets]
    additionalProperties: false
    properties:
      chrona: {description: "Declared compatible Chrona range.", type: string, minLength: 1}
      targets: {type: array, minItems: 1, uniqueItems: true, items: {type: string, minLength: 1}}
  provenance:
    type: object
    additionalProperties: false
    properties:
      derivedFrom: {type: object, required: [id, release, contentIdentity], additionalProperties: false, properties: {id: {type: string, minLength: 1}, release: {type: string, minLength: 1}, contentIdentity: {$ref: "#/$defs/digest"}}}
$defs:
  digest: {description: "Exact SHA-256 content identity.", type: string, pattern: "^sha256:[0-9a-f]{64}$"}
  path: {description: "Safe package-relative member address.", type: string, minLength: 1, pattern: "^(?!.*(?:^|/)\\.{1,2}(?:/|$))[A-Za-z0-9][A-Za-z0-9._/-]*$"}
  presetMember:
    type: object
    required: [id, path, contentIdentity]
    additionalProperties: false
    properties: {id: {type: string, minLength: 1}, path: {$ref: "#/$defs/path"}, contentIdentity: {$ref: "#/$defs/digest"}}
  resourceMember:
    type: object
    required: [id, kind, path, contentIdentity]
    additionalProperties: false
    properties:
      id: {type: string, minLength: 1}
      kind: {enum: [view, theme, color-scheme, layout-profile]}
      path: {$ref: "#/$defs/path"}
      contentIdentity: {$ref: "#/$defs/digest"}
