$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "chrona/actual-set-v0.2"
title: "Chrona Actual set with external intake provenance v0.2"
type: object
required: [version, kind, id, body]
additionalProperties: false
properties:
  version: {const: chrona/actual-set/v0.2}
  kind: {const: actual-set}
  id: {type: string, minLength: 1}
  body:
    type: object
    required: [observations]
    additionalProperties: false
    properties:
      observations:
        type: array
        items:
          type: object
          required: [id, sequence, actual]
          additionalProperties: false
          properties:
            id: {type: string, minLength: 1}
            sequence: {type: integer, minimum: 1}
            projectObjectId: {type: string, minLength: 1}
            externalIdentity: {type: object, required: [system, key], additionalProperties: false, properties: {system: {type: string, minLength: 1}, key: {type: [string, integer]}}}
            sourceContentIdentity: {type: string, pattern: "^sha256:[0-9a-f]{64}$"}
            alignment: {const: unmatched}
            actual: {type: object, minProperties: 1, additionalProperties: false, properties: {start: {type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$"}, finish: {type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$"}, at: {type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$"}, progress: {type: number, minimum: 0, maximum: 1}}}
          allOf:
            - if: {required: [externalIdentity]}
              then: {required: [sourceContentIdentity]}
