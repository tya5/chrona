$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "urn:chrona:release-package-v0.2"
type: object
additionalProperties: false
required: [version, releaseId, status, evaluationIdentity, output, acceptance, artifact]
properties:
  version: {const: "chrona/release-package/v0.2"}
  releaseId: {type: string, minLength: 1}
  status: {enum: [published, blocked]}
  evaluationIdentity: {type: string, minLength: 1}
  output:
    type: object
    additionalProperties: false
    required: [target, targetVersion, manifestIdentity]
    properties:
      target: {enum: [svg, pdf, raster, canvas, presentation]}
      targetVersion: {type: string, minLength: 1}
      manifestIdentity: {type: string, pattern: "^sha256:[0-9a-f]{64}$"}
  acceptance:
    type: object
    additionalProperties: false
    required: [manifestIdentity]
    properties:
      manifestIdentity: {type: string, pattern: "^sha256:[0-9a-f]{64}$"}
  artifact:
    type: object
    additionalProperties: false
    required: [contentIdentity]
    properties:
      contentIdentity: {type: [string, 'null'], pattern: "^sha256:[0-9a-f]{64}$"}
  diagnostics:
    type: array
    items: {type: string, minLength: 1}
