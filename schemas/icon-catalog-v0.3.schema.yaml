$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "urn:chrona:icon-catalog-v0.3"
title: "Chrona Icon Catalog v0.3"
description: "A canonical, offline icon set. Vector paths are normalized at import; raw SVG/XML is never a render input."
allOf:
  - $ref: "urn:chrona:presentation-resource-v0.1"
  - description: "Catalog fields extending the shared presentation resource envelope."
    type: object
    properties:
      version: {description: "This canonical catalog contract version.", const: "chrona/icon-catalog/v0.3"}
      kind: {description: "Resource kind identifying this document as an icon catalog.", const: icon-catalog}
      body:
        description: "Closed catalog content, provenance, entries, and aliases."
        type: object
        required: [set, aliases, provenance, icons, entryAliases]
        additionalProperties: false
        properties:
          set:
            description: "Canonical namespace used by `set:name` references."
            $ref: "#/$defs/name"
          aliases:
            description: "Additional Context-local namespaces resolving to this same catalog set."
            type: array
            uniqueItems: true
            items: {$ref: "#/$defs/name"}
          provenance:
            type: object
            description: "Importer-recorded local collection identity and complete licensing notice."
            required: [sourceKind, sourcePrefix, sourceContentIdentity, license]
            additionalProperties: false
            properties:
              sourceKind: {description: "Authoring ingress that created this normalized catalog.", const: iconify-json}
              sourcePrefix: {description: "Original Iconify collection prefix.", $ref: "#/$defs/name"}
              sourceContentIdentity: {description: "SHA-256 of the exact supplied local collection bytes.", examples: ["sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"], type: string, pattern: "^sha256:[0-9a-f]{64}$"}
              sourceVersion: {description: "Optional upstream collection version supplied by the local source.", type: string, minLength: 1}
              lastModified: {description: "Optional upstream collection modification marker.", type: string, minLength: 1}
              license:
                type: object
                required: [spdx, notice]
                additionalProperties: false
                properties:
                  spdx: {description: "Declared SPDX identifier; policy remains the author's decision.", type: string, minLength: 1}
                  notice: {description: "Complete notice that must travel with this catalog.", type: string, minLength: 1}
          icons:
            description: "Canonical icon entry names and their normalized payloads."
            type: object
            minProperties: 1
            propertyNames: {$ref: "#/$defs/name"}
            additionalProperties: {$ref: "#/$defs/icon"}
          entryAliases:
            description: "Alias name to canonical entry name; geometry-bearing aliases are normalized as entries instead."
            type: object
            additionalProperties: {$ref: "#/$defs/name"}
$defs:
  name:
    description: "Portable identifier component used in a catalog set, alias, or entry name."
    examples: [material-symbols]
    type: string
    pattern: "^[A-Za-z0-9][A-Za-z0-9_-]*$"
  viewport:
    description: "Source-unit dimensions used to preserve an icon's aspect ratio."
    type: object
    required: [inlineSize, blockSize]
    additionalProperties: false
    properties:
      inlineSize: {description: "Positive source-unit width.", type: integer, minimum: 1, maximum: 4096}
      blockSize: {description: "Positive source-unit height.", type: integer, minimum: 1, maximum: 4096}
  command:
    description: "One compact renderer-neutral path command."
    type: object
    required: [kind]
    additionalProperties: false
    properties:
      kind: {description: "Path operation kind.", enum: [move, line, quadratic, close]}
      points:
        description: "Absolute source-unit coordinates required by the operation."
        type: array
        minItems: 0
        maxItems: 4
        items: {description: "One finite coordinate component.", type: number}
    allOf:
      - description: "A close command has no coordinates."
        examples: [{kind: close, points: []}]
        if: {properties: {kind: {const: close}}, required: [kind]}
        then: {properties: {points: {maxItems: 0}}}
      - description: "Move and line commands have one coordinate pair."
        examples: [{kind: move, points: [0, 0]}]
        if: {properties: {kind: {enum: [move, line]}}, required: [kind]}
        then: {properties: {points: {minItems: 2, maxItems: 2}}}
      - description: "A quadratic command has a control and endpoint pair."
        examples: [{kind: quadratic, points: [1, 2, 3, 4]}]
        if: {properties: {kind: {const: quadratic}}, required: [kind]}
        then: {properties: {points: {minItems: 4, maxItems: 4}}}
  path:
    description: "One normalized fill or stroke path."
    type: object
    required: [paint, data]
    additionalProperties: false
    properties:
      paint: {description: "Color-Scheme-owned paint mode.", enum: [fill, stroke]}
      data:
        description: "Canonical normalized primitive stream: only uppercase M, L, Q, Z and finite decimal coordinates."
        type: string
        minLength: 1
        maxLength: 65536
      strokeWidth: {description: "Positive source-unit stroke width.", type: number, exclusiveMinimum: 0, maximum: 1024}
      lineCap: {description: "Stroke endpoint shape.", enum: [butt, round, square]}
      lineJoin: {description: "Stroke corner shape.", enum: [miter, round, bevel]}
    allOf:
      - description: "Stroke paths require their width, cap, and join."
        examples: [{paint: stroke, data: "M 0 0 L 1 1", strokeWidth: 1, lineCap: round, lineJoin: round}]
        if: {properties: {paint: {const: stroke}}, required: [paint]}
        then: {required: [strokeWidth, lineCap, lineJoin]}
      - description: "Fill paths do not carry stroke-only fields."
        examples: [{paint: fill, data: "M 0 0 L 1 1 Z"}]
        if: {properties: {paint: {const: fill}}, required: [paint]}
        then: {not: {anyOf: [{required: [strokeWidth]}, {required: [lineCap]}, {required: [lineJoin]}]}}
  rasterSource:
    description: "Immutable local source for a purpose-built raster icon."
    type: object
    required: [address, contentIdentity]
    additionalProperties: false
    properties:
      address:
        description: "Relative, traversal-free catalog asset address."
        examples: [assets/programme-mark.png]
        type: string
        minLength: 1
        pattern: "^(?!.*(?:^|/)\\.{1,2}(?:/|$))(?![A-Za-z][A-Za-z0-9+.-]*:)(?!/)[A-Za-z0-9][A-Za-z0-9._/-]*$"
      contentIdentity: {description: "SHA-256 of the exact raster bytes.", examples: ["sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"], type: string, pattern: "^sha256:[0-9a-f]{64}$"}
  icon:
    description: "One vector or verified raster icon entry."
    type: object
    required: [kind, viewport, alternative]
    additionalProperties: false
    properties:
      kind: {description: "Payload family for this entry.", enum: [vector, raster]}
      viewport: {description: "Source dimensions for placement scaling.", $ref: "#/$defs/viewport"}
      alternative: {description: "Textual equivalent required when this entry is used meaningfully.", type: string}
      paths: {description: "Normalized paths for a vector entry.", type: array, minItems: 1, maxItems: 1024, items: {$ref: "#/$defs/path"}}
      source: {description: "Verified source descriptor for a raster entry.", $ref: "#/$defs/rasterSource"}
    allOf:
      - description: "Vector entries carry paths and no raster source."
        examples: [{kind: vector, viewport: {inlineSize: 24, blockSize: 24}, alternative: Flag, paths: [{paint: fill, data: "M 0 0 Z"}]}]
        if: {properties: {kind: {const: vector}}, required: [kind]}
        then: {required: [paths], not: {required: [source]}}
      - description: "Raster entries carry an immutable source and no vector paths."
        examples: [{kind: raster, viewport: {inlineSize: 24, blockSize: 24}, alternative: Programme, source: {address: assets/programme-mark.png, contentIdentity: "sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"}}]
        if: {properties: {kind: {const: raster}}, required: [kind]}
        then: {required: [source], not: {required: [paths]}}
