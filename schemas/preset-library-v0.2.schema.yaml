$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "chrona/preset-library-v0.2"
title: "Chrona builtin preset library v0.2"
description: "Finite wheel-owned presentation bundles with exact static catalogue and notice members."
type: object
required: [version, entries]
additionalProperties: false
properties:
  version: {const: chrona/preset-library/v0.2, description: Schema version identifying this preset-library document.}
  entries:
    type: array
    description: Builtin presentation bundles available in this library.
    minItems: 1
    uniqueItems: true
    items:
      type: object
      description: One named bundle and its resource members.
      required: [id, gallerySet, members]
      additionalProperties: false
      properties:
        id:
          type: string
          pattern: "^[a-z][a-z0-9-]*$"
          description: Stable lowercase identifier for this preset.
          examples: [technical-print]
        gallerySet: {type: string, minLength: 1, description: Gallery set used to present this preset.}
        visualProfile:
          type: object
          description: Optional preferred visual output profile.
          required: [preferred]
          additionalProperties: false
          properties:
            preferred: {enum: [chrona-output/visual/v0.5-baseline, chrona-output/visual/v0.6-svg, chrona-output/visual/v0.6-png, chrona-output/visual/v0.7-svg, chrona-output/visual/v0.7-png], description: Visual output profile preferred for this preset.}
        members:
          type: object
          description: Resource references that make up this preset.
          required: [view, theme, colorScheme, layout]
          additionalProperties: false
          properties:
            view: {$ref: "#/$defs/view"}
            theme: {$ref: "#/$defs/theme"}
            colorScheme: {$ref: "#/$defs/colorScheme"}
            layout: {$ref: "#/$defs/layout"}
            detailProfile: {$ref: "#/$defs/detailProfile"}
            iconCatalogs:
              type: array
              description: Optional icon catalog resources included with this preset.
              uniqueItems: true
              items: {$ref: "#/$defs/iconCatalog"}
$defs:
  address:
    type: string
    pattern: "^(?!.*(?:^|/)\\.{1,2}(?:/|$))[A-Za-z0-9][A-Za-z0-9._/-]*$"
    description: Relative resource address that excludes dot and dot-dot path segments.
    examples: [bundles/technical-print/theme.yaml]
  identity:
    type: string
    pattern: "^sha256:[0-9a-f]{64}$"
    description: SHA-256 content identity written as a lowercase hexadecimal digest.
    examples: ["sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"]
  view:
    type: object
    description: Reference to a view resource.
    required: [id, kind, sourceRoot, sourcePath]
    additionalProperties: false
    properties:
      id: {type: string, minLength: 1, description: Stable view resource identifier.}
      kind: {const: view, description: Resource kind discriminator.}
      sourceRoot: {$ref: "#/$defs/address"}
      sourcePath: {$ref: "#/$defs/address"}
  theme:
    type: object
    description: Reference to a theme resource.
    required: [id, kind, sourceRoot, sourcePath]
    additionalProperties: false
    properties:
      id: {type: string, minLength: 1, description: Stable theme resource identifier.}
      kind: {const: theme, description: Resource kind discriminator.}
      sourceRoot: {$ref: "#/$defs/address"}
      sourcePath: {$ref: "#/$defs/address"}
  colorScheme:
    type: object
    description: Reference to a color-scheme resource.
    required: [id, kind, sourceRoot, sourcePath]
    additionalProperties: false
    properties:
      id: {type: string, minLength: 1, description: Stable color-scheme resource identifier.}
      kind: {const: color-scheme, description: Resource kind discriminator.}
      sourceRoot: {$ref: "#/$defs/address"}
      sourcePath: {$ref: "#/$defs/address"}
  layout:
    type: object
    description: Reference to a layout-profile resource.
    required: [id, kind, sourceRoot, sourcePath]
    additionalProperties: false
    properties:
      id: {type: string, minLength: 1, description: Stable layout-profile resource identifier.}
      kind: {const: layout-profile, description: Resource kind discriminator.}
      sourceRoot: {$ref: "#/$defs/address"}
      sourcePath: {$ref: "#/$defs/address"}
  detailProfile:
    type: object
    description: Reference to a review detail-profile resource.
    required: [id, kind, sourceRoot, sourcePath]
    additionalProperties: false
    properties:
      id: {type: string, minLength: 1, description: Stable detail-profile resource identifier.}
      kind: {const: review-detail-profile, description: Resource kind discriminator.}
      sourceRoot: {$ref: "#/$defs/address"}
      sourcePath: {$ref: "#/$defs/address"}
  iconCatalog:
    type: object
    description: Reference to an icon catalog and its associated notice resource.
    required: [id, kind, sourceRoot, sourcePath, noticeSourcePath, contentIdentity, noticeContentIdentity]
    additionalProperties: false
    properties:
      id:
        type: string
        pattern: "^[A-Za-z0-9][A-Za-z0-9_-]*$"
        description: Stable icon catalog identifier.
        examples: [chrona-theme-starter]
      kind: {const: icon-catalog, description: Resource kind discriminator.}
      sourceRoot: {const: icons, description: Root directory containing this icon catalog.}
      sourcePath: {$ref: "#/$defs/address"}
      noticeSourcePath: {$ref: "#/$defs/address"}
      contentIdentity: {$ref: "#/$defs/identity"}
      noticeContentIdentity: {$ref: "#/$defs/identity"}
