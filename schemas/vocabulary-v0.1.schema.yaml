$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "urn:chrona:vocabulary-v0.1"
title: "Chrona Shared Vocabulary v0.1"
description: >-
  Finite vocabularies that more than one live schema declares, referenced as
  `urn:chrona:vocabulary-v0.1#/$defs/<name>`. The part asserts nothing at its root. A definition is an
  `enum` with no `type`, so a site that references it has the same dereferenced form as the inline enum
  it replaced. Each definition is frozen once published: the inventory records a digest per definition
  and a change is a new part version, never an edit. A context that accepts only part of a vocabulary
  declares a named subset definition beside the full one, and a test proves the subset is contained in it.
$defs:
  visualProfile:
    description: "Exact renderer-neutral visual capability profile."
    examples: ["chrona-output/visual/v0.5-baseline"]
    enum:
      - chrona-output/visual/v0.5-baseline
      - chrona-output/visual/v0.6-svg
      - chrona-output/visual/v0.6-png
      - chrona-output/visual/v0.7-svg
      - chrona-output/visual/v0.7-png
  monthLabelForm:
    description: "Finite month axis-label form."
    examples: [short-month]
    enum: [short-month, long-month, numeric-month, short-month-year, long-month-year, numeric-year-month]
  quarterLabelForm:
    description: "Finite quarter axis-label form."
    examples: [year-quarter]
    enum: [quarter, year-quarter, quarter-year]
  annotationPurpose:
    description: "Author intent for an annotation."
    examples: [callout]
    enum: [callout, highlight, note, explanatory-arrow]
  annotationSide:
    description: "Logical side of the anchor on which an annotation is placed."
    examples: [above]
    enum: [above, below, start, end]
  annotationAlignment:
    description: "Alignment of an annotation along its chosen side."
    examples: [center]
    enum: [start, center, end]
  logicalAlignment:
    description: "Logical-axis alignment of content within its completed allocation."
    examples: [center]
    enum: [start, center, end]
  annotationVisibilityMode:
    description: "Which annotations a View shows: none, the semantic ones, the presentation ones, or all."
    examples: [presentation]
    enum: [none, semantic, presentation, all]
  guidedAnnotationVisibilityMode:
    description: "The subset of `annotationVisibilityMode` a guided authoring override may select; it cannot alter semantic annotations."
    examples: [presentation]
    enum: [none, presentation, all]
  relationVisibilityMode:
    description: "Which relations a View shows: none, the semantic ones, the critical ones, or all."
    examples: [semantic]
    enum: [none, semantic, critical, all]
  guidedRelationVisibilityMode:
    description: "The subset of `relationVisibilityMode` a guided authoring override may select."
    examples: [semantic]
    enum: [none, semantic]
  viewGroupingBy:
    description: "The dimension a View groups its automatic rows by."
    examples: [objectType]
    enum: [objectType, field, hierarchy, none]
  guidedViewGroupingBy:
    description: "The subset of `viewGroupingBy` a guided authoring override may select: grouping needs no field name or depth."
    examples: [objectType]
    enum: [objectType, none]
  valueFormat:
    description: "Every public value formatter: the union of the subsets below. No site references it; each context accepts its own named subset."
    examples: [text]
    enum: [text, date, dateRange, count, signedDays]
  tableColumnScalarFormat:
    description: "The subset of `valueFormat` a View table column may apply to a scalar (a column may also declare a presence presentation)."
    examples: [dateRange]
    enum: [text, dateRange, date, signedDays]
  summaryMetricFormat:
    description: "The subset of `valueFormat` a summary-profile metric may apply to its value."
    examples: [count]
    enum: [text, date, count, signedDays]
  summaryArrangement:
    description: "Arrangement of a summary panel's ordered text runs."
    examples: [inline]
    enum: [stack, inline]
  backgroundExtent:
    description: "Finite completed review-surface background regions; contexts may declare named subsets or extensions."
    examples: [table]
    enum: [table, timeline, both]
  dateEndpoint:
    description: "Completed-date endpoint of a Project object: the point `at`, or the `start` or `end` of a span."
    examples: [end]
    enum: [at, start, end]
  anchorEndpoint:
    description: "Endpoint of an annotation anchor in a View: `start`, the span-end `end` (canonical, as in `dateEndpoint`) or its alias `finish` (what Views have always said; normalised to `finish` before layout because the text appears in Scene ids), `at`, or `body`."
    examples: [end]
    enum: [start, end, finish, at, body]
  annotationBarWidth:
    description: "Inline sizing of an annotation-kind bar within its completed content container."
    examples: [fill]
    enum: [fill, hug]
  annotationBarBleed:
    description: "Whether an annotation-kind bar stays within its content inset or reaches the container's inner border."
    examples: [none]
    enum: [none, border]
  annotationStampPlacement:
    description: "Whether an annotation-kind stamp occupies a note column or sits at the end of its bar."
    examples: [column]
    enum: [column, bar-end]
