$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "chrona/preset-library-v0.1"
title: "Chrona builtin preset library v0.1"
type: object
required: [version, entries]
additionalProperties: false
properties:
  version: {const: chrona/preset-library/v0.1}
  entries:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: object
      required: [id, gallerySet, members]
      additionalProperties: false
      properties:
        id: {type: string, pattern: "^[a-z][a-z0-9-]*$"}
        gallerySet: {type: string, minLength: 1}
        members:
          type: object
          required: [view, theme, colorScheme, layout]
          additionalProperties: false
          properties:
            view:
              type: object
              required: [id, kind, sourceRoot, sourcePath]
              additionalProperties: false
              properties: {id: {type: string, minLength: 1}, kind: {const: view}, sourceRoot: {type: string, pattern: "^(?!.*(?:^|/)\\.{1,2}(?:/|$))[A-Za-z0-9][A-Za-z0-9._/-]*$"}, sourcePath: {type: string, pattern: "^(?!.*(?:^|/)\\.{1,2}(?:/|$))[A-Za-z0-9][A-Za-z0-9._/-]*$"}}
            theme:
              type: object
              required: [id, kind, sourceRoot, sourcePath]
              additionalProperties: false
              properties: {id: {type: string, minLength: 1}, kind: {const: theme}, sourceRoot: {type: string, pattern: "^(?!.*(?:^|/)\\.{1,2}(?:/|$))[A-Za-z0-9][A-Za-z0-9._/-]*$"}, sourcePath: {type: string, pattern: "^(?!.*(?:^|/)\\.{1,2}(?:/|$))[A-Za-z0-9][A-Za-z0-9._/-]*$"}}
            colorScheme:
              type: object
              required: [id, kind, sourceRoot, sourcePath]
              additionalProperties: false
              properties: {id: {type: string, minLength: 1}, kind: {const: color-scheme}, sourceRoot: {type: string, pattern: "^(?!.*(?:^|/)\\.{1,2}(?:/|$))[A-Za-z0-9][A-Za-z0-9._/-]*$"}, sourcePath: {type: string, pattern: "^(?!.*(?:^|/)\\.{1,2}(?:/|$))[A-Za-z0-9][A-Za-z0-9._/-]*$"}}
            layout:
              type: object
              required: [id, kind, sourceRoot, sourcePath]
              additionalProperties: false
              properties: {id: {type: string, minLength: 1}, kind: {const: layout-profile}, sourceRoot: {type: string, pattern: "^(?!.*(?:^|/)\\.{1,2}(?:/|$))[A-Za-z0-9][A-Za-z0-9._/-]*$"}, sourcePath: {type: string, pattern: "^(?!.*(?:^|/)\\.{1,2}(?:/|$))[A-Za-z0-9][A-Za-z0-9._/-]*$"}}
