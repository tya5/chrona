$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "chrona/authoring-command-result-v0.1"
title: "Chrona guided authoring command result v0.1"
description: "Outcome of one revision-bound guided authoring workspace command."
type: object
required: [version, status, commandId, commandBaseRevision, workspaceRevision, resultRevision, diagnostics]
additionalProperties: false
properties:
  version: {description: "This authoring result format version.", const: chrona/authoring-command-result/v0.1}
  status: {description: "Whether the command was accepted or rejected.", enum: [accepted, rejected]}
  commandId: {description: "The command identity supplied by the caller.", type: string, minLength: 1}
  commandBaseRevision: {description: "The workspace revision declared by the command.", examples: ["sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"], $ref: "urn:chrona:common-v0.1#/$defs/sha256Identity"}
  workspaceRevision: {description: "The validated workspace revision observed before writing.", examples: ["sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"], $ref: "urn:chrona:common-v0.1#/$defs/sha256Identity"}
  resultRevision: {description: "The revision after an accepted write, or null after rejection.", examples: ["sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc"], $ref: "urn:chrona:common-v0.1#/$defs/sha256IdentityOrNull"}
  reversible: {description: "Whether the accepted operation is reversible.", type: boolean}
  replayed: {description: "True only when this accepted result is the retained first result of an earlier application of the same commandId and request; nothing was written by this call. Absent for a fresh application.", const: true}
  revisionIsCurrent: {description: "Present on a replay: whether resultRevision is still the workspace's current revision (false when later commands changed it).", type: boolean}
  inverse:
    description: "On an accepted result of every type except materializePresentationPreset: the authoring-command/v0.1 request (version, commandId, type, target, baseRevision = resultRevision, payload) that restores exactly what this command changed. Apply it with apply_authoring_command to revert the edit; it is refused with E_AUTHORING_BASE_REVISION once the workspace has moved on."
    type: object
    required: [version, commandId, type, target, baseRevision, payload]
    additionalProperties: false
    properties:
      version: {description: "The authoring-command contract version.", const: chrona/authoring-command/v0.1}
      commandId: {description: "The command identity of the inverse: the original commandId with -inverse appended (use your own to retry after a different edit).", type: string, minLength: 1}
      type: {description: "The inverse operation: a command type of authoring-command/v0.1.", type: string, minLength: 1}
      target: {description: "The workspace the inverse applies to (the original target).", type: object}
      baseRevision: {description: "The revision the inverse requires: this result's resultRevision.", $ref: "urn:chrona:common-v0.1#/$defs/sha256Identity"}
      payload: {description: "Operation-specific inverse content; an inverse of a removal carries the position index.", type: object}
  diagnostics:
    description: "Diagnostics emitted by the authoring command boundary."
    type: array
    items:
      description: "One authoring-command diagnostic."
      type: object
      required: [code]
      additionalProperties: false
      properties:
        code: {description: "Stable diagnostic identifier.", type: string, minLength: 1}
        detail: {description: "Actionable diagnostic explanation.", type: string, minLength: 1}
        expectedRevision: {description: "Workspace revision required by the command writer.", examples: ["sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"], $ref: "urn:chrona:common-v0.1#/$defs/sha256Identity"}
        firstApplied: {description: "On E_AUTHORING_COMMAND_ID_REUSE: true, the earlier command with this commandId was applied.", const: true}
        appliedRevision: {description: "On E_AUTHORING_COMMAND_ID_REUSE: the result revision of the earlier command that used this commandId.", examples: ["sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc"], $ref: "urn:chrona:common-v0.1#/$defs/sha256Identity"}
        revisionIsCurrent: {description: "On E_AUTHORING_COMMAND_ID_REUSE: whether appliedRevision is still the workspace's current revision.", type: boolean}
        receivedRevision: {description: "Revision supplied by the rejected command.", examples: ["sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"], $ref: "urn:chrona:common-v0.1#/$defs/sha256Identity"}
allOf:
  - description: "Accepted results carry a result revision and no diagnostics."
    examples: [{}]
    if: {properties: {status: {const: accepted}}, required: [status]}
    then: {properties: {resultRevision: {type: string}}, allOf: [{properties: {diagnostics: {maxItems: 0}}}]}
  - description: "Rejected results have no result revision and at least one diagnostic."
    examples: [{}]
    if: {properties: {status: {const: rejected}}, required: [status]}
    then: {properties: {resultRevision: {type: 'null'}}, allOf: [{properties: {diagnostics: {minItems: 1}}}]}
