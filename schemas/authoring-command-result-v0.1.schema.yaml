$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "chrona/authoring-command-result-v0.1"
title: "Chrona guided authoring command result v0.1"
description: "Outcome of one revision-bound guided authoring workspace command."
type: object
required: [version, status, commandId, commandBaseRevision, workspaceRevision, resultRevision, diagnostics]
additionalProperties: false
properties:
  version: {const: chrona/authoring-command-result/v0.1}
  status: {enum: [accepted, rejected]}
  commandId: {type: string, minLength: 1}
  commandBaseRevision: {type: string, pattern: "^sha256:[0-9a-f]{64}$"}
  workspaceRevision: {type: string, pattern: "^sha256:[0-9a-f]{64}$"}
  resultRevision: {type: [string, 'null'], pattern: "^sha256:[0-9a-f]{64}$"}
  reversible: {type: boolean}
  diagnostics:
    type: array
    items:
      type: object
      required: [code]
      additionalProperties: false
      properties:
        code: {type: string, minLength: 1}
        detail: {type: string, minLength: 1}
        expectedRevision: {type: string, pattern: "^sha256:[0-9a-f]{64}$"}
        receivedRevision: {type: string, pattern: "^sha256:[0-9a-f]{64}$"}
allOf:
  - if: {properties: {status: {const: accepted}}, required: [status]}
    then: {properties: {resultRevision: {type: string}}, allOf: [{properties: {diagnostics: {maxItems: 0}}}]}
  - if: {properties: {status: {const: rejected}}, required: [status]}
    then: {properties: {resultRevision: {type: 'null'}}, allOf: [{properties: {diagnostics: {minItems: 1}}}]}
