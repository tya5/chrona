$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "chrona/style-v0.1"
allOf:
  - $ref: "urn:chrona:presentation-resource-v0.1"
  - type: object
    properties:
      version: {const: chrona/style/v0.1}
      kind: {const: style}
      body:
        type: object
        required: [rules]
        additionalProperties: false
        properties:
          rules:
            type: array
            items:
              type: object
              required: [id, when, addRoles]
              additionalProperties: false
              properties:
                id: {type: string, minLength: 1}
                when:
                  type: object
                  minProperties: 1
                  additionalProperties: false
                  properties:
                    facet: {enum: [planned, actual, missingActual, unmatchedActual, startDelta, finishDelta, atDelta, progress]}
                    sourceType: {enum: [span, point, relation, annotation]}
                    relationKind: {enum: [dependency, explanatory-arrow]}
                    comparisonCategory: {enum: [ahead, on-track, behind, unknown]}
                addRoles:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items: {enum: [planned, actual, actual-missing, variance-ahead, variance-on-track, variance-behind, variance-unknown, dependency, explanatory-arrow, semantic-annotation, presentation-annotation, selected, muted]}
