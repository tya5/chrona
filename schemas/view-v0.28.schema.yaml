$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://chrona.dev/schemas/view-v0.28.schema.yaml"
title: "Chrona View v0.28"
description: "Declarative selection and presentation intent for one review surface."
allOf:
  - $ref: "urn:chrona:presentation-resource-v0.1"
  - description: "View document fields extending the shared presentation resource."
    type: object
    properties:
      version: {description: "This View document contract version.", const: "chrona/view/v0.28"}
      kind: {description: "Resource kind identifying this document as a View.", const: view}
      body:
        description: "Surface selection and presentation semantics."
        type: object
        required: [surface, comparison, visibility, rows]
        additionalProperties: false
        properties:
          surface: {description: "Review surface family.", enum: [table-timeline, dependency-network]}
          colorEncoding:
            type: object
            description: "One closed field-to-colour encoding for eligible planned marks."
            required: [scale, target, source, domain]
            additionalProperties: false
            properties:
              scale: {description: "Named colour scale to apply.", type: string, minLength: 1}
              target: {description: "Only planned marks are colour-encoded.", const: planned}
              source:
                description: "Project field supplying the encoded value."
                type: object
                required: [field]
                additionalProperties: false
                properties: {field: {description: "Project field name.", type: string, minLength: 1}}
              domain:
                description: "Closed set of values admitted by the scale, or firstAppearance to derive it from the selected items in projection order."
                oneOf:
                  - type: array
                    minItems: 1
                    uniqueItems: true
                    items: {description: "One admitted source value.", type: string, minLength: 1}
                  - {description: "Distinct source values of the selected primary items, in projection order.", const: firstAppearance}
          progressFill:
            type: object
            description: "Optional display-only fraction submark source for completed planned or actual marks."
            required: [source]
            additionalProperties: false
            properties:
              source: {description: "The authoritative fraction source.", enum: [actual, planned]}
          selection:
            description: "Objects included in or excluded from automatic rows."
            type: object
            required: [include]
            additionalProperties: false
            properties:
              include:
                description: "Positive selection predicates."
                type: object
                additionalProperties: false
                properties:
                  ids: {description: "Explicit object identifiers.", type: array, uniqueItems: true, items: {description: "One object identifier.", type: string, minLength: 1}}
                  types: {description: "Included scheduling types.", type: array, uniqueItems: true, items: {description: "One scheduling type.", type: string, minLength: 1}}
                  objectTypes: {description: "Included domain object types.", type: array, uniqueItems: true, items: {description: "One domain object type.", type: string, minLength: 1}}
              exclude:
                description: "Negative selection predicates applied after inclusion."
                type: object
                additionalProperties: false
                properties:
                  objectTypes: {description: "Excluded domain object types.", type: array, uniqueItems: true, items: {description: "One excluded domain object type.", type: string, minLength: 1}}
          grouping:
            description: "Automatic-row grouping policy."
            type: object
            required: [by]
            additionalProperties: false
            properties:
              by: {description: "Grouping dimension.", $ref: "urn:chrona:vocabulary-v0.1#/$defs/viewGroupingBy"}
              field: {description: "Project field used when grouping by field.", type: string, minLength: 1}
              order:
                description: "Preferred order of group values, or a data-derived order."
                oneOf:
                  - {type: array, uniqueItems: true, items: {description: "One group value.", type: string, minLength: 1}}
                  - type: object
                    required: [by]
                    additionalProperties: false
                    properties: {by: {description: "Order groups by the earliest planned start among their selected items, then by group value.", const: earliestPlannedStart}}
              missing: {description: "Label for missing field values.", type: string, minLength: 1}
              presentation: {description: "Visual treatment for groups.", enum: [band, header]}
              depth: {description: "Maximum hierarchy depth.", type: integer, minimum: 0}
              rollup: {description: "Hierarchy rollup presentation.", enum: [bar, header, none]}
              header:
                description: "Group-header text template; usable only with presentation header and grouping by field or object type."
                type: object
                required: [text]
                additionalProperties: false
                properties:
                  text: {description: "Literal text with the closed placeholders {ordinal}, {title}, {secondary} and {figure:<id>} (a derived figure the View declares); {{ and }} are literal braces. A placeholder may name a Theme text role, {name|role} (role: a letter then letters, digits, underscore or hyphen): its text is one run in that role's typography and ink on the shared baseline, and unmarked text takes the groupHeader role.", examples: ["{ordinal|group-ordinal} {title}"], type: string, minLength: 1}
                  ordinal: {description: "Form of {ordinal}, the group's 1-based position in display order; arabic when omitted.", enum: [arabic, zero-padded, roman, kanji, kanji-formal]}
                  first: {description: "Template for the first group in display order, with the same placeholders.", type: string, minLength: 1}
                  secondary:
                    description: "Source of {secondary}: a non-empty string in the group entity's fields."
                    type: object
                    required: [entityField]
                    additionalProperties: false
                    properties: {entityField: {description: "Entity field name.", type: string, minLength: 1}}
              tint:
                description: "Per-group band tint: a Theme colour scale over the grouping field's values; usable only when grouping by field."
                type: object
                required: [scale]
                additionalProperties: false
                properties:
                  scale: {description: "Named Theme colour scale applied to each group's band and header band.", type: string, minLength: 1}
                  domain:
                    description: "Closed set of group values admitted by the scale, or firstAppearance (the default) to derive it from the groups in display order."
                    oneOf:
                      - type: array
                        minItems: 1
                        uniqueItems: true
                        items: {description: "One admitted group value.", type: string, minLength: 1}
                      - {description: "Distinct group values in display order.", const: firstAppearance}
            allOf:
              - description: "Field grouping requires its field name and missing-value label."
                examples: [{by: field, field: status, missing: Unset}]
                if: {properties: {by: {const: field}}, required: [by]}
                then: {required: [field, missing]}
              - description: "Hierarchy grouping requires a depth and rollup presentation."
                examples: [{by: hierarchy, depth: 1, rollup: header}]
                if: {properties: {by: {const: hierarchy}}, required: [by]}
                then: {required: [depth, rollup]}
          ordering:
            description: "Deterministic automatic-row ordering."
            type: object
            required: [by, direction, tieBreak]
            additionalProperties: false
            properties:
              by: {description: "Primary ordering key; `source` keeps the order the Project declares its objects in.", enum: [id, title, plannedStart, plannedEnd, source]}
              direction: {description: "Ordering direction.", enum: [ascending, descending]}
              tieBreak: {description: "Stable ordering tie-breaker.", enum: [id, title, plannedStart, plannedFinish, source]}
          window:
            description: "Temporal window selected for the surface."
            type: object
            required: [mode]
            additionalProperties: false
            properties:
              mode: {description: "Window derivation mode.", enum: [explicit, selected-planned, selected-comparison]}
              start: {description: "Inclusive explicit ISO calendar start.", examples: ["2026-01-01"], $ref: "urn:chrona:common-v0.1#/$defs/isoDate"}
              end: {description: "Exclusive explicit ISO calendar end.", examples: ["2026-02-01"], $ref: "urn:chrona:common-v0.1#/$defs/isoDate"}
              marginDays: {description: "Non-negative expansion around a derived window.", type: integer, minimum: 0}
          comparison:
            description: "Baseline, actual, and comparison-facet policy."
            type: object
            required: [baseline, actual, observationSelection, deltaUnit, facets]
            additionalProperties: false
            properties:
              baseline: {description: "Comparison baseline source.", enum: [primary, snapshot, scenario]}
              scenario: {description: "Scenario identifier when scenario is the baseline.", type: string, minLength: 1}
              baselineMarks: {description: "With a snapshot baseline in automatic or lane rows, `ghost` draws the baseline snapshot of each selected item as a ghost mark beside the current one, also under field grouping; `ghost-when-changed` draws it only for an item whose baseline placement differs from its current one. Omitted, no ghost is drawn; explicit rows name their snapshot items themselves.", enum: [ghost, ghost-when-changed], examples: [ghost]}
              missingActualScope: {description: "Which work the missing-actual mark covers. `due-unobserved` (the default) marks a planned finish that has passed with no observation. `in-progress` marks a span that has an actual start and no finish up to the as-of date, drawn as a span in place of its open actual, and marks nothing else (a gate or a span with no observation gets no mark).", enum: [due-unobserved, in-progress], examples: [in-progress]}
              actual: {description: "Requiredness of actual observations.", enum: [forbidden, optional, required]}
              observationSelection: {description: "Only the latest observation is selected.", const: latest}
              deltaUnit: {description: "Comparison delta unit.", const: calendar-days}
              facets: {description: "Comparison facets exposed to the surface.", type: array, uniqueItems: true, items: {description: "One comparison facet.", enum: [planned, actual, startDelta, finishDelta, atDelta, progress, missingActual, unmatchedActual]}}
          visibility:
            description: "Visibility and fallback policy for surface content."
            type: object
            required: [labels, relations, annotations]
            additionalProperties: false
            properties:
              labels:
                oneOf:
                  - {type: boolean}
                  - type: object
                    required: [placement]
                    additionalProperties: false
                    properties:
                      placement: {enum: [plot, table, both, none]}
                      content: {type: array, minItems: 1, uniqueItems: true, items: {enum: [title, finishDelta]}}
                      side: {enum: [auto, above, below, start, end, inside]}
                      overflow: {enum: [suppress, visible-overflow]}
                      textRole: {description: "Named Theme text role in which the plot member labels (the bar labels, outside or inside the bar) are measured and set (#1141): size, weight, letter spacing and transform, `viewerFit` and, when the Theme binds `<role>.fill`, the colour of an outside label. Absent, the labels keep `text`, shared with table cells. A role the Theme does not declare is `E_THEME_ROLE_REQUIRED` at `/body/visibility/labels/textRole`.", examples: [bar-label], type: string, minLength: 1}
              relations:
                oneOf:
                  - {$ref: "urn:chrona:vocabulary-v0.1#/$defs/relationVisibilityMode"}
                  - type: object
                    required: [mode, overflow]
                    additionalProperties: false
                    properties:
                      mode: {enum: [none, semantic, critical]}
                      overflow: {enum: [suppress, visible-overflow]}
                      content: {description: "Ordered optional relation-label facts; absence selects no labels.", type: array, uniqueItems: true, items: {enum: [lag, endpointPair]}}
              annotations:
                oneOf:
                  - {$ref: "urn:chrona:vocabulary-v0.1#/$defs/annotationVisibilityMode"}
                  - type: object
                    required: [mode, marker]
                    additionalProperties: false
                    properties:
                      mode: {$ref: "urn:chrona:vocabulary-v0.1#/$defs/annotationVisibilityMode"}
                      marker: {enum: [none, numbered]}
              links: {enum: [none, title, row]}
              fallback:
                type: object
                additionalProperties: false
                properties:
                  labels: {type: array, minItems: 1, uniqueItems: true, items: {enum: [above, below, start, end, inside, suppress]}}
                  annotations: {type: array, minItems: 1, uniqueItems: true, items: {enum: [above, below, start, end, rail, suppress]}}
          axis:
            type: object
            required: [tiers]
            additionalProperties: false
            properties:
              tiers:
                type: array
                minItems: 1
                items:
                  type: object
                  required: [unit, every, role]
                  additionalProperties: false
                  properties:
                    unit: {enum: [auto, day, week, month, quarter, half, year]}
                    every: {type: integer, minimum: 1}
                    role: {enum: [band, labels, grid-major, grid-minor]}
                    fillScale: {$ref: "#/$defs/axisBandFillScale"}
                    label: {}
                    typographyRole: {description: "Named Theme text-treatment role used to measure this tier and size its lane. Visual paint for a labels tier uses its ordinal axisLabel role, independently of this measurement role. Defaults to axis.", type: string, minLength: 1}
                  dependentSchemas:
                    fillScale:
                      description: "Only a fixed-unit band tier can declare interval paint."
                      properties:
                        role: {const: band}
                        unit: {enum: [day, week, month, quarter, half, year]}
                  allOf:
                    - description: "Only a band or labels tier may bind a typography role for lane sizing."
                      examples: [{unit: quarter, every: 1, role: band, typographyRole: axisQuarter}]
                      if: {properties: {role: {enum: [grid-major, grid-minor]}}, required: [role]}
                      then: {not: {required: [typographyRole]}}
                    - description: "Only a labels tier owns a label declaration."
                      examples: [{unit: month, every: 1, role: labels, label: {form: short-month, align: start, overflow: visible-overflow, orientation: horizontal}}]
                      if: {properties: {role: {const: labels}}, required: [role]}
                      then: {required: [label]}
                      else: {not: {required: [label]}}
                    - description: "A labels tier with a secondary label needs a horizontal primary; rotated text has no agreed stacking."
                      examples: [{unit: month, every: 1, role: labels, label: {form: short-month, align: center, overflow: thin-with-record, orientation: horizontal, secondary: {form: short-month, typographyRole: axisSecondary, placement: stacked}}}]
                      if: {properties: {label: {required: [secondary]}}, required: [label]}
                      then: {properties: {label: {properties: {orientation: {const: horizontal}}}}}
                    - description: "Automatic unit selection is available only for labels."
                      examples: [{unit: auto, every: 1, role: labels, label: {forms: {month: short-month}, align: start, overflow: visible-overflow, orientation: horizontal}}]
                      if: {properties: {unit: {const: auto}}, required: [unit]}
                      then: {properties: {role: {const: labels}}}
                    - description: "Day labels use the localized-date form."
                      examples: [{unit: day, every: 1, role: labels, label: {form: localized-date, align: start, overflow: visible-overflow, orientation: horizontal}}]
                      if: {properties: {unit: {const: day}, role: {const: labels}}, required: [unit, role]}
                      then: {properties: {label: {type: object, required: [form, align, overflow, orientation], additionalProperties: false, properties: {form: {const: localized-date}, align: {enum: [start, center]}, overflow: {enum: [visible-overflow, thin-with-record]}, orientation: {description: "Finite orientation of the label text block; Layout selects its completed rotation.", enum: [horizontal, rotate-cw, rotate-ccw]}, nameTable: {description: "Exact built-in axis name-table ID; defaults to Render Context locale.", enum: [en-US, ja-JP]}, secondary: {description: "Optional secondary label of the same interval, drawn in the same cell (#493).", $ref: "#/$defs/axisSecondaryLabel", properties: {form: {const: localized-date}}}}}}}
                    - description: "Week labels use ISO week numbers."
                      examples: [{unit: week, every: 1, role: labels, label: {form: iso-week, align: start, overflow: visible-overflow, orientation: horizontal}}]
                      if: {properties: {unit: {const: week}, role: {const: labels}}, required: [unit, role]}
                      then: {properties: {label: {type: object, required: [form, align, overflow, orientation], additionalProperties: false, properties: {form: {const: iso-week}, align: {enum: [start, center]}, overflow: {enum: [visible-overflow, thin-with-record]}, orientation: {description: "Finite orientation of the label text block; Layout selects its completed rotation.", enum: [horizontal, rotate-cw, rotate-ccw]}, nameTable: {description: "Exact built-in axis name-table ID; defaults to Render Context locale.", enum: [en-US, ja-JP]}, secondary: {description: "Optional secondary label of the same interval, drawn in the same cell (#493).", $ref: "#/$defs/axisSecondaryLabel", properties: {form: {const: iso-week}}}}}}}
                    - description: "Month labels select one finite month form."
                      examples: [{unit: month, every: 1, role: labels, label: {form: short-month, align: start, overflow: visible-overflow, orientation: horizontal}}]
                      if: {properties: {unit: {const: month}, role: {const: labels}}, required: [unit, role]}
                      then: {properties: {label: {type: object, required: [form, align, overflow, orientation], additionalProperties: false, properties: {form: {$ref: "urn:chrona:vocabulary-v0.1#/$defs/monthLabelForm"}, align: {enum: [start, center]}, overflow: {enum: [visible-overflow, thin-with-record]}, orientation: {description: "Finite orientation of the label text block; Layout selects its completed rotation.", enum: [horizontal, rotate-cw, rotate-ccw]}, nameTable: {description: "Exact built-in axis name-table ID; defaults to Render Context locale.", enum: [en-US, ja-JP]}, secondary: {description: "Optional secondary label of the same interval, drawn in the same cell (#493).", $ref: "#/$defs/axisSecondaryLabel", properties: {form: {$ref: "urn:chrona:vocabulary-v0.1#/$defs/monthLabelForm"}}}}}}}
                    - description: "Quarter labels select one finite quarter form."
                      examples: [{unit: quarter, every: 1, role: labels, label: {form: year-quarter, align: center, overflow: visible-overflow, orientation: horizontal}}]
                      if: {properties: {unit: {const: quarter}, role: {const: labels}}, required: [unit, role]}
                      then: {properties: {label: {type: object, required: [form, align, overflow, orientation], additionalProperties: false, properties: {form: {$ref: "urn:chrona:vocabulary-v0.1#/$defs/quarterLabelForm"}, align: {enum: [start, center]}, overflow: {enum: [visible-overflow, thin-with-record]}, orientation: {description: "Finite orientation of the label text block; Layout selects its completed rotation.", enum: [horizontal, rotate-cw, rotate-ccw]}, nameTable: {description: "Exact built-in axis name-table ID; defaults to Render Context locale.", enum: [en-US, ja-JP]}, secondary: {description: "Optional secondary label of the same interval, drawn in the same cell (#493).", $ref: "#/$defs/axisSecondaryLabel", properties: {form: {$ref: "urn:chrona:vocabulary-v0.1#/$defs/quarterLabelForm"}}}}}}}
                    - description: "Half-year labels use the fiscal half-year form."
                      examples: [{unit: half, every: 1, role: labels, label: {form: half-year, align: center, overflow: visible-overflow, orientation: horizontal}}]
                      if: {properties: {unit: {const: half}, role: {const: labels}}, required: [unit, role]}
                      then: {properties: {label: {type: object, required: [form, align, overflow, orientation], additionalProperties: false, properties: {form: {const: half-year}, align: {enum: [start, center]}, overflow: {enum: [visible-overflow, thin-with-record]}, orientation: {description: "Finite orientation of the label text block; Layout selects its completed rotation.", enum: [horizontal, rotate-cw, rotate-ccw]}, nameTable: {description: "Exact built-in axis name-table ID; defaults to Render Context locale.", enum: [en-US, ja-JP]}, secondary: {description: "Optional secondary label of the same interval, drawn in the same cell (#493).", $ref: "#/$defs/axisSecondaryLabel", properties: {form: {const: half-year}}}}}}}
                    - description: "Year labels use the year form."
                      examples: [{unit: year, every: 1, role: labels, label: {form: year, align: center, overflow: visible-overflow, orientation: horizontal}}]
                      if: {properties: {unit: {const: year}, role: {const: labels}}, required: [unit, role]}
                      then: {properties: {label: {type: object, required: [form, align, overflow, orientation], additionalProperties: false, properties: {form: {const: year}, align: {enum: [start, center]}, overflow: {enum: [visible-overflow, thin-with-record]}, orientation: {description: "Finite orientation of the label text block; Layout selects its completed rotation.", enum: [horizontal, rotate-cw, rotate-ccw]}, nameTable: {description: "Exact built-in axis name-table ID; defaults to Render Context locale.", enum: [en-US, ja-JP]}, secondary: {description: "Optional secondary label of the same interval, drawn in the same cell (#493).", $ref: "#/$defs/axisSecondaryLabel", properties: {form: {const: year}}}}}}}
                    - description: "Automatic labels declare their allowed concrete forms."
                      examples: [{unit: auto, every: 1, role: labels, label: {forms: {month: short-month}, align: start, overflow: thin-with-record, orientation: horizontal}}]
                      if: {properties: {unit: {const: auto}, role: {const: labels}}, required: [unit, role]}
                      then:
                        properties:
                          label:
                            type: object
                            required: [forms, align, overflow, orientation]
                            additionalProperties: false
                            properties:
                              forms:
                                type: object
                                minProperties: 1
                                additionalProperties: false
                                properties:
                                  day: {const: localized-date}
                                  week: {const: iso-week}
                                  month: {$ref: "urn:chrona:vocabulary-v0.1#/$defs/monthLabelForm"}
                                  quarter: {$ref: "urn:chrona:vocabulary-v0.1#/$defs/quarterLabelForm"}
                                  half: {const: half-year}
                                  year: {const: year}
                              align: {enum: [start, center]}
                              overflow: {enum: [visible-overflow, thin-with-record]}
                              orientation: {description: "Finite orientation of the label text block; Layout selects its completed rotation.", enum: [horizontal, rotate-cw, rotate-ccw]}
                              nameTable: {description: "Exact built-in axis name-table ID; defaults to Render Context locale.", enum: [en-US, ja-JP]}
          markers:
            type: array
            items:
              type: object
              required: [kind, source, label]
              additionalProperties: false
              properties:
                kind: {const: asOf}
                source: {const: actual}
                label: {description: "The marker label, rendered exactly as written unless a date form is declared.", type: string}
                date:
                  description: "Optional date appended to the label, formatted like an axis localized-date label."
                  type: object
                  required: [form]
                  additionalProperties: false
                  properties:
                    form: {description: "The date form: the localized date (`Aug 20, 2027`), the day and short month (`20 Aug`) or the day, short month and year (`20 Aug 2027`).", enum: [localized-date, day-month, day-month-year]}
                    nameTable: {description: "Exact built-in axis name-table ID; defaults to Render Context locale.", enum: [en-US, ja-JP]}
                placement: {description: "Where the label sits on the plot: the top margin (default), the plot foot (centred on the rule above the last row) or below the plot (centred on the rule under the last row, in a block Layout reserves; with no room it falls back to the foot with a diagnostic).", enum: [top, foot, below-plot], examples: [below-plot]}
          periods:
            description: "Named Project periods drawn as bands across the plot, in paint order of declaration; absent selects none."
            type: array
            items:
              description: "One selected Project period."
              examples: [{id: launch-window}]
              type: object
              required: [id]
              additionalProperties: false
              properties:
                id: {description: "Identifier of a period declared in the Project's `periods`.", type: string, minLength: 1}
                label:
                  description: "Optional label of the band, its text the period title or the `text` override; absent draws the band without a label."
                  examples: [{placement: top, overflow: suppress}]
                  type: object
                  required: [placement]
                  additionalProperties: false
                  properties:
                    placement: {description: "Where the label sits: at the plot's top edge, at its bottom edge, or centred in the band.", enum: [top, bottom, inside]}
                    overflow: {description: "What happens when no collision-free position exists: suppress the label with a recorded warning, or place it anyway with a recorded overflow. Defaults to visible-overflow.", enum: [suppress, visible-overflow]}
                    text: {description: "Optional display text of the label, replacing the Project period title for this View only (the Theme role's text transform styles it); absent shows the period title.", $ref: "urn:chrona:common-v0.1#/$defs/literalCaption", examples: [OPENING NIGHT]}
                    template: {description: "Optional closed figure template instead of literal text: {figure:id} reads a global View figure; {{ and }} escape braces. Mutually exclusive with text.", $ref: "urn:chrona:common-v0.1#/$defs/literalCaption", examples: ["WINDOW CLOSES IN {figure:closing} DAYS"]}
          figures:
            description: "Derived integer figures: signed days from declared dates or neutral projected counts, shown by name in Summary, group headers and declared label templates; absent declares none."
            examples: [[{id: launch-countdown, kind: daysUntil, to: {period: launch-window, side: start}}]]
            type: array
            items:
              oneOf:
                - $ref: "#/$defs/figureDaysUntil"
                - $ref: "#/$defs/figureDaysIn"
                - $ref: "#/$defs/figureCount"
          heading:
            description: "The optional kicker above the title, the title, and optional subtitle lines of a table-timeline surface (a dependency network ignores it), each a template of literal text and the placeholders {project} (the Project title), {asOf} (the Actual Set's as-of date in dateForm) and {calendar} (the Project's default calendar title, else its id); {{ and }} are literal braces. Absent, the title is the Project title and there is no kicker or subtitle."
            examples: [{kicker: "Episode {asOf}", title: "{project}", subtitle: "Every work package by owning team, as of {asOf}, calendar {calendar}"}]
            type: object
            minProperties: 1
            additionalProperties: false
            properties:
              kicker: {description: "The optional template drawn above the title in the Theme's `kicker` typography role.", type: string, minLength: 1, examples: ["第弐面"]}
              title: {description: "The title template; a Project without a title shows `Chrona`.", type: string, minLength: 1, examples: ["{project} programme board"]}
              subtitle: {description: "The subtitle template, drawn under the title in the Theme's `subtitle` typography role.", type: string, minLength: 1, examples: ["as of {asOf}"]}
              dateForm: {description: "The form of {asOf}; absent is the localized date.", enum: [localized-date, day-month, day-month-year]}
          slotHeadingText:
            description: "Optional literal caption replacements keyed by resolved Layout slot node ID. Each target must already declare a heading; only its text is replaced."
            type: object
            propertyNames: {$ref: "urn:chrona:common-v0.1#/$defs/identifier"}
            additionalProperties: {$ref: "urn:chrona:common-v0.1#/$defs/literalCaption"}
          deadlines:
            description: "Draws each object's Project deadline as a tick at its date and, when the planned finish is later, a run from the tick to that finish; absent draws none."
            examples: [{show: slipped}]
            type: object
            required: [show]
            additionalProperties: false
            properties:
              show: {description: "Which deadlines are drawn: only those the plan misses (slipped), or every deadline (all), the missed ones with their run.", enum: [slipped, all]}
          shading:
            type: object
            additionalProperties: false
            properties:
              nonWorking: {type: boolean}
              exceptions: {type: boolean}
          timePresentation:
            type: object
            additionalProperties: false
            properties:
              asOf: {enum: [hidden, line]}
              calendarClosed: {type: boolean}
          annotationPresentation: {enum: [plain, numbered]}
          visuals:
            description: "Closed icon requests resolved by Layout against Context-local catalogs."
            type: array
            items: {$ref: "https://chrona.dev/schemas/view-v0.28.schema.yaml#/$defs/visual"}
          hierarchyColumn:
            description: "Named table column that receives resolved row nesting indentation."
            type: string
            minLength: 1
          backgroundDecoration:
            description: "Independent finite row and group decoration selections for completed table--timeline surfaces."
            type: object
            required: [rows, groups]
            additionalProperties: false
            properties:
              rows: {enum: [none, alternate, rules]}
              groups: {enum: [none, all, alternate]}
          tableColumns:
            type: array
            minItems: 1
            uniqueItems: true
            items:
              type: object
              required: [id, source, missing, align, width, headerOrientation]
              additionalProperties: false
              properties:
                id: {type: string, minLength: 1}
                source:
                  oneOf:
                    - {enum: [id, title, objectType, entity, rowIndex, wbsCode, path, totalFloat]}
                    - type: object
                      required: [field]
                      additionalProperties: false
                      properties: {field: {type: string, minLength: 1}}
                    - type: object
                      required: [comparisonFacet]
                      additionalProperties: false
                      properties: {comparisonFacet: {enum: [startDelta, finishDelta, atDelta, progress, missingActual]}}
                    - type: object
                      required: [facet]
                      additionalProperties: false
                      properties: {facet: {enum: [planned, actual, finishDelta]}}
                    - type: object
                      required: [scenario]
                      additionalProperties: false
                      properties: {scenario: {enum: [id, title]}}
                format:
                  description: "Closed scalar formatter or an explicit boolean presence presentation."
                  oneOf:
                    - {$ref: "urn:chrona:vocabulary-v0.1#/$defs/tableColumnScalarFormat"}
                    - {description: "A signed whole number with no unit (`+10`, `+0`, `-3`; #588). The shared vocabulary part is frozen, so this one value is declared here until the part has a new version.", const: signedNumber}
                    - type: object
                      required: [kind, whenTrue, whenFalse]
                      additionalProperties: false
                      properties:
                        kind: {const: presence}
                        whenTrue: {description: "Text rendered for boolean true; an empty string is intentional.", type: string}
                        whenFalse: {description: "Text rendered for boolean false; an empty string is intentional.", type: string}
                missing:
                  description: "The text of an absent value: `blank`, `em-dash`, `unknown`, `in-progress`, or an author-chosen literal `{text}` shown exactly as written (#1288)."
                  oneOf:
                    - {enum: [blank, em-dash, unknown, in-progress]}
                    - {$ref: "#/$defs/missingText"}
                missingBy:
                  description: "The text of an absent value by the item's observation state (#991), each taking the values of `missing` that need no actual source; a state not named keeps `missing`. `inProgress` is a span with an actual start and no finish, `dueUnobserved` a due item with no observation, `notYetDue` an item still before its due date, `unavailable` one with no as-of date or due date."
                  examples: [{inProgress: em-dash, dueUnobserved: blank, notYetDue: blank}]
                  type: object
                  minProperties: 1
                  additionalProperties: false
                  properties:
                    inProgress:
                      oneOf:
                        - {enum: [blank, em-dash, unknown]}
                        - {$ref: "#/$defs/missingText"}
                    dueUnobserved:
                      oneOf:
                        - {enum: [blank, em-dash, unknown]}
                        - {$ref: "#/$defs/missingText"}
                    notYetDue:
                      oneOf:
                        - {enum: [blank, em-dash, unknown]}
                        - {$ref: "#/$defs/missingText"}
                    unavailable:
                      oneOf:
                        - {enum: [blank, em-dash, unknown]}
                        - {$ref: "#/$defs/missingText"}
                affixes:
                  description: "Per-state text affixes (#588) wrapped around the formatted cell text: slip, onTime and ahead for a signed format (a value above, at and below zero), missing for an absent value. Absent, the cell is the formatted text."
                  examples: [{slip: {suffix: "!"}, missing: {suffix: "?"}}]
                  type: object
                  minProperties: 1
                  additionalProperties: false
                  properties:
                    slip: {$ref: "#/$defs/columnAffix"}
                    onTime: {$ref: "#/$defs/columnAffix"}
                    ahead: {$ref: "#/$defs/columnAffix"}
                    missing: {$ref: "#/$defs/columnAffix"}
                textRole: {description: "Named Theme text role in which this column's cells are measured and set (#1062): its size, weight, letter spacing and transform, and, when the Theme binds `<role>.fill`, the colour of a plain cell. A state-coloured cell (variance, missing actual) keeps its own ink. Absent, the cells keep `text` (`numeric` for a signed format). A role the Theme does not declare is `E_THEME_ROLE_REQUIRED`.", examples: [table-cell-secondary], type: string, minLength: 1}
                align: {description: "Inline alignment inside the measured column allocation.", enum: [start, center, end]}
                headerOrientation: {description: "Finite orientation of this column header; table cells remain horizontal.", enum: [horizontal, rotate-cw, rotate-ccw]}
                width:
                  description: "Table subset of the Layout logical size grammar for this measured column."
                  oneOf:
                    - {enum: [content, fill]}
                    - {$ref: "urn:chrona:common-v0.1#/$defs/fractionalTrack"}
                    - type: object
                      required: [minmax]
                      additionalProperties: false
                      properties:
                        minmax:
                          type: object
                          required: [min, max]
                          additionalProperties: false
                          properties:
                            min: {enum: [content]}
                            max:
                              oneOf:
                                - {enum: [content, fill]}
                                - {$ref: "urn:chrona:common-v0.1#/$defs/fractionalTrack"}
          annotations:
            type: array
            items:
              type: object
              required: [id, purpose, anchor]
              additionalProperties: false
              properties:
                id: {type: string, minLength: 1}
                purpose: {$ref: "urn:chrona:vocabulary-v0.1#/$defs/annotationPurpose"}
                anchor:
                  type: object
                  required: [kind, id, facet, endpoint]
                  additionalProperties: false
                  properties:
                    kind: {const: object}
                    id: {type: string, minLength: 1}
                    facet: {enum: [planned, actual]}
                    endpoint: {$ref: "urn:chrona:vocabulary-v0.1#/$defs/anchorEndpoint"}
                    rowId: {type: string, minLength: 1}
                    itemId: {type: string, minLength: 1}
                    date: {$ref: "urn:chrona:common-v0.1#/$defs/isoDate"}
                placement:
                  description: "The old rung spelling: one flush side of the anchor. Kept valid alongside candidates (#466); an annotation uses exactly one spelling."
                  type: object
                  required: [side, alignment]
                  additionalProperties: false
                  properties:
                    side: {$ref: "urn:chrona:vocabulary-v0.1#/$defs/annotationSide"}
                    alignment: {$ref: "urn:chrona:vocabulary-v0.1#/$defs/annotationAlignment"}
                candidates:
                  description: "The declared placement-candidate list: region, search, obstacles and connector (#466). An annotation uses exactly one spelling."
                  type: array
                  minItems: 1
                  items:
                    description: "One declared annotation placement candidate: region, search, obstacles and connector (#466)."
                    examples: [{id: plot-near, region: {kind: plot}, search: {kind: nearest-free, maxPositions: 256, maxInlineEm: 18}, obstacles: {classes: [mark, text, label-visual, dependency-route, leader-route, annotation-box, port, rule]}, connector: {kind: tail}}]
                    type: object
                    required: [id, region, search, obstacles, connector]
                    additionalProperties: false
                    properties:
                      id: {description: "Candidate identifier, unique per annotation and stable in diagnostics.", type: string, minLength: 1}
                      region:
                        description: "The area this candidate's box may occupy."
                        examples: [{kind: plot}]
                        type: object
                        required: [kind]
                        additionalProperties: false
                        properties:
                          kind: {description: "Region kind.", enum: [plot, content, slot, intersection]}
                          source: {description: "The named slot source, required only for a slot region.", type: string, minLength: 1}
                          of:
                            description: "The exactly two named simple (non-intersection) regions an intersection region combines."
                            type: array
                            minItems: 2
                            maxItems: 2
                            items:
                              description: "One simple region combined by an intersection."
                              examples: [{kind: plot}]
                              type: object
                              required: [kind]
                              additionalProperties: false
                              properties:
                                kind: {description: "Region kind.", enum: [plot, content, slot]}
                                source: {description: "The named slot source, required only for a slot region.", type: string, minLength: 1}
                              allOf:
                                - description: "A slot region names its source slot."
                                  examples: [{kind: slot, source: annotations}]
                                  if: {properties: {kind: {const: slot}}, required: [kind]}
                                  then: {required: [source]}
                        allOf:
                          - description: "A slot region names its source slot."
                            examples: [{kind: slot, source: annotations}]
                            if: {properties: {kind: {const: slot}}, required: [kind]}
                            then: {required: [source]}
                          - description: "Only an intersection region combines two named regions."
                            examples: [{kind: intersection, of: [{kind: plot}, {kind: slot, source: annotations}]}]
                            if: {properties: {kind: {const: intersection}}, required: [kind]}
                            then: {required: [of]}
                            else: {not: {required: [of]}}
                      search:
                        description: "How positions inside the region are generated and ordered."
                        examples: [{kind: nearest-free, maxPositions: 256, maxInlineEm: 18}]
                        type: object
                        required: [kind]
                        additionalProperties: false
                        properties:
                          kind: {description: "Search strategy.", enum: [row-aligned, adjacent, nearest-free]}
                          side: {description: "The one logical side an adjacent search projects from.", $ref: "urn:chrona:vocabulary-v0.1#/$defs/annotationSide"}
                          maxPositions: {description: "Bounded lattice size examined by a nearest-free search.", type: integer, minimum: 1, maximum: 1024}
                          maxInlineEm: {description: "Positive finite text-width bound for a plot/content search, in em.", type: number, exclusiveMinimum: 0}
                        allOf:
                          - description: "An adjacent search must declare its one logical side."
                            examples: [{kind: adjacent, side: end}]
                            if: {properties: {kind: {const: adjacent}}, required: [kind]}
                            then: {required: [side]}
                          - description: "maxInlineEm bounds only a nearest-free search."
                            examples: [{kind: row-aligned}]
                            if: {properties: {kind: {not: {const: nearest-free}}}, required: [kind]}
                            then: {not: {required: [maxInlineEm]}}
                      obstacles:
                        description: "The nonempty closed set of obstacle-index classes this candidate must avoid."
                        examples: [{classes: [mark, text, label-visual, dependency-route, leader-route, annotation-box, port, rule]}]
                        type: object
                        required: [classes]
                        additionalProperties: false
                        properties:
                          classes:
                            description: "One or more obstacle-index classes."
                            type: array
                            minItems: 1
                            uniqueItems: true
                            items: {description: "One shared obstacle-index class.", enum: [mark, text, label-visual, dependency-route, leader-route, annotation-box, port, rule]}
                      connector:
                        description: "How the box points at its subject."
                        examples: [{kind: tail}]
                        type: object
                        required: [kind]
                        additionalProperties: false
                        properties:
                          kind: {description: "Connector kind.", enum: [none, leader, tail]}
                text: {description: "View-local annotation text.", type: string}
                projectAnnotation: {description: "A stable Project annotation identifier this View annotation selects text from (#466); consumed once, never duplicated into the notes slot.", type: string, minLength: 1}
              allOf:
                - description: "An annotation uses exactly one placement spelling: the old rung, or the declared candidate list."
                  examples: [{id: note-1, purpose: note, anchor: {kind: object, id: window, facet: planned, endpoint: at}, placement: {side: end, alignment: start}, text: "Window closes."}]
                  oneOf:
                    - required: [placement]
                      not: {required: [candidates]}
                    - required: [candidates]
                      not: {required: [placement]}
                - description: "An annotation uses exactly one text source: View-local text, or a selected Project annotation."
                  examples: [{id: note-1, purpose: note, anchor: {kind: object, id: window, facet: planned, endpoint: at}, placement: {side: end, alignment: start}, text: "Window closes."}]
                  oneOf:
                    - required: [text]
                      not: {required: [projectAnnotation]}
                    - required: [projectAnnotation]
                      not: {required: [text]}
          rows:
            type: object
            required: [mode]
            additionalProperties: false
            properties:
              mode: {enum: [automatic, explicit, lanes]}
              trackAllocation: {description: "Explicit rows retain member_index stacking unless collision allocation is explicitly selected.", enum: [collision]}
              packing:
                description: "Canonical-order, duplicate-free lane assignment rules. chain and dates are opt-in."
                type: array
                default: [explicit, attached]
                enum:
                  - []
                  - [explicit]
                  - [attached]
                  - [chain]
                  - [dates]
                  - [explicit, attached]
                  - [explicit, chain]
                  - [explicit, dates]
                  - [attached, chain]
                  - [attached, dates]
                  - [chain, dates]
                  - [explicit, attached, chain]
                  - [explicit, attached, dates]
                  - [explicit, chain, dates]
                  - [attached, chain, dates]
                  - [explicit, attached, chain, dates]
              laneKeys:
                description: "View-selected sources for explicit lane keys; keys are scoped to the resolved group."
                type: object
                additionalProperties: false
                properties:
                  field: {description: "Project object fields key read as a lane key.", type: string, minLength: 1}
                  byObject:
                    description: "Explicit lane keys by selected Project object ID."
                    type: object
                    additionalProperties: {type: string, minLength: 1}
                anyOf:
                  - required: [field]
                  - required: [byObject]
              laneTable:
                description: "Finite group/lane summary columns for generated lane rows."
                type: object
                required: [label]
                additionalProperties: false
                properties:
                  label: {enum: [group, lane]}
                  count: {type: boolean, default: false}
              points: {description: "Automatic-row point policy; attached (the default) draws a point that attachesTo a selected span on that span's row.", enum: [attached, own-row, group-header, predecessor]}
              items:
                type: array
                minItems: 1
                items:
                  type: object
                  required: [id, depth, items]
                  additionalProperties: false
                  properties:
                    id: {type: string, minLength: 1}
                    label: {type: string, minLength: 1}
                    depth: {type: integer, minimum: 0}
                    parentRow: {type: string, minLength: 1}
                    group: {type: string, minLength: 1}
                    tableSubject: {type: string, minLength: 1}
                    presentation: {$ref: "#/$defs/presentationIntent"}
                    items:
                      type: array
                      minItems: 1
                      items:
                        type: object
                        required: [id, source]
                        additionalProperties: false
                        properties:
                          id: {type: string, minLength: 1}
                          track: {enum: [stacked, shared]}
                          presentation: {$ref: "#/$defs/presentationIntent"}
                          source:
                            type: object
                            required: [kind, object]
                            additionalProperties: false
                            properties:
                              kind: {enum: [primary, snapshot, scenario, actual]}
                              object: {type: string, minLength: 1}
                              scenario: {type: string, minLength: 1}
            allOf:
              - description: "Automatic rows derive rows and cannot declare explicit items."
                examples: [{mode: automatic}]
                if: {properties: {mode: {const: automatic}}}
                then: {not: {anyOf: [{required: [items]}, {required: [laneTable]}, {required: [packing]}, {required: [laneKeys]}]}}
              - description: "Explicit rows require items and cannot use automatic point policy."
                examples: [{mode: explicit, items: []}]
                if: {properties: {mode: {const: explicit}}}
                then:
                  required: [items]
                  not: {anyOf: [{required: [points]}, {required: [laneTable]}, {required: [packing]}, {required: [laneKeys]}]}
              - description: "Generated lanes use derived selection and prohibit authored rows, explicit track policy, and automatic point folding."
                examples: [{mode: lanes, laneTable: {label: group}}]
                if: {properties: {mode: {const: lanes}}, required: [mode]}
                then:
                  required: [laneTable]
                  not: {anyOf: [{required: [items]}, {required: [points]}, {required: [trackAllocation]}]}
              - description: "Collision track allocation is an explicit-row opt-in only."
                examples: [{mode: explicit, items: [], trackAllocation: collision}]
                if: {properties: {trackAllocation: {const: collision}}, required: [trackAllocation]}
                then: {properties: {mode: {const: explicit}}}
        allOf:
          - description: "Automatic rows require selection, grouping, ordering, and a window."
            examples: [{rows: {mode: automatic}, selection: {}, grouping: {}, ordering: {}, window: {}}]
            if: {properties: {rows: {properties: {mode: {const: automatic}}, required: [mode]}}}
            then: {required: [selection, grouping, ordering, window]}
          - description: "Scenario comparison requires a scenario identifier."
            examples: [{comparison: {baseline: scenario, scenario: baseline}}]
            if: {properties: {comparison: {properties: {baseline: {const: scenario}}, required: [baseline]}}}
            then: {properties: {comparison: {required: [scenario]}}}
          - description: "Explicit rows prohibit automatic selection, grouping, and ordering."
            examples: [{rows: {mode: explicit}, window: {}}]
            if: {properties: {rows: {properties: {mode: {const: explicit}}, required: [mode]}}}
            then: {not: {anyOf: [{required: [selection]}, {required: [grouping]}, {required: [ordering]}]}, required: [window]}
          - description: "Lane rows require plot names; side, content and suppress overflow have lane defaults without weakening non-lane declarations."
            examples: [{surface: table-timeline, rows: {mode: lanes, laneTable: {label: group}}, selection: {}, grouping: {}, ordering: {}, window: {}, visibility: {labels: {placement: plot, content: [title], side: inside}, fallback: {labels: [inside, end, suppress]}}}]
            if: {properties: {rows: {properties: {mode: {const: lanes}}, required: [mode]}}, required: [rows]}
            then:
              required: [selection, grouping, ordering, window, visibility]
              properties:
                surface: {const: table-timeline}
                grouping:
                  not: {properties: {by: {const: hierarchy}}, required: [by]}
                visibility:
                  required: [labels]
                  properties:
                    labels:
                      type: object
                      required: [placement]
                      properties:
                        placement: {const: plot}
                        content: {contains: {const: title}}
                        overflow: {const: suppress}
              not: {anyOf: [{required: [hierarchyColumn]}, {required: [tableColumns]}]}
            else:
              properties:
                visibility:
                  properties:
                    labels:
                      if: {type: object}
                      then: {required: [content, side]}
          - description: "A dependency network omits table-timeline-only presentation fields."
            examples: [{surface: dependency-network}]
            if: {properties: {surface: {const: dependency-network}}, required: [surface]}
            then:
              not:
                anyOf:
                  - {required: [tableColumns]}
                  - {required: [hierarchyColumn]}
                  - {required: [backgroundDecoration]}
                  - {required: [axis]}
                  - {required: [markers]}
                  - {required: [periods]}
                  - {required: [deadlines]}
                  - {required: [shading]}
                  - {required: [timePresentation]}
                  - {required: [annotations]}
                  - {required: [annotationPresentation]}
$defs:
  axisBandFillScale:
    description: "Optional Theme colour scale used to fill a fixed-unit band tier."
    examples: [{scale: phase, key: interval, containingTier: 0}]
    type: object
    required: [scale, key]
    additionalProperties: false
    properties:
      scale: {description: "Exact Theme colour-scale identifier.", type: string, minLength: 1}
      key: {description: "Derive paint from this tier's alternating parity or interval ordinal.", enum: [alternating, interval]}
      containingTier: {description: "Optional index of the declared coarser fixed-unit band tier whose natural interval contains this one.", type: integer, minimum: 0}
  missingText:
    description: "An author-chosen literal for an absent table value: one to eight characters with no control character, drawn exactly as written in the column's text role (#1288). `affixes.missing` still wraps whatever the absent text is, in every absent state."
    examples: [{text: "?"}]
    type: object
    required: [text]
    additionalProperties: false
    properties:
      text: {description: "The literal shown in place of the absent value; no control character.", examples: ["?"], type: string, minLength: 1, maxLength: 8, not: {pattern: "[\\u0000-\\u001f\\u007f]"}}
  columnAffix:
    description: "A literal prefix and suffix of one to eight characters wrapped around a table cell's text in one state (#588); at least one is declared."
    examples: [{suffix: "!"}]
    type: object
    minProperties: 1
    additionalProperties: false
    properties:
      prefix: {description: "Literal text before the cell text.", type: string, minLength: 1, maxLength: 8}
      suffix: {description: "Literal text after the cell text.", type: string, minLength: 1, maxLength: 8}
  axisSecondaryLabel:
    description: "A second form of the same axis interval, drawn smaller in the same cell as the tier's main label and fitted by Layout; omitted with a record when it does not fit."
    examples: [{form: short-month, nameTable: en-US, typographyRole: axisSecondary, placement: stacked}]
    type: object
    required: [form, typographyRole, placement]
    additionalProperties: false
    properties:
      form: {description: "A label form valid for the tier's unit; the unit's branch narrows it to that unit's forms.", type: string}
      nameTable: {description: "Exact built-in axis name-table ID; defaults as the main label's does.", enum: [en-US, ja-JP]}
      typographyRole: {description: "Named Theme text-treatment role measuring and sizing the secondary text; its colour is the tier's.", type: string, minLength: 1}
      placement: {description: "stacked draws it on the line below the main label; inline draws it after the main label on the same baseline.", enum: [stacked, inline]}
  figureFact:
    description: "One fact a figure reads: the Actual Set as-of, a named period's start, exclusive end or final covered day, an object's placed endpoint, or the current selected group's first planned start."
    examples: [asOf, {period: launch-window, side: start}, {period: launch-window, side: last}, {object: tvac, endpoint: end}]
    oneOf:
      - {description: "The Actual Set as-of date.", const: asOf}
      - description: "A named Project period's boundary or final covered calendar day."
        type: object
        required: [period, side]
        additionalProperties: false
        properties:
          period: {description: "Identifier of a period declared in the Project's `periods`.", type: string, minLength: 1}
          side: {description: "The period's start, exclusive end, or last covered calendar day (end minus one day).", enum: [start, end, last]}
      - description: "The completed (placed) date of one endpoint of a Project object."
        type: object
        required: [object, endpoint]
        additionalProperties: false
        properties:
          object: {description: "Identifier of a Project object.", type: string, minLength: 1}
          endpoint: {description: "The endpoint the object's schedule offers: at for a point, start or end for a span.", $ref: "urn:chrona:vocabulary-v0.1#/$defs/dateEndpoint"}
      - description: "The earliest selected Primary planned start or point of the current group; requires figure scope group."
        examples: [{group: firstPlannedStart}]
        type: object
        required: [group]
        additionalProperties: false
        properties:
          group: {description: "The current group's first planned start or point, gathered by View projection.", const: firstPlannedStart}
  figureIdentity:
    description: "A non-empty identifier local to a declared View figure; preserves the existing string acceptance grammar."
    type: string
    minLength: 1
  figureDaysUntil:
    description: "Signed days from one fact to another; negative once the target has passed."
    examples: [{id: launch-countdown, kind: daysUntil, to: {period: launch-window, side: start}}]
    type: object
    required: [id, kind, to]
    additionalProperties: false
    properties:
      id: {description: "Figure identifier, unique in this View and named by consumers; no braces or whitespace.", $ref: "#/$defs/figureIdentity"}
      kind: {description: "Days from `from` to `to`.", const: daysUntil}
      scope: {description: "Resolve once globally (default), or once for each current View group; group results are shown by group headers only.", enum: [global, group]}
      from: {description: "The starting fact; the as-of when omitted.", $ref: "#/$defs/figureFact"}
      to: {description: "The target fact.", $ref: "#/$defs/figureFact"}
      days: {description: "Count calendar days (the default) or working days of the figure's calendar.", enum: [calendar, working]}
      calendar: {description: "Project calendar for working days; the Project default calendar when omitted. Only with days working.", type: string, minLength: 1}
  figureDaysIn:
    description: "The days a named period covers, its end exclusive."
    examples: [{id: window-length, kind: daysIn, period: launch-window, days: working}]
    type: object
    required: [id, kind, period]
    additionalProperties: false
    properties:
      id: {description: "Figure identifier, unique in this View and named by consumers; no braces or whitespace.", $ref: "#/$defs/figureIdentity"}
      kind: {description: "Days covered by `period`.", const: daysIn}
      period: {description: "Identifier of a period declared in the Project's `periods`.", type: string, minLength: 1}
      days: {description: "Count calendar days (the default) or working days of the figure's calendar.", enum: [calendar, working]}
      calendar: {description: "Project calendar for working days; the Project default calendar when omitted. Only with days working.", type: string, minLength: 1}
  figureCount:
    description: "An integer count of selected Primary review facts, globally or in the current group."
    examples: [{id: overdue, kind: count, source: missingActual}, {id: group-late, kind: count, source: behind, scope: group}]
    type: object
    required: [id, kind, source]
    additionalProperties: false
    properties:
      id: {description: "Figure identifier, unique in this View and named by consumers; no braces or whitespace.", $ref: "#/$defs/figureIdentity"}
      kind: {description: "Select an already-projected integer count, without inferring dates or state.", const: count}
      source: {description: "Closed selected-item/state/known-variance or observed behind/ahead count; missingActual requires an explicit as-of.", enum: [selected, recorded, dueUnobserved, notYetDue, unavailable, missingActual, knownFinishVariance, behind, ahead]}
      scope: {description: "Resolve once globally (default), or once for each current View group; group results are shown by group headers only.", enum: [global, group]}
  visual:
    description: "One direct or data-encoded icon request for an admitted occurrence."
    examples:
      - {target: {kind: title}, ref: material:flag-outline-rounded, decorative: true}
    type: object
    required: [target]
    additionalProperties: false
    properties:
      target:
        description: "Exact label or mark occurrence receiving the icon."
        $ref: "#/$defs/visualTarget"
      ref: {description: "Direct Context-local set:name icon reference.", examples: ["material:flag-outline-rounded"], type: string, pattern: "^[A-Za-z][A-Za-z0-9_-]*:[A-Za-z0-9][A-Za-z0-9_-]*$"}
      encoding:
        description: "Closed source-field to icon-reference mapping."
        type: object
        required: [field, domain]
        additionalProperties: false
        properties:
          field: {description: "Projection-exposed source field name.", type: string, minLength: 1}
          domain:
            description: "Mapping from source value to Context-local icon reference."
            type: object
            minProperties: 1
