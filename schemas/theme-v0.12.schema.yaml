$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "urn:chrona:theme-v0.12"
title: "Chrona derived Theme v0.12"
type: object
required: [version, kind, id, body]
additionalProperties: false
properties:
  version: {const: "chrona/theme/v0.12"}
  kind: {const: theme}
  id: {type: string, minLength: 1}
  body:
    type: object
    required: [extends]
    additionalProperties: false
    properties:
      extends:
        type: object
        required: [id, path, contentIdentity]
        additionalProperties: false
        properties:
          id: {type: string, minLength: 1}
          path: {type: string, pattern: "^(?!.*(?:^|/)\\.{1,2}(?:/|$))[A-Za-z0-9][A-Za-z0-9._/-]*$"}
          contentIdentity: {type: string, pattern: "^sha256:[0-9a-f]{64}$"}
      values: {type: object}
      roles: {type: object}
