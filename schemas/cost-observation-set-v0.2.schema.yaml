$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "urn:chrona:cost-observation-set-v0.2"
type: object
required: [version, id, observations]
additionalProperties: false
properties:
  version: {const: "chrona/cost-observation-set/v0.2"}
  id: {type: string, minLength: 1}
  observations:
    type: array
    items:
      type: object
      required: [id, observedOn, quantity, quantityUnit]
      additionalProperties: false
      properties:
        id: {type: string, minLength: 1}
        observedOn: {type: string, format: date}
        quantity: {type: number, exclusiveMinimum: 0}
        quantityUnit: {type: string, minLength: 1}
        rate: {type: number, exclusiveMinimum: 0}
        rateUnit: {type: string, minLength: 1}
        objectId: {type: string, minLength: 1}
      allOf:
        - if: {required: [rate]}
          then: {required: [rateUnit]}
        - if: {required: [rateUnit]}
          then: {required: [rate]}
