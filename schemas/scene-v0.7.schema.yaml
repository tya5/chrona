sitive"}}}}, {description: "A box role whose background follows the viewer's text.", examples: [{mode: box-follows-text, boxId: "annotation-box:n", endPadSpaces: 2}], type: object, required: [mode, boxId, endPadSpaces], additionalProperties: false, properties: {mode: {description: "The viewer-fit mode.", const: box-follows-text}, boxId: {description: "The id of the box primitive that follows this text.", $ref: "#/$defs/string"}, endPadSpaces: {description: "Trailing spaces of the run's own face that stand for the end inset.", type: integer, minimum: 0}}}]}, assetIdentity: {$ref: "#/$defs/identity"}}}
