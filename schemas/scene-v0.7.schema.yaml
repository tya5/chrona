$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "chrona/scene/v0.7"
title: "Chrona inspection Scene v0.7"
description: "Derived, non-authoritative inspection and adapter evidence for one completed render."
type: object
required: [version, kind, provenance, viewport, requiredCapabilities, surfaces, manifest, diagnostics]
additionalProperties: false
properties:
  version: {$ref: "#/$defs/sceneVersion"}
  kind: {$ref: "#/$defs/sceneKind"}
  provenance: {$ref: "#/$defs/provenance"}
  viewport: {$ref: "#/$defs/viewport"}
  requiredCapabilities: {$ref: "#/$defs/capabilities"}
  surfaces: {$ref: "#/$defs/surfaces"}
  manifest: {$ref: "#/$defs/manifest"}
  diagnostics: {$ref: "#/$defs/diagnostics"}
  fontWarnings: {description: "Ordered draft-only exact-face numeric degradation warnings.", type: array, items: {$ref: "#/$defs/fontTabularWarning"}}
$defs:
  sceneVersion: {description: "The supported public Scene contract version.", const: chrona/scene/v0.7}
  sceneKind: {description: "The document kind identifying a Scene.", const: scene}
  fontTabularWarning: {description: "Exact draft face lacks requested tabular digits.", type: object, required: [code, role, family, weight, requestedSpacing, effectiveSpacing], additionalProperties: false, properties: {code: {description: "Stable warning code.", const: W_FONT_TABULAR_UNAVAILABLE}, role: {description: "Affected Theme typography role.", $ref: "#/$defs/string"}, family: {description: "Selected exact face family.", $ref: "#/$defs/string"}, weight: {description: "Selected exact face weight.", $ref: "#/$defs/positiveInteger"}, requestedSpacing: {description: "Declared tabular spacing request.", const: tabular}, effectiveSpacing: {description: "Exactly measured proportional spacing.", const: proportional}}}
  string: {description: "A non-empty identifier or label.", type: string, minLength: 1}
  text: {description: "Text that may be empty when the source declares it so.", type: string}
  number: {description: "A finite coordinate or scalar number.", type: number}
  positive: {description: "A strictly positive coordinate extent.", type: number, exclusiveMinimum: 0}
  nonnegative: {description: "A non-negative extent or numeric property.", type: number, minimum: 0}
  unitInterval: {description: "A normalized opacity or stop offset.", type: number, minimum: 0, maximum: 1}
  integer: {description: "An integer count.", type: integer}
  positiveInteger: {description: "A strictly positive integer extent or weight.", type: integer, minimum: 1}
  identity: {description: "An immutable SHA-256 content identity.", examples: ["sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"], $ref: "urn:chrona:common-v0.1#/$defs/sha256Identity"}
  boolean: {description: "A Boolean presentation value.", type: boolean}
  point: {description: "A completed inline/block coordinate.", type: array, minItems: 2, maxItems: 2, items: {$ref: "#/$defs/number"}}
  viewport: {description: "A positive final render viewport.", type: object, required: [inlineSize, blockSize], additionalProperties: false, properties: {inlineSize: {$ref: "#/$defs/positive"}, blockSize: {$ref: "#/$defs/positive"}}}
  provenance: {description: "The closure provenance of a derived Scene.", type: object, required: [mode, chronaVersion, resources], additionalProperties: false, properties: {mode: {$ref: "#/$defs/mode"}, chronaVersion: {$ref: "#/$defs/string"}, resources: {$ref: "#/$defs/resources"}}}
  mode: {description: "Whether the render was Draft or immutable.", enum: [draft, immutable]}
  resources: {description: "Closed resource identities read by the render.", type: array, items: {$ref: "#/$defs/resource"}}
  resource: {description: "One closed resource identity.", type: object, required: [kind, id, revision, contentIdentity], additionalProperties: false, properties: {kind: {$ref: "#/$defs/string"}, id: {$ref: "#/$defs/string"}, revision: {$ref: "#/$defs/string"}, contentIdentity: {$ref: "#/$defs/identity"}}}
  capabilities: {description: "Sorted completed feature capabilities required by a consumer.", type: array, uniqueItems: true, items: {$ref: "#/$defs/capability"}}
  capability: {description: "One closed completed-Scene feature capability.", enum: [mark.marker-geometry, paint.pattern-geometry, mark.symbol-outline, icon.vector, icon.raster]}
  surfaces: {description: "Completed renderer-neutral surfaces.", type: array, minItems: 1, items: {$ref: "#/$defs/surface"}}
  surface: {description: "One completed surface with its typed geometry and primitives.", type: object, required: [id, slots, rows, columns, groups, canvasBounds, primitives], additionalProperties: false, allOf: [{description: "Fixed-lane Scene evidence is complete only when mode, member and obstacle inventories, and shared clearance are all present.", examples: [{laneMode: lanes, laneMembers: [], laneObstacles: [], laneClearance: 0}], if: {required: [laneMode]}, then: {required: [laneMembers, laneObstacles, laneClearance]}, else: {not: {anyOf: [{required: [laneMembers]}, {required: [laneObstacles]}, {required: [laneClearance]}]}}}], properties: {id: {$ref: "#/$defs/string"}, slots: {$ref: "#/$defs/slots"}, rows: {$ref: "#/$defs/rows"}, columns: {$ref: "#/$defs/columns"}, groups: {$ref: "#/$defs/groups"}, scale: {$ref: "#/$defs/scale"}, canvasPaint: {description: "Optional canvas background paint; radial gradients are reserved for explicit overlay Rect primitives.", examples: [{fill: '#FFFFFF'}, {gradient: {start: {x: 0, y: 0}, end: {x: 0, y: 1}, stops: [{offset: 0, color: '#FFFFFF'}, {offset: 1, color: '#000000'}], fidelity: required}}], allOf: [{$ref: "#/$defs/paint"}, {description: "Canvas background paint excludes radialGradient; radial fades are painted by explicit overlay Rect primitives.", examples: [{fill: '#FFFFFF'}], not: {required: [radialGradient]}}]}, canvasBounds: {$ref: "#/$defs/bounds"}, fitWarnings: {$ref: "#/$defs/fitWarnings"}, decorationDispositions: {$ref: "#/$defs/decorationDispositions"}, laneMode: {description: "Discriminator for fixed data-only lane membership Scene evidence.", const: lanes}, laneMembers: {description: "Public Project/View membership oracle and exact owner inventory for emitted primitives.", type: array, minItems: 1, items: {$ref: "#/$defs/laneMember"}}, laneObstacles: {description: "Layout-completed visible footprint inventory; Scene validates correspondence with emitted primitives.", type: array, minItems: 1, items: {$ref: "#/$defs/laneObstacle"}}, laneClearance: {description: "Non-negative shared tolerance for interpreting lane obstacle geometry in Scene route/label checks.", $ref: "#/$defs/nonnegative"}, primitives: {$ref: "#/$defs/primitives"}}}
  laneMember: {description: "One lane member and its exact completed Scene primitive inventory.", type: object, required: [rowId, memberId, emittedPrimitiveIds, primaryMarkIds], additionalProperties: false, properties: {rowId: {$ref: "#/$defs/string"}, memberId: {$ref: "#/$defs/string"}, emittedPrimitiveIds: {description: "Every primitive emitted for this countable member.", type: array, minItems: 1, uniqueItems: true, items: {$ref: "#/$defs/string"}}, primaryMarkIds: {description: "The primitive IDs that represent this member's primary mark footprint.", type: array, minItems: 1, uniqueItems: true, items: {$ref: "#/$defs/string"}}}}
  laneObstacle: {description: "One Layout-owned visible footprint facet and the primitive/member identity it supports.", type: object, required: [facetId, primitiveId, rowId, memberId, class, geometry], additionalProperties: false, properties: {facetId: {$ref: "#/$defs/string"}, primitiveId: {$ref: "#/$defs/string"}, rowId: {$ref: "#/$defs/string"}, memberId: {$ref: "#/$defs/string"}, class: {description: "Whether the footprint represents a mark or required text/icon label.", enum: [mark, required-label]}, geometry: {$ref: "#/$defs/laneObstacleGeometry"}}}
  laneObstacleGeometry: {description: "Exact Layout-completed rect or stroked-segment footprint geometry.", examples: [{kind: rect, left: 0, top: 0, right: 1, bottom: 1}], oneOf: [{$ref: "#/$defs/laneObstacleRect"}, {$ref: "#/$defs/laneObstacleSegment"}]}
  laneObstacleRect: {description: "A finite positive-area rectangle in final surface coordinates.", type: object, required: [kind, left, top, right, bottom], additionalProperties: false, properties: {kind: {description: "The geometry discriminator for a rectangular obstacle.", const: rect}, left: {$ref: "#/$defs/number"}, top: {$ref: "#/$defs/number"}, right: {$ref: "#/$defs/number"}, bottom: {$ref: "#/$defs/number"}}}
  laneObstacleSegment: {description: "A stroked segment in final surface coordinates.", type: object, required: [kind, start, end, strokeWidth], additionalProperties: false, properties: {kind: {description: "The geometry discriminator for a stroked segment obstacle.", const: stroked-segment}, start: {$ref: "#/$defs/point"}, end: {$ref: "#/$defs/point"}, strokeWidth: {$ref: "#/$defs/nonnegative"}}}
  slots: {description: "Resolved Layout slots.", type: array, items: {$ref: "#/$defs/slot"}}
  slot: {description: "One resolved surface slot.", type: object, required: [id, source, bounds, priority, overflow], additionalProperties: false, properties: {id: {$ref: "#/$defs/string"}, source: {$ref: "#/$defs/string"}, scaleId: {$ref: "#/$defs/string"}, bounds: {$ref: "#/$defs/bounds"}, priority: {$ref: "#/$defs/string"}, overflow: {$ref: "#/$defs/string"}}}
  rows: {description: "Typed table/timeline rows.", type: array, items: {$ref: "#/$defs/row"}}
  row: {description: "One completed row identity and extent; groupId is empty for an ungrouped row.", type: object, required: [id, objectId, groupId, bounds], additionalProperties: false, properties: {id: {$ref: "#/$defs/string"}, objectId: {$ref: "#/$defs/string"}, groupId: {$ref: "#/$defs/text"}, bounds: {$ref: "#/$defs/bounds"}, laneMarkBandBlock: {$ref: "#/$defs/number"}}}
  columns: {description: "Typed table columns from Layout.", type: array, items: {$ref: "#/$defs/column"}}
  column: {description: "One column identity, label, and extent.", type: object, required: [id, label, bounds], additionalProperties: false, properties: {id: {$ref: "#/$defs/string"}, label: {$ref: "#/$defs/string"}, bounds: {$ref: "#/$defs/bounds"}}}
  groups: {description: "Completed group extents.", type: array, items: {$ref: "#/$defs/group"}}
  group: {description: "One group content extent and optional header extent; id is empty for the ungrouped aggregate.", type: object, required: [id, contentBounds], additionalProperties: false, properties: {id: {$ref: "#/$defs/text"}, headerBounds: {$ref: "#/$defs/bounds"}, contentBounds: {$ref: "#/$defs/bounds"}}}
  primitives: {description: "Completed primitives in canonical source order.", type: array, items: {$ref: "#/$defs/primitive"}}
  primitive:
    description: "One completed primitive with opaque identifier, Layout-owned slot identity, and typed optional data."
    examples: [{id: box, kind: Rect, sourceRef: box, sourceKind: decoration, purpose: frame, visualRole: frame, bounds: {inline: 0, block: 0, inlineSize: 20, blockSize: 10}, slotId: plot}]
    type: object
    required: [id, kind, sourceRef, sourceKind, purpose, visualRole, bounds, slotId]
    additionalProperties: false
    dependentRequired: {fromInstanceId: [toInstanceId], toInstanceId: [fromInstanceId]}
    if: {required: [strokeClip]}
    then:
      required: [paint]
      properties:
        kind: {enum: [Rect, Symbol, Path]}
        paint: {required: [stroke, strokeWidth], properties: {strokeWidth: {type: number, exclusiveMinimum: 0}}}
      if: {properties: {kind: {not: {const: Rect}}}}
      then: {properties: {strokeClip: {required: [outline]}}}
    allOf:
      - description: "A finite radial surface layer is one completed Rect paint, never combined with another paint effect or a periodic pattern."
        examples: [{id: vignette, kind: Rect, sourceRef: vignette, sourceKind: decoration, purpose: canvas-overlay-gradient, visualRole: canvas-overlay-gradient, bounds: {inline: 0, block: 0, inlineSize: 20, blockSize: 10}, slotId: surface, paint: {fill: '#202020', opacity: 1, radialGradient: {center: {x: 0.5, y: 0.5}, radii: [0.8, 0.8], stops: [{offset: 0, color: '#202020', opacity: 0}, {offset: 1, color: '#202020', opacity: 1}], fidelity: required}}}]
        if:
          required: [paint]
          properties:
            paint: {required: [radialGradient]}
        then:
          required: [kind]
          properties:
            kind: {const: Rect}
            paint:
              required: [fill]
              properties: {dash: {maxItems: 0}}
              not:
                anyOf:
                  - {required: [stroke]}
                  - {required: [strokeWidth]}
                  - {required: [gradient]}
                  - {required: [shadow]}
                  - {required: [glow]}
                  - {required: [wobble]}
                  - {required: [strokeFinish]}
                  - {required: [image]}
          not: {required: [pattern]}
      - description: "Resolved endpoint identity is metadata for a Path, never another primitive kind."
        examples: [{kind: Path, fromInstanceId: source-instance, toInstanceId: target-instance}]
        if:
          anyOf:
            - {required: [fromInstanceId]}
            - {required: [toInstanceId]}
        then:
          properties: {kind: {const: Path}}
      - description: "A Layout-approved same-port fan-in belongs to a resolved incoming Path."
        examples: [{kind: Path, toInstanceId: target-instance, fanIn: {targetPortId: target-start, terminalOwnerId: first-arrival}}]
        if: {required: [fanIn]}
        then:
          required: [toInstanceId]
          properties: {kind: {const: Path}}
    properties:
      id: {$ref: "#/$defs/string"}
      kind: {$ref: "#/$defs/primitiveKind"}
      sourceRef: {$ref: "#/$defs/text"}
      sourceKind: {$ref: "#/$defs/string"}
      purpose: {$ref: "#/$defs/string"}
      visualRole: {$ref: "#/$defs/string"}
      bounds: {$ref: "#/$defs/bounds"}
      slotId: {$ref: "#/$defs/string"}
      text: {$ref: "#/$defs/text"}
      baseline: {$ref: "#/$defs/point"}
      textLayout: {$ref: "#/$defs/textLayout"}
      paint: {$ref: "#/$defs/paint"}
      cornerRadius: {$ref: "#/$defs/nonnegative"}
      strokeClip: {$ref: "#/$defs/strokeClip"}
      paintClip: {$ref: "#/$defs/paintClip"}
      pathCommands: {$ref: "#/$defs/pathCommands"}
      points: {$ref: "#/$defs/points"}
      href: {$ref: "#/$defs/text"}
      linkTitle: {$ref: "#/$defs/text"}
      tableRowId: {$ref: "#/$defs/text"}
      tableColumnId: {$ref: "#/$defs/text"}
      laneRowId: {$ref: "#/$defs/string"}
      laneMemberId: {$ref: "#/$defs/string"}
      fromInstanceId: {$ref: "#/$defs/string"}
      toInstanceId: {$ref: "#/$defs/string"}
      fanIn: {$ref: "#/$defs/relationFanIn"}
      markerStart: {$ref: "#/$defs/marker"}
      markerEnd: {$ref: "#/$defs/marker"}
      pattern: {$ref: "#/$defs/pattern"}
      symbol: {$ref: "#/$defs/symbol"}
      icon: {$ref: "#/$defs/icon"}
      paintOrder: {$ref: "#/$defs/integer"}
      hostPlacementId: {$ref: "#/$defs/string"}
      clipSourceId: {$ref: "#/$defs/string"}
      contrastTreatment: {$ref: "#/$defs/contrastTreatment"}
      endTreatment: {$ref: "#/$defs/endTreatment"}
      viewerFit: {description: "Completed viewer-fit mode of a text-bearing box (#1050): the text-follows-box and box-follows-text declarations of a Theme box role; written only when not raw. A box-follows-text Rect is painted by an adapter as a filter group around its text (fit.boxId).", enum: [text-follows-box, box-follows-text]}
  contrastTreatment: {description: "Resolved finite state-text contrast floor selected before Scene projection.", enum: [required, deemphasized]}
  endTreatment: {description: "Layout-selected terminal treatment for a completed mark.", enum: [closed, open]}
  primitiveKind: {description: "One closed renderer-neutral primitive kind.", enum: [Rect, Text, Symbol, Path, Icon]}
  bounds: {description: "A completed rectangle; path extents may be zero.", type: object, required: [inline, block, inlineSize, blockSize], additionalProperties: false, properties: {inline: {$ref: "#/$defs/number"}, block: {$ref: "#/$defs/number"}, inlineSize: {$ref: "#/$defs/nonnegative"}, blockSize: {$ref: "#/$defs/nonnegative"}}}
  paintClip: {description: "An optional Layout-completed finite positive paint clip; primitive geometry is already contained by these bounds.", type: object, required: [bounds], additionalProperties: false, properties: {bounds: {description: "The completed positive inline/block plot bounds.", allOf: [{$ref: "#/$defs/bounds"}, {description: "Both physical plot dimensions are positive.", type: object, properties: {inlineSize: {$ref: "#/$defs/positive"}, blockSize: {$ref: "#/$defs/positive"}}}]}}}
  manifest: {description: "Derived role, content, font, and scale inspection evidence.", type: object, required: [version, settingsVersion, viewport, selectedObjectIds, fontAssetIdentities, contentFamilyCounts, surfaceScales, visualRoleCounts], additionalProperties: false, properties: {version: {$ref: "#/$defs/manifestVersion"}, settingsVersion: {$ref: "#/$defs/string"}, viewport: {$ref: "#/$defs/viewport"}, selectedObjectIds: {$ref: "#/$defs/strings"}, fontAssetIdentities: {$ref: "#/$defs/identities"}, contentFamilyCounts: {$ref: "#/$defs/contentCounts"}, surfaceScales: {$ref: "#/$defs/scales"}, visualRoleCounts: {$ref: "#/$defs/roleCounts"}}}
  manifestVersion: {description: "The supported derived Scene manifest version.", const: chrona/scene-manifest/v0.1}
  diagnostics: {description: "Non-fatal diagnostic strings retained as inspection evidence.", type: array, items: {$ref: "#/$defs/string"}}
  decorationDispositions: {description: "Explicit classified decoration absences; consumers must not infer absence from transparent drawing.", type: array, items: {$ref: "#/$defs/decorationDisposition"}}
  decorationDisposition: {description: "One non-drawable classified decoration result.", type: object, required: [visualRole, disposition], additionalProperties: false, properties: {visualRole: {$ref: "#/$defs/string"}, disposition: {description: "The only explicit non-drawable decoration outcome.", const: absent}}}
  fitWarnings: {description: "Ordered Layout-owned visible fit-failure records.", type: array, items: {$ref: "#/$defs/fitWarning"}}
  fitWarning: {description: "One completed visible fit fallback with measured facts.", type: object, required: [code, placementId, sourceRef, failureKind, behaviour, requiredInline, requiredBlock, availableInline, availableBlock], additionalProperties: false, properties: {code: {description: "The stable warning identifier for the completed fallback.", type: string, pattern: "^W_LAYOUT_[A-Z0-9_]+$", examples: [W_LAYOUT_VISIBLE_OVERFLOW]}, placementId: {description: "The completed placement identity affected by the fallback.", $ref: "#/$defs/string"}, sourceRef: {description: "The source fact associated with the completed placement.", $ref: "#/$defs/string"}, failureKind: {description: "The finite Layout failure family that selected the fallback.", $ref: "#/$defs/string"}, behaviour: {description: "The completed visible or explicitly declared fallback behaviour.", $ref: "#/$defs/string"}, requiredInline: {description: "The measured inline extent required before fallback.", $ref: "#/$defs/nonnegative"}, requiredBlock: {description: "The measured block extent required before fallback.", $ref: "#/$defs/nonnegative"}, availableInline: {description: "The allocated inline extent available before fallback.", $ref: "#/$defs/nonnegative"}, availableBlock: {description: "The allocated block extent available before fallback.", $ref: "#/$defs/nonnegative"}}}
  strings: {description: "An ordered collection of text values.", type: array, items: {$ref: "#/$defs/text"}}
  identities: {description: "An ordered collection of immutable content identities.", type: array, items: {$ref: "#/$defs/identity"}}
  pathCommands: {description: "An ordered completed path command list.", type: array, items: {$ref: "#/$defs/pathCommand"}}
  points: {description: "An ordered completed coordinate list.", type: array, items: {$ref: "#/$defs/point"}}
  pathCommand: {description: "One renderer-neutral path command.", type: object, required: [kind, points], additionalProperties: false, properties: {kind: {$ref: "#/$defs/pathCommandKind"}, points: {$ref: "#/$defs/points"}}}
  pathCommandKind: {description: "One closed path command kind.", enum: [move, line, quadratic, cubic, close]}
  date: {description: "An ISO-8601 calendar date.", examples: ["2026-09-25"], type: string, format: date}
  scale: {description: "A completed time-to-inline coordinate scale.", type: object, required: [surfaceId, scaleId, domainStart, domainEnd, rangeStart, rangeEnd, origin, unitRatio], additionalProperties: false, properties: {surfaceId: {$ref: "#/$defs/string"}, scaleId: {$ref: "#/$defs/string"}, domainStart: {$ref: "#/$defs/date"}, domainEnd: {$ref: "#/$defs/date"}, rangeStart: {$ref: "#/$defs/number"}, rangeEnd: {$ref: "#/$defs/number"}, origin: {$ref: "#/$defs/number"}, unitRatio: {$ref: "#/$defs/positive"}}}
  scales: {description: "Completed surface scales.", type: array, items: {$ref: "#/$defs/scale"}}
  paint: {description: "Completed primitive paint, including optional fidelity-bearing details.", type: object, required: [opacity], additionalProperties: false, properties: {fill: {$ref: "#/$defs/text"}, stroke: {$ref: "#/$defs/text"}, strokeWidth: {$ref: "#/$defs/positive"}, dash: {$ref: "#/$defs/positiveNumbers"}, opacity: {$ref: "#/$defs/unitInterval"}, gradient: {$ref: "#/$defs/gradient"}, radialGradient: {$ref: "#/$defs/radialGradient"}, shadow: {$ref: "#/$defs/shadow"}, glow: {$ref: "#/$defs/glow"}, wobble: {$ref: "#/$defs/wobble"}, strokeFinish: {$ref: "#/$defs/strokeFinish"}, image: {$ref: "#/$defs/image"}}}
  image: {description: "A completed nine-slice raster fill for an annotation container (#465); adapters only serialize it.", type: object, required: [assetIdentity, viewport, tiles], additionalProperties: false, properties: {assetIdentity: {$ref: "#/$defs/identity"}, viewport: {$ref: "#/$defs/iconViewport"}, tiles: {$ref: "#/$defs/imageTiles"}}}
  imageTiles: {description: "The completed nine-slice tile list, at most nine tiles.", type: array, minItems: 1, maxItems: 9, items: {$ref: "#/$defs/imageTile"}}
  imageTile: {description: "One completed nine-slice tile: a source rect stretched to a destination rect.", type: object, required: [source, destination], additionalProperties: false, properties: {source: {$ref: "#/$defs/bounds"}, destination: {$ref: "#/$defs/bounds"}}}
  positiveNumbers: {description: "An ordered collection of strictly positive numbers.", type: array, items: {$ref: "#/$defs/positive"}}
  gradient: {description: "A completed linear gradient with fidelity policy.", type: object, required: [start, end, stops, fidelity], additionalProperties: false, properties: {start: {$ref: "#/$defs/point"}, end: {$ref: "#/$defs/point"}, stops: {$ref: "#/$defs/gradientStops"}, fidelity: {$ref: "#/$defs/fidelity"}}}
  radialGradient: {description: "A completed finite elliptical surface fade with fixed-ink stops.", type: object, required: [center, radii, stops, fidelity], additionalProperties: false, properties: {center: {$ref: "#/$defs/point"}, radii: {description: "Positive inline and block radii for the ellipse.", examples: [[0.8, 0.6]], type: array, minItems: 2, maxItems: 2, items: {$ref: "#/$defs/positive"}}, stops: {$ref: "#/$defs/radialGradientStops"}, fidelity: {$ref: "#/$defs/fidelity"}}}
  radialGradientStops:
    description: "The two- or three-stop opacity list for the radial surface fade."
    examples: [[{offset: 0, color: '#202020', opacity: 0}, {offset: 1, color: '#202020', opacity: 1}]]
    oneOf:
      - type: array
        description: "A radial fade with transparent center and opaque outer stop."
        examples: [[{offset: 0, color: '#202020', opacity: 0}, {offset: 1, color: '#202020', opacity: 1}]]
        minItems: 2
        maxItems: 2
        prefixItems: [{$ref: "#/$defs/radialGradientZeroStop"}, {$ref: "#/$defs/radialGradientOneStop"}]
        items: false
      - type: array
        description: "A radial fade with a zero-opacity middle stop."
        examples: [[{offset: 0, color: '#202020', opacity: 0}, {offset: 0.5, color: '#202020', opacity: 0}, {offset: 1, color: '#202020', opacity: 1}]]
        minItems: 3
        maxItems: 3
        prefixItems: [{$ref: "#/$defs/radialGradientZeroStop"}, {$ref: "#/$defs/radialGradientInnerStop"}, {$ref: "#/$defs/radialGradientOneStop"}]
        items: false
  radialGradientStop: {description: "One completed radial stop with an explicit alpha and fixed ink.", type: object, required: [offset, color, opacity], additionalProperties: false, properties: {offset: {$ref: "#/$defs/unitInterval"}, color: {$ref: "#/$defs/text"}, opacity: {$ref: "#/$defs/unitInterval"}}}
  radialGradientZeroStop: {description: "The transparent start stop of a radial fade.", examples: [{offset: 0, color: '#202020', opacity: 0}], allOf: [{$ref: "#/$defs/radialGradientStop"}, {description: "The first radial stop has zero offset and opacity.", examples: [{offset: 0, color: '#202020', opacity: 0}], properties: {offset: {const: 0}, opacity: {const: 0}}}]}
  radialGradientInnerStop: {description: "The optional transparent middle stop of a radial fade.", examples: [{offset: 0.5, color: '#202020', opacity: 0}], allOf: [{$ref: "#/$defs/radialGradientStop"}, {description: "The middle radial stop is interior and transparent.", examples: [{offset: 0.5, color: '#202020', opacity: 0}], properties: {offset: {type: number, exclusiveMinimum: 0, exclusiveMaximum: 1}, opacity: {const: 0}}}]}
  radialGradientOneStop: {description: "The opaque end stop of a radial fade.", examples: [{offset: 1, color: '#202020', opacity: 1}], allOf: [{$ref: "#/$defs/radialGradientStop"}, {description: "The last radial stop has unit offset and opacity.", examples: [{offset: 1, color: '#202020', opacity: 1}], properties: {offset: {const: 1}, opacity: {const: 1}}}]}
  gradientStops: {description: "An ordered gradient stop list.", type: array, minItems: 2, items: {$ref: "#/$defs/gradientStop"}}
  gradientStop: {description: "One completed gradient stop; an optional opacity (#890) lets a gradient fade to transparent.", type: object, required: [offset, color], additionalProperties: false, properties: {offset: {$ref: "#/$defs/unitInterval"}, color: {$ref: "#/$defs/text"}, opacity: {$ref: "#/$defs/unitInterval"}}}
  shadow: {description: "A completed shadow with fidelity policy.", type: object, required: [color, offsetInline, offsetBlock, blur, opacity, fidelity], additionalProperties: false, properties: {color: {$ref: "#/$defs/text"}, offsetInline: {$ref: "#/$defs/number"}, offsetBlock: {$ref: "#/$defs/number"}, blur: {$ref: "#/$defs/nonnegative"}, opacity: {$ref: "#/$defs/unitInterval"}, fidelity: {$ref: "#/$defs/fidelity"}}}
  glow: {description: "A completed glow (#587): colour, blur, opacity, fidelity policy and the canvas-clipped region the halo may paint in.", type: object, required: [color, blur, opacity, fidelity, region], additionalProperties: false, properties: {color: {$ref: "#/$defs/text"}, blur: {$ref: "#/$defs/nonnegative"}, opacity: {$ref: "#/$defs/unitInterval"}, fidelity: {$ref: "#/$defs/fidelity"}, region: {$ref: "#/$defs/bounds"}}}
