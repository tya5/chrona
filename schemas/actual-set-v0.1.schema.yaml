$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "chrona/actual-set-v0.1"
allOf:
  - $ref: "urn:chrona:presentation-resource-v0.1"
  - type: object
    properties:
      kind: {const: actual-set}
      body:
        type: object
        required: [observations]
        additionalProperties: false
        properties:
          asOf: {type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$"}
          observations:
            type: array
            items:
              type: object
              required: [id, sequence, actual]
              additionalProperties: false
              properties:
                id: {type: string, minLength: 1}
                sequence: {type: integer, minimum: 1}
                projectObjectId: {type: string, minLength: 1}
                externalIdentity: {type: object, required: [system, key], additionalProperties: false, properties: {system: {type: string}, key: {type: [string, integer]}}}
                alignment: {const: unmatched}
                actual:
                  type: object
                  minProperties: 1
                  additionalProperties: false
                  properties:
                    start: {type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$"}
                    finish: {type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$"}
                    at: {type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$"}
                    progress: {type: number, minimum: 0, maximum: 1}
              allOf:
                - if: {properties: {actual: {required: [at]}}}
                  then: {properties: {actual: {not: {anyOf: [{required: [start]}, {required: [finish]}, {required: [progress]}]}}}}
