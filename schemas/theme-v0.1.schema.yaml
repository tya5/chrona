$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "chrona/theme-v0.1"
title: "Chrona Theme v0.1"
allOf:
  - $ref: "urn:chrona:presentation-resource-v0.1"
  - type: object
    properties:
      kind: {const: theme}
      body:
        type: object
        required: [values, roles]
        additionalProperties: false
        properties:
          extends:
            $ref: "urn:chrona:presentation-resource-v0.1#/$defs/themeRef"
          values:
            type: object
            minProperties: 1
            additionalProperties:
              type: object
              required: [type, value]
              additionalProperties: false
              properties:
                type: {enum: [color, number, fontFamily, fontWeight, dashPattern, marker, pattern, textAlternative]}
                value: {type: [string, number]}
          roles:
            type: object
            minProperties: 1
            additionalProperties:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                fill: {type: string, minLength: 1}
                stroke: {type: string, minLength: 1}
                marker: {type: string, minLength: 1}
                pattern: {type: string, minLength: 1}
                fontFamily: {type: string, minLength: 1}
                fontWeight: {type: string, minLength: 1}
                opacity: {type: string, minLength: 1}
                textAlternative: {type: string, minLength: 1}
          metrics:
            type: object
            minProperties: 1
            propertyNames: {pattern: "^[A-Za-z][A-Za-z0-9._-]*$"}
            additionalProperties: {type: string, minLength: 1}
