$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "urn:chrona:release-acceptance-v0.2"
title: "Chrona release acceptance manifest v0.2"
type: object
additionalProperties: false
required: [version, releaseId, inputClosure, output, useCases]
properties:
  version: {const: "chrona/release-acceptance/v0.2"}
  releaseId: {type: string, minLength: 1}
  inputClosure:
    type: object
    additionalProperties: false
    required: [projectIdentity, revisionIdentity, packageClosureIdentity, viewIdentity, actualSetIdentity, sceneIdentity, evaluationIdentity]
    properties:
      projectIdentity: {type: string, minLength: 1}
      revisionIdentity: {type: string, minLength: 1}
      packageClosureIdentity: {type: string, minLength: 1}
      viewIdentity: {type: string, minLength: 1}
      actualSetIdentity: {type: string, minLength: 1}
      sceneIdentity: {type: string, minLength: 1}
      evaluationIdentity: {type: string, minLength: 1}
  output:
    type: object
    additionalProperties: false
    required: [target, targetVersion]
    properties:
      target: {enum: [svg, pdf, raster, canvas, presentation]}
      targetVersion: {type: string, minLength: 1}
  useCases:
    type: array
    minItems: 15
    maxItems: 15
    items:
      type: object
      additionalProperties: false
      required: [id, disposition]
      properties:
        id: {enum: [UC-01, UC-02, UC-03, UC-04, UC-05, UC-06, UC-07, UC-08, UC-09, UC-10, UC-11, UC-12, UC-13, UC-14, UC-15]}
        disposition: {enum: [accepted, excluded]}
        evidence:
          type: array
          minItems: 1
          items: {type: string, minLength: 1}
        reason: {type: string, minLength: 1}
        unblockingMilestone: {pattern: "^M[0-9]+(?:\\.[0-9]+)?$"}
      allOf:
        - if: {properties: {disposition: {const: accepted}}}
          then: {required: [evidence]}
        - if: {properties: {disposition: {const: excluded}}}
          then: {required: [reason]}
