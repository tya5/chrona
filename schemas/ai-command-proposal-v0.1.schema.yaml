$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "urn:chrona:ai-command-proposal-v0.1"
type: object
additionalProperties: false
required: [version, proposalId, actor, proposedCommand, intent]
properties:
  version: {const: "chrona/ai-command-proposal/v0.1"}
  proposalId: {type: string, minLength: 1}
  actor:
    type: object
    additionalProperties: false
    required: [principal, agentIdentity, modelIdentity]
    properties:
      principal: {type: string, minLength: 1}
      agentIdentity: {type: string, minLength: 1}
      modelIdentity: {type: string, minLength: 1}
  proposedCommand: {$ref: "chrona/command-request-v0.1"}
  intent: {type: string, minLength: 1}
  evidenceRefs:
    type: array
    items: {type: string, minLength: 1}
