$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "chrona/render-context-v0.1"
title: "Chrona Render Context v0.1"
allOf:
  - $ref: "urn:chrona:presentation-resource-v0.1"
  - type: object
    properties:
      kind:
        const: "render-context"
      body:
        type: object
        required: [project, view, style, theme, sceneProfile, evaluation, viewport, target, layoutMetrics]
        additionalProperties: false
        properties:
          project:
            $ref: "urn:chrona:presentation-resource-v0.1#/$defs/projectRef"
          view:
            $ref: "urn:chrona:presentation-resource-v0.1#/$defs/viewRef"
          style:
            $ref: "urn:chrona:presentation-resource-v0.1#/$defs/styleRef"
          theme:
            $ref: "urn:chrona:presentation-resource-v0.1#/$defs/themeRef"
          sceneProfile:
            $ref: "urn:chrona:presentation-resource-v0.1#/$defs/sceneProfileRef"
          inputs:
            type: object
            additionalProperties: false
            properties:
              snapshot:
                $ref: "urn:chrona:presentation-resource-v0.1#/$defs/snapshotRef"
              actual:
                $ref: "urn:chrona:presentation-resource-v0.1#/$defs/actualSetRef"
          evaluation:
            type: object
            required: [locale]
            additionalProperties: false
            properties:
              locale:
                type: string
                minLength: 2
              asOfDate:
                type: string
                pattern: "^\\d{4}-\\d{2}-\\d{2}$"
          viewport:
            type: object
            required: [width, height, margins, clipping]
            additionalProperties: false
            properties:
              width: {type: number, exclusiveMinimum: 0}
              height: {type: number, exclusiveMinimum: 0}
              margins:
                type: object
                required: [top, right, bottom, left]
                additionalProperties: false
                properties:
                  top: {type: number, minimum: 0}
                  right: {type: number, minimum: 0}
                  bottom: {type: number, minimum: 0}
                  left: {type: number, minimum: 0}
              clipping:
                enum: [clip, overflow]
          target:
            type: object
            required: [kind, capabilities]
            additionalProperties: false
            properties:
              kind: {type: string, minLength: 1}
              capabilities:
                type: array
                uniqueItems: true
                items: {type: string, minLength: 1}
          layoutMetrics:
            type: object
            required: [id, revision, contentIdentity, algorithmVersion]
            additionalProperties: false
            properties:
              id: {type: string, minLength: 1}
              revision: {type: string, pattern: "^metric:[A-Za-z0-9._-]+$"}
              contentIdentity: {type: string, pattern: "^sha256:[0-9a-f]{64}$"}
              algorithmVersion: {type: string, minLength: 1}
