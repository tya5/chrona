$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "chrona/package-lock-v0.1"
title: "Chrona package lock v0.1"
description: "Machine-managed immutable local acquisition record."
type: object
required: [version, packages]
additionalProperties: false
properties:
  version: {const: chrona/package-lock/v0.1}
  packages:
    type: array
    minItems: 1
    items:
      type: object
      required: [id, release, contentIdentity, manifest, presets, compatibility]
      additionalProperties: false
      properties:
        id: {type: string, pattern: "^[a-z0-9][a-z0-9-]*/[a-z0-9][a-z0-9-]*$"}
        release: {type: string, minLength: 1}
        contentIdentity: {$ref: "#/$defs/digest"}
        manifest: {type: object, required: [contentIdentity], additionalProperties: false, properties: {contentIdentity: {$ref: "#/$defs/digest"}}}
        presets:
          type: object
          minProperties: 1
          additionalProperties: {$ref: "#/$defs/preset"}
        compatibility: {type: object, required: [chrona, targets], additionalProperties: false, properties: {chrona: {type: string, minLength: 1}, targets: {type: array, minItems: 1, items: {type: string, minLength: 1}}}}
$defs:
  digest: {type: string, pattern: "^sha256:[0-9a-f]{64}$"}
  resource: {type: object, required: [id, kind, contentIdentity], additionalProperties: false, properties: {id: {type: string, minLength: 1}, kind: {enum: [view, theme, color-scheme, layout-profile]}, contentIdentity: {$ref: "#/$defs/digest"}}}
  preset:
    type: object
    required: [contentIdentity, resources]
    additionalProperties: false
    properties:
      contentIdentity: {$ref: "#/$defs/digest"}
      resources:
        type: object
        required: [view, theme, colorScheme, layout]
        additionalProperties: false
        properties:
          view: {$ref: "#/$defs/resource"}
          theme: {$ref: "#/$defs/resource"}
          colorScheme: {$ref: "#/$defs/resource"}
          layout: {$ref: "#/$defs/resource"}
