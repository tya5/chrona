$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "urn:chrona:theme-asset-source-v0.1"
title: "Chrona Theme Asset Source v0.1"
description: "Local declarative YAML ingress for licensed glyph and pattern entries; the importer validates and normalizes the entire source before writing a catalog."
type: object
required: [version, kind, id, body]
additionalProperties: false
properties:
  version: {description: "Declarative Theme asset source contract version.", const: "chrona/theme-asset-source/v0.1"}
  kind: {description: "Source document family.", const: theme-asset-source}
  id: {description: "Stable identifier for this local source document.", $ref: "#/$defs/name"}
  body:
    type: object
    description: "A complete licensed source with at least one glyph or pattern."
    examples: [{set: fixture, aliases: [], license: {spdx: MIT, notice: Test notice}, glyphs: {pin: {viewport: {inlineSize: 8, blockSize: 8}, parts: [{paint: fill, d: "M 0 0 L 8 0 L 4 8 Z"}]}}, patterns: {}}]
    required: [set, aliases, license, glyphs, patterns]
    additionalProperties: false
    properties:
      set: {description: "Canonical namespace used by `set:name` references in the output catalog.", $ref: "#/$defs/name"}
      aliases: {description: "Additional namespaces resolving to this catalog set.", type: array, uniqueItems: true, items: {$ref: "#/$defs/name"}}
      license:
        description: "Required explicit licensing details copied into catalog provenance."
        type: object
        required: [spdx, notice]
        additionalProperties: false
        properties:
          spdx: {description: "Declared SPDX identifier; the importer does not infer policy.", type: string, minLength: 1}
          notice: {description: "Complete notice text copied with the catalog.", type: string, minLength: 1}
      glyphs:
        description: "Named source glyphs, normalized into ordered renderer-neutral path parts."
        type: object
        propertyNames: {$ref: "#/$defs/name"}
        additionalProperties: {$ref: "#/$defs/glyph"}
      patterns:
        description: "Named source patterns, normalized into bounded repeat tiles."
        type: object
        propertyNames: {$ref: "#/$defs/name"}
        additionalProperties: {$ref: "#/$defs/pattern"}
    anyOf:
      - description: "A source may contain glyphs without patterns."
        properties: {glyphs: {minProperties: 1}}
      - description: "A source may contain patterns without glyphs."
        properties: {patterns: {minProperties: 1}}
$defs:
  name:
    description: "Portable identifier component used in a set, alias, or entry name."
    examples: [fixture]
    type: string
    pattern: "^[A-Za-z0-9][A-Za-z0-9_-]*$"
  glyph:
    description: "A positive viewport and ordered source path parts in the supported SVG path subset."
    type: object
    required: [viewport, parts]
    additionalProperties: false
    properties:
      viewport:
        description: "Positive integer glyph viewport."
        type: object
        required: [inlineSize, blockSize]
        additionalProperties: false
        properties:
          inlineSize: {description: "Positive viewport width.", type: integer, minimum: 1, maximum: 4096}
          blockSize: {description: "Positive viewport height.", type: integer, minimum: 1, maximum: 4096}
      parts:
        description: "Ordered renderer-neutral glyph path parts."
        type: array
        minItems: 1
        maxItems: 32
        items:
          description: "One glyph path part."
          type: object
          required: [paint, d]
          additionalProperties: false
          properties:
            paint: {description: "Theme-owned paint mode.", enum: [fill, stroke]}
            d: {description: "Source SVG path-data accepted by the bounded glyph path normalizer; XML and style syntax are not accepted.", type: string, minLength: 1, maxLength: 65536}
            strokeWidth: {description: "Positive source-unit stroke width, required for stroke paths.", type: number, exclusiveMinimum: 0, maximum: 1024}
            lineCap: {description: "Stroke endpoint shape.", enum: [butt, round, square]}
            lineJoin: {description: "Stroke corner shape.", enum: [miter, round, bevel]}
          allOf:
            - description: "Stroke glyph parts require width, cap, and join."
              examples: [{paint: stroke, d: "M 0 0 L 1 1", strokeWidth: 1, lineCap: round, lineJoin: round}]
              if: {properties: {paint: {const: stroke}}, required: [paint]}
              then: {required: [strokeWidth, lineCap, lineJoin]}
            - description: "Fill glyph parts cannot carry stroke-only fields."
              examples: [{paint: fill, d: "M 0 0 L 1 1 Z"}]
              if: {properties: {paint: {const: fill}}, required: [paint]}
              then: {not: {anyOf: [{required: [strokeWidth]}, {required: [lineCap]}, {required: [lineJoin]}]}}
  pattern:
    description: "A positive bounded tile, clockwise rotation, and ordered declarative shapes."
    type: object
    required: [tile, angle, densityBasisPoints, primitives]
    additionalProperties: false
    properties:
      tile:
        description: "Positive finite repeat tile size."
        type: object
        required: [inlineSize, blockSize]
        additionalProperties: false
        properties:
          inlineSize: {description: "Positive tile width in units.", type: number, minimum: 1, maximum: 256}
          blockSize: {description: "Positive tile height in units.", type: number, minimum: 1, maximum: 256}
      angle: {description: "Clockwise rotation about tile center in degrees.", type: number, minimum: 0, exclusiveMaximum: 360}
      densityBasisPoints: {description: "Declared covered fraction of the fixed rotated 128x128 center grid, in basis points (100 basis points = 1%); importer recomputes with periodic edge wrapping and half-up rounding and rejects a mismatch.", type: integer, minimum: 1, maximum: 10000}
      primitives:
        description: "Ordered circles, rectangles, stroked lines, or stroked arcs. Coordinates must lie within the declared tile; importer computes density and lowers arcs."
        type: array
        minItems: 1
        maxItems: 64
        items: {$ref: "#/$defs/patternPrimitive"}
  patternPrimitive:
    description: "A closed filled circle/rectangle or stroked line/arc."
    examples: [{kind: circle, cx: 4, cy: 4, radius: 1}]
    oneOf:
      - description: "One filled source circle."
        type: object
        required: [kind, cx, cy, radius]
        additionalProperties: false
        properties:
          kind: {description: "Circle source kind.", const: circle}
          cx: {description: "Circle center inline coordinate.", type: number, minimum: 0, maximum: 256}
          cy: {description: "Circle center block coordinate.", type: number, minimum: 0, maximum: 256}
          radius: {description: "Positive circle radius.", type: number, exclusiveMinimum: 0, maximum: 128}
      - description: "One filled source rectangle."
        type: object
        required: [kind, x, y, inlineSize, blockSize]
        additionalProperties: false
        properties:
          kind: {description: "Rectangle source kind.", const: rect}
          x: {description: "Rectangle left coordinate.", type: number, minimum: 0, maximum: 256}
          y: {description: "Rectangle top coordinate.", type: number, minimum: 0, maximum: 256}
          inlineSize: {description: "Positive rectangle width.", type: number, exclusiveMinimum: 0, maximum: 256}
          blockSize: {description: "Positive rectangle height.", type: number, exclusiveMinimum: 0, maximum: 256}
      - description: "One stroked source line."
        type: object
        required: [kind, x1, y1, x2, y2, strokeWidth]
        additionalProperties: false
        properties:
          kind: {description: "Line source kind.", const: line}
          x1: {description: "Line start inline coordinate.", type: number, minimum: 0, maximum: 256}
          y1: {description: "Line start block coordinate.", type: number, minimum: 0, maximum: 256}
          x2: {description: "Line end inline coordinate.", type: number, minimum: 0, maximum: 256}
          y2: {description: "Line end block coordinate.", type: number, minimum: 0, maximum: 256}
          strokeWidth: {description: "Positive source stroke width.", type: number, exclusiveMinimum: 0, maximum: 16}
      - description: "One stroked source arc."
        type: object
        required: [kind, cx, cy, radius, startAngle, endAngle, strokeWidth]
        additionalProperties: false
        properties:
          kind: {description: "Arc source kind.", const: arc}
          cx: {description: "Arc center inline coordinate.", type: number, minimum: 0, maximum: 256}
          cy: {description: "Arc center block coordinate.", type: number, minimum: 0, maximum: 256}
          radius: {description: "Positive arc radius.", type: number, exclusiveMinimum: 0, maximum: 256}
          startAngle: {description: "Clockwise start angle in degrees.", type: number}
          endAngle: {description: "Clockwise end angle in degrees.", type: number}
          strokeWidth: {description: "Positive source stroke width.", type: number, exclusiveMinimum: 0, maximum: 16}
