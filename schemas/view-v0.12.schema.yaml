$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "chrona/view-v0.12"
title: "Chrona View v0.12"
description: "Declarative selection and presentation intent for one review surface."
allOf:
  - $ref: "urn:chrona:presentation-resource-v0.1"
  - description: "View document fields extending the shared presentation resource."
    type: object
    properties:
      version: {const: "chrona/view/v0.12"}
      kind: {const: view}
      body:
        type: object
        required: [surface, comparison, visibility, layoutIntent, rows]
        additionalProperties: false
        properties:
          surface: {enum: [table-timeline, dependency-network]}
          colorEncoding:
            type: object
            description: "One closed field-to-colour encoding for eligible planned marks."
            required: [scale, target, source, domain]
            additionalProperties: false
            properties:
              scale: {type: string, minLength: 1}
              target: {const: planned}
              source:
                type: object
                required: [field]
                additionalProperties: false
                properties: {field: {type: string, minLength: 1}}
              domain:
                type: array
                minItems: 1
                uniqueItems: true
                items: {type: string, minLength: 1}
          progressFill:
            type: object
            description: "Optional display-only fraction submark source for completed planned or actual marks."
            required: [source]
            additionalProperties: false
            properties:
              source: {description: "The authoritative fraction source.", enum: [actual, planned]}
          selection:
            type: object
            required: [include]
            additionalProperties: false
            properties:
              include:
                type: object
                additionalProperties: false
                properties:
                  ids: {type: array, uniqueItems: true, items: {type: string, minLength: 1}}
                  types: {type: array, uniqueItems: true, items: {type: string, minLength: 1}}
                  objectTypes: {type: array, uniqueItems: true, items: {type: string, minLength: 1}}
              exclude:
                type: object
                additionalProperties: false
                properties:
                  objectTypes: {type: array, uniqueItems: true, items: {type: string, minLength: 1}}
          grouping:
            type: object
            required: [by]
            additionalProperties: false
            properties:
              by: {enum: [objectType, field, hierarchy, none]}
              field: {type: string, minLength: 1}
              order: {type: array, uniqueItems: true, items: {type: string, minLength: 1}}
              missing: {type: string, minLength: 1}
              presentation: {enum: [band, header]}
              depth: {type: integer, minimum: 0}
              rollup: {enum: [bar, header, none]}
            allOf:
              - description: "Field grouping requires its field name and missing-value label."
                examples: [{by: field, field: status, missing: Unset}]
                if: {properties: {by: {const: field}}, required: [by]}
                then: {required: [field, missing]}
              - description: "Hierarchy grouping requires a depth and rollup presentation."
                examples: [{by: hierarchy, depth: 1, rollup: header}]
                if: {properties: {by: {const: hierarchy}}, required: [by]}
                then: {required: [depth, rollup]}
          ordering:
            type: object
            required: [by, direction, tieBreak]
            additionalProperties: false
            properties:
              by: {enum: [id, title, plannedStart, plannedEnd]}
              direction: {enum: [ascending, descending]}
              tieBreak: {enum: [id, title, plannedStart, plannedFinish]}
          window:
            type: object
            required: [mode]
            additionalProperties: false
            properties:
              mode: {enum: [explicit, selected-planned, selected-comparison]}
              start: {type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$"}
              end: {type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$"}
              marginDays: {type: integer, minimum: 0}
          comparison:
            type: object
            required: [baseline, actual, observationSelection, deltaUnit, facets]
            additionalProperties: false
            properties:
              baseline: {enum: [primary, snapshot, scenario]}
              scenario: {type: string, minLength: 1}
              actual: {enum: [forbidden, optional, required]}
              observationSelection: {const: latest}
              deltaUnit: {const: calendar-days}
              facets: {type: array, uniqueItems: true, items: {enum: [planned, actual, startDelta, finishDelta, atDelta, progress, missingActual, unmatchedActual]}}
          visibility:
            type: object
            required: [labels, relations, annotations]
            additionalProperties: false
            properties:
              labels:
                oneOf:
                  - {type: boolean}
                  - type: object
                    required: [placement, content, side]
                    additionalProperties: false
                    properties:
                      placement: {enum: [plot, table, none]}
                      content: {type: array, minItems: 1, uniqueItems: true, items: {enum: [title, finishDelta]}}
                      side: {enum: [auto, above, below, start, end, inside]}
                      overflow: {enum: [suppress, diagnose]}
              relations:
                oneOf:
                  - {enum: [none, semantic, critical, all]}
                  - type: object
                    required: [mode, overflow]
                    additionalProperties: false
                    properties:
                      mode: {enum: [none, semantic, critical]}
                      overflow: {enum: [suppress, diagnose]}
              annotations:
                oneOf:
                  - {enum: [none, semantic, presentation, all]}
                  - type: object
                    required: [mode, marker]
                    additionalProperties: false
                    properties:
                      mode: {enum: [none, semantic, presentation, all]}
                      marker: {enum: [none, numbered]}
              links: {enum: [none, title, row]}
              fallback:
                type: object
                additionalProperties: false
                properties:
                  labels: {type: array, minItems: 1, uniqueItems: true, items: {enum: [above, below, start, end, inside, suppress]}}
                  annotations: {type: array, minItems: 1, uniqueItems: true, items: {enum: [above, below, start, end, rail, suppress]}}
          axis:
            type: object
            required: [levels, ticks]
            additionalProperties: false
            properties:
              levels:
                type: array
                minItems: 1
                items:
                  type: object
                  required: [unit, format]
                  additionalProperties: false
                  properties:
                    unit: {enum: [day, week, month, quarter, year]}
                    format: {enum: [localized-date, short-month, long-month, numeric-month, short-month-year, long-month-year, numeric-year-month, quarter, year-quarter, quarter-year]}
              ticks: {enum: [day, week, month, quarter, year]}
          markers:
            type: array
            items:
              type: object
              required: [kind, source, label]
              additionalProperties: false
              properties:
                kind: {const: asOf}
                source: {const: actual}
                label: {type: string}
          shading:
            type: object
            additionalProperties: false
            properties:
              nonWorking: {type: boolean}
              exceptions: {type: boolean}
          timePresentation:
            type: object
            additionalProperties: false
            properties:
              axisLevel: {enum: [auto, day, week, month, quarter, year]}
              asOf: {enum: [hidden, line]}
              calendarClosed: {type: boolean}
          annotationPresentation: {enum: [plain, numbered]}
          visuals:
            description: "Closed icon requests resolved by Layout against Context-local catalogs."
            type: array
            items: {$ref: "chrona/view-v0.12#/$defs/visual"}
          layoutIntent:
            type: object
            required: [compactness, itemStacking]
            additionalProperties: false
            properties:
              compactness: {enum: [compact, balanced, expanded]}
              itemStacking: {const: stable}
          tableColumns:
            type: array
            minItems: 1
            uniqueItems: true
            items:
              type: object
              required: [id, source, missing]
              additionalProperties: false
              properties:
                id: {type: string, minLength: 1}
                source:
                  oneOf:
                    - {enum: [id, title, objectType, entity, rowIndex, wbsCode, path, totalFloat]}
                    - type: object
                      required: [field]
                      additionalProperties: false
                      properties: {field: {type: string, minLength: 1}}
                    - type: object
                      required: [comparisonFacet]
                      additionalProperties: false
                      properties: {comparisonFacet: {enum: [startDelta, finishDelta, atDelta, progress, missingActual]}}
                    - type: object
                      required: [facet]
                      additionalProperties: false
                      properties: {facet: {enum: [planned, actual, finishDelta]}}
                    - type: object
                      required: [scenario]
                      additionalProperties: false
                      properties: {scenario: {enum: [id, title]}}
                format: {enum: [text, dateRange, date, signedDays]}
                missing: {enum: [blank, em-dash, unknown, in-progress]}
          annotations:
            type: array
            items:
              type: object
              required: [id, purpose, placement, text]
              additionalProperties: false
              properties:
                id: {type: string, minLength: 1}
                purpose: {enum: [callout, highlight, note, explanatory-arrow]}
                anchor:
                  type: object
                  required: [kind, id]
                  additionalProperties: false
                  properties:
                    kind: {enum: [object, relation, group, temporal]}
                    id: {type: string, minLength: 1}
                    facet: {enum: [planned, actual]}
                    endpoint: {enum: [start, finish, at, body]}
                    rowId: {type: string, minLength: 1}
                    itemId: {type: string, minLength: 1}
                    date: {type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$"}
                placement:
                  type: object
                  required: [side, alignment]
                  additionalProperties: false
                  properties:
                    side: {enum: [above, below, start, end]}
                    alignment: {enum: [start, center, end]}
                text: {type: string}
          rows:
            type: object
            required: [mode]
            additionalProperties: false
            properties:
              mode: {enum: [automatic, explicit]}
              points: {enum: [own-row, group-header, predecessor]}
              items:
                type: array
                minItems: 1
                items:
                  type: object
                  required: [id, depth, items]
                  additionalProperties: false
                  properties:
                    id: {type: string, minLength: 1}
                    label: {type: string, minLength: 1}
                    depth: {type: integer, minimum: 0}
                    parentRow: {type: string, minLength: 1}
                    group: {type: string, minLength: 1}
                    tableSubject: {type: string, minLength: 1}
                    presentation: {$ref: "#/$defs/presentationIntent"}
                    items:
                      type: array
                      minItems: 1
                      items:
                        type: object
                        required: [id, source]
                        additionalProperties: false
                        properties:
                          id: {type: string, minLength: 1}
                          track: {enum: [stacked, shared]}
                          presentation: {$ref: "#/$defs/presentationIntent"}
                          source:
                            type: object
                            required: [kind, object]
                            additionalProperties: false
                            properties:
                              kind: {enum: [primary, snapshot, scenario, actual]}
                              object: {type: string, minLength: 1}
                              scenario: {type: string, minLength: 1}
            allOf:
              - description: "Automatic rows derive rows and cannot declare explicit items."
                examples: [{mode: automatic}]
                if: {properties: {mode: {const: automatic}}}
                then: {not: {required: [items]}}
              - description: "Explicit rows require items and cannot use automatic point policy."
                examples: [{mode: explicit, items: []}]
                if: {properties: {mode: {const: explicit}}}
                then:
                  required: [items]
                  not: {required: [points]}
        allOf:
          - description: "Automatic rows require selection, grouping, ordering, and a window."
            examples: [{rows: {mode: automatic}, selection: {}, grouping: {}, ordering: {}, window: {}}]
            if: {properties: {rows: {properties: {mode: {const: automatic}}, required: [mode]}}}
            then: {required: [selection, grouping, ordering, window]}
          - description: "Scenario comparison requires a scenario identifier."
            examples: [{comparison: {baseline: scenario, scenario: baseline}}]
            if: {properties: {comparison: {properties: {baseline: {const: scenario}}, required: [baseline]}}}
            then: {properties: {comparison: {required: [scenario]}}}
          - description: "Explicit rows prohibit automatic selection, grouping, and ordering."
            examples: [{rows: {mode: explicit}, window: {}}]
            if: {properties: {rows: {properties: {mode: {const: explicit}}, required: [mode]}}}
            then: {not: {anyOf: [{required: [selection]}, {required: [grouping]}, {required: [ordering]}]}, required: [window]}
          - description: "A dependency network omits table-timeline-only presentation fields."
            examples: [{surface: dependency-network}]
            if: {properties: {surface: {const: dependency-network}}, required: [surface]}
            then:
              not:
                anyOf:
                  - {required: [tableColumns]}
                  - {required: [axis]}
                  - {required: [markers]}
                  - {required: [shading]}
                  - {required: [timePresentation]}
                  - {required: [annotations]}
                  - {required: [annotationPresentation]}
$defs:
  visual:
    type: object
    required: [target]
    additionalProperties: false
    properties:
      target:
        $ref: "#/$defs/visualTarget"
      ref: {description: "Direct Context-local set:name icon reference.", type: string, pattern: "^[A-Za-z][A-Za-z0-9_-]*:[A-Za-z0-9][A-Za-z0-9_-]*$"}
      encoding:
        type: object
        required: [field, domain]
        additionalProperties: false
        properties:
          field: {type: string, minLength: 1}
          domain:
            type: object
            minProperties: 1
            additionalProperties: {type: string, pattern: "^[A-Za-z][A-Za-z0-9_-]*:[A-Za-z0-9][A-Za-z0-9_-]*$"}
      side: {enum: [leading, trailing], default: leading}
      decorative: {type: boolean, default: true}
    oneOf:
      - required: [ref]
      - required: [encoding]
    allOf:
      - description: "Field-to-icon encoding is meaningful only for projection-exposed object targets."
        if:
          properties:
            target:
              properties: {kind: {enum: [cell, plot-label, mark]}}
              required: [kind]
          required: [target]
        then: {}
        else:
          not: {required: [encoding]}
  visualTarget:
    description: "One closed visual occurrence selector; no kind admits irrelevant selector fields."
    oneOf:
      - {type: object, required: [kind], additionalProperties: false, properties: {kind: {const: title}}}
      - {type: object, required: [kind], additionalProperties: false, properties: {kind: {const: as-of-label}}}
      - {type: object, required: [kind, id], additionalProperties: false, properties: {kind: {const: column}, id: {type: string, minLength: 1}}}
      - {type: object, required: [kind, id], additionalProperties: false, properties: {kind: {const: group-header}, id: {type: string, minLength: 1}}}
      - {type: object, required: [kind, id], additionalProperties: false, properties: {kind: {const: plot-label}, id: {type: string, minLength: 1}}}
      - {type: object, required: [kind, id], additionalProperties: false, properties: {kind: {const: annotation}, id: {type: string, minLength: 1}}}
      - {type: object, required: [kind, id], additionalProperties: false, properties: {kind: {const: note}, id: {type: string, minLength: 1}}}
      - {type: object, required: [kind, id], additionalProperties: false, properties: {kind: {const: note-index}, id: {type: string, minLength: 1}}}
      - {type: object, required: [kind, id], additionalProperties: false, properties: {kind: {const: group-detail}, id: {type: string, minLength: 1}}}
      - {type: object, required: [kind, panel], additionalProperties: false, properties: {kind: {const: summary}, panel: {type: string, minLength: 1}}}
      - {type: object, required: [kind, panel, metric, part], additionalProperties: false, properties: {kind: {const: summary}, panel: {type: string, minLength: 1}, metric: {type: string, minLength: 1}, part: {enum: [value, caption]}}}
      - {type: object, required: [kind, id], additionalProperties: false, properties: {kind: {const: milestone}, id: {type: string, minLength: 1}}}
      - {type: object, required: [kind, role], additionalProperties: false, properties: {kind: {const: legend}, role: {type: string, minLength: 1}}}
      - {type: object, required: [kind, object, column], additionalProperties: false, properties: {kind: {const: cell}, object: {type: string, minLength: 1}, column: {type: string, minLength: 1}}}
      - {type: object, required: [kind, level, index], additionalProperties: false, properties: {kind: {const: axis-label}, level: {type: string, minLength: 1}, index: {type: integer, minimum: 0}}}
      - {type: object, required: [kind, level, index], additionalProperties: false, properties: {kind: {const: axis-band}, level: {type: string, minLength: 1}, index: {type: integer, minimum: 0}}}
      - {type: object, required: [kind, object, facet], additionalProperties: false, properties: {kind: {const: mark}, object: {type: string, minLength: 1}, facet: {enum: [planned, actual]}}}
      - {type: object, required: [kind, object], additionalProperties: false, properties: {kind: {const: variance-label}, object: {type: string, minLength: 1}}}
  presentationIntent:
    type: object
    description: "Optional placement preferences for a row or item."
    additionalProperties: false
    properties:
      label:
        type: object
        description: "Preferred placement for an item label."
        required: [side]
        additionalProperties: false
        properties: {side: {description: "Preferred side for the label.", enum: [above, below, start, end, inside]}}
      callout:
        type: object
        description: "Preferred placement for an item callout."
        required: [placement]
        additionalProperties: false
        properties: {placement: {description: "Preferred region for the callout.", enum: [above, below, start, end, rail]}}
      text:
        type: object
        description: "Text wrapping preference for the item."
        required: [wrap]
        additionalProperties: false
        properties: {wrap: {description: "Whether the text may wrap.", enum: [allow, forbid]}}
