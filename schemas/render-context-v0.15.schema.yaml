$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "urn:chrona:render-context-v0.15"
title: "Chrona Render Context v0.15"
description: "Pinned inputs, execution environment, and output target for one materialization."
type: object
required: [version, kind, id, body]
additionalProperties: false
properties:
  version: {description: "This Render Context contract version.", const: "chrona/render-context/v0.15"}
  kind: {description: "The resource kind for a Render Context.", const: render-context}
  id: {description: "Stable Render Context identifier.", type: string, minLength: 1}
  body:
    type: object
    description: "Pinned source resources, environment capabilities, and output target."
    required: [project, view, theme, colorScheme, layout, inputs, environment, target]
    additionalProperties: false
    properties:
      project: {description: "Pinned Project input.", $ref: "#/$defs/projectRef"}
      view: {description: "Pinned View input.", $ref: "#/$defs/viewRef"}
      theme: {description: "Pinned Theme input.", $ref: "#/$defs/themeRef"}
      colorScheme: {description: "Pinned Color Scheme input.", $ref: "#/$defs/colorSchemeRef"}
      layout: {description: "Pinned Layout Profile input.", $ref: "#/$defs/layoutRef"}
      inputs:
        type: object
        description: "Optional comparison and profile resources used by materialization."
        additionalProperties: false
        properties:
          actual: {description: "Optional pinned Actual Set input.", $ref: "#/$defs/actualRef"}
          snapshot: {description: "Optional pinned Snapshot input.", $ref: "#/$defs/snapshotRef"}
          summaryProfile: {description: "Optional pinned summary profile.", $ref: "#/$defs/reference"}
          detailProfile: {description: "Optional pinned detail profile.", $ref: "#/$defs/reference"}
          iconCatalogs:
            type: array
            description: "Optional independently pinned immutable icon catalogs."
            minItems: 1
            uniqueItems: true
            items: {description: "One pinned icon catalog.", $ref: "#/$defs/iconCatalogRef"}
      environment:
        type: object
        description: "Deterministic execution environment for Layout and materialization."
        required: [viewport, locale, fontMetrics, scenePrecision]
        additionalProperties: false
        properties:
          viewport:
            type: object
            description: "Available physical viewport dimensions."
            required: [inlineSize, blockSize]
            additionalProperties: false
            properties:
              inlineSize: {description: "Positive available inline size.", type: integer, minimum: 1}
              blockSize: {description: "Positive available block size.", type: integer, minimum: 1}
          locale: {description: "Deterministic locale used for author-selected localized output.", enum: [en-US, ja-JP]}
          fontMetrics: {description: "Immutable measured and rasterizable font assets selected for Layout and output.", $ref: "#/$defs/fontMetrics"}
          scenePrecision: {description: "Nonnegative Scene numeric precision.", type: integer, minimum: 0}
          rasterizer:
            description: "Raster output engine and version evidence."
            examples: [{engine: resvg-py, version: "0.45.1", resvgVersion: "0.45.1", dpi: 96}, {engine: reportlab, svglibVersion: "1.5.1", reportlabVersion: "4.2.0", invariant: true}]
            oneOf:
              - type: object
                description: "resvg-py rasterizer evidence."
                required: [engine, version, resvgVersion, dpi]
                additionalProperties: false
                properties:
                  engine: {description: "Selects the resvg-py engine.", const: resvg-py}
                  version: {description: "Installed Python adapter version.", type: string, minLength: 1}
                  resvgVersion: {description: "Underlying resvg version.", type: string, minLength: 1}
                  dpi: {description: "Positive raster dots per inch.", type: number, exclusiveMinimum: 0}
              - type: object
                description: "ReportLab rasterizer evidence."
                required: [engine, svglibVersion, reportlabVersion, invariant]
                additionalProperties: false
                properties:
                  engine: {description: "Selects the ReportLab engine.", const: reportlab}
                  svglibVersion: {description: "Installed svglib version.", type: string, minLength: 1}
                  reportlabVersion: {description: "Installed ReportLab version.", type: string, minLength: 1}
                  invariant: {description: "Requires deterministic ReportLab output mode.", const: true}
          typesetter:
            type: object
            description: "Text typesetting engine and adapter grammar evidence."
            required: [engine, version, adapterGrammar]
            additionalProperties: false
            properties:
              engine: {description: "Installed typesetting engine.", enum: [typst, tectonic]}
              version: {description: "Installed typesetting engine version.", examples: ["0.12.0"], type: string, pattern: "^[0-9]+(\\.[0-9]+){1,3}([+-][0-9A-Za-z.-]+)?$"}
              adapterGrammar: {description: "Chrona adapter grammar selected for the engine.", enum: [chrona-typst/v0.1, chrona-tikz/v0.1]}
      target:
        type: object
        description: "Requested public output format and capabilities."
        required: [kind, capabilities, visualProfile]
        additionalProperties: false
        properties:
          kind: {description: "Public output format.", enum: [svg, png, pdf, typst, tikz]}
          capabilities:
            type: array
            description: "Unique capabilities required by the chosen output target."
            items: {description: "One required target capability.", type: string, minLength: 1}
            uniqueItems: true
          visualProfile:
            description: "Exact renderer-neutral visual capability profile."
            enum: [chrona-output/visual/v0.5-baseline, chrona-output/visual/v0.6-svg, chrona-output/visual/v0.6-png, chrona-output/visual/v0.7-svg, chrona-output/visual/v0.7-png]
          textMode: {description: "Text placement mode required for typeset targets.", const: positioned}
    allOf:
      - description: "SVG targets do not select a rasterizer or typesetter."
        examples: [{}]
        if: {properties: {target: {properties: {kind: {const: svg}}}}}
        then: {properties: {environment: {not: {anyOf: [{required: [rasterizer]}, {required: [typesetter]}]}}}}
      - description: "PNG and PDF targets require a rasterizer and no typesetter."
        examples: [{}]
        if: {properties: {target: {properties: {kind: {enum: [png, pdf]}}}}}
        then: {properties: {environment: {allOf: [{required: [rasterizer]}, {not: {required: [typesetter]}}]}}}
      - description: "Typst targets require the matching Typst typesetter grammar."
        examples: [{}]
        if: {properties: {target: {properties: {kind: {const: typst}}}}}
        then:
          properties:
            environment: {allOf: [{required: [typesetter]}, {not: {required: [rasterizer]}}, {properties: {typesetter: {properties: {engine: {const: typst}, adapterGrammar: {const: chrona-typst/v0.1}}}}}]}
            target: {required: [textMode]}
      - description: "TikZ targets require the matching Tectonic typesetter grammar."
        examples: [{}]
        if: {properties: {target: {properties: {kind: {const: tikz}}}}}
        then:
          properties:
            environment: {allOf: [{required: [typesetter]}, {not: {required: [rasterizer]}}, {properties: {typesetter: {properties: {engine: {const: tectonic}, adapterGrammar: {const: chrona-tikz/v0.1}}}}}]}
            target: {required: [textMode]}
$defs:
  sha256:
    description: "SHA-256 identity of one immutable declared byte payload."
    examples: ["sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"]
    type: string
    pattern: "^sha256:[0-9a-f]{64}$"
  fontLocator:
    description: "A safe Context-relative or registered package resource location."
    type: object
    required: [provider, address]
    additionalProperties: false
    properties:
      provider: {description: "Local materialized Context assets or a registered package provider.", examples: [context, package], enum: [context, package]}
      identity: {description: "Required immutable package-provider identity.", examples: [chrona.resources], type: string, minLength: 1}
      address: {description: "Safe relative resource address.", examples: [font_metrics/acme-regular.json], type: string, minLength: 1, pattern: "^(?!/)(?!.*(?:^|/)\\.\\.(?:/|$)).+$"}
    allOf:
      - description: "Package locators identify the registered provider."
        examples: [{provider: package, identity: chrona.resources, address: font_metrics/acme-regular.json}]
        if: {properties: {provider: {const: package}}, required: [provider]}
        then: {required: [identity]}
      - description: "Context locators must not impersonate a package provider."
        examples: [{provider: context, address: fonts/acme-regular.ttf}]
        if: {properties: {provider: {const: context}}, required: [provider]}
        then: {not: {required: [identity]}}
  fontMetrics:
    description: "Complete identity-pinned measured assets and optional target-local raster font assets."
    type: object
    required: [algorithm, assets, missingFont]
    additionalProperties: false
    properties:
      algorithm: {description: "Metrics algorithm required for exact font-pair resolution.", const: declared-metrics-v2}
      missingFont: {description: "Draft-only substitution is rejected for immutable Contexts by closure policy.", enum: [diagnose, substitute]}
      assets:
        description: "One exact metrics/font pair for every selectable family and weight."
        type: array
        minItems: 1
        uniqueItems: true
        items:
          description: "A declared measured font face and optional raster payload."
          type: object
          required: [family, weight, metrics]
          additionalProperties: false
          properties:
            family: {description: "CSS family name selected by the Theme.", type: string, minLength: 1}
            weight: {description: "Numeric font weight selected by the Theme.", type: integer, minimum: 1, maximum: 1000}
            metrics:
              description: "Measured glyph advances generated from this exact font face."
              type: object
              required: [locator, contentIdentity]
              additionalProperties: false
              properties:
                locator: {description: "Identity-neutral metrics resource location.", $ref: "#/$defs/fontLocator"}
                contentIdentity: {description: "Exact identity of the metrics JSON bytes.", $ref: "#/$defs/sha256"}
            font:
              description: "Optional rasterizable static TrueType font face, required only by byte-consuming targets."
              type: object
              required: [locator, contentIdentity]
              additionalProperties: false
              properties:
                locator: {description: "Identity-neutral raster-font resource location.", $ref: "#/$defs/fontLocator"}
                contentIdentity: {description: "Exact identity of the font bytes.", $ref: "#/$defs/sha256"}
  reference:
    type: object
    description: "Pinned Store reference to one materialization input resource."
    required: [id, kind, store, address, revision]
    additionalProperties: false
    properties:
      id: {description: "Referenced resource identifier.", type: string, minLength: 1}
      kind: {description: "Referenced resource kind.", type: string, minLength: 1}
      store: {description: "Provider-specific Store identity.", type: object}
      address: {description: "Store-relative resource address.", type: string, minLength: 1}
      revision: {description: "Provider-specific immutable revision.", type: object}
      contentIdentity: {description: "Optional SHA-256 identity of the resource bytes.", examples: ["sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"], type: string, pattern: "^sha256:[0-9a-f]{64}$"}
  projectRef: {description: "Pinned reference constrained to a Project resource.", examples: [{id: project, kind: project, store: {}, address: projects/main.yaml, revision: {}}], allOf: [{$ref: "#/$defs/reference"}, {description: "Requires the referenced resource kind to be Project.", properties: {kind: {const: project}}}]}
  viewRef: {description: "Pinned reference constrained to a View resource.", examples: [{id: view, kind: view, store: {}, address: views/main.yaml, revision: {}}], allOf: [{$ref: "#/$defs/reference"}, {description: "Requires the referenced resource kind to be View.", properties: {kind: {const: view}}}]}
  themeRef: {description: "Pinned reference constrained to a Theme resource.", examples: [{id: theme, kind: theme, store: {}, address: themes/main.yaml, revision: {}}], allOf: [{$ref: "#/$defs/reference"}, {description: "Requires the referenced resource kind to be Theme.", properties: {kind: {const: theme}}}]}
  colorSchemeRef: {description: "Pinned reference constrained to a Color Scheme resource.", examples: [{id: scheme, kind: color-scheme, store: {}, address: schemes/main.yaml, revision: {}}], allOf: [{$ref: "#/$defs/reference"}, {description: "Requires the referenced resource kind to be Color Scheme.", properties: {kind: {const: color-scheme}}}]}
  layoutRef: {description: "Pinned reference constrained to a Layout Profile resource.", examples: [{id: layout, kind: layout-profile, store: {}, address: layouts/main.yaml, revision: {}}], allOf: [{$ref: "#/$defs/reference"}, {description: "Requires the referenced resource kind to be Layout Profile.", properties: {kind: {const: layout-profile}}}]}
  actualRef: {description: "Pinned reference constrained to an Actual Set resource.", examples: [{id: actual, kind: actual-set, store: {}, address: actuals/main.yaml, revision: {}}], allOf: [{$ref: "#/$defs/reference"}, {description: "Requires the referenced resource kind to be Actual Set.", properties: {kind: {const: actual-set}}}]}
  snapshotRef: {description: "Pinned reference constrained to a Snapshot reference resource.", examples: [{id: snapshot, kind: snapshot-ref, store: {}, address: snapshots/main.yaml, revision: {}}], allOf: [{$ref: "#/$defs/reference"}, {description: "Requires the referenced resource kind to be Snapshot reference.", properties: {kind: {const: snapshot-ref}}}]}
  iconCatalogRef: {description: "Pinned reference constrained to an icon catalog resource.", examples: [{id: icons, kind: icon-catalog, store: {}, address: icons/default.yaml, revision: {}}], allOf: [{$ref: "#/$defs/reference"}, {description: "Requires the referenced resource kind to be icon-catalog.", properties: {kind: {const: icon-catalog}}}]}
