$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "chrona/actual-intake-batch-v0.2"
title: "Chrona immutable external Actual intake batch v0.2"
type: object
required: [version, kind, id, body]
additionalProperties: false
properties:
  version: {const: chrona/actual-intake-batch/v0.2}
  kind: {const: actual-intake-batch}
  id: {type: string, minLength: 1}
  body:
    type: object
    required: [source, records]
    additionalProperties: false
    properties:
      source:
        type: object
        required: [system, contentIdentity]
        additionalProperties: false
        properties:
          system: {type: string, minLength: 1}
          contentIdentity: {type: string, pattern: "^sha256:[0-9a-f]{64}$"}
          locator: {type: string, minLength: 1}
      records:
        type: array
        minItems: 1
        items:
          type: object
          required: [externalKey, actual]
          additionalProperties: false
          properties:
            externalKey: {type: [string, integer]}
            projectObjectId: {type: string, minLength: 1}
            actual:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                start: {type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$"}
                finish: {type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$"}
                at: {type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$"}
                progress: {type: number, minimum: 0, maximum: 1}
