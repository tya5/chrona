$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "urn:chrona:color-scheme-v0.1"
title: "Chrona Color Scheme v0.1"
description: "Concrete immutable palette, suitability claims, and palette provenance."
type: object
required: [version, kind, id, body]
additionalProperties: false
properties:
  version: {description: "This Color Scheme contract version.", const: "chrona/color-scheme/v0.1"}
  kind: {description: "The resource kind for a concrete color palette.", const: color-scheme}
  id: {description: "Stable Color Scheme identifier.", type: string, minLength: 1}
  body:
    type: object
    description: "Concrete colors, category colors, suitability claims, and provenance."
    required: [colors, category, suitability, provenance]
    additionalProperties: false
    properties:
      colors:
        type: object
        description: "Named concrete colors selected by Theme color bindings."
        required: [surface, surfaceRaised, text, textMuted, accent, positive, negative, warning, neutral, insideLabelPlanned, insideLabelActual, insideLabelSnapshot, insideLabelScenario]
        additionalProperties: false
        properties:
          surface: {description: "Canvas surface color.", $ref: "#/$defs/color"}
          surfaceRaised: {description: "Raised surface color.", $ref: "#/$defs/color"}
          text: {description: "Primary text color.", $ref: "#/$defs/color"}
          textMuted: {description: "Secondary text color.", $ref: "#/$defs/color"}
          accent: {description: "Accent color.", $ref: "#/$defs/color"}
          positive: {description: "Positive-state color.", $ref: "#/$defs/color"}
          negative: {description: "Negative-state color.", $ref: "#/$defs/color"}
          warning: {description: "Warning-state color.", $ref: "#/$defs/color"}
          neutral: {description: "Neutral-state color.", $ref: "#/$defs/color"}
          insideLabelPlanned: {description: "Text color on planned marks.", $ref: "#/$defs/color"}
          insideLabelActual: {description: "Text color on actual marks.", $ref: "#/$defs/color"}
          insideLabelSnapshot: {description: "Text color on snapshot marks.", $ref: "#/$defs/color"}
          insideLabelScenario: {description: "Text color on scenario marks.", $ref: "#/$defs/color"}
      category:
        type: array
        description: "One or more concrete colors available for category roles."
        minItems: 1
        items: {$ref: "#/$defs/color"}
      suitability:
        type: object
        description: "Declared palette suitability; these claims do not change color resolution."
        required: [background, colorVision, print]
        additionalProperties: false
        properties:
          background: {description: "Background contrast the scheme targets.", enum: [light, dark]}
          colorVision:
            type: array
            description: "Color-vision conditions considered by the scheme."
            minItems: 1
            uniqueItems: true
            items: {description: "One considered color-vision condition.", enum: [none-claimed, deuteranopia, protanopia, tritanopia]}
          print: {description: "Print suitability claim for the scheme.", enum: [not-claimed, print-friendly, photocopy-friendly]}
      provenance:
        type: object
        description: "Authorship, source, and license for this palette."
        required: [kind, source, license]
        additionalProperties: false
        properties:
          kind: {description: "Whether Chrona authored or imported the scheme.", enum: [chrona-authored, external]}
          source: {description: "Human-readable source of the color scheme.", type: string, minLength: 1}
          license: {description: "License or usage terms for the source.", type: string, minLength: 1}
$defs:
  color: {description: "Six-digit hexadecimal RGB color.", examples: ["#336699"], type: string, pattern: "^#[0-9A-Fa-f]{6}$"}
