$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "chrona/presentation-preset-v0.1"
title: "Chrona declarative presentation preset v0.1"
description: "Pinned package of compatible presentation resource references."
type: object
required: [version, kind, id, body]
additionalProperties: false
properties:
  version: {description: "This presentation-preset contract version.", const: chrona/presentation-preset/v0.1}
  kind: {description: "The resource kind for a presentation preset.", const: presentation-preset}
  id: {description: "Stable preset identifier.", type: string, minLength: 1}
  body:
    type: object
    description: "Package version, resource references, and compatible color schemes."
    required: [package, resources, compatibleColorSchemes]
    additionalProperties: false
    properties:
      package:
        type: object
        description: "Versioned preset package metadata."
        required: [version]
        additionalProperties: false
        properties: {version: {description: "Preset package version.", type: string, minLength: 1}}
      resources:
        type: object
        description: "View, Theme, Scheme, Layout, and explicitly closed optional icon catalogs supplied by the preset."
        required: [view, theme, colorScheme, layout]
        additionalProperties: false
        properties:
          view: {description: "Preset View resource.", $ref: "#/$defs/resource"}
          theme: {description: "Preset Theme resource.", $ref: "#/$defs/resource"}
          colorScheme: {description: "Preset Color Scheme resource.", $ref: "#/$defs/resource"}
          layout: {description: "Preset Layout Profile resource.", $ref: "#/$defs/resource"}
          detailProfile: {description: "Optional review-detail profile (for example a legend) applied unless an explicit detail profile is given.", $ref: "#/$defs/detailProfileResource"}
          summaryProfile: {description: "Optional Summary Profile, overridden by an explicit summary input.", $ref: "#/$defs/summaryProfileResource"}
          iconCatalogs:
            description: "Optional ordered icon catalogs closed by this preset; no catalog discovery occurs."
            type: array
            uniqueItems: true
            items: {$ref: "#/$defs/iconCatalogResource"}
          fontSets:
            description: "Optional packaged font sets the preset needs (#429): each names a set of font-sets.yaml (the Render Context's fontMetrics.fontSet names). A draft render of the preset measures with those faces unless --font-metrics is given."
            type: array
            minItems: 1
            uniqueItems: true
            items: {description: "Packaged font set id.", enum: [chrona.noto-sans, chrona.noto-sans+jp]}
      visualProfile:
        type: object
        description: "Optional visual-profile preference used when no visual profile is given explicitly."
        required: [preferred]
        additionalProperties: false
        properties:
          preferred:
            description: "Exact visual capability profile preferred by this preset; it must serve the selected target."
            $ref: "urn:chrona:vocabulary-v0.2#/$defs/visualProfile"
      compatibleColorSchemes:
        type: array
        description: "Color Scheme resources compatible with this preset."
        minItems: 1
        uniqueItems: true
        items: {$ref: "#/$defs/resource"}
$defs:
  resource:
    type: object
    description: "Pinned relative reference to one preset resource."
    required: [id, kind, path]
    additionalProperties: false
    properties:
      id: {description: "Stable referenced resource identifier.", type: string, minLength: 1}
      kind: {description: "Kind of the referenced presentation resource.", enum: [view, theme, color-scheme, layout-profile]}
      path: {description: "Safe relative path to the referenced resource.", examples: ["views/overview.yaml"], minLength: 1, $ref: "urn:chrona:common-v0.1#/$defs/safeRelativePath"}
  detailProfileResource:
    type: object
    description: "Pinned review-detail profile supplied by the preset."
    required: [id, kind, path]
    additionalProperties: false
    properties:
      id: {description: "Stable review-detail profile identifier.", type: string, minLength: 1}
      kind: {description: "The only permitted detail resource kind.", const: review-detail-profile}
      path: {description: "Safe relative path to the review-detail profile document.", examples: ["detail.yaml"], minLength: 1, $ref: "urn:chrona:common-v0.1#/$defs/safeRelativePath"}
  summaryProfileResource:
    type: object
    description: "Pinned Summary Profile supplied by the preset."
    required: [id, kind, path]
    additionalProperties: false
    properties:
      id: {description: "Stable Summary Profile identifier.", type: string, minLength: 1}
      kind: {description: "The only permitted summary resource kind.", const: summary-profile}
      path: {description: "Safe relative path to the Summary Profile document.", examples: ["summary.yaml"], minLength: 1, $ref: "urn:chrona:common-v0.1#/$defs/safeRelativePath"}
  iconCatalogResource:
    type: object
    description: "Pinned icon catalog resource supplied by the preset."
    required: [id, kind, path]
    additionalProperties: false
    properties:
      id: {description: "Stable icon catalog identifier.", type: string, minLength: 1}
      kind: {description: "The only permitted icon resource kind.", const: icon-catalog}
      path: {description: "Safe relative path to the catalog document.", examples: ["icons/material.yaml"], minLength: 1, $ref: "urn:chrona:common-v0.1#/$defs/safeRelativePath"}
