$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "chrona/presentation-preset-v0.1"
title: "Chrona declarative presentation preset v0.1"
type: object
required: [version, kind, id, body]
additionalProperties: false
properties:
  version: {const: chrona/presentation-preset/v0.1}
  kind: {const: presentation-preset}
  id: {type: string, minLength: 1}
  body:
    type: object
    required: [package, resources, compatibleColorSchemes]
    additionalProperties: false
    properties:
      package:
        type: object
        required: [version]
        additionalProperties: false
        properties: {version: {type: string, minLength: 1}}
      resources:
        type: object
        required: [view, theme, colorScheme, layout]
        additionalProperties: false
        properties:
          view: {$ref: "#/$defs/resource"}
          theme: {$ref: "#/$defs/resource"}
          colorScheme: {$ref: "#/$defs/resource"}
          layout: {$ref: "#/$defs/resource"}
      compatibleColorSchemes:
        type: array
        minItems: 1
        uniqueItems: true
        items: {$ref: "#/$defs/resource"}
$defs:
  resource:
    type: object
    required: [id, kind, path]
    additionalProperties: false
    properties:
      id: {type: string, minLength: 1}
      kind: {enum: [view, theme, color-scheme, layout-profile]}
      path: {type: string, minLength: 1, pattern: "^(?!.*(?:^|/)\\.{1,2}(?:/|$))[A-Za-z0-9][A-Za-z0-9._/-]*$"}
