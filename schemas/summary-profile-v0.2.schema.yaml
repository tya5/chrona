$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "chrona/summary-profile-v0.2"
title: "Chrona Summary Profile v0.2"
allOf:
  - $ref: "urn:chrona:presentation-resource-v0.1"
  - type: object
    properties:
      version: {const: chrona/summary-profile/v0.1}
      kind: {const: summary-profile}
      body:
        type: object
        required: [panels]
        additionalProperties: false
        properties:
          panels:
            type: array
            minItems: 1
            items:
              type: object
              required: [id, metrics]
              additionalProperties: false
              properties:
                id: {type: string, minLength: 1}
                title: {type: string}
                presentation: {enum: [lines, figures]}
                metrics:
                  oneOf:
                    - type: object
                      minProperties: 1
                      additionalProperties:
                        oneOf:
                          - {type: string}
                          - {$ref: "#/$defs/typedMetric"}
                    - type: array
                      minItems: 1
                      items:
                        allOf:
                          - {$ref: "#/$defs/typedMetric"}
                          - required: [id]
                            properties: {id: {type: string, minLength: 1}}
$defs:
  typedMetric:
    type: object
    required: [source, format]
    additionalProperties: false
    properties:
      id: {type: string, minLength: 1}
      label: {type: string}
      scope: {enum: [subtree]}
      source:
        oneOf:
          - {enum: [actual.asOf, planned.nextPoint, count.selected, count.missingActual, count.knownFinishVariance]}
          - type: object
            required: [actual]
            additionalProperties: false
            properties: {actual: {const: asOf}}
          - type: object
            required: [counts]
            additionalProperties: false
            properties: {counts: {const: finishDelta}}
          - type: object
            required: [scenario]
            additionalProperties: false
            properties: {scenario: {enum: [id, title]}}
          - type: object
            required: [object, facet]
            additionalProperties: false
            properties:
              object: {type: string, minLength: 1}
              facet: {const: planned}
      format: {enum: [text, date, count, signedDays]}
    allOf:
      - if:
          required: [scope]
        then:
          properties:
            source:
              type: object
              required: [object, facet]
              additionalProperties: false
              properties:
                object: {type: string, minLength: 1}
                facet: {const: planned}
