$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "chrona/authoring-command-v0.1"
title: "Chrona guided authoring command v0.1"
type: object
required: [version, commandId, type, target, baseRevision, payload]
additionalProperties: false
properties:
  version: {const: chrona/authoring-command/v0.1}
  commandId: {type: string, minLength: 1}
  type: {enum: [setWorkspaceTask, setWorkspaceActual, selectPresentationPreset, setPresentationOverride, materializePresentationPreset]}
  target:
    type: object
    required: [kind, path]
    additionalProperties: false
    properties:
      kind: {const: authoring-workspace}
      path: {type: string, minLength: 1}
  baseRevision: {type: string, pattern: "^sha256:[0-9a-f]{64}$"}
  payload: {type: object}
allOf:
  - if: {properties: {type: {const: setWorkspaceTask}}}
    then:
      properties:
        payload:
          type: object
          required: [task]
          additionalProperties: false
          properties:
            task:
              type: object
              required: [id, title, planned]
              additionalProperties: false
              properties:
                id: {type: string, minLength: 1}
                title: {type: string, minLength: 1}
                planned:
                  type: object
                  required: [start, finish]
                  additionalProperties: false
                  properties:
                    start: {type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$"}
                    finish: {type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$"}
  - if: {properties: {type: {const: setWorkspaceActual}}}
    then:
      properties:
        payload:
          type: object
          required: [actual]
          additionalProperties: false
          properties:
            actual:
              type: object
              required: [taskId, actual]
              additionalProperties: false
              properties:
                taskId: {type: string, minLength: 1}
                actual:
                  type: object
                  required: [start, finish]
                  additionalProperties: false
                  properties:
                    start: {type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$"}
                    finish: {type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$"}
                progress: {type: number, minimum: 0, maximum: 1}
  - if: {properties: {type: {const: selectPresentationPreset}}}
    then:
      properties:
        payload:
          type: object
          required: [preset]
          additionalProperties: false
          properties:
            preset:
              type: object
              required: [id, version, path]
              additionalProperties: false
              properties:
                id: {type: string, minLength: 1}
                version: {type: string, minLength: 1}
                path: {type: string, minLength: 1}
  - if: {properties: {type: {const: setPresentationOverride}}}
    then:
      properties:
        payload:
          type: object
          required: [overrides]
          additionalProperties: false
          properties: {overrides: {type: object}}
  - if: {properties: {type: {const: materializePresentationPreset}}}
    then:
      properties:
        payload:
          type: object
          additionalProperties: false
          properties:
            directory: {type: string, minLength: 1}
