$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "chrona/authoring-command-v0.1"
title: "Chrona guided authoring command v0.1"
description: "One optimistic-concurrency command for a guided authoring workspace."
type: object
required: [version, commandId, type, target, baseRevision, payload]
additionalProperties: false
properties:
  version: {description: "This authoring-command contract version.", const: chrona/authoring-command/v0.1}
  commandId: {description: "Stable identifier for this command.", type: string, minLength: 1}
  type: {description: "Operation to apply to the workspace.", enum: [setWorkspaceTask, removeWorkspaceTask, setWorkspaceActual, removeWorkspaceActual, selectPresentationPreset, setPresentationOverride, removePresentationOverride, materializePresentationPreset]}
  target:
    type: object
    description: "Guided authoring workspace selected by the command."
    required: [kind, path]
    additionalProperties: false
    properties:
      kind: {description: "The only command target resource kind.", const: authoring-workspace}
      path: {description: "Workspace file name in the configured store: one name, no path separator or control character.", $ref: "urn:chrona:common-v0.1#/$defs/fileName"}
  baseRevision: {description: "SHA-256 identity required for optimistic concurrency.", examples: ["sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"], $ref: "urn:chrona:common-v0.1#/$defs/sha256Identity"}
  payload: {description: "Operation-specific command content.", type: object}
allOf:
  - description: "Task-edit commands require one complete compact task payload."
    examples: [{}]
    if: {properties: {type: {const: setWorkspaceTask}}}
    then:
      properties:
        payload:
          type: object
          required: [task]
          additionalProperties: false
          properties:
            index: {description: "Optional position at which a NEW task is inserted (0 = first); omitted appends. Refused for a task that already exists. Inverses of a removal carry it.", type: integer, minimum: 0}
            task:
              type: object
              required: [id, title, planned]
              additionalProperties: false
              properties:
                id: {type: string, minLength: 1}
                title: {type: string, minLength: 1}
                planned:
                  type: object
                  required: [start, finish]
                  additionalProperties: false
                  properties:
                    start: {$ref: "urn:chrona:common-v0.1#/$defs/isoDate"}
                    finish: {$ref: "urn:chrona:common-v0.1#/$defs/isoDate"}
  - description: "Task-removal commands name the task."
    examples: [{}]
    if: {properties: {type: {const: removeWorkspaceTask}}}
    then:
      properties:
        payload:
          type: object
          required: [taskId]
          additionalProperties: false
          properties:
            taskId: {description: "The task to remove; refused while an actual still names it.", type: string, minLength: 1}
  - description: "Actual-removal commands name the task whose observation is removed."
    examples: [{}]
    if: {properties: {type: {const: removeWorkspaceActual}}}
    then:
      properties:
        payload:
          type: object
          required: [taskId]
          additionalProperties: false
          properties:
            taskId: {description: "The task whose observation is removed.", type: string, minLength: 1}
  - description: "Override-removal commands carry no payload members."
    examples: [{}]
    if: {properties: {type: {const: removePresentationOverride}}}
    then:
      properties:
        payload:
          type: object
          additionalProperties: false
  - description: "Actual-edit commands require one complete compact observation payload."
    examples: [{}]
    if: {properties: {type: {const: setWorkspaceActual}}}
    then:
      properties:
        payload:
          type: object
          required: [actual]
          additionalProperties: false
          properties:
            index: {description: "Optional position at which a NEW observation is inserted (0 = first); omitted appends. Refused for a task that already has one. Inverses of a removal carry it.", type: integer, minimum: 0}
            actual:
              type: object
              required: [taskId, actual]
              additionalProperties: false
              properties:
                taskId: {type: string, minLength: 1}
                actual:
                  type: object
                  required: [start, finish]
                  additionalProperties: false
                  properties:
                    start: {$ref: "urn:chrona:common-v0.1#/$defs/isoDate"}
                    finish: {$ref: "urn:chrona:common-v0.1#/$defs/isoDate"}
                progress: {type: number, minimum: 0, maximum: 1}
  - description: "Preset-selection commands require a pinned preset payload."
    examples: [{}]
    if: {properties: {type: {const: selectPresentationPreset}}}
    then:
      properties:
        payload:
          type: object
          required: [preset]
          additionalProperties: false
          properties:
            preset:
              type: object
              required: [id, version, path]
              additionalProperties: false
              properties:
                id: {type: string, minLength: 1}
                version: {type: string, minLength: 1}
                path: {description: "Safe relative path to the pinned preset document.", minLength: 1, $ref: "urn:chrona:common-v0.1#/$defs/safeRelativePath"}
  - description: "Override commands require an override payload."
    examples: [{}]
    if: {properties: {type: {const: setPresentationOverride}}}
    then:
      properties:
        payload:
          type: object
          required: [overrides]
          additionalProperties: false
          properties: {overrides: {type: object}}
  - description: "Materialization commands accept only the optional output directory."
    examples: [{}]
    if: {properties: {type: {const: materializePresentationPreset}}}
    then:
      properties:
        payload:
          type: object
          additionalProperties: false
          properties:
            directory: {description: "Safe relative output directory.", minLength: 1, $ref: "urn:chrona:common-v0.1#/$defs/safeRelativePath"}
