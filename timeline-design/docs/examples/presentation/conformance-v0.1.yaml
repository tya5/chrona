cases:
  - id: style-plan-actual
    resource: styles/plan-actual.yaml
    schema: ../../schemas/style-v0.1.schema.yaml
  - id: command-accepted-shape
    resource: commands/edit-actual-accepted.yaml
    schema: ../../schemas/command-request-v0.1.schema.yaml
  - id: command-stale-shape
    resource: commands/edit-actual-rejected.yaml
    schema: ../../schemas/command-request-v0.1.schema.yaml
  - id: local-actual-delta
    resource: scene-delta-local-actual.yaml
    expect: {replaceScope: null}
  - id: global-viewport-delta
    resource: scene-delta-global-viewport.yaml
    schema: ../../schemas/scene-delta-v0.1.schema.yaml
    expect: {replaceScope: scene}
  - id: local-actual-delta-schema
    resource: scene-delta-local-actual.yaml
    schema: ../../schemas/scene-delta-v0.1.schema.yaml
  - id: snapshot-capture-shape
    resource: commands/capture-snapshot.yaml
    schema: ../../schemas/command-request-v0.1.schema.yaml
  - id: actual-resolution-shape
    resource: commands/resolve-actual.yaml
    schema: ../../schemas/command-request-v0.1.schema.yaml
  - id: annotation-view
    resource: views/controller-risk-review.yaml
    schema: ../../schemas/view-v0.1.schema.yaml
  - id: independent-customer-context
    resource: contexts/controller-customer.yaml
    schema: ../../schemas/render-context-v0.1.schema.yaml
  - id: revision-bound-wrong-view-id
    resource: contexts/controller-customer-wrong-view-id.yaml
    schema: ../../schemas/render-context-v0.1.schema.yaml
    expectDiagnostics: [PRES-REF-IDENTITY]
  - id: snapshot-immutable-revision
    resource: snapshots/baseline-q2.yaml
    schema: ../../schemas/snapshot-ref-v0.1.schema.yaml
  - id: actual-alignment
    resource: actuals/controller-observed.yaml
    schema: ../../schemas/actual-set-v0.1.schema.yaml
