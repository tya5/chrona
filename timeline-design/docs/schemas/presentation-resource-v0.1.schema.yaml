$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "urn:chrona:presentation-resource-v0.1"
title: "Chrona Presentation Resource v0.1"
type: object
required: [version, kind, id, body]
additionalProperties: false

properties:
  version:
    const: "chrona/presentation/v0.1"
  kind:
    type: string
    minLength: 1
  id:
    type: string
    minLength: 1
  body: {}

$defs:
  resourceRef:
    type: object
    required: [id, kind, path, revision, contentIdentity]
    additionalProperties: false
    properties:
      id:
        type: string
        minLength: 1
      kind:
        type: string
        minLength: 1
      path:
        type: string
        minLength: 1
        pattern: "^(?!.*(?:^|/)\\.{1,2}(?:/|$))[A-Za-z0-9][A-Za-z0-9._/-]*$"
      revision:
        type: string
        pattern: "^git:[0-9A-Fa-f]{40,64}$"
      contentIdentity:
        type: string
        pattern: "^sha256:[0-9a-f]{64}$"

  projectRef:
    type: object
    required: [id, kind, path, revision, contentIdentity]
    additionalProperties: false
    properties:
      id:
        type: string
        minLength: 1
      kind:
        const: project
      path:
        type: string
        minLength: 1
        pattern: "^(?!.*(?:^|/)\\.{1,2}(?:/|$))[A-Za-z0-9][A-Za-z0-9._/-]*$"
      revision:
        type: string
        pattern: "^git:[0-9A-Fa-f]{40,64}$"
      contentIdentity:
        type: string
        pattern: "^sha256:[0-9a-f]{64}$"

  viewRef:
    allOf:
      - $ref: "#/$defs/resourceRef"
      - properties: {kind: {const: view}}
  styleRef:
    allOf:
      - $ref: "#/$defs/resourceRef"
      - properties: {kind: {const: style}}
  themeRef:
    allOf:
      - $ref: "#/$defs/resourceRef"
      - properties: {kind: {const: theme}}
  sceneProfileRef:
    allOf:
      - $ref: "#/$defs/resourceRef"
      - properties: {kind: {const: scene-profile}}
  snapshotRef:
    allOf:
      - $ref: "#/$defs/resourceRef"
      - properties: {kind: {const: snapshot-ref}}
  actualSetRef:
    allOf:
      - $ref: "#/$defs/resourceRef"
      - properties: {kind: {const: actual-set}}
