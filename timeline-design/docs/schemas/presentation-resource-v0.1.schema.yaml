$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "chrona/presentation-resource-v0.1"
title: "Chrona Presentation Resource v0.1"
type: object
required: [version, kind, id, body]
additionalProperties: false

properties:
  version:
    const: "chrona/presentation/v0.1"
  kind:
    type: string
    minLength: 1
  id:
    type: string
    minLength: 1
  body: {}

$defs:
  resourceRef:
    type: object
    required: [id, path]
    additionalProperties: false
    properties:
      id:
        type: string
        minLength: 1
      path:
        type: string
        minLength: 1

  projectRef:
    type: object
    required: [path, revision]
    additionalProperties: false
    properties:
      path:
        type: string
        minLength: 1
      revision:
        type: string
        pattern: "^(?:git:[0-9A-Fa-f]{7,64}|store:\\S+)$"
