$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "urn:chrona:render-context-v0.2"
title: "Chrona Render Context v0.2"
type: object
required: [version, kind, id, body]
additionalProperties: false
properties:
  version: {const: chrona/presentation/v0.2}
  kind: {const: render-context}
  id: {type: string, minLength: 1}
  body:
    type: object
    required: [project, view, style, theme, sceneProfile, federationPlan, evaluation, viewport, target, layoutMetrics]
    additionalProperties: false
    properties:
      project: {$ref: "#/$defs/projectRef"}
      view: {$ref: "#/$defs/viewRef"}
      style: {$ref: "#/$defs/styleRef"}
      theme: {$ref: "#/$defs/themeRef"}
      sceneProfile: {$ref: "#/$defs/sceneProfileRef"}
      federationPlan:
        allOf:
          - $ref: "#/$defs/resourceRef"
          - properties: {kind: {const: federation-plan}}
      inputs:
        type: object
        additionalProperties: false
        properties:
          snapshot: {$ref: "#/$defs/snapshotRef"}
          actual: {$ref: "#/$defs/actualSetRef"}
      evaluation:
        type: object
        required: [locale]
        additionalProperties: false
        properties: {locale: {type: string, minLength: 2}}
      viewport:
        type: object
        required: [width, height, margins, clipping]
        additionalProperties: false
        properties:
          width: {type: number, exclusiveMinimum: 0}
          height: {type: number, exclusiveMinimum: 0}
          margins:
            type: object
            required: [top, right, bottom, left]
            additionalProperties: false
            properties:
              top: {type: number, minimum: 0}
              right: {type: number, minimum: 0}
              bottom: {type: number, minimum: 0}
              left: {type: number, minimum: 0}
          clipping: {enum: [clip, overflow]}
      target:
        type: object
        required: [kind, capabilities]
        additionalProperties: false
        properties: {kind: {type: string}, capabilities: {type: array, uniqueItems: true, items: {type: string}}}
      layoutMetrics:
        type: object
        required: [id, revision, contentIdentity, algorithmVersion]
        additionalProperties: false
        properties:
          id: {type: string}
          revision: {type: string, pattern: "^metric:"}
          contentIdentity: {type: string, pattern: "^sha256:[0-9a-f]{64}$"}
          algorithmVersion: {type: string}
$defs:
  resourceRef:
    $ref: "urn:chrona:revision-store-resource-ref-v0.1"
  projectRef:
    allOf: [{$ref: "#/$defs/resourceRef"}, {properties: {kind: {const: project}}}]
  viewRef:
    allOf: [{$ref: "#/$defs/resourceRef"}, {properties: {kind: {const: view}}}]
  styleRef:
    allOf: [{$ref: "#/$defs/resourceRef"}, {properties: {kind: {const: style}}}]
  themeRef:
    allOf: [{$ref: "#/$defs/resourceRef"}, {properties: {kind: {const: theme}}}]
  sceneProfileRef:
    allOf: [{$ref: "#/$defs/resourceRef"}, {properties: {kind: {const: scene-profile}}}]
  snapshotRef:
    allOf: [{$ref: "#/$defs/resourceRef"}, {properties: {kind: {const: snapshot-ref}}}]
  actualSetRef:
    allOf: [{$ref: "#/$defs/resourceRef"}, {properties: {kind: {const: actual-set}}}]
