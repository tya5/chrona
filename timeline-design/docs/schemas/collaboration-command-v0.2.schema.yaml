$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "urn:chrona:collaboration-command-v0.2"
title: "Chrona collaboration command v0.2"
type: object
required: [version, commandId, type, target, baseRevision, actor, payload]
additionalProperties: false
properties:
  version: {const: "chrona/collaboration-command/v0.2"}
  commandId: {type: string, minLength: 1}
  type: {enum: [submitCommand, resolveMergeConflict]}
  target: {type: object, required: [kind, id], properties: {kind: {type: string}, id: {type: string}}}
  baseRevision: {type: string, minLength: 1}
  actor: {type: object, required: [principal, policyVersion], properties: {principal: {type: string}, policyVersion: {type: string}}}
  approval: {type: object, required: [commandFingerprint, expiresAt], properties: {commandFingerprint: {type: string}, expiresAt: {type: string, format: date-time}}}
  payload: {type: object}
