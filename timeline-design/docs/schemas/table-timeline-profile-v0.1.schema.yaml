$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "urn:chrona:table-timeline-profile-v0.1"
type: object
additionalProperties: false
required: [version, id, table, axis, groups, routing]
properties:
  version: {const: "chrona/table-timeline-profile/v0.1"}
  id: {type: string, minLength: 1}
  table:
    type: object
    additionalProperties: false
    required: [columnSizing, header]
    properties:
      columnSizing: {enum: [content-bounded, balanced, fixed-profile]}
      header: {enum: [single-row, grouped]}
  axis:
    type: object
    additionalProperties: false
    required: [domain, levels, minorGrid, majorGrid]
    properties:
      domain: {const: date}
      levels: {type: array, minItems: 2, maxItems: 3, uniqueItems: true, items: {enum: [quarter, month, week]}}
      minorGrid: {enum: [week, none]}
      majorGrid: {enum: [month, quarter]}
  groups:
    type: object
    additionalProperties: false
    required: [mode, gapRows]
    properties:
      mode: {enum: [none, separator, band, header-and-separator]}
      gapRows: {type: integer, minimum: 0, maximum: 4}
  routing:
    type: object
    additionalProperties: false
    required: [relations, annotations]
    properties:
      relations: {const: deterministic-obstacle-aware}
      annotations: {const: deterministic-obstacle-aware}
