$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "urn:chrona:review-summary-profile-v0.1"
type: object
additionalProperties: false
required: [version, id, panels]
properties:
  version: {const: "chrona/review-summary-profile/v0.1"}
  id: {type: string, minLength: 1}
  panels:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: object
      additionalProperties: false
      required: [id, metrics]
      properties:
        id: {type: string, minLength: 1}
        metrics:
          type: array
          minItems: 1
          uniqueItems: true
          items: {enum: [selectedCount, actualCoverage, knownFinishVarianceCount, nextPlannedPoint, missingActualCount]}
