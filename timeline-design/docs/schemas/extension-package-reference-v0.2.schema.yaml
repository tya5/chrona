$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "urn:chrona:extension-package-reference-v0.2"
title: "Chrona extension package reference v0.2"
type: object
required: [packageId, version, source, contentIdentity]
additionalProperties: false
properties:
  packageId: {type: string, minLength: 1}
  version: {type: string, pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+"}
  source: {type: object, required: [provider, identity], properties: {provider: {type: string}, identity: {type: string}}}
  contentIdentity: {type: string, pattern: "^sha256:"}
  requires: {type: object}
  dependencies: {type: array, items: {type: object}}
