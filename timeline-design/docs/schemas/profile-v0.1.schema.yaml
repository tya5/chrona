$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "urn:chrona:profile-v0.1"
type: object
required: [version, packageId, requires, profiles]
additionalProperties: false
properties:
  version: {const: chrona/profile/v0.1}
  packageId: {type: string, minLength: 1}
  requires:
    type: object
    required: [projectFormat]
    additionalProperties: false
    properties: {projectFormat: {const: timeline/v0.1}}
  profiles:
    type: object
    minProperties: 1
    additionalProperties:
      type: object
      required: [extends]
      additionalProperties: false
      properties:
        extends: {type: string, minLength: 1}
  fields:
    type: object
    additionalProperties:
      type: object
      required: [type]
      additionalProperties: false
      properties:
        type: {enum: [string, boolean, integer, number, date]}
