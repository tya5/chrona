$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "urn:chrona:timeline-export-v0.1"
title: "Chrona Timeline Export v0.1"
type: object
required: [version, kind, id, project, objects, interfaceMilestones, progressAggregation]
additionalProperties: false
properties:
  version: {const: chrona/timeline-export/v0.1}
  kind: {const: timeline-export}
  id: {type: string, minLength: 1}
  project:
    type: object
    required: [id, revision, contentIdentity]
    additionalProperties: false
    properties:
      id: {type: string, minLength: 1}
      revision: {type: string, pattern: "^git:[0-9A-Fa-f]{40,64}$"}
      contentIdentity: {type: string, pattern: "^sha256:[0-9a-f]{64}$"}
  objects:
    type: array
    minItems: 1
    items:
      type: object
      required: [id, kind, title, schedule]
      additionalProperties: false
      properties:
        id: {type: string, minLength: 1}
        kind: {enum: [milestone, span]}
        title: {type: string}
        schedule:
          oneOf:
            - type: object
              required: [at]
              additionalProperties: false
              properties: {at: {type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$"}}
            - type: object
              required: [start, end]
              additionalProperties: false
              properties:
                start: {type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$"}
                end: {type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$"}
        progress: {type: number, minimum: 0, maximum: 1}
  interfaceMilestones:
    type: array
    uniqueItems: true
    items: {type: string, minLength: 1}
  progressAggregation:
    type: object
    required: [method]
    additionalProperties: false
    properties:
      method: {enum: [none, explicit, weighted-object-progress]}
      value: {type: number, minimum: 0, maximum: 1}
allOf:
  - if: {properties: {progressAggregation: {properties: {method: {const: explicit}}}}}
    then: {properties: {progressAggregation: {required: [value]}}}
