$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "urn:chrona:review-svg-profile-v0.1"
type: object
additionalProperties: false
required: [version, id, axis, comparison, missingActual, annotations]
properties:
  version: {const: "chrona/review-svg-profile/v0.1"}
  id: {type: string, minLength: 1}
  axis:
    type: object
    additionalProperties: false
    required: [domain, grid, labels]
    properties:
      domain: {const: date}
      grid: {const: weekly}
      labels: {const: month}
  comparison:
    type: object
    additionalProperties: false
    required: [planned, actual, variance]
    properties:
      planned: {const: upper}
      actual: {const: lower}
      variance: {const: labelled-calendar-days}
  missingActual:
    type: object
    additionalProperties: false
    required: [treatment]
    properties: {treatment: {const: hatch-and-text}}
  annotations:
    type: object
    additionalProperties: false
    required: [layout]
    properties: {layout: {const: deterministic-callout-leader}}
