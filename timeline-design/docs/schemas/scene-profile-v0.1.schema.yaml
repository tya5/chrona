$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "chrona/scene-profile-v0.1"
allOf:
  - $ref: "presentation-resource-v0.1.schema.yaml"
  - type: object
    properties:
      kind: {const: scene-profile}
      body:
        type: object
        required: [temporalScale, lanes, routing, collision, layoutMetrics]
        additionalProperties: false
        properties:
          temporalScale: {type: object, required: [domain, mode], additionalProperties: false, properties: {domain: {const: date}, mode: {const: linear}}}
          lanes: {type: object, required: [mode, itemStacking], additionalProperties: false, properties: {mode: {const: view-groups}, itemStacking: {const: stable}}}
          routing: {type: object, required: [dependencies, annotations], additionalProperties: false, properties: {dependencies: {const: orthogonal}, annotations: {const: avoid-lanes}}}
          collision: {type: object, required: [labels], additionalProperties: false, properties: {labels: {const: diagnose}}}
          layoutMetrics: {const: required}
