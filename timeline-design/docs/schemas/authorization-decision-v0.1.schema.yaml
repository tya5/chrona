$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "urn:chrona:authorization-decision-v0.1"
type: object
additionalProperties: false
required: [version, proposalId, commandFingerprint, principal, policyVersion, decision]
properties:
  version: {const: "chrona/authorization-decision/v0.1"}
  proposalId: {type: string, minLength: 1}
  commandFingerprint: {type: string, pattern: "^sha256:[0-9a-f]{64}$"}
  principal: {type: string, minLength: 1}
  policyVersion: {type: string, minLength: 1}
  decision: {enum: [allow, deny]}
  reason: {type: string, minLength: 1}
