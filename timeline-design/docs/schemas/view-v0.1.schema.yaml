$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "chrona/view-v0.1"
title: "Chrona View v0.1"
allOf:
  - $ref: "urn:chrona:presentation-resource-v0.1"
  - type: object
    properties:
      kind: {const: view}
      body:
        type: object
        required: [selection, grouping, ordering, window, comparison, visibility, layoutIntent]
        additionalProperties: false
        properties:
          selection:
            type: object
            required: [include]
            additionalProperties: false
            properties:
              include:
                type: object
                additionalProperties: false
                properties:
                  ids: {type: array, uniqueItems: true, items: {type: string, minLength: 1}}
                  types: {type: array, uniqueItems: true, items: {type: string, minLength: 1}}
                  entityIds: {type: array, uniqueItems: true, items: {type: string, minLength: 1}}
                  profiles: {type: array, uniqueItems: true, items: {type: string, minLength: 1}}
          grouping:
            type: object
            required: [by, missing]
            additionalProperties: false
            properties:
              by: {enum: [objectType, field, none]}
              field: {type: string, minLength: 1}
              order: {type: array, uniqueItems: true, items: {type: string, minLength: 1}}
              missing: {type: string, minLength: 1}
            allOf:
              - if: {properties: {by: {const: field}}}
                then: {required: [field]}
          ordering:
            type: object
            required: [by, direction, tieBreak]
            additionalProperties: false
            properties:
              by: {enum: [id, title, plannedStart, plannedEnd]}
              direction: {enum: [ascending, descending]}
              tieBreak: {enum: [id, title, plannedStart, plannedFinish]}
          window:
            type: object
            required: [mode]
            additionalProperties: false
            properties:
              mode: {enum: [explicit, selected-planned, selected-comparison]}
              start: {type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$"}
              end: {type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$"}
              marginDays: {type: integer, minimum: 0}
            allOf:
              - if: {properties: {mode: {const: explicit}}}
                then: {required: [start, end]}
              - if: {properties: {mode: {enum: [selected-planned, selected-comparison]}}}
                then: {required: [marginDays]}
          comparison:
            type: object
            required: [baseline, actual, observationSelection, deltaUnit, facets]
            additionalProperties: false
            properties:
              baseline: {enum: [primary, snapshot]}
              actual: {enum: [forbidden, optional, required]}
              observationSelection: {const: latest}
              deltaUnit: {const: calendar-days}
              facets:
                type: array
                uniqueItems: true
                items: {enum: [planned, actual, startDelta, finishDelta, atDelta, progress, missingActual, unmatchedActual]}
          visibility:
            type: object
            required: [labels, relations, annotations]
            additionalProperties: false
            properties:
              labels: {type: boolean}
              relations: {enum: [none, semantic, all]}
              annotations: {enum: [none, semantic, presentation, all]}
          layoutIntent:
            type: object
            required: [compactness, itemStacking]
            additionalProperties: false
            properties:
              compactness: {enum: [compact, balanced, expanded]}
              itemStacking: {const: stable}
          tableColumns:
            type: array
            minItems: 1
            uniqueItems: true
            items:
              type: object
              required: [id, source, missing]
              additionalProperties: false
              properties:
                id: {type: string, minLength: 1}
                source:
                  oneOf:
                    - {enum: [id, title, objectType, entity]}
                    - type: object
                      required: [field]
                      additionalProperties: false
                      properties: {field: {type: string, minLength: 1}}
                    - type: object
                      required: [comparisonFacet]
                      additionalProperties: false
                      properties: {comparisonFacet: {enum: [startDelta, finishDelta, atDelta, progress, missingActual]}}
                missing: {enum: [blank, em-dash, unknown]}
          annotations:
            type: array
            items:
              type: object
              required: [id, purpose, placement, text]
              additionalProperties: false
              properties:
                id: {type: string, minLength: 1}
                purpose: {enum: [callout, highlight, note, explanatory-arrow]}
                anchor:
                  type: object
                  required: [kind, id]
                  additionalProperties: false
                  properties: {kind: {enum: [object, relation, group, temporal]}, id: {type: string, minLength: 1}, endpoint: {enum: [start, finish, at, body]}, date: {type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$"}}
                placement:
                  type: object
                  required: [side, alignment]
                  additionalProperties: false
                  properties: {side: {enum: [above, below, start, end]}, alignment: {enum: [start, center, end]}}
                text: {type: string}
                source: {type: object, required: [kind, id], additionalProperties: false, properties: {kind: {enum: [object, relation, group, temporal]}, id: {type: string, minLength: 1}, endpoint: {enum: [start, finish, at, body]}, date: {type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$"}}}
                target: {type: object, required: [kind, id], additionalProperties: false, properties: {kind: {enum: [object, relation, group, temporal]}, id: {type: string, minLength: 1}, endpoint: {enum: [start, finish, at, body]}, date: {type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$"}}}
              allOf:
                - if: {properties: {purpose: {const: explanatory-arrow}}}
                  then: {required: [source, target], not: {required: [anchor]}}
                  else: {required: [anchor]}
