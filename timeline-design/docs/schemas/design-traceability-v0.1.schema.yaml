$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "urn:chrona:design-traceability:v0.1"
type: object
required: [version, areas, findings]
additionalProperties: false
properties:
  version:
    const: chrona/design-traceability/v0.1
  areas:
    type: array
    minItems: 1
    items:
      type: object
      required: [id, name, specifications, productFacing, useCases, milestones, evidence, status]
      additionalProperties: false
      properties:
        id: {type: string, pattern: "^[A-Z][A-Z0-9-]+$"}
        name: {type: string, minLength: 1}
        specifications: {type: array, minItems: 1, items: {type: string}}
        productFacing: {type: boolean}
        useCases: {type: array, items: {type: string, pattern: "^UC-[0-9]{2}$"}}
        milestones: {type: array, items: {type: string, pattern: "^M[0-9]+(?:\\.[0-9]+)?$"}}
        evidence: {type: array, items: {type: string}}
        status: {enum: [covered, partial, missing, governance-only]}
        findingIds: {type: array, items: {type: string, pattern: "^T-[0-9]{2}$"}}
  findings:
    type: array
    items:
      type: object
      required: [id, severity, summary, remediationPhase]
      additionalProperties: false
      properties:
        id: {type: string, pattern: "^T-[0-9]{2}$"}
        severity: {enum: [blocker, high, medium]}
        summary: {type: string, minLength: 1}
        remediationPhase: {enum: [TR-0, TR-1, TR-2, TR-3, TR-4]}
