version: chrona/presentation-scene-input/v0.1
kind: derived-scene-input
authority: runtime-derived-only
inputs:
  resolvedSettings: chrona/presentation-settings/v0.2
  surfaces:
    - id: table-timeline
      slots:
        - {id: title, source: title, bounds: resolved-layout}
        - {id: table, source: table, bounds: resolved-layout}
        - {id: timeline, source: timeline, bounds: resolved-layout, scaleId: primary}
        - {id: timelineAxis, source: timeline-axis, bounds: resolved-layout, scaleId: primary}
      rows: {source: resolved-view-group-order, bounds: resolved-layout}
      primitives:
        required: [title-text, axis-band, axis-label, tick, comparison-mark, item-label]
        laterFamilies:
          I3-C: [table-frame, table-header-band, table-column-label, group-surface, group-header, row-shade, table-row-rule, table-cell, dependency-connector, annotation-box, annotation-text, annotation-leader, project-note, legend-swatch, legend-label, coverage-text]
          I3-F: [summary-panel, summary-header, summary-metric]
        ownership: resolved-scene-geometry
    - id: review
      slots:
        - {id: title, source: title, bounds: resolved-layout}
        - {id: reviewTimeline, source: timeline, bounds: resolved-layout, scaleId: primary}
        - {id: reviewAxis, source: timeline-axis, bounds: resolved-layout, scaleId: primary}
        - {id: optionalResolvedSlot, source: summary-or-other-authorized-optional-source, bounds: resolved-layout, optional: true}
      rows: {source: resolved-view-group-order, bounds: resolved-layout}
      primitives:
        required: [title-text, axis-band, axis-label, tick, comparison-mark, item-label]
        laterFamilies:
          I3-F: [dependency-connector, annotation-box, annotation-text, annotation-leader, summary-panel, summary-header, summary-metric]
        ownership: resolved-scene-geometry
    - id: minimal
      slots:
        - {id: title, source: title, bounds: resolved-layout}
        - {id: minimalTimeline, source: timeline, bounds: resolved-layout, scaleId: primary}
        - {id: minimalAxis, source: timeline-axis, bounds: resolved-layout, scaleId: primary}
      rows: {source: resolved-view-group-order, bounds: resolved-layout}
      primitives:
        required: [title-text, axis-band, axis-label, tick, comparison-mark, item-label]
        laterFamilies:
          I3-F: [dependency-connector, annotation-box, annotation-text, annotation-leader]
        ownership: resolved-scene-geometry
  laneTracks:
    source: stable-lane-stack
    bounds: resolved-scene-geometry
    surfaces: [row-aligned, independent-lane-track]
  primitivePayloads:
    Rect: [bounds]
    Text: [text, textLayout]
    Symbol: [shape, bounds]
    Path: [points]
    connectorPath: [points, fromPortId, toPortId]
  surfaceContentInput:
    required: [tableColumns, tableCells, relations, annotations, notes, legendEntries, coverageText, summaryPanels, templateValues]
    templateValues: [title, windowStart, windowLastVisible, selectedCount, unmatchedCount, missingCount]
    summaryPanelShape: [panelId, headingText, orderedMetricPairs]
    summaryMetricShape: [metricId, formattedText]
    normalization: application-boundary-once
    adapterVisible: false
    authority: derived-selected-content-only
invariants:
  - adapters-receive-completed-scene-only
  - slot-row-track-bounds-are-not-authoring-data
  - shared-scale-slots-have-equal-normalized-date-position
  - surface-adapter-selects-completed-primitives-only
  - missing-surface-or-primitive-is-a-stable-diagnostic
  - primitive-family-presence-is-authorized-by-surface-slot-and-visibility
  - routes-ports-and-text-layout-are-scene-owned
  - primitive-kind-payload-mismatch-is-a-stable-diagnostic
  - adapters-never-read-surface-content-input
