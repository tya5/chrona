version: chrona/design-gallery/v0.2
deferred:
  - {id: japanese-board, dimension: content, blocker: "controller-z-ja is a translated project with a ja-JP environment and CJK metrics; the current one-axis gallery contract requires identical project and environment references, so it remains standalone corpus evidence until localized semantic pairing is designed."}
  - {id: programme-at-scale, dimension: composition, blocker: "Overlay grammar now has corpus evidence, but this gallery set still requires a responsive View/Layout comparison with deliberately composable Halcyon peers."}
  - {id: milestones-notes-margins, dimension: composition, blocker: "Requires a new View/Layout design for the undrawn detail slots."}
  - {id: bar-encodings, dimension: visual-grammar, blocker: "Requires the remaining per-object encoding design."}
  - {id: print-and-typeset, blocker: "Requires a multi-target materializer evidence contract; target is not a Design Space dimension."}
entries:
  - id: controller-z-executive-status
    corpus: controller-z
    slide: executive
    narrative: {title: Executive status, audience: programme leadership, purpose: Compare plan, actual, and label exceptions.}
    comparison: {set: controller-z-executive-status, dimension: content, axis: comparison focus}
    target: {kind: svg, capabilities: [accessibleText, semanticRoles]}
    accessibility: {note: Semantic labels and table structure remain present alongside colour.}
  - id: controller-z-plan-only-status
    corpus: controller-z
    slide: plan-only
    narrative: {title: Plan-only control, audience: delivery leads, purpose: Focus the same schedule on planned commitments.}
    comparison: {set: controller-z-executive-status, dimension: content, axis: comparison focus}
    target: {kind: svg, capabilities: [accessibleText, semanticRoles, tableSemantics]}
    accessibility: {note: Semantic labels and table structure remain present alongside colour.}
  - id: controller-z-treatment-baseline
    corpus: controller-z
    slide: executive
    narrative: {title: Baseline treatment, audience: programme leadership, purpose: Establish the ordinary status-review treatment.}
    comparison: {set: controller-z-treatment-ladder, dimension: appearance, axis: visual treatment}
    target: {kind: svg, capabilities: [accessibleText, semanticRoles, tableSemantics]}
    accessibility: {note: Semantic labels and table structure remain present alongside colour.}
  - id: controller-z-elevated-treatment
    corpus: controller-z
    slide: elevated
    narrative: {title: Elevated status review, audience: programme leadership, purpose: Compare bounded portable visual treatment on the same review.}
    comparison: {set: controller-z-treatment-ladder, dimension: appearance, axis: visual treatment}
    target: {kind: svg, capabilities: [accessibleText, semanticRoles, tableSemantics]}
    accessibility: {note: Gradient and shadow are decorative; semantic labels, source metadata, and table structure remain present.}
  - id: halcyon-tvac-scenario
    corpus: halcyon-1
    slide: tvac-slip
    narrative: {title: TVAC slip scenario, audience: programme office, purpose: Investigate the primary plan under the declared TVAC slip scenario.}
    comparison: {set: halcyon-investigating-slip, dimension: content, axis: comparison baseline}
    target: {kind: svg, capabilities: [accessibleText, hierarchicalAxis, semanticRoles, tableSemantics]}
    accessibility: {note: Scenario differences remain expressed in structured labels and comparison facets.}
  - id: halcyon-replan-baseline
    corpus: halcyon-1
    slide: replan-baseline
    narrative: {title: Captured replan baseline, audience: programme office, purpose: Investigate the same programme against its pinned June baseline.}
    comparison: {set: halcyon-investigating-slip, dimension: content, axis: comparison baseline}
    target: {kind: svg, capabilities: [accessibleText, hierarchicalAxis, semanticRoles, tableSemantics]}
    accessibility: {note: Baseline comparison remains expressed in structured labels and comparison facets.}
