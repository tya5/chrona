[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chrona"
version = "0.1.0a0"
description = "A Git-friendly grammar and reference scheduler for temporal project data."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0", "jsonschema>=4.18", "fonttools>=4.0", "skia-pathops==0.9.2"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-xdist>=3.8.0", "pytest-split>=0.11.0,<1"]
render = ["Pillow>=10.0", "resvg-py==0.5.0", "svglib==2.2.0", "reportlab==5.0.1"]
mcp = ["mcp>=2.0,<3"]

[project.scripts]
chrona = "chrona.app.cli:main"

[tool.hatch.build]
dev-mode-dirs = ["src", "."]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "corpus: whole-corpus or HALCYON-board sweep; the PR shards deselect it (-m \"not corpus\") and the full matrix, nightly and manual runs execute it (#657)",
]

[tool.hatch.build.targets.wheel]
packages = ["src/chrona"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "chrona/resources/schemas"
"examples/halcyon-1" = "chrona/resources/examples/halcyon-1"
"skills/chrona" = "chrona/resources/skills/chrona"
