[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chrona"
version = "0.1.0a0"
description = "A Git-friendly grammar and reference scheduler for temporal project data."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0", "jsonschema>=4.18", "fonttools>=4.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
chrona = "chrona.app.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/chrona"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "chrona/resources/schemas"
