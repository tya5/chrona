name: derived-main
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: 'Exact commit SHA on refs/heads/derived-gate/<sha>'
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: derived-main-${{ inputs.expected_sha }}
  cancel-in-progress: false
jobs:
  derived-main:
    name: derived-main
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Verify immutable gate ref and exact dispatched commit
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          test -n "$EXPECTED_SHA"
          test "$GITHUB_REF" = "refs/heads/derived-gate/$EXPECTED_SHA"
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Check every committed derived output
        run: |
          pip install -e '.[dev,render]' -e packages/chrona-fonts-noto-cjk
          python -m tools.derived_evidence --check --jobs 4
  derived-ready:
    name: derived-ready
    needs: derived-main
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Require successful derived gate on exact commit
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          GATE_RESULT: ${{ needs.derived-main.result }}
        run: |
          test "$GATE_RESULT" = "success"
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
      # A check run created by a dispatched workflow on this ref is not counted
      # by a protected branch's push hook (proved on a disposable branch,
      # #590 I590-3); a commit status of the same name is. Only the verified
      # exact SHA is marked, and only after the step above succeeded.
      - name: Publish the derived-ready commit status for the verified SHA
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$EXPECTED_SHA" \
            -f state=success -f context=derived-ready \
            -f description="derived-main passed on this exact commit" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
