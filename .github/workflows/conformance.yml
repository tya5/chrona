name: conformance
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: conformance-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  conformance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e '.[dev,render]' -e packages/chrona-fonts-noto-cjk
      - id: conformance
        continue-on-error: true
        run: python conformance/run_conformance.py
      - id: pytest
        if: ${{ always() }}
        continue-on-error: true
        run: pytest -n 4
      - id: wheel_smoke
        if: ${{ always() && steps.conformance.outcome == 'success' && steps.pytest.outcome == 'success' }}
        shell: bash
        run: |
          python -m pip wheel . --no-deps -w dist
          python tools/check_wheel_size.py dist/chrona-*.whl
          python -m pip install --force-reinstall --no-deps dist/*.whl
          smoke_dir="$(mktemp -d)"
          cd "$smoke_dir"
          python "$GITHUB_WORKSPACE/tools/wheel_smoke.py"
      - name: Finalize independent CI outcomes
        if: ${{ always() }}
        run: >-
          python tools/check_ci_outcomes.py
          --required conformance=${{ steps.conformance.outcome }}
          --required pytest=${{ steps.pytest.outcome }}
          --dependent wheel-smoke=${{ steps.wheel_smoke.outcome }}

  reproduction-newest-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e '.[dev,render]' -e packages/chrona-fonts-noto-cjk
      - name: Reproduce every committed public materializer context
        run: pytest -q tests/integration/test_materialize_example.py::test_declared_examples_reproduce_by_public_cli
