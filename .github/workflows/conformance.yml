# Verification-only branch. NEVER merge this replacement into main.
# Reuses the registered dispatch filename; publishes no production gate/status.
name: issue-1906-serial-timing
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: issue-1906-serial-timing
  cancel-in-progress: false
jobs:
  serial-timing:
    name: Isolated before-after timing (not release CI)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: benchmark
      - uses: actions/checkout@v4
        with:
          ref: 820688585bb58031369c4f04b88c9a604b26ec27
          path: before
      - uses: actions/checkout@v4
        with:
          ref: e5cc70efb75f283f569eb1f04ebfc2f144d3efa2
          path: after
      - uses: actions/checkout@v4
        with:
          ref: cbc183f6b9243181eaef102afa4f9377c9b899ca
          path: inputs
          sparse-checkout: trial-17/plan
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare separate project venvs with matching dependency versions
        shell: bash
        run: |
          python -m venv before/.venv
          before/.venv/bin/python -m pip install -e './before[render]' -e before/packages/chrona-fonts-noto-cjk
          before/.venv/bin/python -m pip freeze --exclude-editable > constraints.txt
          python -m venv after/.venv
          after/.venv/bin/python -m pip install -c constraints.txt -e './after[render]' -e after/packages/chrona-fonts-noto-cjk
          mkdir evidence
          cp constraints.txt evidence/dependencies.txt
      - name: One serial profiled render per source on this otherwise dedicated runner
        shell: bash
        run: |
          cd inputs/trial-17
          for bench_side in before after; do
            "$GITHUB_WORKSPACE/$bench_side/.venv/bin/python" "$GITHUB_WORKSPACE/benchmark/tools/issue_1906_serial_profile.py" \
              --worktree "$GITHUB_WORKSPACE/$bench_side" \
              --trial "$GITHUB_WORKSPACE/inputs/trial-17" \
              --output "$GITHUB_WORKSPACE/evidence/$bench_side"
          done
      - name: Validate the controlled pair and print measured totals
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          before = json.loads(Path('evidence/before/receipt.json').read_text())
          after = json.loads(Path('evidence/after/receipt.json').read_text())
          assert before['exitCode'] == after['exitCode'] == 0
          assert before['inputSha256'] == after['inputSha256']
          assert before['python'] == after['python']
          assert before['head'] == '820688585bb58031369c4f04b88c9a604b26ec27'
          assert after['head'] == 'e5cc70efb75f283f569eb1f04ebfc2f144d3efa2'
          print({side: {key: row[key] for key in ('wallSeconds', 'cpuSeconds', 'scope')}
                 for side, row in (('before', before), ('after', after))})
          PY
      - name: Upload bounded experimental evidence (never a release gate)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-1906-serial-before-after
          path: evidence/
          retention-days: 14
          if-no-files-found: error
