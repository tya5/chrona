name: conformance
on: [push, pull_request]
jobs:
  conformance:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -e '.[dev]'
      - run: python conformance/run_conformance.py
      - run: pytest
      - run: python -m pip wheel . --no-deps -w dist
      - run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - name: Smoke-test installed wheel outside the checkout
        run: |
          smoke_dir="$(mktemp -d)"
          cd "$smoke_dir"
          python "$GITHUB_WORKSPACE/tools/wheel_smoke.py"
