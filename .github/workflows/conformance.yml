name: conformance
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: conformance-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  conformance:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e '.[dev,render]' -e packages/chrona-fonts-noto-cjk
      - run: python conformance/run_conformance.py
      - run: python tools/check_documented_commands.py --check --execute
      - run: python tools/check_module_reachability.py
      - run: python tools/check_scene_primitive_delivery.py
      - run: python tools/check_view_dispatch_reachability.py
      - run: python tools/check_semantic_registry_reachability.py
      - run: python tools/check_import_direction.py
      - run: python tools/check_text_encoding.py
      - run: python tools/presentation_coverage.py --check
      - run: python tools/semantic_realization_coverage.py --check
      - run: pytest -n 4
      - run: python -m pip wheel . --no-deps -w dist
      - name: Enforce primary wheel budget
        shell: bash
        run: python tools/check_wheel_size.py dist/chrona-*.whl
      - name: Install the built wheel
        shell: bash
        run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - name: Smoke-test installed wheel outside the checkout
        shell: bash
        run: |
          smoke_dir="$(mktemp -d)"
          cd "$smoke_dir"
          python "$GITHUB_WORKSPACE/tools/wheel_smoke.py"
